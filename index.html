eturn;\n  const children = getChildTasks(taskId);\n  if(!children.length) return;\n  const st = getTaskStatus(dateKey, taskId);\n  const vals = children.map(c => !!getTaskStatus(dateKey, c.id).done);\n  if(task.isSystemFixed || task.completeRule === 'any'){\n    st.done = vals.some(v => v);\n  } else {\n    st.done = vals.every(v => v);\n  }\n}\n\nfunction syncTaskDoneState(taskId, dateKey) {\n  const task = state.tasks[taskId];\n  if (!task) return;\n  const st = getTaskStatus(dateKey, taskId);\n  \n  if (statusSeconds(st, false) <= 0) {\n    st.done = false;\n  }\n  \n  if (!task.parentId) {\n    applyCompleteRuleToTask(taskId, dateKey);\n    if (!st.done) {\n      getChildTasks(taskId).forEach(c => {\n        const cst = getTaskStatus(dateKey, c.id);\n        if (cst.done && statusSeconds(cst, false) <= 0) cst.done = false;\n      });\n    }\n  } else {\n    \/* 二级或三级：先更新自己（如果有下级），再更新父级 *\/\n    applyCompleteRuleToTask(taskId, dateKey);\n    applyCompleteRuleToTask(task.parentId, dateKey);\n  }\n}\n\nfunction saveEditTask(){\n  if(!editTaskId) return;\n  const task = state.tasks[editTaskId];\n  if(!task) return;\n\n  if(task.isSystemFixed){ toast('系统固定任务不能在这里修改'); return; }\n\n  const isPaperSub = !!task.isPaperSub;\n  const text = isPaperSub ? task.text : document.getElementById('emTaskText').value.trim();\n  if(!text){ toast('任务内容不能为空'); return; }\n  const note = document.getElementById('emTaskNote').value.trim();\n  const startDate = document.getElementById('emStartDate').value || viewDate;\n  const endless = document.getElementById('emEndless').checked;\n  const endDate = endless ? null : (document.getElementById('emEndDate').value || null);\n  \n  if(endDate && endDate < startDate){ \n    showModalError('emBox', 'emErrorMsg', '结束日期不能早于开始日期，已自动为您修正');\n    document.getElementById('emEndDate').value = startDate; \n    return; \n  }\n\n  const parentTask = task.parentId ? state.tasks[task.parentId] : null;\n  if (parentTask) {\n    if (parentTask.startDate && startDate < parentTask.startDate) {\n      toast('子任务的开始日期不能早于所属上级（' + parentTask.text + '）的开始日期');\n      return;\n    }\n    if (parentTask.endDate && endDate && endDate > parentTask.endDate) {\n      toast('子任务的结束日期不能晚于所属上级（' + parentTask.text + '）的结束日期');\n      return;\n    }\n    if (parentTask.endDate && !endDate && !endless) {\n       toast('上级设置了结束日期，子任务不能选择无限期');\n       return;\n    }\n  }\n\n  const newCat = isPaperSub ? task.category : (document.getElementById('emCategory').value || task.category);\n  const oldCat = task.category;\n  const level = isPaperSub ? 'sub' : document.getElementById('emLevel').value;\n  let newParentId = '';\n  \n  \/\/ 👇 修改3：无论是二级还是三级，只要选了层级，就获取对应的父级\n  if(level === 'sub' || level === 'subsub'){\n    newParentId = isPaperSub ? task.parentId : document.getElementById('emParent').value;\n    if(!newParentId){ toast(level === 'subsub' ? '请选择一个所属二级任务' : '请选择一个所属一级任务'); return; }\n    if(newParentId === editTaskId){ toast('不能选择自己作为上级'); return; }\n    let cur = state.tasks[newParentId];\n    let guard = 0;\n    while(cur && guard++ < 100){\n      if(cur.id === editTaskId){ toast('不能挂在自己的子任务下'); return; }\n      cur = cur.parentId ? state.tasks[cur.parentId] : null;\n    }\n  }\n\n  task.text = text; task.note = note; task.startDate = startDate; task.endDate = endDate;\n  \n  \/\/ 👇 修复：强制更新为你重新选择的新父级（而不是保留旧父级）\n  task.parentId = newParentId || ''; \n  \n  if(!document.getElementById('emRuleRow').hidden){\n    const rule = document.getElementById('emCompleteRule').value;\n    task.completeRule = rule === 'any' ? 'any' : 'all';\n  }\n\n  let finalCat = newCat;\n  if(newParentId){\n    const p = state.tasks[newParentId];\n    if(p) finalCat = p.category;\n  }\n\n  if(finalCat !== oldCat){\n    if(state.settings.taskOrder[oldCat]){\n      state.settings.taskOrder[oldCat] = state.settings.taskOrder[oldCat].filter(id => id !== editTaskId);\n    }\n    if(!state.settings.taskOrder[finalCat]) state.settings.taskOrder[finalCat] = [];\n    \n    \/\/ 👇 优化：如果是子任务，尝试插入到新父级任务的紧后面，而不是整个学科的最后面\n    let insertIdx = state.settings.taskOrder[finalCat].length;\n    if (newParentId) {\n      const parentIdx = state.settings.taskOrder[finalCat].indexOf(newParentId);\n      if (parentIdx >= 0) insertIdx = parentIdx + 1;\n    }\n    state.settings.taskOrder[finalCat].splice(insertIdx, 0, editTaskId);\n    \n    task.category = finalCat;\n    getChildTasks(editTaskId).forEach(c => { c.category = finalCat; });\n  } else {\n    task.category = finalCat;\n  }\n\n  reconcileDayStatus();\n  save();\n  document.getElementById('editModal').classList.remove('show');\n  editTaskId = null; editingSessionId = null;\n  renderPlan();\n  toast('已保存');\n}\n\ndocument.getElementById('emSubAddBtn').addEventListener('click', addEditSub);\n\/* 三级区已合并进 emSubList，emSubSubAddBtn 不再使用 *\/\ndocument.getElementById('emSave').addEventListener('click', saveEditTask);\ndocument.getElementById('emTaskText').addEventListener('keydown', e => {\n  if(e.key === 'Enter'){ e.preventDefault(); saveEditTask(); }\n});\ndocument.getElementById('editModal').addEventListener('click', e => {\n  if(e.target.id === 'editModal'){\n    e.currentTarget.classList.remove('show');\n    editTaskId = null; editingSessionId = null;\n  }\n});\n\ndocument.getElementById('emSubList').addEventListener('click', e => {\n  if(!editTaskId) return;\n\n  const toggleBtn = e.target.closest('[data-em-toggle]');\n  if(toggleBtn){\n    const childId = toggleBtn.dataset.emToggle;\n    const st = getTaskStatus(viewDate, childId);\n    finishRunning(st);\n    st.done = !st.done;\n    applyCompleteRuleToTask(editTaskId, viewDate);\n    save(); renderEditSubList(); renderPlan();\n    return;\n  }\n\n  const delBtn = e.target.closest('[data-em-del]');\n  if(delBtn){\n    const childId = delBtn.dataset.emDel;\n    const child = state.tasks[childId];\n    if(child){\n      askConfirm('确定删除任务？', '「' + child.text + '」及其下级、专注记录都会删除。', () => {\n        hardRemoveTask(childId);\n        applyCompleteRuleToTask(editTaskId, viewDate);\n        save(); renderEditSubList(); renderPlan();\n      });\n    }\n    return;\n  }\n\n  const textEl = e.target.closest('[data-em-edit]');\n  if(textEl){\n    const childId = textEl.dataset.emEdit;\n    const child = state.tasks[childId];\n    if(!child) return;\n    \/* 单击文字：如果是二级任务，打开它自己的详情（里面有三级列表）；如果是一级下的二级，也打开自己的详情 *\/\n    openEditModal(child.category, childId);\n    return;\n  }\n});\n\ndocument.getElementById('emSubList').addEventListener('dragstart', e => {\n  if(!editTaskId) return;\n  if(e.target.closest('input')){ e.preventDefault(); return; }\n  const item = e.target.closest('.sub-edit-item');\n  if(!item) return;\n  draggedSubId = item.dataset.childId;\n  item.classList.add('dragging');\n  e.dataTransfer.effectAllowed = 'move';\n  e.dataTransfer.setData('text\/plain', 'sub');\n});\n\ndocument.getElementById('emSubList').addEventListener('dragover', e => {\n  if(!draggedSubId) return;\n  const item = e.target.closest('.sub-edit-item');\n  if(!item || item.dataset.childId === draggedSubId) return;\n  e.preventDefault();\n  e.dataTransfer.dropEffect = 'move';\n  document.querySelectorAll('#emSubList .drag-over').forEach(x => x.classList.remove('drag-over'));\n  item.classList.add('drag-over');\n});\n\ndocument.getElementById('emSubList').addEventListener('dragleave', e => {\n  const item = e.target.closest('.sub-edit-item');\n  if(item) item.classList.remove('drag-over');\n});\n\ndocument.getElementById('emSubList').addEventListener('drop', e => {\n  e.preventDefault();\n  if(!editTaskId || !draggedSubId) return;\n  const item = e.target.closest('.sub-edit-item');\n  if(!item || item.dataset.childId === draggedSubId) return;\n  const targetId = item.dataset.childId;\n  const parentTask = state.tasks[editTaskId];\n  if(!parentTask) return;\n  const order = state.settings.taskOrder[parentTask.category] || [];\n  const fromIdx = order.indexOf(draggedSubId);\n  const toIdx = order.indexOf(targetId);\n  if(fromIdx < 0 || toIdx < 0) return;\n  const [moved] = order.splice(fromIdx, 1);\n  order.splice(toIdx, 0, moved);\n  save(); renderEditSubList(); renderPlan();\n});\n\ndocument.getElementById('emSubList').addEventListener('dragend', () => {\n  draggedSubId = null;\n  document.querySelectorAll('#emSubList .dragging, #emSubList .drag-over').forEach(x => {\n    x.classList.remove('dragging');\n    x.classList.remove('drag-over');\n  });\n});\n\ndocument.getElementById('emSessAdd').addEventListener('click', () => {\n  if(!editTaskId) return;\n  const startHM = document.getElementById('emSessStart').value;\n  const endHM = document.getElementById('emSessEnd').value;\n  const hVal = document.getElementById('emSessH').value;\n  const mVal = document.getElementById('emSessM').value;\n  const durMin = hmToMinutes(hVal, mVal);\n\n  let startAt = 0, endAt = 0;\n\n  if(durMin > 0){\n    if(startHM) startAt = timeStrToTs(viewDate, startHM);\n    else startAt = timeStrToTs(viewDate, '12:00');\n    if(!startAt) startAt = Date.now();\n    endAt = startAt + durMin * 60000;\n  } else if(startHM && endHM){\n    startAt = timeStrToTs(viewDate, startHM);\n    endAt = timeStrToTs(viewDate, endHM);\n    if(!startAt || !endAt){ toast('时间格式有误'); return; }\n    if(endAt <= startAt) endAt += 86400000;\n  } else {\n    toast('请填写时间，或直接填时长');\n    return;\n  }\n\n  if(endAt - startAt > 24 * 3600 * 1000){ toast('单次时长不能超过 24 小时'); return; }\n  const st = getTaskStatus(viewDate, editTaskId);\n  st.sessions.push({ id: uid(), startAt, endAt });\n  st.done = true;\n  \n  const currentTask = state.tasks[editTaskId];\n  if (currentTask && currentTask.parentId) {\n    applyCompleteRuleToTask(currentTask.parentId, viewDate);\n  } else if (currentTask) {\n    getChildTasks(editTaskId).forEach(c => {\n      getTaskStatus(viewDate, c.id).done = true;\n    });\n  }\n\n  save();\n  document.getElementById('emSessStart').value = '';\n  document.getElementById('emSessEnd').value = '';\n  document.getElementById('emSessH').value = '';\n  document.getElementById('emSessM').value = '';\n\n  renderEditSessionList();\n  renderPlan();\n  toast('已添加专注记录');\n});\n\nlet editingSession = null;\n\nfunction buildSeTaskSelectors(){\n  const task = state.tasks[editTaskId];\n  if(!task) return;\n  \n  const catSel = document.getElementById('seCategory');\n  fillCategorySelect(catSel, task.category);\n  \n  const parentSel = document.getElementById('seParent');\n  const childSel = document.getElementById('seChild');\n  const subChildSel = document.getElementById('seSubChild');\n\n  \/\/ 找出这个任务的真实一级和二级\n  let level1Id = '';\n  let level2Id = '';\n  if (!task.parentId) {\n    level1Id = task.id;\n  } else {\n    const p1 = state.tasks[task.parentId];\n    if (p1 && p1.parentId) {\n      level2Id = p1.id;\n      level1Id = p1.parentId;\n    } else {\n      level2Id = task.id;\n      level1Id = task.parentId;\n    }\n  }\n\n  fillParentSelect(parentSel, task.category, null, level1Id);\n  \n  \/\/ 填入二级\n  const children = level1Id ? getChildTasks(level1Id) : [];\n  childSel.innerHTML = '<option value=\"\">（只属于一级任务）<\/option>' + children.map(c =>\n    '<option value=\"' + c.id + '\"' + (c.id === level2Id ? ' selected' : '') + '>' + escapeHtml(c.text) + '<\/option>'\n  ).join('');\n\n  \/\/ 填入三级\n  const subChildren = level2Id ? getChildTasks(level2Id) : [];\n  subChildSel.innerHTML = '<option value=\"\">（只属于二级任务）<\/option>' + subChildren.map(c =>\n    '<option value=\"' + c.id + '\"' + (c.id === task.id && task.parentId && state.tasks[task.parentId].parentId ? ' selected' : '') + '>' + escapeHtml(c.text) + '<\/option>'\n  ).join('');\n}\n\nfunction refreshSeChildSelect(){\n  const parentId = document.getElementById('seParent').value;\n  const childSel = document.getElementById('seChild');\n  const children = parentId ? getChildTasks(parentId) : [];\n  childSel.innerHTML = '<option value=\"\">（只属于一级任务）<\/option>' + children.map(c =>\n    '<option value=\"' + c.id + '\">' + escapeHtml(c.text) + '<\/option>'\n  ).join('');\n}\n\nfunction openSessionEditModal(sess){\n  editingSession = sess;\n  document.getElementById('seStart').value = fmtHM(sess.startAt);\n  document.getElementById('seEnd').value = fmtHM(sess.endAt);\n  document.getElementById('seH').value = '';\n  document.getElementById('seM').value = '';\n  buildSeTaskSelectors();\n  document.getElementById('sessionEditModal').classList.add('show');\n}\n\ndocument.getElementById('seCategory').addEventListener('change', e => {\n  const catKey = e.target.value;\n  const parentSel = document.getElementById('seParent');\n  fillParentSelect(parentSel, catKey, null, null);\n  const parentId = parentSel.value;\n  const childSel = document.getElementById('seChild');\n  const children = parentId ? getChildTasks(parentId) : [];\n  childSel.innerHTML = '<option value=\"\">（只属于一级任务）<\/option>' + children.map(c =>\n    '<option value=\"' + c.id + '\">' + escapeHtml(c.text) + '<\/option>'\n  ).join('');\n  document.getElementById('seSubChild').innerHTML = '<option value=\"\">（只属于二级任务）<\/option>';\n});\n\ndocument.getElementById('seParent').addEventListener('change', () => {\n  const parentId = document.getElementById('seParent').value;\n  const childSel = document.getElementById('seChild');\n  const children = parentId ? getChildTasks(parentId) : [];\n  childSel.innerHTML = '<option value=\"\">（只属于一级任务）<\/option>' + children.map(c =>\n    '<option value=\"' + c.id + '\">' + escapeHtml(c.text) + '<\/option>'\n  ).join('');\n  document.getElementById('seSubChild').innerHTML = '<option value=\"\">（只属于二级任务）<\/option>';\n});\n\ndocument.getElementById('seChild').addEventListener('change', () => {\n  const childId = document.getElementById('seChild').value;\n  const subChildSel = document.getElementById('seSubChild');\n  const subChildren = childId ? getChildTasks(childId) : [];\n  subChildSel.innerHTML = '<option value=\"\">（只属于二级任务）<\/option>' + subChildren.map(c =>\n    '<option value=\"' + c.id + '\">' + escapeHtml(c.text) + '<\/option>'\n  ).join('');\n});\n\ndocument.getElementById('seCancel').addEventListener('click', () => {\n  editingSession = null;\n  document.getElementById('sessionEditModal').classList.remove('show');\n});\ndocument.getElementById('seSave').addEventListener('click', () => {\n  if(!editingSession || !editTaskId) return;\n  const startHM = document.getElementById('seStart').value;\n  const endHM = document.getElementById('seEnd').value;\n  const hVal = document.getElementById('seH').value;\n  const mVal = document.getElementById('seM').value;\n  const durMin = hmToMinutes(hVal, mVal);\n\n  let startAt = 0, endAt = 0;\n  if(durMin > 0){\n    if(startHM) startAt = timeStrToTs(viewDate, startHM);\n    else startAt = editingSession.startAt;\n    endAt = startAt + durMin * 60000;\n  } else if(startHM && endHM){\n    startAt = timeStrToTs(viewDate, startHM);\n    endAt = timeStrToTs(viewDate, endHM);\n    if(!startAt || !endAt){ toast('时间格式有误'); return; }\n    if(endAt <= startAt) endAt += 86400000;\n  } else {\n    toast('请填写时间或时长');\n    return;\n  }\n  if(endAt - startAt > 24 * 3600 * 1000){ toast('单次时长不能超过 24 小时'); return; }\n\n  const targetParentId = document.getElementById('seParent').value;\n  const targetChildId = document.getElementById('seChild').value;\n  const targetSubChildId = document.getElementById('seSubChild').value;\n  \/\/ 优先取最底层的三级 > 二级 > 一级\n  const targetTaskId = targetSubChildId || targetChildId || targetParentId;\n\n  if(targetTaskId && targetTaskId !== editTaskId){\n    const oldSt = getTaskStatus(viewDate, editTaskId);\n    oldSt.sessions = (oldSt.sessions || []).filter(x => x.id !== editingSession.id);\n    const newSt = getTaskStatus(viewDate, targetTaskId);\n    newSt.sessions.push({ id: editingSession.id, startAt, endAt });\n    save();\n    const currentTask = state.tasks[editTaskId];\n    if (currentTask && currentTask.parentId) {\n      applyCompleteRuleToTask(currentTask.parentId, viewDate);\n    }\n    editingSession = null;\n    document.getElementById('sessionEditModal').classList.remove('show');\n    renderEditSessionList();\n    renderPlan();\n    toast('已移动到新任务');\n    return;\n  }\n\n  editingSession.startAt = startAt;\n  editingSession.endAt = endAt;\n  editingSession = null;\n  save();\n  \n  syncTaskDoneState(editTaskId, viewDate);\n  if (targetTaskId && targetTaskId !== editTaskId) {\n    syncTaskDoneState(targetTaskId, viewDate);\n  }\n\n  document.getElementById('sessionEditModal').classList.remove('show');\n  renderEditSessionList();\n  renderPlan();\n  toast('已保存');\n});\ndocument.getElementById('sessionEditModal').addEventListener('click', e => {\n  if(e.target.id === 'sessionEditModal'){\n    editingSession = null;\n    e.currentTarget.classList.remove('show');\n  }\n});\n\ndocument.getElementById('emSessionList').addEventListener('click', e => {\n  if(!editTaskId) return;\n  const st = getTaskStatus(viewDate, editTaskId);\n\n  const editBtn = e.target.closest('[data-sess-edit]');\n  if(editBtn){\n    const s = (st.sessions || []).find(x => x.id === editBtn.dataset.sessEdit);\n    if(s) openSessionEditModal(s);\n    return;\n  }\n\n  const cancelBtn = e.target.closest('[data-sess-cancel]');\n  if(cancelBtn){ editingSessionId = null; renderEditSessionList(); return; }\n\n  const saveBtn = e.target.closest('[data-sess-save]');\n  if(saveBtn){\n    const sid = saveBtn.dataset.sessSave;\n    const startEl = document.querySelector('[data-sess-start=\"' + sid + '\"]');\n    const endEl = document.querySelector('[data-sess-end=\"' + sid + '\"]');\n    if(!startEl || !endEl) return;\n    let startAt = timeStrToTs(viewDate, startEl.value);\n    let endAt = timeStrToTs(viewDate, endEl.value);\n    if(!startAt || !endAt){ toast('时间格式有误'); return; }\n    if(endAt <= startAt) endAt += 86400000;\n    const s = (st.sessions || []).find(x => x.id === sid);\n    if(s){ s.startAt = startAt; s.endAt = endAt; }\n    editingSessionId = null;\n    save(); renderEditSessionList(); renderPlan();\n    toast('已保存');\n    return;\n  }\n\n  const delBtn = e.target.closest('[data-sess-del]');\n  if(delBtn){\n    const sid = delBtn.dataset.sessDel;\n    const s = (st.sessions || []).find(x => x.id === sid);\n    if(!s) return;\n    askConfirm('确定删除这条专注记录？',\n      fmtHM(s.startAt) + ' – ' + fmtHM(s.endAt) + ' · ' + fmtDuration(sessionSeconds(s)),\n      () => {\n        st.sessions = (st.sessions || []).filter(x => x.id !== sid);\n        if(editingSessionId === sid) editingSessionId = null;\n        \n        syncTaskDoneState(editTaskId, viewDate);\n\n        save(); renderEditSessionList(); renderPlan();\n        toast('已删除');\n      });\n    return;\n  }\n});\n\ndocument.getElementById('emArchive').addEventListener('click', () => {\n  if(!editTaskId) return;\n  const task = state.tasks[editTaskId];\n  if(!task) return;\n  if(task.isSystemFixed){ toast('系统固定任务不能归档'); return; }\n  if(task.isPaperSub){ toast('真题子任务不支持归档，可直接删除'); return; }\n  const targetId = editTaskId;\n  if(task.archived){\n    unarchiveTask(targetId);\n    document.getElementById('editModal').classList.remove('show');\n    editTaskId = null; editingSessionId = null;\n    return;\n  }\n  askConfirm('确定归档任务？',\n    '「' + task.text + '」会从每日列表隐藏，但专注记录和时间都会保留，可在「学习记录」中找回或撤回归档。其二级任务也会一并归档。',\n    () => {\n      archiveTask(targetId);\n      document.getElementById('editModal').classList.remove('show');\n      editTaskId = null; editingSessionId = null;\n    }, '确定归档');\n});\n\ndocument.getElementById('emDelete').addEventListener('click', () => {\n  if(!editTaskId) return;\n  const task = state.tasks[editTaskId];\n  if(!task) return;\n  if(task.isSystemFixed){ toast('系统固定任务不能删除'); return; }\n  const targetId = editTaskId;\n  askConfirm('确定删除任务？',\n    '删除后这个任务以及它的所有专注记录都会彻底消失，不可恢复。若它有一级任务下的二级任务，也会一并删除。',\n    () => {\n      hardRemoveTask(targetId);\n      document.getElementById('editModal').classList.remove('show');\n      editTaskId = null; editingSessionId = null;\n    }, '确定删除');\n});\n\nfunction archiveTask(taskId){\n  const task = state.tasks[taskId];\n  if(!task || task.isSystemFixed) return;\n  const st = getTaskStatus(viewDate, taskId);\n  finishRunning(st);\n  task.archived = true;\n  task.archivedAt = Date.now();\n  function markArchived(id){\n    Object.keys(state.tasks).forEach(cid => {\n      const c = state.tasks[cid];\n      if(c && c.parentId === id && !c.archived && !c.isSystemFixed){\n        c.archived = true; c.archivedAt = Date.now();\n        markArchived(cid);\n      }\n    });\n  }\n  markArchived(taskId);\n  reconcileDayStatus();\n  save();\n  renderPlan();\n  updateDateNav();\n  toast('已归档，专注记录仍在累计中');\n}\n\nfunction unarchiveTask(taskId){\n  const task = state.tasks[taskId];\n  if(!task) return;\n  task.archived = false;\n  task.archivedAt = 0;\n  function markUnarchived(id){\n    Object.keys(state.tasks).forEach(cid => {\n      const c = state.tasks[cid];\n      if(c && c.parentId === id && c.archived){\n        c.archived = false; c.archivedAt = 0;\n        markUnarchived(cid);\n      }\n    });\n  }\n  markUnarchived(taskId);\n  save();\n  renderPlan();\n  updateDateNav();\n  toast('已撤回归档');\n}\n\nfunction hardRemoveTask(taskId){\n  const task = state.tasks[taskId];\n  if(!task) return;\n  if(task.isSystemFixed) return;\n\n  Object.keys(state.tasks).forEach(cid => {\n    if(state.tasks[cid] && state.tasks[cid].parentId === taskId){\n      hardRemoveTask(cid);\n    }\n  });\n\n  const cat = task.category;\n  if(state.settings.taskOrder[cat]){\n    state.settings.taskOrder[cat] = state.settings.taskOrder[cat].filter(id => id !== taskId);\n  }\n\n  Object.keys(state.dayStatus).forEach(k => {\n    const dd = state.dayStatus[k];\n    if(dd && dd.statuses && dd.statuses[taskId]) delete dd.statuses[taskId];\n  });\n\n  delete state.tasks[taskId];\n\n  save();\n  renderPlan();\n  updateDateNav();\n}\n\nfunction cleanupDrag(){\n  document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));\n  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));\n  draggedTask = null; draggedCat = null;\n}\n\nfunction moveTaskTo(cat, fromId, toId){\n  const fromTask = state.tasks[fromId];\n  const toTask = state.tasks[toId];\n  if(!fromTask || !toTask) return;\n  if(fromTask.isSystemFixed || toTask.isSystemFixed) return;\n  const arr = state.settings.taskOrder[cat];\n  if(!arr) return;\n  const fromIdx = arr.indexOf(fromId);\n  if(fromIdx < 0) return;\n  const item = arr.splice(fromIdx, 1)[0];\n  const toIdx = arr.indexOf(toId);\n  arr.splice(toIdx, 0, item);\n  save(); renderPlan();\n}\n\nfunction moveCategoryTo(fromKey, toKey){\n  const order = state.settings.catOrder.slice();\n  const fromIdx = order.indexOf(fromKey);\n  if(fromIdx < 0) return;\n  const item = order.splice(fromIdx, 1)[0];\n  const toIdx = order.indexOf(toKey);\n  order.splice(toIdx, 0, item);\n  state.settings.catOrder = order;\n  save(); renderPlan();\n}\n\ndocument.getElementById('catColumns').addEventListener('dragstart', e => {\n  if(e.target.closest('button, input, .check')){ e.preventDefault(); return; }\n  const taskEl = e.target.closest('.task');\n  if(taskEl && taskEl.dataset.id){\n    const t = state.tasks[taskEl.dataset.id];\n    if(t && t.isSystemFixed){ e.preventDefault(); return; }\n    draggedTask = { cat: taskEl.dataset.cat, id: taskEl.dataset.id };\n    taskEl.classList.add('dragging');\n    e.dataTransfer.effectAllowed = 'move';\n    e.dataTransfer.setData('text\/plain', 'task');\n    return;\n  }\n  const headEl = e.target.closest('.cat-head');\n  if(headEl && !e.target.closest('.add-icon-btn')){\n    const cardEl = headEl.closest('.cat-card');\n    if(cardEl){\n      draggedCat = cardEl.dataset.cat;\n      cardEl.classList.add('dragging');\n      e.dataTransfer.effectAllowed = 'move';\n      e.dataTransfer.setData('text\/plain', 'cat');\n    }\n  }\n});\n\ndocument.getElementById('catColumns').addEventListener('dragover', e => {\n  if(draggedTask){\n    const taskEl = e.target.closest('.task');\n    if(taskEl && taskEl.dataset.cat === draggedTask.cat && taskEl.dataset.id !== draggedTask.id){\n      const t = state.tasks[taskEl.dataset.id];\n      if(t && t.isSystemFixed) return;\n      e.preventDefault();\n      e.dataTransfer.dropEffect = 'move';\n      taskEl.classList.add('drag-over');\n    }\n    return;\n  }\n  if(draggedCat){\n    const cardEl = e.target.closest('.cat-card');\n    if(cardEl && cardEl.dataset.cat !== draggedCat){\n      e.preventDefault();\n      e.dataTransfer.dropEffect = 'move';\n      cardEl.classList.add('drag-over');\n    }\n  }\n});\n\ndocument.getElementById('catColumns').addEventListener('dragleave', e => {\n  const taskEl = e.target.closest('.task');\n  if(taskEl) taskEl.classList.remove('drag-over');\n  const cardEl = e.target.closest('.cat-card');\n  if(cardEl) cardEl.classList.remove('drag-over');\n});\n\ndocument.getElementById('catColumns').addEventListener('drop', e => {\n  e.preventDefault();\n  if(draggedTask){\n    const taskEl = e.target.closest('.task');\n    if(taskEl && taskEl.dataset.cat === draggedTask.cat && taskEl.dataset.id !== draggedTask.id){\n      moveTaskTo(draggedTask.cat, draggedTask.id, taskEl.dataset.id);\n    }\n    draggedTask = null;\n  } else if(draggedCat){\n    const cardEl = e.target.closest('.cat-card');\n    if(cardEl && cardEl.dataset.cat !== draggedCat){\n      moveCategoryTo(draggedCat, cardEl.dataset.cat);\n    }\n    draggedCat = null;\n  }\n  cleanupDrag();\n});\ndocument.getElementById('catColumns').addEventListener('dragend', cleanupDrag);\n\ndocument.getElementById('catColumns').addEventListener('click', e => {\n  \/\/ 👇 新增：处理折叠按钮的点击\n  const toggleBtn = e.target.closest('[data-toggle-task]');\n  if(toggleBtn){\n    e.stopPropagation(); \/\/ 阻止触发其他点击事件（比如打开详情）\n    const taskId = toggleBtn.dataset.toggleTask;\n    if (collapsedTasks.has(taskId)) {\n      collapsedTasks.delete(taskId);\n    } else {\n      collapsedTasks.add(taskId);\n    }\n    state.collapsedTasks = Array.from(collapsedTasks); \/\/ 👈 转换为数组保存进 state\n    save(); \/\/ 👈 立即保存到 localStorage\n    renderPlan(); \/\/ 重新渲染页面\n    return;\n  }\n\n  \/* 系统固定任务：+ 添加真题 *\/\n  const fixedAddBtn = e.target.closest('[data-fixed-add]');\n  \/\/ ... 原有的其他代码保持不变 ...\n  if(fixedAddBtn){\n    e.stopPropagation();\n    openPaperPicker(fixedAddBtn.dataset.fixedAdd);\n    return;\n  }\n\n  \/* 系统固定任务：点击任务文字打开管理弹窗 *\/\n  const fixedManage = e.target.closest('[data-fixed-manage]');\n  if(fixedManage){\n    openFixedPaperManage(fixedManage.dataset.fixedManage);\n    return;\n  }\n\n  const addBtn = e.target.closest('[data-add-cat]');\n  if(addBtn){ openAddModal(addBtn.dataset.addCat); return; }\n  \n  const check = e.target.closest('.check');\n  if(check){\n    const taskId = check.dataset.id;\n    const task = state.tasks[taskId];\n    if(!task) return;\n    toggleTask(viewDate, check.dataset.cat, taskId);\n    const st = getTaskStatus(viewDate, taskId);\n    \n    if(task.parentId){\n      const parent = state.tasks[task.parentId];\n      const grandParent = parent ? state.tasks[parent.parentId] : null;\n      if(grandParent){\n        \/* 三级：更新二级，再更新一级 *\/\n        applyCompleteRuleToTask(task.parentId, viewDate);\n        applyCompleteRuleToTask(parent.parentId, viewDate);\n      } else {\n        const parentSt = getTaskStatus(viewDate, task.parentId);\n        if (parent && parent.isSystemFixed) {\n          const children = getChildTasks(task.parentId);\n          const anyDone = children.some(c => !!getTaskStatus(viewDate, c.id).done);\n          parentSt.done = anyDone;\n        } else {\n          applyCompleteRuleToTask(task.parentId, viewDate);\n        }\n      }\n    } else {\n      \/\/ 如果点的是父级任务，同步底下所有子任务状态\n      getChildTasks(taskId).forEach(c => {\n        getTaskStatus(viewDate, c.id).done = st.done;\n      });\n    }\n    save();\n    renderPlan();\n    return;\n  }\n  \n  const startBtn = e.target.closest('.start-btn');\n  if(startBtn){\n    e.stopPropagation();\n    const taskId = startBtn.dataset.id;\n    const st = getTaskStatus(viewDate, taskId);\n    if(st.runningStart) openFinishModal(viewDate, taskId);\n    else startLearning(viewDate, taskId);\n    return;\n  }\n  \n  const body = e.target.closest('.task-body');\n  if(body){ \n    if(body.dataset.id) openEditModal(body.dataset.cat, body.dataset.id); \n    return; \n  }\n});\n\n\/* ============================================================\n   复盘：通用聚合\n============================================================ *\/\nfunction buildCompletedTree(dateKeys){\n  const catRoots = {};\n\n  dateKeys.forEach(k => {\n    const dd = state.dayStatus[k];\n    if(!dd) return;\n\n    const rootMap = new Map();\n    const childAgg = new Map(); \/\/ 这里我们依然存所有非一级任务，但渲染时再搭树\n\n    if(dd.statuses){\n      Object.keys(dd.statuses).forEach(id => {\n        const task = state.tasks[id];\n        if(!task || task.deleted) return;\n        const st = dd.statuses[id];\n        const sec = statusSeconds(st);\n        const done = !!st.done;\n        const hasSess = (st.sessions||[]).length>0 || !!st.runningStart;\n        \n        \/\/ 向上找顶级（一级任务）\n        let rootId = task.parentId;\n        while(rootId && state.tasks[rootId] && state.tasks[rootId].parentId) {\n          rootId = state.tasks[rootId].parentId;\n        }\n        \n        if(!rootId){\n          \/\/ 是一级任务\n          if(!rootMap.has(id)) rootMap.set(id, { task, ownSec:0, done:false, hasSess:false });\n          const r = rootMap.get(id);\n          r.ownSec += sec;\n          if(done) r.done = true;\n          if(hasSess) r.hasSess = true;\n        } else {\n          \/\/ 二级或三级任务，先存进 childAgg（挂在最顶级 rootId 名下）\n          if(!childAgg.has(rootId)) childAgg.set(rootId, []);\n          childAgg.get(rootId).push({ task, sec, done, hasSess });\n        }\n      });\n    }\n\n    childAgg.forEach((children, rootId) => {\n      if(!rootMap.has(rootId)){\n        const t = state.tasks[rootId];\n        if(t && !t.deleted) rootMap.set(rootId, { task:t, ownSec:0, done:false, hasSess:false });\n      }\n    });\n\n    rootMap.forEach((r, rootId) => {\n      const children = childAgg.get(rootId) || [];\n      const catKey = r.task.category;\n      const anyDone = r.done || children.some(c => c.done);\n      const anySess = r.hasSess || children.some(c => c.hasSess);\n      if(!anyDone && !anySess) return;\n\n      if(!catRoots[catKey]) catRoots[catKey] = new Map();\n      const m = catRoots[catKey];\n      if(!m.has(rootId)){\n        m.set(rootId, {\n          rootId, catKey, name: r.task.text,\n          ownSec: 0, children: [], anyDone: false\n        });\n      }\n      const item = m.get(rootId);\n      item.ownSec += r.ownSec;\n      if(r.done) item.anyDone = true;\n\n      \/\/ 👇 核心重构：在挂载二级和三级时，构建嵌套的层级（children 里面包含 subChildren）\n      children.forEach(c => {\n        if(c.done) item.anyDone = true;\n        if(!c.done && !c.hasSess) return;\n        \n        const t = c.task;\n        if (!t.parentId || t.parentId === rootId) {\n          \/\/ 这是一个二级任务\n          let exist = item.children.find(x => x.id === t.id);\n          if(!exist){\n            exist = { id: t.id, name: t.text, ownSec: 0, subChildren: [] };\n            item.children.push(exist);\n          }\n          exist.ownSec += c.sec;\n        } else {\n          \/\/ 这是一个三级任务\n          let p = item.children.find(x => x.id === t.parentId);\n          if (!p) {\n            const pt = state.tasks[t.parentId];\n            p = { id: pt.id, name: pt.text, ownSec: 0, subChildren: [] };\n            item.children.push(p);\n          }\n          let subEx = p.subChildren.find(x => x.id === t.id);\n          if (!subEx) {\n            subEx = { id: t.id, name: t.text, sec: 0 };\n            p.subChildren.push(subEx);\n          }\n          subEx.sec += c.sec;\n        }\n      });\n    });\n  });\n\n  const items = [];\n  Object.keys(catRoots).forEach(catKey => {\n    catRoots[catKey].forEach(item => {\n      let topLevelSec = item.ownSec;\n      \n      item.children.forEach(c => {\n        let childTotal = c.ownSec;\n        c.subChildren.forEach(sc => { childTotal += sc.sec; });\n        c.sec = childTotal; \/\/ 二级任务的时间 = 自己的时间 + 三级所有时间\n        topLevelSec += childTotal;\n      });\n\n      item.totalSec = topLevelSec;\n      if(item.totalSec <= 0 && !item.children.length && !item.anyDone) return;\n      items.push(item);\n    });\n  });\n\n  return { items };\n}\n\nfunction calcFocusByTree(dateKeys){\n  const { items } = buildCompletedTree(dateKeys);\n  const result = {};\n  DEFAULT_CATEGORIES.forEach(c => result[c.key] = 0);\n  items.forEach(it => {\n    result[it.catKey] = (result[it.catKey] || 0) + it.totalSec;\n  });\n  return result;\n}\n\nfunction keysBetween(startKey, endKey){\n  const arr = [];\n  const d = new Date(startKey + 'T00:00:00');\n  const end = new Date(endKey + 'T00:00:00');\n  while(d <= end){ arr.push(dkey(d)); d.setDate(d.getDate() + 1); }\n  return arr;\n}\n\nfunction buildFocusPieByKeys(dateKeys){\n  const focusByCat = calcFocusByTree(dateKeys);\n  const pieData = orderedCategories().map(c => ({\n    name: c.name,\n    value: focusByCat[c.key] || 0,\n    color: c.color\n  })).filter(d => d.value > 0);\n  return pieData.length ? buildPieBlock(pieData) : '<div class=\"empty\">还没有专注记录<\/div>';\n}\n\n\/* ============================================================\n   完成列表：两列布局（名称 + 时长）\n============================================================ *\/\nfunction buildDoneTreeHtml(dateKeys){\n  const { items } = buildCompletedTree(dateKeys);\n\n  const byCat = {};\n  items.forEach(it => {\n    if(!byCat[it.catKey]) byCat[it.catKey] = [];\n    byCat[it.catKey].push(it);\n  });\n\n  \/\/ 1. 计算每个学科的总时长并排序（时长多的在前）\n  const catStats = orderedCategories().map(c => {\n    const catItems = byCat[c.key] || [];\n    const catTotal = catItems.reduce((a, it) => a + it.totalSec, 0);\n    return { cat: c, catItems, catTotal };\n  }).sort((a, b) => b.catTotal - a.catTotal);\n\n  let html = '';\n\n  catStats.forEach(stat => {\n    const { cat, catItems, catTotal } = stat;\n    if(!catItems.length) return;\n\n    \/\/ 2. 一级任务按总时长降序排列\n    const sortedItems = catItems.slice().sort((a,b) => b.totalSec - a.totalSec);\n\n    html += '<li class=\"done-tree-item\">';\n\n    html += '<div class=\"done-item-row\" style=\"margin-bottom:4px;\">' +\n      '<div class=\"done-cat-name\" style=\"color:' + cat.color + '; padding-left:0;\">' +\n        '<span class=\"done-cat-dot\" style=\"background:' + cat.color + '\"><\/span>' + cat.name +\n      '<\/div>' +\n      '<div class=\"done-item-time done-cat-time\" style=\"color:' + cat.color + '\">' +\n        (catTotal > 0 ? fmtDurationShort(catTotal) : '<span class=\"no-time\">未记录时长<\/span>') +\n      '<\/div>' +\n    '<\/div>';\n\n    sortedItems.forEach(it => {\n      const topTime = it.totalSec > 0 ? fmtDurationShort(it.totalSec) : '未记录时长';\n      \n      html += '<div class=\"done-item-row\">' +\n        '<div class=\"done-top-name\" style=\"font-weight:700; color:var(--ink);\">' + escapeHtml(it.name) + '<\/div>' +\n        '<div class=\"done-item-time\" style=\"font-weight:700; color:var(--ink);\">' + topTime + '<\/div>' +\n      '<\/div>';\n      \n      if(it.children && it.children.length){\n        \/\/ 3. 二级任务按专注时长降序排列\n        const sortedChildren = it.children.slice().sort((a, b) => b.sec - a.sec);\n        \n        sortedChildren.forEach(c => {\n          const subTime = c.sec > 0 ? fmtDurationShort(c.sec) : '未记录时长';\n          html += '<div class=\"done-item-row\">' +\n            '<div class=\"done-sub-name\" style=\"color:var(--muted);\">└ ' + escapeHtml(c.name) + '<\/div>' +\n            '<div class=\"done-item-time\" style=\"color:var(--muted);\">' + subTime + '<\/div>' +\n          '<\/div>';\n\n          \/\/ 👇 核心新增：渲染三级任务（带更深缩进）\n          if (c.subChildren && c.subChildren.length) {\n            const sortedSub = c.subChildren.slice().sort((a, b) => b.sec - a.sec);\n            sortedSub.forEach(sc => {\n              const scTime = sc.sec > 0 ? fmtDurationShort(sc.sec) : '未记录时长';\n              \/\/ 使用 mixHex 让颜色比 --muted 再淡 35%\n              const subColor = mixHex(state.settings.theme === 'dark' ? '#171b19' : '#ffffff', '#8a938e', 0.65);\n              html += '<div class=\"done-item-row\">' +\n                '<div class=\"done-sub-name\" style=\"padding-left: 40px; color:' + subColor + ';\">└ ' + escapeHtml(sc.name) + '<\/div>' +\n                '<div class=\"done-item-time\" style=\"color:' + subColor + ';\">' + scTime + '<\/div>' +\n              '<\/div>';\n            });\n          }\n        });\n        if(it.ownSec > 0){\n          html += '<div class=\"done-item-row\">' +\n            '<div class=\"done-sub-name\" style=\"color:var(--muted);font-style:italic\">（本任务自身专注）<\/div>' +\n            '<div class=\"done-item-time sub\">' + fmtDurationShort(it.ownSec) + '<\/div>' +\n          '<\/div>';\n        }\n      }\n    });\n\n    html += '<\/li>';\n  });\n\n  if(!html) return '<div class=\"empty\">还没有完成任务<\/div>';\n  return '<ul class=\"done-tree\">' + html + '<\/ul>';\n}\n\n\/* ============================================================\n   月度热力图\n============================================================ *\/\nfunction renderMonthHeatmap(y, m, daysInMonth){\n  const firstDay = new Date(y, m, 1);\n  let startWeekday = firstDay.getDay();\n  startWeekday = startWeekday === 0 ? 6 : startWeekday - 1;\n\n  const daySeconds = [];\n  let maxSec = 0;\n  for(let d = 1; d <= daysInMonth; d++){\n    const k = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');\n    const sec = getDayFocusSec(k);\n    daySeconds.push({ d, k, sec });\n    if(sec > maxSec) maxSec = sec;\n  }\n\n  const themeColor = state.settings.themeColor || '#2f5d50';\n  const cells = [];\n  for(let i = 0; i < startWeekday; i++){\n    cells.push('<div class=\"heatmap-day-wrap\"><\/div>');\n  }\n  const todayKey = logicalKey();\n  \n  daySeconds.forEach(item => {\n    let level = 0;\n    if(item.sec > 0 && maxSec > 0){\n      const ratio = item.sec \/ maxSec;\n      if(ratio <= 0.25) level = 1;\n      else if(ratio <= 0.5) level = 2;\n      else if(ratio <= 0.75) level = 3;\n      else level = 4;\n    }\n    let bg = 'var(--checkin-off)';\n    if(level === 1) bg = mixHex(themeColor, '#ffffff', 0.7);\n    if(level === 2) bg = mixHex(themeColor, '#ffffff', 0.45);\n    if(level === 3) bg = mixHex(themeColor, '#ffffff', 0.2);\n    if(level === 4) bg = themeColor;\n\n    const isToday = item.k === todayKey;\n    \n    let timeStr = '';\n    if (item.sec > 0) {\n      const totalMin = Math.round(item.sec \/ 60);\n      if (totalMin < 60) {\n        timeStr = totalMin + 'm';\n      } else {\n        const h = Math.floor(totalMin \/ 60);\n        const m = totalMin % 60;\n        timeStr = h + 'h' + (m > 0 ? m + 'm' : '');\n      }\n    }\n\n    cells.push(\n      '<div class=\"heatmap-day-wrap\" title=\"' + item.k + ' · ' + fmtDuration(item.sec) + '\">' +\n        '<div class=\"heatmap-cell' + (isToday ? ' today' : '') + '\" ' +\n        'style=\"background:' + bg + '\">' + item.d + '<\/div>' +\n        (timeStr ? '<span class=\"heatmap-time\">' + timeStr + '<\/span>' : '') +\n      '<\/div>'\n    );\n  });\n\n  return '<div class=\"heatmap-grid\">' +\n    ['一','二','三','四','五','六','日'].map(w => '<div class=\"heatmap-weekday\">' + w + '<\/div>').join('') +\n    cells.join('') +\n  '<\/div>';\n}\n\n\/* ============================================================\n   月度时间轴\n============================================================ *\/\nfunction collectMonthSessions(y, m, daysInMonth){\n  const result = [];\n  for(let d = 1; d <= daysInMonth; d++){\n    const k = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');\n    const dd = state.dayStatus[k];\n    if(!dd) continue;\n    const dayBase = new Date(k + 'T00:00:00').getTime();\n    const dayEnd = dayBase + 86400000;\n\n    const pushSess = (catKey, sess, extra) => {\n      const s = Math.max(sess.startAt, dayBase);\n      const e = Math.min(sess.endAt, dayEnd);\n      if(e <= s) return;\n      result.push(Object.assign({\n        dateKey: k, day: d, catKey,\n        startMin: (s - dayBase) \/ 60000,\n        endMin: (e - dayBase) \/ 60000,\n        startAt: s, endAt: e\n      }, extra || {}));\n    };\n\n    if(dd.statuses){\n      Object.keys(dd.statuses).forEach(id => {\n        const task = state.tasks[id];\n        if(!task || task.deleted) return;\n        const parent = task.parentId ? state.tasks[task.parentId] : null;\n        (dd.statuses[id].sessions || []).forEach(s => pushSess(task.category, s, {\n          taskName: task.text,\n          parentName: parent ? parent.text : '',\n          isSub: !!task.parentId\n        }));\n      });\n    }\n  }\n  return result;\n}\n\nlet tlSessionIndex = {};\n\nfunction renderMonthlyTimeline(y, m, daysInMonth){\n  const sessions = collectMonthSessions(y, m, daysInMonth);\n\n  if(!sessions.length){\n    return '<div class=\"empty\" style=\"padding: 40px 0;\">本月无学习专注记录<\/div>';\n  }\n  tlSessionIndex = {};\n  sessions.forEach(s => {\n    const key = s.dateKey + '|' + s.startAt + '|' + s.catKey + '|' + (s.taskName||'');\n    tlSessionIndex[key] = s;\n  });\n\n  let minMin = 6 * 60, maxMin = 24 * 60;\n  if(sessions.length){\n    let sMin = Infinity, eMin = -Infinity;\n    sessions.forEach(s => { sMin = Math.min(sMin, s.startMin); eMin = Math.max(eMin, s.endMin); });\n    minMin = Math.max(0, Math.floor(sMin \/ 60) * 60);\n    maxMin = Math.min(24 * 60, Math.ceil(eMin \/ 60) * 60);\n    if(maxMin - minMin < 4 * 60){ minMin = 6 * 60; maxMin = 24 * 60; }\n  }\n  const hourCount = Math.round((maxMin - minMin) \/ 60);\n  const hourH = 22;\n  const totalH = hourCount * hourH;\n\n  const catColors = {};\n  orderedCategories().forEach(c => catColors[c.key] = c.color);\n\n  const todayKey = logicalKey();\n\n  let daysRowHtml = '<div class=\"tl-days-row\" style=\"--tl-days:' + daysInMonth + '\">' +\n    '<div><\/div>';\n  for(let d = 1; d <= daysInMonth; d++){\n    const dt = new Date(y, m, d);\n    const wd = dt.getDay();\n    const k = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');\n    const cls = (wd === 0 || wd === 6) ? ' weekend' : '';\n    const todayCls = k === todayKey ? ' today' : '';\n    daysRowHtml += '<div class=\"tl-day-label' + cls + todayCls + '\">' + d + '<\/div>';\n  }\n  daysRowHtml += '<\/div>';\n\n  let hoursHtml = '<div class=\"tl-hours\" style=\"height:' + totalH + 'px\">';\n  for(let h = 0; h <= hourCount; h++){\n    const min = minMin + h * 60;\n    const labelHour = Math.floor(min \/ 60);\n    const label = String(labelHour).padStart(2,'0') + ':00';\n    hoursHtml += '<div class=\"tl-hour-tick\" style=\"top:' + (h * hourH) + 'px\">' + label + '<\/div>';\n  }\n  hoursHtml += '<\/div>';\n\n  const dayColsHtml = [];\n  for(let d = 1; d <= daysInMonth; d++){\n    const k = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');\n    const isToday = k === todayKey;\n    let colHtml = '<div class=\"tl-day-col' + (isToday ? ' today' : '') + '\" data-day=\"' + k + '\">';\n    const daySessions = sessions.filter(s => s.dateKey === k).sort((a,b) => a.startMin - b.startMin);\n    daySessions.forEach(s => {\n      const visStart = Math.max(s.startMin, minMin);\n      const visEnd = Math.min(s.endMin, maxMin);\n      if(visEnd <= visStart) return;\n      const top = (visStart - minMin) \/ 60 * hourH;\n      const height = Math.max(2, (visEnd - visStart) \/ 60 * hourH);\n      const color = catColors[s.catKey] || 'var(--green)';\n      const key = s.dateKey + '|' + s.startAt + '|' + s.catKey + '|' + (s.taskName||'');\n      colHtml += '<div class=\"tl-block\" ' +\n        'style=\"top:' + top.toFixed(1) + 'px;height:' + height.toFixed(1) + 'px;background:' + color + '\" ' +\n        'data-tl-key=\"' + escapeHtml(key) + '\"><\/div>';\n    });\n    colHtml += '<\/div>';\n    dayColsHtml.push(colHtml);\n  }\n\n  const gridHtml = '<div class=\"tl-grid-area\" style=\"height:' + totalH + 'px;--tl-hour-h:' + hourH + 'px;--tl-days:' + daysInMonth + '\">' +\n    dayColsHtml.join('') + '<\/div>';\n\n  const legend = orderedCategories().map(c =>\n    '<span class=\"tl-legend-item\"><span class=\"tl-legend-dot\" style=\"background:' + c.color + '\"><\/span>' + c.name + '<\/span>'\n  ).join('');\n\n  return '<div class=\"tl-wrap\">' +\n    '<div class=\"tl-canvas\" style=\"--tl-days:' + daysInMonth + '\">' +\n      daysRowHtml +\n      '<div class=\"tl-body\">' + hoursHtml + gridHtml + '<\/div>' +\n    '<\/div>' +\n  '<\/div>' +\n  '<div class=\"tl-legend\">' + legend + '<\/div>';\n}\n\n(function initTimelineTooltip(){\n  const tip = document.getElementById('tlTip');\n  if(!tip) return;\n\n  const showTip = (e, key) => {\n    const s = tlSessionIndex[key];\n    if(!s) return;\n    const cat = catByKey(s.catKey);\n    const dur = Math.max(0, Math.round((s.endAt - s.startAt) \/ 60000));\n    const durStr = dur >= 60\n      ? Math.floor(dur\/60) + ' 小时 ' + (dur%60) + ' 分钟'\n      : dur + ' 分钟';\n    let taskLine = '';\n    if(s.isSub && s.parentName){\n      taskLine = '<div><span class=\"tt-cat\" style=\"color:' + (cat ? cat.color : 'var(--bg)') + '\">' +\n        escapeHtml(cat ? cat.name : s.catKey) + '<\/span>' +\n        '<span class=\"tt-sep\">·<\/span>' + escapeHtml(s.parentName) +\n        '<span class=\"tt-sep\">›<\/span>' + escapeHtml(s.taskName) + '<\/div>';\n    } else {\n      taskLine = '<div><span class=\"tt-cat\" style=\"color:' + (cat ? cat.color : 'var(--bg)') + '\">' +\n        escapeHtml(cat ? cat.name : s.catKey) + '<\/span>' +\n        '<span class=\"tt-sep\">·<\/span>' + escapeHtml(s.taskName || '') + '<\/div>';\n    }\n    tip.innerHTML =\n      '<div class=\"tt-time\">' + fmtHM(s.startAt) + ' – ' + fmtHM(s.endAt) + ' · 共 ' + durStr + '<\/div>' +\n      taskLine;\n    const pad = 12;\n    let left = e.clientX + pad;\n    let top = e.clientY + pad;\n    tip.classList.add('show');\n    const rect = tip.getBoundingClientRect();\n    if(left + rect.width > window.innerWidth - 8) left = e.clientX - rect.width - pad;\n    if(top + rect.height > window.innerHeight - 8) top = e.clientY - rect.height - pad;\n    if(left < 8) left = 8;\n    if(top < 8) top = 8;\n    tip.style.left = left + 'px';\n    tip.style.top = top + 'px';\n  };\n\n  const hideTip = () => tip.classList.remove('show');\n\n  document.addEventListener('mouseover', e => {\n    const block = e.target.closest('.tl-block');\n    if(block && block.dataset.tlKey){\n      showTip(e, block.dataset.tlKey);\n    }\n  });\n  document.addEventListener('mousemove', e => {\n    const block = e.target.closest('.tl-block');\n    if(block && block.dataset.tlKey){\n      showTip(e, block.dataset.tlKey);\n    } else if(tip.classList.contains('show')){\n      hideTip();\n    }\n  });\n  document.addEventListener('mouseout', e => {\n    const block = e.target.closest('.tl-block');\n    if(block) hideTip();\n  });\n})();\n\n\/* ============================================================\n   复盘渲染\n============================================================ *\/\nlet reviewDate = logicalKey();\nlet weekRefDate = logicalKey();\nlet monthRefDate = logicalKey();\n\nfunction getWeekRangeOf(dateKey){\n  const d = new Date(dateKey + 'T00:00:00');\n  const wd = d.getDay();\n  const offset = wd === 0 ? 6 : wd - 1;\n  const mon = new Date(d);\n  mon.setDate(d.getDate() - offset);\n  const sun = new Date(mon);\n  sun.setDate(mon.getDate() + 6);\n  return { monday: mon, sunday: sun, startKey: dkey(mon), endKey: dkey(sun) };\n}\n\nfunction updateReviewDateNav(){\n  const inp = document.getElementById('rvDateInput');\n  inp.value = reviewDate;\n  const d = new Date(reviewDate + 'T00:00:00');\n  const w = '日一二三四五六'[d.getDay()];\n  document.getElementById('rvDateText').textContent =\n    (d.getMonth()+1) + '月' + d.getDate() + '日 · 周' + w;\n  document.getElementById('rvBackToday').hidden = (reviewDate === logicalKey());\n\n  const wr = getWeekRangeOf(weekRefDate);\n  const wm = new Date(wr.startKey + 'T00:00:00');\n  const ws = new Date(wr.endKey + 'T00:00:00');\n  document.getElementById('wvDateText').textContent =\n    (wm.getMonth()+1) + '月' + wm.getDate() + '日 - ' + (ws.getMonth()+1) + '月' + ws.getDate() + '日';\n  document.getElementById('wvBackThis').hidden = (wr.startKey === getWeekRangeOf(logicalKey()).startKey);\n  const wvInp = document.getElementById('wvDateInput');\n  wvInp.value = weekRefDate;\n\n  const md = new Date(monthRefDate + 'T00:00:00');\n  document.getElementById('monthRangeText').textContent =\n    md.getFullYear() + ' 年 ' + (md.getMonth()+1) + ' 月';\n  const now = new Date();\n  document.getElementById('monthBackThis').hidden = (md.getFullYear() === now.getFullYear() && md.getMonth() === now.getMonth());\n}\n\nfunction renderDailyCol(){\n  const k = reviewDate;\n  const pieHtml = buildFocusPieByKeys([k]);\n  const doneHtml = buildDoneTreeHtml([k]);\n  document.getElementById('dailyCol').innerHTML =\n    '<div class=\"review-inner-stack\">' +\n      '<div class=\"card\">' +\n        '<div class=\"mini-card-title\"><span>今日专注<\/span><\/div>' +\n        pieHtml +\n      '<\/div>' +\n      '<div class=\"card\">' +\n        '<div class=\"mini-card-title\"><span>今日完成<\/span><\/div>' +\n        doneHtml +\n      '<\/div>' +\n    '<\/div>';\n}\n\nfunction renderWeeklyCol(){\n  const range = getWeekRangeOf(weekRefDate);\n  const dateKeys = keysBetween(range.startKey, range.endKey);\n  const pieHtml = buildFocusPieByKeys(dateKeys);\n  const doneHtml = buildDoneTreeHtml(dateKeys);\n  document.getElementById('weeklyCol').innerHTML =\n    '<div class=\"review-inner-stack\">' +\n      '<div class=\"card\">' +\n        '<div class=\"mini-card-title\"><span>本周专注<\/span><\/div>' +\n        pieHtml +\n      '<\/div>' +\n      '<div class=\"card\">' +\n        '<div class=\"mini-card-title\"><span>本周完成<\/span><\/div>' +\n        doneHtml +\n      '<\/div>' +\n    '<\/div>';\n}\n\nfunction renderMonthlyCols(){\n  const d0 = new Date(monthRefDate + 'T00:00:00');\n  const y = d0.getFullYear();\n  const m = d0.getMonth();\n  const monthStart = new Date(y, m, 1);\n  const monthEnd = new Date(y, m + 1, 0);\n  const startKey = dkey(monthStart), endKey = dkey(monthEnd);\n  const daysInMonth = monthEnd.getDate();\n  const dateKeys = keysBetween(startKey, endKey);\n\n  const pieHtml = buildFocusPieByKeys(dateKeys);\n  const doneHtml = buildDoneTreeHtml(dateKeys);\n  document.getElementById('monthlyColLeft').innerHTML =\n    '<div class=\"card\">' +\n      '<div class=\"mini-card-title\"><span>本月专注<\/span><\/div>' +\n      pieHtml +\n    '<\/div>' +\n    '<div class=\"card\">' +\n      '<div class=\"mini-card-title\"><span>本月完成<\/span><\/div>' +\n      doneHtml +\n    '<\/div>';\n\n  const dayKeys = [];\n  for(let d = 1; d <= daysInMonth; d++){\n    dayKeys.push(y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0'));\n  }\n  const catDays = {};\n  orderedCategories().forEach(c => catDays[c.key] = 0);\n\n  const monthLineHtml = orderedCategories().map(c => {\n    const cells = dayKeys.map(k => {\n      const dd = state.dayStatus[k];\n      let has = false;\n      if(dd && dd.statuses){\n        has = Object.keys(dd.statuses).some(id => {\n          const task = state.tasks[id];\n          return task && !task.deleted && task.category === c.key && dd.statuses[id].done;\n        });\n      }\n      if(has) catDays[c.key]++;\n      return '<div class=\"month-cell' + (has ? ' on' : '') + '\" title=\"' + k + '\"><\/div>';\n    }).join('');\n    return '<div class=\"month-line-item\">' +\n      '<div class=\"month-line-label\">' + c.name + '<\/div>' +\n      '<div class=\"month-cells\">' + cells + '<\/div>' +\n      '<div class=\"month-line-count\">' + catDays[c.key] + ' 天<\/div>' +\n    '<\/div>';\n  }).join('');\n\n  const heatmapHtml = renderMonthHeatmap(y, m, daysInMonth);\n  const timelineHtml = renderMonthlyTimeline(y, m, daysInMonth);\n\n  document.getElementById('monthlyColRight').innerHTML =\n    '<div class=\"card\">' +\n      '<div class=\"mini-card-title\">本月学习打卡<\/div>' +\n      '<div class=\"month-line\">' + monthLineHtml + '<\/div>' +\n    '<\/div>' +\n    '<div class=\"card\">' +\n      '<div class=\"mini-card-title\">本月专注热力图<\/div>' +\n      heatmapHtml +\n    '<\/div>' +\n    '<div class=\"card\">' +\n      '<div class=\"mini-card-title\">本月专注时间轴<\/div>' +\n      timelineHtml +\n    '<\/div>';\n}\n\nfunction renderReviewTotals(){\n  const el = document.getElementById('reviewTotals');\n  const totalTasks = calcTotalCompletedTasks();\n  const totalFocus = calcTotalFocusSec();\n  const { h, m } = fmtDurationParts(totalFocus);\n  const days = calcTotalStudyDays();\n  const streak = calcStudyStreak();\n\n  let focusHtml = '';\n  if(h > 0 && m > 0) focusHtml = h + '<span class=\"u\">小时<\/span> ' + m + '<span class=\"u\">分钟<\/span>';\n  else if(h > 0) focusHtml = h + '<span class=\"u\">小时<\/span>';\n  else focusHtml = m + '<span class=\"u\">分钟<\/span>';\n\n  el.innerHTML =\n    '<div class=\"total-card\"><div class=\"total-num\">' + focusHtml + '<\/div><div class=\"total-label\">累计专注<\/div><\/div>' +\n    '<div class=\"total-card\"><div class=\"total-num\">' + totalTasks + '<span class=\"u\">个<\/span><\/div><div class=\"total-label\">累计完成任务<\/div><\/div>' +\n    '<div class=\"total-card\"><div class=\"total-num\">' + days + '<span class=\"u\">天<\/span><\/div><div class=\"total-label\">学习天数<\/div><\/div>' +\n    '<div class=\"total-card\"><div class=\"total-num\">' + streak + '<span class=\"u\">天<\/span><\/div><div class=\"total-label\">连续学习天数<\/div><\/div>';\n}\n\nfunction renderReview(){\n  updateReviewDateNav();\n  renderReviewTotals();\n  renderDailyCol();\n  renderWeeklyCol();\n  renderMonthlyCols();\n}\n\n\/* ============================================================\n   复盘日期导航事件\n============================================================ *\/\ndocument.getElementById('rvDateBtn').addEventListener('click', () => {\n  const inp = document.getElementById('rvDateInput');\n  inp.value = reviewDate;\n  try { if(typeof inp.showPicker === 'function'){ inp.showPicker(); return; } } catch(e){}\n  inp.focus(); inp.click();\n});\ndocument.getElementById('rvPrevDay').addEventListener('click', () => {\n  reviewDate = shiftDateKey(reviewDate, -1);\n  renderReview();\n});\ndocument.getElementById('rvNextDay').addEventListener('click', () => {\n  reviewDate = shiftDateKey(reviewDate, 1);\n  renderReview();\n});\ndocument.getElementById('rvBackToday').addEventListener('click', () => {\n  reviewDate = logicalKey();\n  renderReview();\n});\ndocument.getElementById('rvDateInput').addEventListener('change', e => {\n  const v = e.target.value;\n  if(v){ reviewDate = v; renderReview(); }\n  else e.target.value = reviewDate;\n});\n\ndocument.getElementById('wvDateBtn').addEventListener('click', () => {\n  const inp = document.getElementById('wvDateInput');\n  inp.value = weekRefDate;\n  try { if(typeof inp.showPicker === 'function'){ inp.showPicker(); return; } } catch(e){}\n  inp.focus(); inp.click();\n});\ndocument.getElementById('wvPrevWeek').addEventListener('click', () => {\n  weekRefDate = shiftDateKey(weekRefDate, -7);\n  renderReview();\n});\ndocument.getElementById('wvNextWeek').addEventListener('click', () => {\n  weekRefDate = shiftDateKey(weekRefDate, 7);\n  renderReview();\n});\ndocument.getElementById('wvBackThis').addEventListener('click', () => {\n  weekRefDate = logicalKey();\n  renderReview();\n});\ndocument.getElementById('wvDateInput').addEventListener('change', e => {\n  const v = e.target.value;\n  if(v){ weekRefDate = v; renderReview(); }\n  else e.target.value = weekRefDate;\n});\n\ndocument.getElementById('monthPrev').addEventListener('click', () => {\n  const d = new Date(monthRefDate + 'T00:00:00');\n  d.setMonth(d.getMonth() - 1);\n  monthRefDate = dkey(d);\n  renderReview();\n});\ndocument.getElementById('monthNext').addEventListener('click', () => {\n  const d = new Date(monthRefDate + 'T00:00:00');\n  d.setMonth(d.getMonth() + 1);\n  monthRefDate = dkey(d);\n  renderReview();\n});\ndocument.getElementById('monthBackThis').addEventListener('click', () => {\n  monthRefDate = logicalKey();\n  renderReview();\n});\n\n\/* ============================================================\n   学习记录弹窗\n============================================================ *\/\nfunction getAllArchivedTasks(){\n  return Object.keys(state.tasks)\n    .map(id => state.tasks[id])\n    .filter(t => t && t.archived && !t.deleted)\n    .sort((a,b) => (b.archivedAt || 0) - (a.archivedAt || 0));\n}\n\nfunction getAllFocusRecords(){\n  const list = [];\n  Object.keys(state.dayStatus).forEach(k => {\n    const dd = state.dayStatus[k];\n    if(!dd) return;\n    if(dd.statuses){\n      Object.keys(dd.statuses).forEach(id => {\n        const task = state.tasks[id];\n        if(!task) return;\n        (dd.statuses[id].sessions || []).forEach(s => {\n          list.push({ dateKey: k, taskId: id, task, session: s, deleted: !!task.deleted, archived: !!task.archived });\n        });\n      });\n    }\n  });\n  list.sort((a, b) => b.session.startAt - a.session.startAt);\n  return list;\n}\n\nfunction renderArchivedItemHtml(t){\n  const sec = taskTotalSeconds(t.id);\n  const cat = catByKey(t.category);\n  const catHtml = '<span class=\"record-cat\" style=\"background:' + (cat ? cat.soft : 'var(--aux-line)') +\n    ';color:' + (cat ? cat.color : 'var(--muted)') + '\">' + (cat ? cat.name : t.category) + '<\/span>';\n  const archDate = t.archivedAt ? dkey(new Date(t.archivedAt)) : '';\n  return '<div class=\"record-item record-clickable\" data-arch-id=\"' + t.id + '\">' +\n    catHtml +\n    '<div class=\"record-info\">' +\n      '<div class=\"record-name\">' + escapeHtml(t.text) + '<\/div>' +\n      '<div class=\"record-meta\">归档于 ' + (archDate || '—') + ' · 累计专注 ' + fmtDuration(sec) + '<\/div>' +\n    '<\/div>' +\n  '<\/div>';\n}\n\nfunction renderFocusItemHtml(f){\n  const catKey = f.task.category;\n  const cat = catByKey(catKey);\n  const catHtml = '<span class=\"record-cat\" style=\"background:' + (cat ? cat.soft : 'var(--aux-line)') +\n    ';color:' + (cat ? cat.color : 'var(--muted)') + '\">' + (cat ? cat.name : catKey) + '<\/span>';\n\n  \/\/ 1. 顺着 parentId 往上找，把整个任务链收集起来\n  const chain = [];\n  let curr = f.task;\n  let guard = 0;\n  while (curr && guard++ < 10) {\n    chain.unshift(curr.text); \/\/ 插到数组最前面，这样就是从高级到低级\n    if (curr.parentId && state.tasks[curr.parentId]) {\n      curr = state.tasks[curr.parentId];\n    } else {\n      curr = null;\n    }\n  }\n\n  \/\/ 2. 把任务链用“›”连起来，区分一级、二级、三级\n  let nameHtml = chain.map((text, idx) => {\n    if (idx === 0) {\n      \/\/ 一级任务：加粗黑色\n      return '<span style=\"font-weight:700;color:var(--ink)\">' + escapeHtml(text) + '<\/span>';\n    } else if (idx === 1) {\n      \/\/ 二级任务：正常黑色\n      return '<span style=\"color:var(--ink)\">' + escapeHtml(text) + '<\/span>';\n    } else {\n      \/\/ 三级及以下：灰色\n      return '<span style=\"color:var(--muted)\">' + escapeHtml(text) + '<\/span>';\n    }\n  }).join('<span style=\"color:var(--muted);margin:0 4px\">›<\/span>');\n\n  let statusHtml = '';\n  if(f.task.isSystemFixed) statusHtml = '<span class=\"status-tag\">系统固定<\/span>';\n  else if(f.task.isPaperSub) statusHtml = '<span class=\"status-tag\">真题<\/span>';\n  if(f.deleted) statusHtml = '<span class=\"status-tag\">已删除<\/span>';\n  else if(f.archived) statusHtml = '<span class=\"status-tag\">已归档<\/span>';\n\n  return '<div class=\"record-item record-clickable\" data-rec-open=\"' + f.session.id + '\" data-rec-date=\"' + f.dateKey + '\" data-rec-type=\"task:' + f.taskId + '\">' +\n    catHtml +\n    '<div class=\"record-info\">' +\n      '<div class=\"record-top\">' +\n        nameHtml +\n        statusHtml +\n      '<\/div>' +\n      '<div class=\"record-meta\">' + f.dateKey + ' · ' + fmtHM(f.session.startAt) + ' – ' + fmtHM(f.session.endAt) + '<\/div>' +\n    '<\/div>' +\n    '<div class=\"record-value\">' + fmtDuration(sessionSeconds(f.session)) + '<\/div>' +\n  '<\/div>';\n}\n\nfunction renderRecordModal(){\n  const focus = getAllFocusRecords();\n  const focusBox = document.getElementById('recordFocusList');\n  if(!focus.length){\n    focusBox.innerHTML = '<div class=\"empty\">还没有专注记录<\/div>';\n  } else {\n    focusBox.innerHTML = focus.slice(0, 3).map(renderFocusItemHtml).join('');\n  }\n  document.getElementById('moreFocusBtn').hidden = focus.length <= 3;\n\n  const archived = getAllArchivedTasks();\n  const archBox = document.getElementById('recordArchivedList');\n  if(!archived.length){\n    archBox.innerHTML = '<div class=\"empty\">还没有归档任务<\/div>';\n  } else {\n    archBox.innerHTML = archived.slice(0, 3).map(renderArchivedItemHtml).join('');\n  }\n  document.getElementById('moreArchivedBtn').hidden = archived.length <= 3;\n}\n\nfunction renderMoreArchived(){\n  const archived = getAllArchivedTasks();\n  const box = document.getElementById('moreArchivedList');\n  if(!archived.length){\n    box.innerHTML = '<div class=\"empty\">还没有归档任务<\/div>';\n    return;\n  }\n  box.innerHTML = archived.map(renderArchivedItemHtml).join('');\n}\n\nfunction renderMoreFocus(){\n  const focus = getAllFocusRecords();\n  const box = document.getElementById('moreFocusList');\n  if(!focus.length){\n    box.innerHTML = '<div class=\"empty\">还没有专注记录<\/div>';\n    return;\n  }\n  box.innerHTML = focus.map(renderFocusItemHtml).join('');\n  document.getElementById('moreFocusTitle').textContent = '全部专注记录';\n}\n\ndocument.getElementById('recordBtn').addEventListener('click', () => {\n  renderRecordModal();\n  document.getElementById('recordModal').classList.add('show');\n});\ndocument.getElementById('recordClose').addEventListener('click', () => {\n  document.getElementById('recordModal').classList.remove('show');\n});\ndocument.getElementById('recordModal').addEventListener('click', e => {\n  if(e.target.id === 'recordModal') e.currentTarget.classList.remove('show');\n});\n\ndocument.getElementById('moreArchivedBtn').addEventListener('click', () => {\n  renderMoreArchived();\n  document.getElementById('moreArchivedModal').classList.add('show');\n});\ndocument.getElementById('moreArchivedClose').addEventListener('click', () => {\n  document.getElementById('moreArchivedModal').classList.remove('show');\n});\ndocument.getElementById('moreArchivedModal').addEventListener('click', e => {\n  if(e.target.id === 'moreArchivedModal') e.currentTarget.classList.remove('show');\n});\n\ndocument.getElementById('moreFocusBtn').addEventListener('click', () => {\n  renderMoreFocus();\n  document.getElementById('moreFocusModal').classList.add('show');\n});\ndocument.getElementById('moreFocusClose').addEventListener('click', () => {\n  document.getElementById('moreFocusModal').classList.remove('show');\n});\ndocument.getElementById('moreFocusModal').addEventListener('click', e => {\n  if(e.target.id === 'moreFocusModal') e.currentTarget.classList.remove('show');\n});\n\ndocument.querySelectorAll('#recordArchivedList, #moreArchivedList').forEach(box => {\n  box.addEventListener('click', e => {\n    const item = e.target.closest('[data-arch-id]');\n    if(!item) return;\n    const taskId = item.dataset.archId;\n    const task = state.tasks[taskId];\n    if(!task) return;\n    document.getElementById('recordModal').classList.remove('show');\n    document.getElementById('moreArchivedModal').classList.remove('show');\n    viewDate = logicalKey();\n    updateDateNav();\n    openEditModal(task.category, taskId);\n  });\n});\n\nlet recEditTarget = null;\n\nfunction findSessionByType(dateKey, type, sessionId){\n  const dd = state.dayStatus[dateKey];\n  if(!dd) return null;\n  if(type.startsWith('task:')){\n    const taskId = type.slice(5);\n    const st = dd.statuses && dd.statuses[taskId];\n    if(!st) return null;\n    const session = (st.sessions || []).find(s => s.id === sessionId);\n    return { type:'task', taskId, session };\n  }\n  return null;\n}\n\nfunction removeSessionByType(dateKey, type, sessionId){\n  const dd = state.dayStatus[dateKey];\n  if(!dd) return false;\n  if(type.startsWith('task:')){\n    const taskId = type.slice(5);\n    const st = dd.statuses && dd.statuses[taskId];\n    if(!st) return false;\n    st.sessions = (st.sessions || []).filter(s => s.id !== sessionId);\n    return true;\n  }\n  return false;\n}\n\nfunction buildRfTaskSelectors(task){\n  const catSel = document.getElementById('rfCategory');\n  fillCategorySelect(catSel, task.category);\n  \n  const parentSel = document.getElementById('rfParent');\n  const childSel = document.getElementById('rfChild');\n  const subChildSel = document.getElementById('rfSubChild');\n\n  \/\/ 找出这个任务的真实一级和二级\n  let level1Id = '';\n  let level2Id = '';\n  if (!task.parentId) {\n    level1Id = task.id;\n  } else {\n    const p1 = state.tasks[task.parentId];\n    if (p1 && p1.parentId) {\n      level2Id = p1.id;\n      level1Id = p1.parentId;\n    } else {\n      level2Id = task.id;\n      level1Id = task.parentId;\n    }\n  }\n\n  fillParentSelect(parentSel, task.category, null, level1Id);\n  \n  \/\/ 填入二级\n  const children = level1Id ? getChildTasks(level1Id) : [];\n  childSel.innerHTML = '<option value=\"\">（只属于一级任务）<\/option>' + children.map(c =>\n    '<option value=\"' + c.id + '\"' + (c.id === level2Id ? ' selected' : '') + '>' + escapeHtml(c.text) + '<\/option>'\n  ).join('');\n\n  \/\/ 填入三级\n  const subChildren = level2Id ? getChildTasks(level2Id) : [];\n  subChildSel.innerHTML = '<option value=\"\">（只属于二级任务）<\/option>' + subChildren.map(c =>\n    '<option value=\"' + c.id + '\"' + (c.id === task.id && task.parentId && state.tasks[task.parentId].parentId ? ' selected' : '') + '>' + escapeHtml(c.text) + '<\/option>'\n  ).join('');\n}\n\ndocument.getElementById('rfCategory').addEventListener('change', e => {\n  const catKey = e.target.value;\n  const parentSel = document.getElementById('rfParent');\n  fillParentSelect(parentSel, catKey, null, null);\n  const parentId = parentSel.value;\n  const childSel = document.getElementById('rfChild');\n  const children = parentId ? getChildTasks(parentId) : [];\n  childSel.innerHTML = '<option value=\"\">（只属于一级任务）<\/option>' + children.map(c =>\n    '<option value=\"' + c.id + '\">' + escapeHtml(c.text) + '<\/option>'\n  ).join('');\n  document.getElementById('rfSubChild').innerHTML = '<option value=\"\">（只属于二级任务）<\/option>';\n});\n\ndocument.getElementById('rfParent').addEventListener('change', () => {\n  const parentId = document.getElementById('rfParent').value;\n  const childSel = document.getElementById('rfChild');\n  const children = parentId ? getChildTasks(parentId) : [];\n  childSel.innerHTML = '<option value=\"\">（只属于一级任务）<\/option>' + children.map(c =>\n    '<option value=\"' + c.id + '\">' + escapeHtml(c.text) + '<\/option>'\n  ).join('');\n  document.getElementById('rfSubChild').innerHTML = '<option value=\"\">（只属于二级任务）<\/option>';\n});\n\ndocument.getElementById('rfChild').addEventListener('change', () => {\n  const childId = document.getElementById('rfChild').value;\n  const subChildSel = document.getElementById('rfSubChild');\n  const subChildren = childId ? getChildTasks(childId) : [];\n  subChildSel.innerHTML = '<option value=\"\">（只属于二级任务）<\/option>' + subChildren.map(c =>\n    '<option value=\"' + c.id + '\">' + escapeHtml(c.text) + '<\/option>'\n  ).join('');\n});\n\ndocument.querySelectorAll('#recordFocusList, #moreFocusList').forEach(box => {\n  box.addEventListener('click', e => {\n    const item = e.target.closest('[data-rec-open]');\n    if(!item) return;\n    const dateKey = item.dataset.recDate;\n    const type = item.dataset.recType;\n    const sid = item.dataset.recOpen;\n    const found = findSessionByType(dateKey, type, sid);\n    if(!found || !found.session){ toast('记录不存在'); return; }\n    recEditTarget = { dateKey, type, sessionId: sid };\n    document.getElementById('rfDate').value = dateKey;\n    document.getElementById('rfStart').value = fmtHM(found.session.startAt);\n    document.getElementById('rfEnd').value = fmtHM(found.session.endAt);\n    document.getElementById('rfH').value = '';\n    document.getElementById('rfM').value = '';\n    if(found.type === 'task'){\n      const task = state.tasks[found.taskId];\n      if(task) buildRfTaskSelectors(task);\n      else {\n        document.getElementById('rfCategory').innerHTML = '';\n        document.getElementById('rfParent').innerHTML = '';\n        document.getElementById('rfChild').innerHTML = '';\n      }\n    }\n    document.getElementById('recordFocusEditModal').classList.add('show');\n  });\n});\n\ndocument.getElementById('rfCancel').addEventListener('click', () => {\n  recEditTarget = null;\n  document.getElementById('recordFocusEditModal').classList.remove('show');\n});\n\ndocument.getElementById('rfSave').addEventListener('click', () => {\n  if(!recEditTarget) return;\n  const dateKey = document.getElementById('rfDate').value || recEditTarget.dateKey;\n  const startHM = document.getElementById('rfStart').value;\n  const endHM = document.getElementById('rfEnd').value;\n  const hVal = document.getElementById('rfH').value;\n  const mVal = document.getElementById('rfM').value;\n  const durMin = hmToMinutes(hVal, mVal);\n\n  const found = findSessionByType(recEditTarget.dateKey, recEditTarget.type, recEditTarget.sessionId);\n  if(!found || !found.session){ toast('记录不存在'); return; }\n\n  let startAt = 0, endAt = 0;\n  if(durMin > 0){\n    startAt = startHM ? timeStrToTs(dateKey, startHM) : timeStrToTs(dateKey, '12:00');\n    endAt = startAt + durMin * 60000;\n  } else if(startHM && endHM){\n    startAt = timeStrToTs(dateKey, startHM);\n    endAt = timeStrToTs(dateKey, endHM);\n    if(!startAt || !endAt){ toast('时间格式有误'); return; }\n    if(endAt <= startAt) endAt += 86400000;\n  } else {\n    toast('请填写时间或时长'); return;\n  }\n  if(endAt - startAt > 24 * 3600 * 1000){ toast('单次时长不能超过 24 小时'); return; }\n\n  let targetType = recEditTarget.type;\n  let targetTaskId = null;\n  if(recEditTarget.type.startsWith('task:')){\n    const parentId = document.getElementById('rfParent').value;\n    const childId = document.getElementById('rfChild').value;\n    const subChildId = document.getElementById('rfSubChild').value;\n    \/\/ 优先取最底层的三级 > 二级 > 一级\n    const chosenId = subChildId || childId || parentId;\n    if(chosenId) targetTaskId = chosenId;\n  }\n\n  const oldDateKey = recEditTarget.dateKey;\n  const oldType = recEditTarget.type;\n  const sameTask = (targetTaskId && targetType === 'task:' + targetTaskId);\n  const sameDate = dateKey === oldDateKey;\n\n  if(sameTask && sameDate){\n    found.session.startAt = startAt;\n    found.session.endAt = endAt;\n  } else {\n    removeSessionByType(oldDateKey, oldType, recEditTarget.sessionId);\n    const dd = getDayStatus(dateKey);\n    if(targetTaskId){\n      if(!dd.statuses[targetTaskId]) dd.statuses[targetTaskId] = { done:false, sessions:[], runningStart:0 };\n      dd.statuses[targetTaskId].sessions.push({ id: uid(), startAt, endAt });\n    } else {\n      toast('请选择所属任务'); return;\n    }\n  }\n\n  \/\/ 👇 新增：修改保存后，强制让该任务打钩并联动父级\n  if (targetTaskId) {\n    const targetSt = getTaskStatus(dateKey, targetTaskId);\n    targetSt.done = true; \/\/ 设置为已完成\n    \n    const t = state.tasks[targetTaskId];\n    if (t && t.parentId) {\n      applyCompleteRuleToTask(t.parentId, dateKey); \/\/ 如果是子任务，更新父级\n    } else if (t) {\n      getChildTasks(targetTaskId).forEach(c => { \/\/ 如果是一级任务，子任务也全部打钩\n        getTaskStatus(dateKey, c.id).done = true;\n      });\n    }\n  }\n\n  save();\n  recEditTarget = null;\n  document.getElementById('recordFocusEditModal').classList.remove('show');\n  renderRecordModal();\n  renderReview();\n  toast('已保存');\n});\n\ndocument.getElementById('recordFocusEditModal').addEventListener('click', e => {\n  if(e.target.id === 'recordFocusEditModal'){\n    recEditTarget = null;\n    e.currentTarget.classList.remove('show');\n  }\n});\n\n(function addRfDeleteBtn(){\n  const actions = document.querySelector('#recordFocusEditModal .modal-actions');\n  if(!actions) return;\n  if(actions.querySelector('#rfDelete')) return;\n  const btn = document.createElement('button');\n  btn.id = 'rfDelete';\n  btn.className = 'danger-btn';\n  btn.style.marginRight = 'auto';\n  btn.textContent = '删除这条记录';\n  actions.insertBefore(btn, actions.firstChild);\n  btn.addEventListener('click', () => {\n    if(!recEditTarget) return;\n    const { dateKey, type, sessionId } = recEditTarget;\n    askConfirm('确定删除这条专注记录？',\n      '删除后会同时从复盘统计中移除，不可恢复。',\n      () => {\n        if(removeSessionByType(dateKey, type, sessionId)){\n          if (type.startsWith('task:')) {\n            syncTaskDoneState(type.slice(5), dateKey);\n          }\n\n          save();\n          recEditTarget = null;\n          document.getElementById('recordFocusEditModal').classList.remove('show');\n          renderRecordModal();\n          renderReview();\n          toast('已删除');\n        } else {\n          toast('删除失败');\n        }\n      }, '确定删除');\n  });\n})();\n\n\/* ============================================================\n   累计统计\n============================================================ *\/\nfunction calcTotalCompletedTasks(){\n  let n = 0;\n  Object.keys(state.dayStatus).forEach(k => {\n    const dd = state.dayStatus[k];\n    if(!dd) return;\n    if(dd.statuses) Object.keys(dd.statuses).forEach(id => {\n      const task = state.tasks[id];\n      if(task && !task.deleted && dd.statuses[id].done) n++;\n    });\n  });\n  return n;\n}\nfunction calcTotalFocusSec(){\n  let sec = 0;\n  Object.keys(state.dayStatus).forEach(k => {\n    sec += getDayFocusSec(k);\n  });\n  return sec;\n}\nfunction getDayFocusSec(dateKey){\n  const dd = state.dayStatus[dateKey];\n  if(!dd) return 0;\n  let sec = 0;\n  if(dd.statuses){\n    Object.keys(dd.statuses).forEach(id => {\n      sec += statusSeconds(dd.statuses[id]);\n    });\n  }\n  return sec;\n}\nfunction isStudyDay(k){\n  const dd = state.dayStatus[k];\n  if(!dd) return false;\n  if(dd.statuses && Object.keys(dd.statuses).some(id => {\n    const task = state.tasks[id];\n    return task && !task.deleted && dd.statuses[id].done;\n  })) return true;\n  return false;\n}\nfunction calcTotalStudyDays(){\n  let n = 0;\n  Object.keys(state.dayStatus).forEach(k => { if(isStudyDay(k)) n++; });\n  return n;\n}\nfunction calcStudyStreak(){\n  const cursor = new Date(logicalNow());\n  if(!isStudyDay(dkey(cursor))) cursor.setDate(cursor.getDate() - 1);\n  let n = 0;\n  while(n < 3660){\n    if(isStudyDay(dkey(cursor))){ n++; cursor.setDate(cursor.getDate() - 1); }\n    else break;\n  }\n  return n;\n}\nfunction taskTotalSeconds(taskId){\n  let sec = 0;\n  Object.keys(state.dayStatus).forEach(k => {\n    const dd = state.dayStatus[k];\n    const st = dd && dd.statuses && dd.statuses[taskId];\n    if(st){\n      (st.sessions || []).forEach(s => sec += sessionSeconds(s));\n    }\n  });\n  return sec;\n}\n\n\/* ============================================================\n   饼图\n============================================================ *\/\nfunction buildPieBlock(dataArr){\n  \/\/ 新增：按时长从大到小排序图例\n  dataArr.sort((a, b) => b.value - a.value);\n  \n  const total = dataArr.reduce((a, b) => a + b.value, 0);\n  let angle = 0;\n  const stops = [];\n  if(total > 0){\n    dataArr.forEach(d => {\n      const pct = d.value \/ total * 100;\n      const start = angle;\n      angle += pct;\n      if(pct <= 0) return;\n      stops.push(d.color + ' ' + start.toFixed(3) + '% ' + angle.toFixed(3) + '%');\n    });\n  }\n  const bg = total > 0 ? 'conic-gradient(' + stops.join(',') + ')' : 'var(--aux-line)';\n\n  const legend = dataArr.map(d => {\n    const pct = total > 0 ? Math.round(d.value \/ total * 100) : 0;\n    return '<div class=\"legend-row\">' +\n      '<div class=\"legend-left\">' +\n        '<span class=\"legend-dot\" style=\"background:' + d.color + '\"><\/span>' +\n        '<span class=\"legend-name\">' + escapeHtml(d.name) + '<\/span>' +\n      '<\/div>' +\n      '<span class=\"legend-val\">' + fmtDurationShort(d.value) + '<\/span>' +\n      '<span class=\"legend-pct\">' + pct + '%<\/span>' +\n    '<\/div>';\n  }).join('');\n\n  return '<div class=\"pie-block\">' +\n    '<div class=\"pie-main\">' +\n      '<div class=\"pie\" style=\"background:' + bg + '\">' +\n        '<div class=\"pie-center\">' +\n          '<div class=\"n\">' + fmtDurationShort(total) + '<\/div>' +\n        '<\/div>' +\n      '<\/div>' +\n    '<\/div>' +\n    '<div class=\"pie-legend\">' + (legend || '<div class=\"empty\">暂无数据<\/div>') + '<\/div>' +\n  '<\/div>';\n}\n\n\/* ============================================================\n   做题记录\n============================================================ *\/\nlet openBooks = new Set();\nlet currentPaper = null;\n\nfunction pid(book, test, part){ return book + '-t' + test + '-' + part; }\n\nfunction renderPapers(){\n  document.getElementById('bookGrid').innerHTML = BOOKS.map(b => {\n    let done = 0, total = 0;\n    TESTS.forEach(t => SECTIONS.forEach(s => s.parts.forEach(p => {\n      total++;\n      if((state.papers[pid(b,t,p[0])] || []).length) done++;\n    })));\n    const pct = total ? Math.round(done\/total*100) : 0;\n    const open = openBooks.has(b);\n    return '<div class=\"book-card' + (open ? ' open' : '') + '\">' +\n      '<div class=\"book-head\" data-toggle=\"' + b + '\">' +\n        '<div>' +\n          '<div class=\"book-name\">剑雅 ' + b + '<\/div>' +\n          '<div class=\"book-sub\">' + done + ' \/ ' + total + ' 个部分已练<\/div>' +\n        '<\/div>' +\n        '<div class=\"book-arrow\">' + (open ? '−' : '+') + '<\/div>' +\n      '<\/div>' +\n      '<div class=\"book-progress\"><div style=\"width:' + pct + '%\"><\/div><\/div>' +\n      (open ? '<div class=\"book-body\">' + TESTS.map(t => renderTest(b, t)).join('') + '<\/div>' : '') +\n    '<\/div>';\n  }).join('');\n}\n\nfunction renderTest(b, t){\n  return '<div class=\"test-block\">' +\n    '<div class=\"test-title\">Test ' + t + '<\/div>' +\n    SECTIONS.map(s => {\n      const parts = s.parts.map(([pk, pl]) => {\n        const id = pid(b, t, pk);\n        const n = (state.papers[id] || []).length;\n        return '<button class=\"part-btn' + (n ? ' done' : '') + '\" data-paper=\"' + id + '\" ' +\n          'data-label=\"剑雅 ' + b + ' · Test ' + t + ' · ' + s.label + ' ' + pl + '\">' +\n          pl + (n ? '<span class=\"cnt\">' + n + '<\/span>' : '') +\n        '<\/button>';\n      }).join('');\n      return '<div class=\"sec-row\"><div class=\"sec-label\">' + s.label + '<\/div><div class=\"sec-parts\">' + parts + '<\/div><\/div>';\n    }).join('') +\n  '<\/div>';\n}\n\nfunction openPaper(id, label){\n  currentPaper = id;\n  document.getElementById('pmTitle').textContent = label;\n  document.getElementById('pmDate').value = dkey();\n  document.getElementById('pmScore').value = '';\n  document.getElementById('pmNote').value = '';\n  renderPmList();\n  document.getElementById('paperModal').classList.add('show');\n}\n\nfunction renderPmList(){\n  const list = (state.papers[currentPaper] || []).slice().sort((a,b) => (b.date||'').localeCompare(a.date||''));\n  const box = document.getElementById('pmList');\n  if(!list.length){\n    box.innerHTML = '<div class=\"pm-empty\">还没有记录，做一次就记一笔。<\/div>';\n    return;\n  }\n  box.innerHTML = list.map(r =>\n    '<div class=\"pm-item\">' +\n      '<div class=\"pm-date\">' + r.date + '<\/div>' +\n      '<div class=\"pm-note\">' +\n        (r.score ? '<span style=\"color:var(--blue);font-weight:700\">分数 ' + escapeHtml(r.score) + '<\/span>' : '') +\n        (r.score && r.note ? ' · ' : '') +\n        (r.note ? escapeHtml(r.note) : '') +\n      '<\/div>' +\n      '<button class=\"pm-del\" data-run=\"' + r.id + '\" title=\"删除这条\">×<\/button>' +\n    '<\/div>'\n  ).join('');\n}\n\nfunction savePaperRun(){\n  if(!currentPaper)

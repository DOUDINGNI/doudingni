nt.getElementById('addFigureBtn');\n  if (addBtn) {\n    addBtn.addEventListener('click', function(e) {\n      e.preventDefault();\n      e.stopPropagation();\n      const user = userList[currentViewUserIndex];\n      if(!user) return;\n      \n      $('popupBodyMetricDate').value = getTodayStr();\n      $('popupBodyMetricValue').value = '';\n      \n      const sel = $('popupBodyPartSelect');\n      if (sel) {\n        sel.value = 'waist';\n        const part = sel.value;\n        $('popupBodySideSelect').style.display = BODY_PARTS[part]?.hasSide ? 'block' : 'none';\n      }\n      \n      if (maskBodyMetricAdd) maskBodyMetricAdd.classList.add('show');\n    });\n  }\n});\nfunction getBodyShape(shoulder, chest, waist, hip){\n  \/\/ 肩围为可选项：未记录肩围时用「胸臀差」近似肩臀差，保证体型判定依然可用\n  if(!chest||!waist||!hip) return null;\n  const hasSh=!!shoulder;\n  \/\/ 四维测量法：根据肩围、胸围、腰围、臀围的差值计算\n  const shHip = hasSh ? (shoulder - hip) : (chest - hip);\n  const chWaist = chest - waist;\n  const hiWaist = hip - waist;\n  const chHip = chest - hip;\n\n  \/\/ 按照表格规则从下往上进行判断匹配\n  \/\/ 1. 长方形\n  if (Math.abs(shHip) <= 5 && Math.abs(chHip) <= 10 && Math.abs(hiWaist) <= 10 && Math.abs(chWaist) <= 15) {\n    return { label: '长方形' };\n  }\n  \/\/ 2. 苹果型\n  if (Math.abs(shHip) <= 5 && Math.abs(chHip) <= 10 && Math.abs(hiWaist) <= 15 && Math.abs(chWaist) <= 15) {\n     \/\/ 苹果形：腰围大，臀腰差极小甚至为负，胸腰差小\n     if (chWaist < 15 && hiWaist <= 15) return { label: '苹果形' };\n  }\n  \/\/ 3. 倒三角\n  if (shHip > 5 && shHip >= -5) {\n    return { label: '倒三角' };\n  }\n  \/\/ 4. 梨型\n  if (shHip >= -5 && shHip <= 5 && chWaist > 5) {\n    return { label: '梨形' };\n  }\n  \/\/ 5. 沙漏型\n  if (Math.abs(shHip) <= 5 && chWaist > 5 && hiWaist > 5) {\n    return { label: '沙漏型' };\n  }\n  \/\/ 6. H型\n  if (Math.abs(shHip) <= 5 && chWaist < 10 && hiWaist < 10) {\n    return { label: 'H型' };\n  }\n\n  \/\/ 兜底匹配（如果数据刚好在边界上）\n  if (shHip > 5 && chWaist <= 7.6) return { label: '倒三角' };\n  if (shHip < -5 && chWaist >= 7.6) return { label: '梨形' };\n  if (chWaist > 15 && hiWaist <= 10) return { label: '沙漏型' };\n  if (chWaist < 10 && hiWaist < 10) return { label: 'H型' };\n  \n  return { label: 'H型' }; \/\/ 默认\n}\nfunction getWaistHipRatioInfo(waist, hip, gender){\n  if(!waist||!hip) return null;\n  const r=waist\/hip;\n  let level, cls;\n  if(gender === 'female'){\n    if(r < 0.80){ level='标准'; cls='bf-normal'; }\n    else if(r <= 0.85){ level='偏高'; cls='bf-high'; }\n    else { level='过高'; cls='bf-vhigh'; }\n  } else {\n    if(r < 0.90){ level='标准'; cls='bf-normal'; }\n    else if(r <= 0.95){ level='偏高'; cls='bf-high'; }\n    else { level='过高'; cls='bf-vhigh'; }\n  }\n  return { ratio:r, level, cls };\n}\n\n\/* =========================================================\n   健康信息弹窗\n   ========================================================= *\/\nfunction openHealthInfo(type){\n  const user=userList[currentViewUserIndex]; if(!user) return;\n  const titleEl=$('healthInfoTitle'), bodyEl=$('healthInfoBody');\n  const get=k=>{ const r=getLatestMetric(user,k); return r?Number(r.value):null; };\n  const chest=get('chest'), waist=get('waist'), hip=get('hip');\n  const h=Number(user.height), cw=getCurrentWeight(user);\n  const bmi= h>0 ? cw\/Math.pow(h\/100,2) : null;\n  const bfInfo=getBodyFatInfo(user);\n  const bmr=calcBMR(user);\n  let title='', currentVal='', currentLbl='当前值', table='', desc='';\n\n  if(type==='shape'){\n    title='体型';\n    const shoulder=get('shoulder');\n    const shape=getBodyShape(shoulder,chest,waist,hip);\n    currentVal=shape?shape.label:'--';\n    currentLbl='当前体型';\n    const rows=[\n      ['H型','肩围-臀围≈0，胸围-腰围<10，臀围-腰围<10','H型'],\n      ['沙漏型','肩围-臀围≈0，胸围-腰围>15，臀围-腰围>15','沙漏型'],\n      ['梨型','肩围-臀围<5，胸围-腰围<10，臀围-腰围>15','梨形'],\n      ['倒三角','肩围-臀围>5，胸围-腰围<7.6，臀围-腰围<5','倒三角'],\n      ['苹果型','肩围-臀围≈0，胸围-腰围<15，臀围-腰围<-15','苹果形'],\n      ['长方型','肩围-臀围≈0，胸围-腰围<10，臀围-腰围<10','长方形']\n    ];\n    table=rows.map(([n,d,k])=>`<div class=\"hi-row ${shape?.label===k?'active':''}\"><span class=\"hi-level\">${n}<\/span><span>${d}<\/span><\/div>`).join('');\n    desc='根据“四维测量法”（肩围、胸围、腰围、臀围的差值比对）计算得出参考体型，实际以专业测量为准。';\n  } else if(type==='whr'){\n    title='腰臀比';\n    const whr=(waist&&hip)?waist\/hip:null;\n    const info=whr?getWaistHipRatioInfo(waist,hip,user.gender):null;\n    currentVal=whr?whr.toFixed(2):'--';\n    currentLbl=info?`当前腰臀比（${info.level}）`:'当前腰臀比';\n    if(user.gender === 'female'){\n      table=`\n        <div class=\"hi-row ${whr&&whr<0.8?'active':''}\"><span class=\"hi-level bf-normal\">标准<\/span><span class=\"val-only\">&lt; 0.80<\/span><\/div>\n        <div class=\"hi-row ${whr&&whr>=0.8&&whr<=0.85?'active':''}\"><span class=\"hi-level bf-high\">偏高<\/span><span class=\"val-only\">0.80 - 0.85<\/span><\/div>\n        <div class=\"hi-row ${whr&&whr>0.85?'active':''}\"><span class=\"hi-level bf-vhigh\">过高<\/span><span class=\"val-only\">&gt; 0.85<\/span><\/div>\n      `;\n    } else {\n      table=`\n        <div class=\"hi-row ${whr&&whr<0.9?'active':''}\"><span class=\"hi-level bf-normal\">标准<\/span><span class=\"val-only\">&lt; 0.90<\/span><\/div>\n        <div class=\"hi-row ${whr&&whr>=0.9&&whr<=0.95?'active':''}\"><span class=\"hi-level bf-high\">偏高<\/span><span class=\"val-only\">0.90 - 0.95<\/span><\/div>\n        <div class=\"hi-row ${whr&&whr>0.95?'active':''}\"><span class=\"hi-level bf-vhigh\">过高<\/span><span class=\"val-only\">&gt; 0.95<\/span><\/div>\n      `;\n    }\n    desc='腰臀比 = 腰围 ÷ 臀围，反映腹部脂肪堆积程度。数值越低越好。';\n  } else if(type==='bmi'){\n    title='BMI（身体质量指数）';\n    const lv=bmi?bmiLevel(bmi):null;\n    currentVal=bmi?bmi.toFixed(1):'--';\n    currentLbl=lv?`当前 BMI（${lv.level}）`:'当前 BMI';\n    table=`\n      <div class=\"hi-row ${bmi&&bmi<18.5?'active':''}\"><span class=\"hi-level bf-low\">偏低<\/span><span class=\"val-only\">&lt; 18.5<\/span><\/div>\n      <div class=\"hi-row ${bmi&&bmi>=18.5&&bmi<24?'active':''}\"><span class=\"hi-level bf-normal\">标准<\/span><span class=\"val-only\">18.5 - 23.9<\/span><\/div>\n      <div class=\"hi-row ${bmi&&bmi>=24&&bmi<28?'active':''}\"><span class=\"hi-level bf-high\">偏高<\/span><span class=\"val-only\">24.0 - 27.9<\/span><\/div>\n      <div class=\"hi-row ${bmi&&bmi>=28?'active':''}\"><span class=\"hi-level bf-vhigh\">过高<\/span><span class=\"val-only\">≥ 28.0<\/span><\/div>\n    `;\n    desc='BMI = 体重(kg) ÷ 身高(m)²。只反映体重与身高的关系，不区分肌肉与脂肪。';\n  } else if(type==='bodyfat'){\n    title='体脂率';\n    const lv=bfInfo?bodyFatLevel(bfInfo.value, user.gender):null;\n    currentVal=bfInfo?bfInfo.value.toFixed(1)+'%':'--';\n    currentLbl=lv?`当前体脂率（${lv.level}）`:'当前体脂率';\n    if(user.gender === 'female'){\n      table=`\n        <div class=\"hi-row ${bfInfo&&bfInfo.value<20?'active':''}\"><span class=\"hi-level bf-low\">偏低<\/span><span class=\"val-only\">&lt; 20%<\/span><\/div>\n        <div class=\"hi-row ${bfInfo&&bfInfo.value>=20&&bfInfo.value<=30?'active':''}\"><span class=\"hi-level bf-normal\">标准<\/span><span class=\"val-only\">20% - 30%<\/span><\/div>\n        <div class=\"hi-row ${bfInfo&&bfInfo.value>30&&bfInfo.value<=35?'active':''}\"><span class=\"hi-level bf-high\">偏高<\/span><span class=\"val-only\">30% - 35%<\/span><\/div>\n        <div class=\"hi-row ${bfInfo&&bfInfo.value>35?'active':''}\"><span class=\"hi-level bf-vhigh\">过高<\/span><span class=\"val-only\">&gt; 35%<\/span><\/div>\n      `;\n    } else {\n      table=`\n        <div class=\"hi-row ${bfInfo&&bfInfo.value<10?'active':''}\"><span class=\"hi-level bf-low\">偏低<\/span><span class=\"val-only\">&lt; 10%<\/span><\/div>\n        <div class=\"hi-row ${bfInfo&&bfInfo.value>=10&&bfInfo.value<=20?'active':''}\"><span class=\"hi-level bf-normal\">标准<\/span><span class=\"val-only\">10% - 20%<\/span><\/div>\n        <div class=\"hi-row ${bfInfo&&bfInfo.value>20&&bfInfo.value<=25?'active':''}\"><span class=\"hi-level bf-high\">偏高<\/span><span class=\"val-only\">20% - 25%<\/span><\/div>\n        <div class=\"hi-row ${bfInfo&&bfInfo.value>25?'active':''}\"><span class=\"hi-level bf-vhigh\">过高<\/span><span class=\"val-only\">&gt; 25%<\/span><\/div>\n      `;\n    }\n    if(bfInfo && bfInfo.auto){\n      desc='体脂率依据 Deurenberg 公式自动估算：体脂率 = 1.2×BMI + 0.23×年龄 - 10.8×性别 - 5.4（男=1，女=0）。如需精准数据，请使用体脂秤或专业测量。';\n    } else {\n      desc='体脂率来自手动记录。填写性别、出生年月日与身高后，系统可自动估算体脂率。';\n    }\n  } else if(type==='bmr'){\n    title='基础代谢（BMR）';\n    currentVal=bmr!==null?Math.round(bmr):'--';\n    currentLbl='当前估算（kcal\/天）';\n    let bmrRangeHtml = '';\n    if(bmr !== null) {\n      const low = Math.round(bmr * 0.9);\n      const high = Math.round(bmr * 1.1);\n      const high2 = Math.round(bmr * 1.2);\n      bmrRangeHtml = `\n        <div class=\"hi-row ${bmr < low?'active':''}\"><span class=\"hi-level bf-low\">偏低<\/span><span class=\"val-only\">&lt; ${low} kcal<\/span><\/div>\n        <div class=\"hi-row ${bmr >= low && bmr <= high?'active':''}\"><span class=\"hi-level bf-normal\">标准<\/span><span class=\"val-only\">${low} - ${high} kcal<\/span><\/div>\n        <div class=\"hi-row ${bmr > high && bmr <= high2?'active':''}\"><span class=\"hi-level bf-high\">偏高<\/span><span class=\"val-only\">${high} - ${high2} kcal<\/span><\/div>\n        <div class=\"hi-row ${bmr > high2?'active':''}\"><span class=\"hi-level bf-vhigh\">过高<\/span><span class=\"val-only\">&gt; ${high2} kcal<\/span><\/div>\n      `;\n    } else {\n      bmrRangeHtml = '<div class=\"hi-row\"><span class=\"hi-level\">提示<\/span><span>请先完善信息以计算基础代谢<\/span><\/div>';\n    }\n    table = bmrRangeHtml;\n    desc='基础代谢是指身体在静息状态下维持生命所需的最低能量，用 Mifflin-St Jeor 公式估算：男 = 10×体重 + 6.25×身高 - 5×年龄 + 5；女 = 同式 - 161。正常范围通常为计算值的 ±10%。';\n  } else if(type==='speed'){\n    title='减重速度';\n    const recs=getSortedRecords(user);\n    const lastRec=recs.length?recs[recs.length-1]:null;\n    const startD=parseDate(user.startDate)||new Date();\n    const endD=lastRec?parseDate(lastRec.date):startD;\n    const weeks=(!isNaN(startD.getTime())&&!isNaN(endD.getTime()))?(endD-startD)\/(7*86400000):0;\n    const lost=(Number(user.startWeight)||0)-getCurrentWeight(user);\n    const sp=(weeks>0.02)?lost\/weeks:null;\n    currentVal=sp!==null?sp.toFixed(2)+' 公斤\/周':'--';\n    currentLbl='当前减重速度';\n    table=`\n      <div class=\"hi-row ${sp!==null&&sp>1?'active':''}\"><span class=\"hi-level bf-normal\">快<\/span><span class=\"val-only\">&gt; 1.0 公斤\/周<\/span><\/div>\n      <div class=\"hi-row ${sp!==null&&sp>=0.5&&sp<=1?'active':''}\"><span class=\"hi-level bf-normal\">正常<\/span><span class=\"val-only\">0.5 - 1.0 公斤\/周<\/span><\/div>\n      <div class=\"hi-row ${sp!==null&&sp>=0&&sp<0.5?'active':''}\"><span class=\"hi-level bf-vhigh\">慢<\/span><span class=\"val-only\">&lt; 0.5 公斤\/周<\/span><\/div>\n    `;\n    desc='减重速度 = 累计减重 ÷ 减重周数。健康减重速度通常为每周 0.5 - 1 公斤，过快或过慢都建议结合饮食与运动调整。';\n  }\n  titleEl.textContent=title;\n  bodyEl.innerHTML=`\n    <div class=\"hi-current\">\n      <div class=\"hi-current-val\">${currentVal}<\/div>\n      <div class=\"hi-current-lbl\">${currentLbl}<\/div>\n    <\/div>\n    <div class=\"hi-table\">${table}<\/div>\n    <div class=\"hi-desc\">${desc}<\/div>\n  `;\n  maskHealthInfo.classList.add('show');\n}\n$('closeHealthInfo').onclick=()=>maskHealthInfo.classList.remove('show');\nmaskHealthInfo.onclick=e=>{ if(e.target===maskHealthInfo) maskHealthInfo.classList.remove('show'); };\n\n$('metricHistorySelect').onchange=function(){\n  currentMetricKey=this.value;\n  const u=userList[currentViewUserIndex]; if(!u) return;\n  renderMetricHistoryList(u);\n};\nfunction getSeriesForPart(user, part){\n  const bm=user.bodyMetrics||emptyBodyMetrics();\n  if(BODY_PARTS[part]?.hasSide){\n    const out=[];\n    const sides=[['_L','var(--primary)'],['_R','var(--up-color)'],['_N','var(--same-color)']];\n    sides.forEach(([sfx,color])=>{\n      const key=part+sfx;\n      const arr=bm[key]||[];\n      if(arr.length>0){\n        const label = sfx==='_L'?'左':sfx==='_R'?'右':'';\n        out.push({\n          name: BODY_PARTS[part].label+(label?`（${label}）`:''),\n          color,\n          points: [...arr].map(r=>({date:r.date, value:Number(r.value)})).sort((a,b)=> a.date<b.date?-1:1)\n        });\n      }\n    });\n    return out;\n  }\n  const arr=bm[part]||[];\n  return [{\n    name:BODY_PARTS[part].label,\n    color:'var(--primary)',\n    points: [...arr].map(r=>({date:r.date, value:Number(r.value)})).sort((a,b)=> a.date<b.date?-1:1)\n  }];\n}\nfunction renderMetricTrendChart(user){\n  \/\/ 页面改版后已无独立围度趋势图容器，保留空函数以兼容旧调用\n  const box = $('metricTrendChart');\n  if(!box) return;\n  const series=getSeriesForPart(user, currentMetricKey).filter(s=>s.points.length>0);\n  renderMultiLineChart(box, series, '厘米');\n}\nfunction collectMetricItems(user, part){\n  const bm=user.bodyMetrics||emptyBodyMetrics();\n  const items=[];\n  const keys=[];\n  if(BODY_PARTS[part]?.hasSide){ keys.push(part+'_L',part+'_R',part+'_N'); }\n  else keys.push(part);\n  keys.forEach(k=>{\n    (bm[k]||[]).forEach(r=>{ items.push({ key:k, id:r.id, date:r.date, value:Number(r.value) }); });\n  });\n  items.sort((a,b)=> a.date<b.date?1 : a.date>b.date?-1 : 0);\n  return items;\n}\nfunction buildMetricHistoryItem(it, items){\n  const div=document.createElement('div'); div.className='metric-history-item';\n  const label=getMetricLabel(it.key);\n  let diffTxt='';\n  const sameKeyItems=items.filter(x=>x.key===it.key);\n  const posInKey=sameKeyItems.findIndex(x=>x.id===it.id);\n  if(posInKey>=0 && posInKey<sameKeyItems.length-1){\n    const prev=sameKeyItems[posInKey+1];\n    const d=it.value-prev.value;\n    const ad=Math.round(d*10)\/10;\n    if(Math.abs(ad)<0.05) diffTxt=`<span class=\"mh-diff same\">0<\/span>`;\n    else if(ad>0) diffTxt=`<span class=\"mh-diff up\">+${fmt(ad)}<\/span>`;\n    else diffTxt=`<span class=\"mh-diff down\">${fmt(ad)}<\/span>`;\n  }\n  div.innerHTML=`<div class=\"mh-left\"><div class=\"mh-value\">${it.value} 厘米<\/div><div class=\"mh-date\">${it.date}<\/div><\/div><div>${diffTxt}<\/div>`;\n  div.onclick=()=>openMetricEditModal(it.key, it.id);\n  return div;\n}\nfunction renderMetricHistoryList(user){\n  const part=currentMetricKey;\n  const items=collectMetricItems(user, part);\n  const list=$('metricHistoryList'); list.innerHTML='';\n  const moreBtn=$('showAllMetricRecordsBtn');\n  if(items.length===0){\n    list.innerHTML='<div class=\"empty-tip\" style=\"padding:8px 0;font-size:12px;\">暂无记录<\/div>';\n    moreBtn.style.display='none';\n    return;\n  }\n  const show=items.slice(0,3);\n  show.forEach(it=>{ list.appendChild(buildMetricHistoryItem(it, items)); });\n  moreBtn.style.display = items.length>3 ? 'inline-block' : 'none';\n}\n$('showAllMetricRecordsBtn').onclick=()=>{\n  const user=userList[currentViewUserIndex]; if(!user) return;\n  const part=currentMetricKey;\n  const items=collectMetricItems(user, part);\n  $('metricHistoryFullTitle').textContent=`全部 ${BODY_PARTS[part]?.label||''} 记录`;\n  const box=$('metricHistoryFullList'); box.innerHTML='';\n  if(items.length===0){\n    box.innerHTML='<div class=\"empty-tip\" style=\"padding:10px 0;font-size:12px;\">暂无记录<\/div>';\n  } else {\n    items.forEach(it=>{ box.appendChild(buildMetricHistoryItem(it, items)); });\n  }\n  maskMetricHistoryFull.classList.add('show');\n};\n$('closeMetricHistoryFull').onclick=()=>maskMetricHistoryFull.classList.remove('show');\nmaskMetricHistoryFull.onclick=e=>{ if(e.target===maskMetricHistoryFull) maskMetricHistoryFull.classList.remove('show'); };\n\nfunction openMetricEditModal(key, id){\n  const user=userList[currentViewUserIndex]; if(!user) return;\n  const rec=(user.bodyMetrics[key]||[]).find(r=>r.id===id); if(!rec) return;\n  editingMetricKey=key; editingMetricId=id;\n  $('metricEditTitle').textContent=`修改 ${getMetricLabel(key)} 记录`;\n  $('inpMetricEditValue').value=rec.value;\n  $('inpMetricEditDate').value=rec.date;\n  maskMetricEdit.classList.add('show');\n}\n$('cancelMetricEdit').onclick=()=>maskMetricEdit.classList.remove('show');\nmaskMetricEdit.onclick=e=>{ if(e.target===maskMetricEdit) maskMetricEdit.classList.remove('show'); };\n$('saveMetricEdit').onclick=()=>{\n  const user=userList[currentViewUserIndex];\n  if(!user||!editingMetricKey||!editingMetricId) return;\n  const v=parseFloat($('inpMetricEditValue').value);\n  const d=$('inpMetricEditDate').value;\n  if(isNaN(v)||v<=0||v>300){ alert('请输入有效数值'); return; }\n  if(!d){ alert('请选择日期'); return; }\n  const rec=(user.bodyMetrics[editingMetricKey]||[]).find(r=>r.id===editingMetricId);\n  if(rec){ rec.value=v; rec.date=fixDate(d); saveUsers(); }\n  maskMetricEdit.classList.remove('show');\n  renderBodyMetricsSection(user, globalUnit, unitLabel(globalUnit));\n};\n$('deleteMetricRecord').onclick=()=>{\n  const user=userList[currentViewUserIndex];\n  if(!user||!editingMetricKey||!editingMetricId) return;\n  if(!confirm('确认删除这条围度记录吗？')) return;\n  user.bodyMetrics[editingMetricKey]=user.bodyMetrics[editingMetricKey].filter(r=>r.id!==editingMetricId);\n  saveUsers(); maskMetricEdit.classList.remove('show');\n  renderBodyMetricsSection(user, globalUnit, unitLabel(globalUnit));\n};\n\n\/* =========================================================\n   编辑用户列表\n   ========================================================= *\/\nfunction renderEditList(){\n  const el=$('editUserList'); el.innerHTML='';\n  if(userList.length===0){ el.innerHTML='<div class=\"empty-tip\">暂无用户<\/div>'; return; }\n  if(editMode==='sort') el.insertAdjacentHTML('beforeend','<div class=\"top-tip\">按住上下拖动调整顺序<\/div>');\n  userList.forEach((u,idx)=>{\n    const item=document.createElement('div');\n    const av=document.createElement('div'); av.className='avatar';\n    renderAvatarVisual(av,u.avatarEmoji,u.avatarBg,36,u.avatarImage);\n    const left=document.createElement('div'); left.className='edit-left';\n    const nm=document.createElement('span'); nm.className='edit-user-name'; nm.textContent=u.name;\n    left.appendChild(av); left.appendChild(nm);\n    if(editMode==='sort'){\n      item.className='sort-item'; item.draggable=true; item.dataset.index=idx;\n      const h=document.createElement('span'); h.className='sort-handle'; h.textContent='⋮⋮';\n      item.appendChild(left); item.appendChild(h); attachSortEvents(item);\n    } else {\n      item.className='edit-user-item'; item.appendChild(left);\n      if(editMode==='delete'){\n        const b=document.createElement('button'); b.className='del-inline-btn'; b.textContent='删除'; b.dataset.idx=idx;\n        b.onclick=(e)=>{\n          e.stopPropagation();\n          const i=Number(b.dataset.idx); const un=userList[i].name;\n          if(confirm(`确认删除用户[${un}]？删除后所有记录会全部清除！`)){\n            userList.splice(i,1); saveUsers();\n            \n            \/\/ 处理当前视图状态\n            if (userList.length === 0) {\n              currentViewUserIndex = null;\n              try{ localStorage.removeItem('weightRecordLastUser'); }catch(e){}\n              \n              \/\/ 关闭编辑弹窗\n              maskEdit.classList.remove('show');\n              \n              \/\/ 重置为空状态并刷新\n              renderSidebarUsers();\n              renderCombinedTab(); \/\/ 直接调用，确保无数据分支被执行\n              \n            } else {\n              \/\/ 如果删除的是当前正在查看的用户，或者比当前小的索引\n              if(currentViewUserIndex === i){\n                currentViewUserIndex = 0; \/\/ 默认切换到第一个\n                openUserDetail(0);\n              } else if(currentViewUserIndex !== null && currentViewUserIndex > i){\n                currentViewUserIndex--;\n                openUserDetail(currentViewUserIndex);\n              }\n              renderSidebarUsers(); \n              renderEditList();\n            }\n          }\n        };\n        item.appendChild(b);\n      }\n      item.onclick=()=>{ if(editMode==='view') openModifyModal(idx); };\n    }\n    el.appendChild(item);\n  });\n}\nlet dragIndex=null;\nfunction attachSortEvents(item){\n  item.addEventListener('dragstart',e=>{ dragIndex=Number(item.dataset.index); item.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });\n  item.addEventListener('dragover',e=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; });\n  item.addEventListener('drop',e=>{\n    e.preventDefault();\n    const di=Number(item.dataset.index);\n    if(dragIndex!==null && dragIndex!==di){\n      const curUser = (currentViewUserIndex!==null) ? userList[currentViewUserIndex] : null;\n      const [m]=userList.splice(dragIndex,1); userList.splice(di,0,m);\n      if(curUser){\n        const ni = userList.indexOf(curUser);\n        if(ni>=0){\n          currentViewUserIndex = ni;\n          try{ localStorage.setItem('weightRecordLastUser', String(ni)); }catch(e){}\n        }\n      }\n      saveUsers(); renderSidebarUsers(); renderEditList();\n    }\n  });\n  item.addEventListener('dragend',()=>{ item.classList.remove('dragging'); dragIndex=null; });\n}\n\n\/* =========================================================\n   创建\/修改用户\n   ========================================================= *\/\nfunction clearCreateError(){ ['errName','errHeight','errStartW','errStartD','errTargetW','errTargetD'].forEach(i=>$(i).textContent=''); }\nfunction clearModifyError(){ \n  if($('errModName')) $('errModName').textContent='';\n}\nfunction updateCreateNeedLose(){\n  const sw=parseFloat($('inpStartWeight').value), tw=parseFloat($('inpTargetWeight').value);\n  const el=$('createNeedLose');\n  if(isNaN(sw)||isNaN(tw)){ el.textContent='--'; return; }\n  el.textContent=(Math.round((sw-tw)*10)\/10).toFixed(1)+' '+unitLabel(globalUnit);\n}\nfunction updateModNeedLose(){\n  const sw=parseFloat($('inpModifyStartWeight').value), tw=parseFloat($('inpModifyTargetWeight').value);\n  const el=$('modNeedLose');\n  if(isNaN(sw)||isNaN(tw)){ el.textContent='--'; return; }\n  el.textContent=(Math.round((sw-tw)*10)\/10).toFixed(1)+' '+unitLabel(globalUnit);\n}\n$('inpStartWeight').addEventListener('input',updateCreateNeedLose);\n$('inpTargetWeight').addEventListener('input',updateCreateNeedLose);\n\n\nfunction openModifyModal(idx){\n  currentModifyIndex=idx; const user=userList[idx];\n    $('maskModify').querySelector('h3').textContent='个人信息';\n  if(!user) return;\n  \n  $('inpModifyName').value=user.name;\n  selectedAvatar={ emoji:user.avatarEmoji||null, bg:user.avatarBg||'#8899aa', image:user.avatarImage||null };\n  tempAvatar={...selectedAvatar}; renderFormAvatarPreview();\n  \n  \/\/ 把以前的清空报错代码去掉，直接显示\n  if($('errModName')) $('errModName').textContent='';\n  maskModify.classList.add('show');\n\n  \/\/ 刷新迁移到弹窗内的历史区域\n  renderRecordList(user, globalUnit, unitLabel(globalUnit));\n  const mhSel = $('metricHistorySelect');\n  if(mhSel){ mhSel.value = currentMetricKey; }\n  if($('metricHistoryList')) renderMetricHistoryList(user);\n}\n\n$('openCreate').onclick=()=>{\n  const unit=globalUnit;\n  $('createUnitLabel').textContent=unitLabel(unit);\n  $('createUnitLabel2').textContent=unitLabel(unit);\n  maskCreate.classList.add('show');\n  $('inpName').value='';\n  $('inpHeight').value=''; $('inpStartWeight').value='';\n  $('inpStartDate').value=getTodayStr();\n  $('inpTargetWeight').value=''; $('inpTargetDate').value=getTodayStr();\n  $('createNeedLose').textContent='--';\n  selectedAvatar={ emoji:null, bg:'#8899aa', image:null };\n  tempAvatar={...selectedAvatar}; renderFormAvatarPreview();\n  clearCreateError();\n};\n$('cancelCreate').onclick=()=>maskCreate.classList.remove('show');\nmaskCreate.onclick=e=>{ if(e.target===maskCreate) maskCreate.classList.remove('show'); };\nmaskEdit.onclick=e=>{ if(e.target===maskEdit) maskEdit.classList.remove('show'); };\nmaskModify.onclick=e=>{ if(e.target===maskModify) maskModify.classList.remove('show'); };\nmaskAvatarSelect.onclick=e=>{ if(e.target===maskAvatarSelect) maskAvatarSelect.classList.remove('show'); };\n$('openEdit').onclick=()=>{ editMode='view'; renderEditList(); maskEdit.classList.add('show'); };\n$('closeEdit').onclick=()=>maskEdit.classList.remove('show');\n$('btnSort').onclick=()=>{ editMode=editMode==='sort'?'view':'sort'; renderEditList(); };\n$('btnDelete').onclick=()=>{ editMode=editMode==='delete'?'view':'delete'; renderEditList(); };\n$('cancelModify').onclick=()=>maskModify.classList.remove('show');\n\n$('saveModify').onclick=()=>{\n  const idx=currentModifyIndex; if(idx===null) return;\n  const u=userList[idx];\n  const nn=$('inpModifyName').value.trim();\n  clearModifyError();\n  let valid=true;\n  \n  if(!nn){ $('errModName').textContent='输入内容！'; valid=false; }\n  else if(isNameTaken(nn, idx)){ $('errModName').textContent='该用户名已被使用'; valid=false; }\n  \n  if(!valid) return;\n\n  u.name=nn;\n  u.avatarEmoji=selectedAvatar.emoji; \n  u.avatarBg=selectedAvatar.bg; \n  u.avatarImage=selectedAvatar.image;\n\n  saveUsers(); renderSidebarUsers(); renderEditList();\n  maskModify.classList.remove('show');\n  if(currentViewUserIndex!==null){\n    if(getActiveTab()==='combined') renderCombinedTab();\n    else renderWeightTab();\n  }\n};\n$('submitCreate').onclick=()=>{\n  clearCreateError();\n  const name=$('inpName').value.trim();\n  const hs=$('inpHeight').value.trim();\n  const sws=$('inpStartWeight').value.trim();\n  const sd=$('inpStartDate').value;\n  const tws=$('inpTargetWeight').value.trim();\n  const td=$('inpTargetDate').value;\n  let valid=true;\n  if(!name){ $('errName').textContent='输入内容！'; valid=false; }\n  else if(isNameTaken(name, -1)){ $('errName').textContent='该用户名已被使用'; valid=false; }\n  const hv=parseFloat(hs); if(!hs||isNaN(hv)||hv<=0){ $('errHeight').textContent='输入有效身高！'; valid=false; }\n  const swv=parseFloat(sws); if(!sws||isNaN(swv)||swv<=0){ $('errStartW').textContent='输入有效体重！'; valid=false; }\n  if(!sd){ $('errStartD').textContent='输入内容！'; valid=false; }\n  const twv=parseFloat(tws); if(!tws||isNaN(twv)||twv<=0){ $('errTargetW').textContent='输入有效体重！'; valid=false; }\n  if(!td){ $('errTargetD').textContent='输入内容！'; valid=false; }\n  if(!valid) return;\n\n  if(sd && td && td <= sd){\n    $('errTargetD').textContent='目标日期需晚于初始日期';\n    return;\n  }\n  if(swv && twv && twv > swv){\n    const unit=globalUnit;\n    if(!confirm(`目标体重（${twv}${unitLabel(unit)}）高于初始体重（${swv}${unitLabel(unit)}），确认要增重吗？`)) return;\n  }\n\n  const unit=globalUnit;\n  const nu={\n    id:genId(), name,\n    avatarEmoji:selectedAvatar.emoji, avatarBg:selectedAvatar.bg, avatarImage:selectedAvatar.image,\n    height:hv,\n    startWeight:toKg(swv,unit), startDate:fixDate(sd),\n    targetWeight:toKg(twv,unit), targetDate:fixDate(td),\n    records:[], bodyFatRecords:[], dietRecords:[], exerciseRecords:[],\n    bodyMetrics:emptyBodyMetrics()\n  };\nuserList.push(nu); saveUsers(); renderSidebarUsers();\nmaskCreate.classList.remove('show');\nopenUserDetail(userList.length-1);   \/\/ 新增后自动选中\nmaskUserSelect.classList.remove('show');\n};\n\n\/* =========================================================\n   图表 X 轴标签辅助\n   ========================================================= *\/\nfunction pickXLabels(n, maxLabels=7){\n  if(n<=0) return [];\n  if(n<=maxLabels) return Array.from({length:n},(_,i)=>i);\n  const out=[0];\n  const innerCount=maxLabels-2;\n  for(let k=1;k<=innerCount;k++){\n    out.push(Math.round(k*(n-1)\/(innerCount+1)));\n  }\n  out.push(n-1);\n  return [...new Set(out)];\n}\n\n\/* =========================================================\n   趋势 Tab\n   ========================================================= *\/\n\/\/ 保留原函数本体，避免任何外部引用报错；实际入口已改为 renderCombinedTab()\nfunction renderCalendarSingle(user, unit, ul){\n  const year=calYear, month=calMonth;\n  $('calTitle').textContent=`${year}年${month+1}月`;\n  \n  \/\/ 判断是否显示“回到本月”按钮\n  const now = new Date();\n  $('backToTodayBtn').style.display = 'inline-block';\n  $('backToTodayBtn').style.visibility = (year === now.getFullYear() && month === now.getMonth()) ? 'hidden' : 'visible';\n\n  const recs=getSortedRecords(user);\n  const diffMap=getRecordDiffMap(user);\n  const todayStr=getTodayStr();\n  const recByDate={};\n  recs.forEach(r=>{ if(!recByDate[r.date]) recByDate[r.date]=[]; recByDate[r.date].push(r); });\n  const firstDay=new Date(year,month,1);\n  const daysInMonth=new Date(year,month+1,0).getDate();\n  let startWeekday=firstDay.getDay();\n  startWeekday = startWeekday===0?6:startWeekday-1;\n  const daysEl=$('calDaysSingle'); daysEl.innerHTML='';\n  const buildHtml=(dayNum,dateStr)=>{\n    const dayRecs=recByDate[dateStr];\n    let inner=`<div class=\"dnum\">${dayNum}<\/div>`;\n    if(dayRecs && dayRecs.length){\n      const last=dayRecs[dayRecs.length-1];\n      const w=Number(last.weight); const info=diffMap[last.id];\n      let color='var(--same-color)';\n      if(info){ if(info.dir==='up') color='var(--up-color)'; else if(info.dir==='down') color='var(--down-color)'; }\n      inner+=`<div class=\"dweight\" style=\"color:${color}\">${fmt(toDisplay(w,unit))}<\/div>`;\n    }\n    return inner;\n  };\n  const prevMonthDays=new Date(year,month,0).getDate();\n  for(let i=startWeekday-1;i>=0;i--){\n    const dn=prevMonthDays-i;\n    const d=new Date(year,month-1,dn);\n    const el=document.createElement('div'); el.className='cal-day other-month';\n    el.innerHTML=buildHtml(dn, dateToStr(d)); daysEl.appendChild(el);\n  }\n    for(let d=1;d<=daysInMonth;d++){\n    const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;\n    const el=document.createElement('div'); el.className='cal-day';\n    if(ds===todayStr) el.classList.add('today');\n    if(recByDate[ds] && recByDate[ds].length) el.classList.add('has-rec');\n    \n    \/\/ 加上特殊类名控制字体颜色，并加上鼠标悬浮提示文字 (data-tip)\n    if (ds === user.startDate) {\n      el.classList.add('tag-start');\n      el.setAttribute('data-tip', '初始日期');\n    } else if (ds === user.targetDate) {\n      el.classList.add('tag-target');\n      el.setAttribute('data-tip', '目标日期');\n    } else if (ds === todayStr) {\n      el.classList.add('tag-today');\n      el.setAttribute('data-tip', '今天');\n    }\n    \n    el.innerHTML=buildHtml(d, ds);\n    el.onclick=()=>{\n      const list=recByDate[ds];\n      if(list && list.length) openRecordModal(list[list.length-1].id);\n      else openRecordModal(null, ds);\n    };\n    daysEl.appendChild(el);\n  }\n  const totalCells=startWeekday+daysInMonth;\n  const nextDays=(7-(totalCells%7))%7;\n  for(let d=1;d<=nextDays;d++){\n    const dObj=new Date(year,month+1,d);\n    const el=document.createElement('div'); el.className='cal-day other-month';\n    el.innerHTML=buildHtml(d, dateToStr(dObj)); daysEl.appendChild(el);\n  }\n}\n\n\/\/ 箭头切换\n$('calPrevBtn').onclick=()=>{ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCombinedTab(); };\n$('calNextBtn').onclick=()=>{ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCombinedTab(); };\n\n\/\/ 点击“回到本月”\n$('backToTodayBtn').onclick=()=>{ \n  const n=new Date(); \n  calYear=n.getFullYear(); \n  calMonth=n.getMonth(); \n  renderCombinedTab(); \n};\n\n\/\/ 点击日期标题弹出“跳转时间”弹窗\n$('calTitle').onclick = () => { \n  openJumpModal('calendar', dateToStr(new Date(calYear, calMonth, 1))); \n};\n\/* =========================================================\n   跳转时间逻辑重构（下拉菜单版）\n   ========================================================= *\/\nlet jumpCurrentTarget = 'calendar'; \n\n\/\/ 统一打开弹窗的方法\nfunction openJumpModal(target, defaultDateStr) {\n  jumpCurrentTarget = target;\n  let baseDate = defaultDateStr ? parseDate(defaultDateStr) : new Date();\n  if(isNaN(baseDate.getTime())) baseDate = new Date();\n  \n  \/\/ 填充年份下拉框\n  const yearSelect = $('jumpYearSelect');\n  yearSelect.innerHTML = '';\n  const currentYear = new Date().getFullYear();\n  const startY = currentYear; \n  \/\/ 【关键修复】第一次只加载 20 年，防止瞬间渲染数百个 DOM 导致页面崩溃\n  const endY = currentYear - 20; \n  \n  for (let y = startY; y >= endY; y--) {\n    const opt = document.createElement('option');\n    opt.value = y;\n    opt.textContent = `${y}年`;\n    yearSelect.appendChild(opt);\n  }\n  yearSelect.value = baseDate.getFullYear(); \n\n  \/\/ 填充第二栏（月\/周）\n  updateJumpTarget2Options(baseDate);\n  maskJumpDate.classList.add('show');\n}\n\n\/\/ 根据模式刷新第二栏的下拉框\nfunction updateJumpTarget2Options(baseDate) {\n  const row2 = $('jumpTarget2Row');\n  const label2 = $('jumpTarget2Label');\n  const select2 = $('jumpTarget2Select');\n  \n  \/\/ 如果是选“年”，隐藏第二栏\n  if (jumpCurrentTarget === 'year') {\n    row2.style.display = 'none';\n    return;\n  }\n  row2.style.display = 'block';\n  \n  select2.innerHTML = '';\n  const currentY = Number($('jumpYearSelect').value) || baseDate.getFullYear();\n  const today = new Date();\n\n  if (jumpCurrentTarget === 'month' || jumpCurrentTarget === 'calendar') {\n    label2.textContent = '月份';\n    \n    \/\/ 获取当前月（如果是今年的话）\n    const currentMonth = (currentY === today.getFullYear()) ? today.getMonth() + 1 : 12;\n    \n    \/\/ 从当前月往下倒序排列（比如今年就是 10, 9, 8... 1）\n    for (let m = currentMonth; m >= 1; m--) {\n      const opt = document.createElement('option');\n      opt.value = m;\n      opt.textContent = `${m}月`;\n      select2.appendChild(opt);\n    }\n    \n    \/\/ 默认精确选中对应的月\n    if (currentY === baseDate.getFullYear()) {\n      select2.value = baseDate.getMonth() + 1;\n    } else {\n      select2.value = 12; \/\/ 如果不是今年，默认选12月\n    }\n  } else if (jumpCurrentTarget === 'week') {\n    label2.textContent = '选择周';\n    \/\/ 获取该年的所有周\n    let weeks = getWeeksInYear(currentY);\n    \n    \/\/ 如果是今年，我们只展示到今天（当前周）及以前的周\n    if (currentY === today.getFullYear()) {\n      const currentWeekStartStr = dateToStr(getWeekRange(today).start);\n      const currentWeekIndex = weeks.findIndex(w => w.startStr === currentWeekStartStr);\n      if (currentWeekIndex !== -1) {\n        \/\/ 截取从年初到当前周\n        weeks = weeks.slice(0, currentWeekIndex + 1);\n      }\n    }\n    \n    \/\/ 倒序排列，让当前周（或年末的周）排在最上面\n    weeks.reverse();\n    \n    weeks.forEach((w) => {\n      const opt = document.createElement('option');\n      opt.value = w.startStr;\n      \/\/ 计算原本的周数\n      const weekNum = getWeeksInYear(currentY).findIndex(item => item.startStr === w.startStr) + 1;\n      opt.textContent = `第${weekNum}周 (${w.display})`;\n      select2.appendChild(opt);\n    });\n    \n    \/\/ 默认精确选中对应的周\n    if (currentY === baseDate.getFullYear()) {\n      select2.value = dateToStr(getWeekRange(baseDate).start);\n    } else {\n      \/\/ 如果不是今年，默认选最后一周\n      select2.value = weeks[0].startStr;\n    }\n  }\n}\n\/\/ 计算某一年有多少个周（以周一为起点）\nfunction getWeeksInYear(year) {\n  const weeks = [];\n  \/\/ 找到当年的第一个周一\n  let d = new Date(year, 0, 1);\n  const day = d.getDay();\n  const diff = day === 0 ? 1 : (8 - day); \/\/ 如果1月1日是周日，那就下周一再算\n  if (day !== 1) {\n    d.setDate(d.getDate() + diff);\n  }\n  \n  \/\/ 开始循环直到下一年\n  while (d.getFullYear() === year) {\n    const start = new Date(d);\n    const end = new Date(d);\n    end.setDate(end.getDate() + 6);\n    \n    \/\/ 跨年处理（如果是12月底，结束可能在明年）\n    weeks.push({\n      start: start,\n      end: end,\n      startStr: dateToStr(start),\n      display: `${start.getMonth()+1}.${start.getDate()}-${end.getMonth()+1}.${end.getDate()}`\n    });\n    d.setDate(d.getDate() + 7);\n  }\n  \n  \/\/ 补充：如果年初的几天不属于第一周，可以单独补一个“第1周”\n  const jan1 = new Date(year, 0, 1);\n  if (jan1.getDay() !== 1 && weeks.length > 0 && weeks[0].start > jan1) {\n    const end = new Date(jan1);\n    end.setDate(end.getDate() + (7 - jan1.getDay()));\n    weeks.unshift({\n      start: jan1,\n      end: end,\n      startStr: dateToStr(jan1),\n      display: `${jan1.getMonth()+1}.${jan1.getDate()}-${end.getMonth()+1}.${end.getDate()}`\n    });\n  }\n  return weeks;\n}\n\n\/\/ 监听下拉框变化\n$('jumpYearSelect').onchange = () => {\n  const baseDate = new Date(Number($('jumpYearSelect').value), 0, 1); \/\/ 切换到该年的1月1日作为基准\n  updateJumpTarget2Options(baseDate);\n};\n\n\/\/ 取消与关闭\nconst closeJumpModal = () => maskJumpDate.classList.remove('show');\n$('cancelJumpDate').onclick = closeJumpModal;\nmaskJumpDate.onclick = (e) => { if(e.target === maskJumpDate) closeJumpModal(); };\n\n\/\/ 点击确定\n$('confirmJumpDate').onclick = () => {\n  maskJumpDate.classList.remove('show');\n  \n  const year = Number($('jumpYearSelect').value);\n  const targetDate = new Date(year, 0, 1); \/\/ 默认 1 月 1 日\n  \n  if (jumpCurrentTarget === 'year') {\n    \/\/ 选年\n    const today = new Date();\n    yearOffset = year - today.getFullYear();\n  } else if (jumpCurrentTarget === 'month' || jumpCurrentTarget === 'calendar') {\n    \/\/ 选月\n    const month = Number($('jumpTarget2Select').value) - 1;\n    targetDate.setMonth(month);\n    if (jumpCurrentTarget === 'calendar') {\n      calYear = year; \n      calMonth = month;\n    } else {\n      const today = new Date();\n      monthOffset = (year - today.getFullYear()) * 12 + (month - today.getMonth());\n    }\n  } else if (jumpCurrentTarget === 'week') {\n    \/\/ 选周\n    const startDateStr = $('jumpTarget2Select').value;\n    targetDate = parseDate(startDateStr);\n    const today = new Date();\n    const wrToday = getWeekRange(today);\n    const wrTarget = getWeekRange(targetDate);\n    const diffTime = wrTarget.start - wrToday.start;\n    weekOffset = Math.round(diffTime \/ (7 * 86400000));\n  }\n  \n  renderCombinedTab();\n};\n\n\/\/ 绑定各个触发按钮（日历的已迁移到上方）\n$('weekRange').onclick = () => {\n  const { start } = getWeekRangeOffset(weekOffset);\n  openJumpModal('week', dateToStr(start));\n};\n\n$('monthRange').onclick = () => {\n  const { start } = getMonthRangeOffset(monthOffset);\n  openJumpModal('month', dateToStr(start));\n};\n\n$('yearRange').onclick = () => {\n  const { start } = getYearRangeOffset(yearOffset);\n  openJumpModal('year', dateToStr(start));\n};\n\n\/* --------- 折线图 --------- *\/\nfunction renderLineChart(container, allPoints, opts={}){\n  container.innerHTML='';\n  const oldTip=container.querySelector('.chart-tooltip');\n  if(oldTip) oldTip.remove();\n  if(!allPoints || allPoints.length===0){\n    container.innerHTML='<div class=\"empty-tip\" style=\"padding:20px 0; font-size:12px;\">暂无体重记录<\/div>';\n    return;\n  }\n  let W=container.clientWidth;\n  if(!W && container.parentElement) W=container.parentElement.clientWidth;\n  if(!W) W=Math.max(280, Math.min(window.innerWidth-40, 600));\n  if(W<160) W=Math.max(280, window.innerWidth-40);\n\n  const H=200;\n  const padL=42, padR=34, padT=22, padB=26;\n  const plotW=W-padL-padR, plotH=H-padT-padB;\n\n  const weights=allPoints.map(p=>p.weight);\n  let minW=Math.min(...weights), maxW=Math.max(...weights);\n  if(opts.targetValue!=null && isFinite(opts.targetValue)){\n    minW=Math.min(minW, opts.targetValue); maxW=Math.max(maxW, opts.targetValue);\n  }\n  if(opts.avgValue!=null && isFinite(opts.avgValue)){\n    minW=Math.min(minW, opts.avgValue); maxW=Math.max(maxW, opts.avgValue);\n  }\n  if(minW===maxW){ minW-=1; maxW+=1; }\n  const padV=(maxW-minW)*0.18;\n  minW-=padV; maxW+=padV;\n\n  const xScale=i=> padL + (allPoints.length===1? plotW\/2 : (i\/(allPoints.length-1))*plotW);\n  const yScale=w=> padT + plotH - ((w-minW)\/(maxW-minW))*plotH;\n\n  const svgNS='http:\/\/www.w3.org\/2000\/svg';\n  const svg=document.createElementNS(svgNS,'svg');\n  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);\n  svg.setAttribute('class','chart-svg');\n  svg.style.height=H+'px';\n\n  let maxIdx=0, minIdx=0;\n  allPoints.forEach((p,i)=>{\n    if(p.weight>allPoints[maxIdx].weight) maxIdx=i;\n    if(p.weight<allPoints[minIdx].weight) minIdx=i;\n  });\n  const isMulti=allPoints.length>1;\n  const sameTopBot=isMulti && maxIdx===minIdx;\n\n  const specialYs=[];\n  if(opts.targetValue!=null && isFinite(opts.targetValue)) specialYs.push(yScale(opts.targetValue));\n  if(opts.avgValue!=null && isFinite(opts.avgValue)) specialYs.push(yScale(opts.avgValue));\n  if(isMulti && !sameTopBot){\n    specialYs.push(yScale(allPoints[maxIdx].weight));\n    specialYs.push(yScale(allPoints[minIdx].weight));\n  }\n\n  const yTicks=4;\n  const isNearSpecial=y=> specialYs.some(sy=> Math.abs(sy-y)<9);\n  for(let i=0;i<=yTicks;i++){\n    const val=minW+(maxW-minW)*i\/yTicks;\n    const y=yScale(val);\n    if(isNearSpecial(y)) continue;\n    const line=document.createElementNS(svgNS,'line');\n    line.setAttribute('x1',padL); line.setAttribute('x2',W-padR);\n    line.setAttribute('y1',y); line.setAttribute('y2',y);\n    line.setAttribute('stroke','var(--border)'); line.setAttribute('stroke-width','1');\n    line.setAttribute('stroke-dasharray','3,3');\n    svg.appendChild(line);\n    const txt=document.createElementNS(svgNS,'text');\n    txt.setAttribute('x',padL-5); txt.setAttribute('y',y+3);\n    txt.setAttribute('text-anchor','end'); txt.setAttribute('font-size','10');\n    txt.setAttribute('fill','var(--gray-text)');\n    txt.textContent=toDisplay(val,globalUnit).toFixed(1);\n    svg.appendChild(txt);\n  }\n\n  const labelIdxs=pickXLabels(allPoints.length, 7);\n  labelIdxs.forEach(i=>{\n    const x=xScale(i);\n    const txt=document.createElementNS(svgNS,'text');\n    txt.setAttribute('x',x); txt.setAttribute('y',H-8);\n    txt.setAttribute('text-anchor','middle'); txt.setAttribute('font-size','10');\n    txt.setAttribute('fill','var(--gray-text)');\n    txt.textContent=allPoints[i].date.slice(5);\n    svg.appendChild(txt);\n  });\n\n  const specialRows=[];\n  if(opts.targetValue!=null && isFinite(opts.targetValue)){\n    specialRows.push({ value:opts.targetValue, color:'var(--primary)', text:'目标', dash:'6,4', sw:1.5, opacity:0.85 });\n  }\n  if(opts.avgValue!=null && isFinite(opts.avgValue)){\n    specialRows.push({ value:opts.avgValue, color:'var(--gray-text)', text:'均值', dash:'4,3', sw:1.2, opacity:0.8 });\n  }\n  if(isMulti && !sameTopBot){\n    specialRows.push({ value:allPoints[maxIdx].weight, color:'var(--up-color)', text:'最高', dash:'2,4', sw:1, opacity:0.55 });\n    specialRows.push({ value:allPoints[minIdx].weight, color:'var(--down-color)', text:'最低', dash:'2,4', sw:1, opacity:0.55 });\n  }\n  specialRows.forEach(l=>{ l.y=yScale(l.value); });\n  specialRows.sort((a,b)=> a.y - b.y);\n  const MIN_GAP=11;\n  for(let i=1;i<specialRows.length;i++){\n    if(specialRows[i].y - specialRows[i-1].y < MIN_GAP){\n      specialRows[i].y = specialRows[i-1].y + MIN_GAP;\n    }\n  }\n  specialRows.forEach(l=>{\n    const tl=document.createElementNS(svgNS,'line');\n    tl.setAttribute('x1',padL); tl.setAttribute('x2',W-padR);\n    tl.setAttribute('y1',l.y); tl.setAttribute('y2',l.y);\n    tl.setAttribute('stroke',l.color); tl.setAttribute('stroke-width',l.sw);\n    tl.setAttribute('stroke-dasharray',l.dash); tl.setAttribute('opacity',l.opacity);\n    svg.appendChild(tl);\n\n    const tv=document.createElementNS(svgNS,'text');\n    tv.setAttribute('x',padL-5); tv.setAttribute('y',l.y+3);\n    tv.setAttribute('text-anchor','end'); tv.setAttribute('font-size','10');\n    tv.setAttribute('font-weight','700'); tv.setAttribute('fill',l.color);\n    tv.textContent=toDisplay(l.value,globalUnit).toFixed(1);\n    svg.appendChild(tv);\n\n    const t2=document.createElementNS(svgNS,'text');\n    t2.setAttribute('x',W-padR+4); t2.setAttribute('y',l.y+3);\n    t2.setAttribute('text-anchor','start'); t2.setAttribute('font-size','10');\n    t2.setAttribute('font-weight','600'); t2.setAttribute('fill',l.color);\n    t2.textContent=l.text;\n    svg.appendChild(t2);\n  });\n\n  for(let i=1;i<allPoints.length;i++){\n    const p0=allPoints[i-1], p1=allPoints[i];\n    const d=p1.weight-p0.weight;\n    let color;\n    if(d>0.05) color='var(--up-color)';\n    else if(d<-0.05) color='var(--down-color)';\n    else color='var(--same-color)';\n    const line=document.createElementNS(svgNS,'line');\n    line.setAttribute('x1',xScale(i-1)); line.setAttribute('y1',yScale(p0.weight));\n    line.setAttribute('x2',xScale(i)); line.setAttribute('y2',yScale(p1.weight));\n    line.setAttribute('stroke',color); line.setAttribute('stroke-width','2');\n    line.setAttribute('stroke-linecap','round');\n    svg.appendChild(line);\n  }\n\n  allPoints.forEach((p,i)=>{\n    let color='var(--same-color)';\n    if(i>0){\n      const d=p.weight-allPoints[i-1].weight;\n      if(d>0.05) color='var(--up-color)';\n      else if(d<-0.05) color='var(--down-color)';\n      else color='var(--same-color)';\n    } else color='var(--gray-text)';\n    const isMax=isMulti && i===maxIdx;\n    const isMin=isMulti && i===minIdx;\n    const c=document.createElementNS(svgNS,'circle');\n    c.setAttribute('cx',xScale(i)); c.setAttribute('cy',yScale(p.weight));\n    c.setAttribute('r', (isMax||isMin)?'4.5':'3.5');\n    c.setAttribute('fill', color);\n    c.setAttribute('stroke','var(--bg)'); c.setAttribute('stroke-width','1');\n    c.style.cursor='pointer';\n    c.dataset.date=p.date;\n    c.dataset.weight=p.weight;\n    svg.appendChild(c);\n  });\n\n  container.appendChild(svg);\n\n  let tip=container.querySelector('.chart-tooltip');\n  if(!tip){\n    tip=document.createElement('div');\n    tip.className='chart-tooltip';\n    container.appendChild(tip);\n  }\n  svg.addEventListener('mousemove', e=>{\n    const t=e.target;\n    if(t.tagName==='circle'){\n      const date=t.dataset.date;\n      const weight=t.dataset.weight;\n      const cx=parseFloat(t.getAttribute('cx'));\n      const cy=parseFloat(t.getAttribute('cy'));\n      const r=svg.getBoundingClientRect();\n      const scaleX=r.width\/W, scaleY=r.height\/H;\n      tip.textContent=`${formatDateCn(date)} ${fmt(toDisplay(Number(weight),globalUnit))}${unitLabel(globalUnit)}`;\n      tip.textContent=tip.textContent.replace(\/\\s+\/g,' ').trim();\n      tip.style.left=(cx*scaleX)+'px';\n      tip.style.top=(cy*scaleY-10)+'px';\n      tip.classList.add('show');\n    } else tip.classList.remove('show');\n  });\n  svg.addEventListener('mouseleave',()=>tip.classList.remove('show'));\n}\n\nfunction renderMultiLineChart(container, series, unitSuffix){\n  container.innerHTML='';\n  const valid=series.filter(s=>s.points.length>0);\n  if(valid.length===0){\n    container.innerHTML='<div class=\"empty-tip\" style=\"padding:20px 0;font-size:12px;\">暂无记录<\/div>';\n    return;\n  }\n  let W=container.clientWidth;\n  if(!W && container.parentElement) W=container.parentElement.clientWidth;\n  if(!W) W=Math.max(260, Math.min(window.innerWidth-40, 600));\n  if(W<120) W=Math.max(260, window.innerWidth-40);\n  const H=180;\n  const padL=42, padR=18, padT=10, padB=26;\n  const plotW=W-padL-padR, plotH=H-padT-padB;\n  const allVals=[];\n  valid.forEach(s=>s.points.forEach(p=>allVals.push(p.value)));\n  let minW=Math.min(...allVals), maxW=Math.max(...allVals);\n  if(minW===maxW){ minW-=1; maxW+=1; }\n  const padV=(maxW-minW)*0.15;\n  minW-=padV; maxW+=padV;\n  const baseSeries=valid.reduce((a,b)=> a.points.length>=b.points.length?a:b);\n  const xScale=(i,len)=> padL + (len===1? plotW\/2 : (i\/(len-1))*plotW);\n  const yScale=v=> padT + plotH - ((v-minW)\/(maxW-minW))*plotH;\n  const svgNS='http:\/\/www.w3.org\/2000\/svg';\n  const svg=document.createElementNS(svgNS,'svg');\n  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);\n  svg.setAttribute('class','chart-svg');\n  svg.style.height=H+'px';\n  const yTicks=3;\n  for(let i=0;i<=yTicks;i++){\n    const val=minW+(maxW-minW)*i\/yTicks;\n    const y=yScale(val);\n    const line=document.createElementNS(svgNS,'line');\n    line.setAttribute('x1',padL); line.setAttribute('x2',W-padR);\n    line.setAttribute('y1',y); line.setAttribute('y2',y);\n    line.setAttribute('stroke','var(--border)'); line.setAttribute('stroke-width','1');\n    line.setAttribute('stroke-dasharray','3,3');\n    svg.appendChild(line);\n    const txt=document.createElementNS(svgNS,'text');\n    txt.setAttribute('x',padL-4); txt.setAttribute('y',y+3);\n    txt.setAttribute('text-anchor','end'); txt.setAttribute('font-size','9');\n    txt.setAttribute('fill','var(--gray-text)');\n    txt.textContent=val.toFixed(0);\n    svg.appendChild(txt);\n  }\n  const len = baseSeries.points.length;\n  const labelIdxs=pickXLabels(len, 7);\n  labelIdxs.forEach(i=>{\n    const x=xScale(i, len);\n    let anchor='middle';\n    if(i===0) anchor='start';\n    else if(i===len-1) anchor='end';\n    const txt=document.createElementNS(svgNS,'text');\n    txt.setAttribute('x', x);\n    txt.setAttribute('y', H-6);\n    txt.setAttribute('text-anchor', anchor);\n    txt.setAttribute('font-size', '9');\n    txt.setAttribute('fill', 'var(--gray-text)');\n    txt.textContent = baseSeries.points[i].date.slice(5);\n    svg.appendChild(txt);\n  });\n  valid.forEach(s=>{\n    const lenS=s.points.length;\n    for(let i=1;i<lenS;i++){\n      const line=document.createElementNS(svgNS,'line');\n      line.setAttribute('x1',xScale(i-1,lenS)); line.setAttribute('y1',yScale(s.points[i-1].value));\n      line.setAttribute('x2',xScale(i,lenS));   line.setAttribute('y2',yScale(s.points[i].value));\n      line.setAttribute('stroke',s.color); line.setAttribute('stroke-width','2');\n      line.setAttribute('stroke-linecap','round');\n      svg.appendChild(line);\n    }\n    s.points.forEach((p,i)=>{\n      const c=document.createElementNS(svgNS,'circle');\n      c.setAttribute('cx',xScale(i,lenS)); c.setAttribute('cy',yScale(p.value));\n      c.setAttribute('r','2.8');\n      c.setAttribute('fill',s.color); c.setAttribute('stroke','var(--bg)'); c.setAttribute('stroke-width','1');\n      const t=document.createElementNS(svgNS,'title');\n      t.textContent=`${s.name} ${p.date} ${p.value}${unitSuffix}`;\n      c.appendChild(t);\n      svg.appendChild(c);\n    });\n  });\n  container.appendChild(svg);\n}\n\nfunction analyzeStage(points){\n  let down=0,same=0,up=0;\n  for(let i=1;i<points.length;i++){\n    const d=points[i].weight-points[i-1].weight;\n    if(d<-0.05) down++; else if(d>0.05) up++; else same++;\n  }\n  let change=null;\n  if(points.length>=2){\n    change=points[points.length-1].weight-points[0].weight;\n  }\n  return { down, same, up, total: down+same+up, change };\n}\nfunction stageHtml(stage, unit, ul){\n  if(stage.total===0 && stage.change===null){\n    return '';\n  }\n  const pct=n=>stage.total? ((n\/stage.total)*100).toFixed(0)+'%':'0%';\n  let html='';\n  if(stage.total>0){\n    html += `\n      <div class=\"stage-tag\"><span class=\"stage-dot\" style=\"background:var(--down-color)\"><\/span>下降 ${pct(stage.down)}（${stage.down}天）<\/div>\n      <div class=\"stage-tag\"><span class=\"stage-dot\" style=\"background:var(--same-color)\"><\/span>不变 ${pct(stage.same)}（${stage.same}天）<\/div>\n      <div class=\"stage-tag\"><span class=\"stage-dot\" style=\"background:var(--up-color)\"><\/span>上升 ${pct(stage.up)}（${stage.up}天）<\/div>\n    `;\n  }\n  if(stage.change!==null){\n    const c=Math.round(toDisplay(stage.change,unit)*10)\/10;\n    let txt, cls;\n    if(Math.abs(c)<0.05){ txt='0 '+ul; cls='same'; }\n    else if(c<0){ txt='-'+fmt(Math.abs(c))+' '+ul; cls='down'; }\n    else { txt='+'+fmt(c)+' '+ul; cls='up'; }\n    html += `<div class=\"stage-change ${cls}\">区间体重变化　${txt}<\/div>`;\n  }\n  return html;\n}\n\nfunction renderOverallChart(user, unit, ul){\n  const recs=getSortedRecords(user);\n  const startW=Number(user.startWeight)||0;\n  const points=[{ date:user.startDate, weight:startW }];\n  recs.forEach(r=>{ if(r.date!==user.startDate) points.push({ date:r.date, weight:Number(r.weight) }); });\n  const byDate={}; points.forEach(p=>{ byDate[p.date]=p; });\n  const sorted=Object.values(byDate).sort((a,b)=> a.date<b.date?-1:1);\n  const avg = sorted.length ? sorted.reduce((a,b)=>a+b.weight,0)\/sorted.length : null;\n  const targetW=Number(user.targetWeight);\n\n  const sd=parseDate(user.startDate), td=parseDate(user.targetDate);\n  if(!isNaN(sd.getTime()) && !isNaN(td.getTime())){\n    $('overallRange').textContent=cnRange(sd, td);\n  } else if(!isNaN(sd.getTime())){\n    $('overallRange').textContent=`${user.startDate} 起`;\n  } else {\n    $('overallRange').textContent='';\n  }\n\n  renderLineChart($('chartOverall'), sorted, { avgValue: avg, targetValue: targetW });\n  $('stageOverall').innerHTML=stageHtml(analyzeStage(sorted), unit, ul);\n}\n\nfunction getWeekRangeOffset(offset){\n  const today=new Date();\n  const wr=getWeekRange(today);\n  const s=new Date(wr.start); s.setDate(s.getDate()+offset*7);\n  const e=new Date(s); e.setDate(e.getDate()+6); e.setHours(23,59,59,999);\n  return { start:s, end:e };\n}\nfunction getMonthRangeOffset(offset){\n  const t=new Date();\n  const s=new Date(t.getFullYear(), t.getMonth()+offset, 1);\n  const e=new Date(s.getFullYear(), s.getMonth()+1, 0, 23,59,59);\n  return { start:s, end:e };\n}\nfunction getYearRangeOffset(offset){\n  const t=new Date();\n  const y=t.getFullYear()+offset;\n  return { start:new Date(y,0,1), end:new Date(y,11,31,23,59,59) };\n}\nfunction getWeekRange(date){\n  const d=new Date(date);\n  const day=d.getDay();\n  const diff= day===0?6:day-1;\n  const mon=new Date(d); mon.setDate(d.getDate()-diff); mon.setHours(0,0,0,0);\n  const sun=new Date(mon); sun.setDate(mon.getDate()+6); sun.setHours(23,59,59,999);\n  return { start:mon, end:sun };\n}\nfunction renderWeekChart(user, unit, ul){\n  const recs=getSortedRecords(user);\n  const { start, end } = getWeekRangeOffset(weekOffset);\n  $('weekRange').textContent=cnRange(start, end);\n  $('backToWeekBtn').style.display = 'inline-block';\n  $('backToWeekBtn').style.visibility = (weekOffset === 0) ? 'hidden' : 'visible';\n  const points=recs.filter(r=>{ const d=parseDate(r.date); return d>=start&&d<=end; })\n    .map(r=>({ date:r.date, weight:Number(r.weight) }));\n  const avg=points.length?points.reduce((a,b)=>a+b.weight,0)\/points.length:null;\n  renderLineChart($('chartWeek'), points, { avgValue: avg });\n  $('stageWeek').innerHTML=stageHtml(analyzeStage(points), unit, ul);\n}\n\n\n\n\/\/ 2. 点击“回到当下”按钮\n$('backToWeekBtn').onclick = () => { weekOffset = 0; renderCombinedTab(); };\n$('backToMonthBtn').onclick = () => { monthOffset = 0; renderCombinedTab(); };\n$('backToYearBtn').onclick = () => { yearOffset = 0; renderCombinedTab(); };\n\n$('weekPrevBtn').onclick=()=>{ weekOffset--; renderCombinedTab(); };\n$('weekNextBtn').onclick=()=>{ weekOffset++; renderCombinedTab(); };\n\nfunction renderMonthChart(user, unit, ul){\n  const recs=getSortedRecords(user);\n  const { start, end } = getMonthRangeOffset(monthOffset);\n  $('monthRange').textContent=`${start.getFullYear()}年${start.getMonth()+1}月`;\n  $('backToMonthBtn').style.display = 'inline-block';\n  $('backToMonthBtn').style.visibility = (monthOffset === 0) ? 'hidden' : 'visible';\n  const points=recs.filter(r=>{ const d=parseDate(r.date); return d>=start&&d<=end; })\n    .map(r=>({ date:r.date, weight:Number(r.weight) }));\n  const avg=points.length?points.reduce((a,b)=>a+b.weight,0)\/points.length:null;\n  renderLineChart($('chartMonth'), points, { avgValue: avg });\n  $('stageMonth').innerHTML=stageHtml(analyzeStage(points), unit, ul);\n}\n$('monthPrevBtn').onclick=()=>{ monthOffset--; renderCombinedTab(); };\n$('monthNextBtn').onclick=()=>{ monthOffset++; renderCombinedTab(); };\n\nfunction renderYearChart(user, unit, ul){\n  const recs=getSortedRecords(user);\n  const { start, end } = getYearRangeOffset(yearOffset);\n  $('yearRange').textContent=`${start.getFullYear()}年`;\n  $('backToYearBtn').style.display = 'inline-block';\n  $('backToYearBtn').style.visibility = (yearOffset === 0) ? 'hidden' : 'visible';\n  const points=recs.filter(r=>{ const d=parseDate(r.date); return d>=start&&d<=end; })\n    .map(r=>({ date:r.date, weight:Number(r.weight) }));\n  const avg=points.length?points.reduce((a,b)=>a+b.weight,0)\/points.length:null;\n  renderLineChart($('chartYear'), points, { avgValue: avg });\n  $('stageYear').innerHTML=stageHtml(analyzeStage(points), unit, ul);\n}\n$('yearPrevBtn').onclick=()=>{ yearOffset--; renderCombinedTab(); };\n$('yearNextBtn').onclick=()=>{ yearOffset++; renderCombinedTab(); };\n\n\/* =========================================================\n   饮食与运动\n   ========================================================= *\/\nconst MEAL_LABELS={ breakfast:'早餐', lunch:'午餐', dinner:'晚餐', snack:'加餐' };\nconst MEAL_ORDER=['breakfast','lunch','dinner','snack'];\n\nfunction getDietBudget(user){\n  const bmr=calcBMR(user);\n  return (bmr!==null && isFinite(bmr)) ? Math.round(bmr) : 1800;\n}\n\nfunction renderDietTab(){\n  const idx=currentViewUserIndex; if(idx===null||!userList[idx]) return;\n  const user=userList[idx];\n  if(!Array.isArray(user.dietRecords)) user.dietRecords=[];\n  if(!Array.isArray(user.exerciseRecords)) user.exerciseRecords=[];\n\n  $('dietDateLabel').textContent=formatDateCn(dietDate)+(dietDate===getTodayStr()?'（今天）':'');\n\n  const dayDiets=user.dietRecords.filter(r=>r.date===dietDate);\n  const dayEx=user.exerciseRecords.filter(r=>r.date===dietDate);\n\n  const intake=dayDiets.reduce((s,r)=>s+(Number(r.kcal)||0),0);\n  const burn=dayEx.reduce((s,r)=>s+(Number(r.kcal)||0),0);\n  const budget=getDietBudget(user);\n  const remain=budget+burn-intake;\n\n  const remainEl=$('dietRemain');\n  remainEl.textContent=Math.round(remain);\n  remainEl.style.color = remain<0 ? 'var(--up-color)' : 'var(--primary)';\n\n  $('dietIntake').textContent=Math.round(intake);\n  $('dietBurn').textContent=Math.round(burn);\n  $('dietBudget').textContent=Math.round(budget);\n\n  const totalAllow=budget+burn;\n  const pct=totalAllow>0 ? Math.min(100, (intake\/totalAllow)*100) : 0;\n  $('dietBarFill').style.width=pct+'%';\n\n  const bmr=calcBMR(user);\n  $('dietHint').textContent = bmr!==null\n    ? '热量预算基于基础代谢（BMR）估算，运动消耗可额外增加可摄入额度。'\n    : '尚未完善性别 \/ 出生日期 \/ 身高信息，暂以 1800 千卡作为默认预算。完善个人资料后可获得更准确的估算。';\n\n  \/\/ 三大营养素\n  const protein=dayDiets.reduce((s,r)=>s+(Number(r.protein)||0),0);\n  const fat=dayDiets.reduce((s,r)=>s+(Number(r.fat)||0),0);\n  const carb=dayDiets.reduce((s,r)=>s+(Number(r.carb)||0),0);\n\n  const w=getCurrentWeight(user)||60;\n  const proteinGoal=Math.max(1, Math.round(w*1.5));\n  const fatGoal=Math.max(1, Math.round(budget*0.25\/9));\n  const carbGoal=Math.max(1, Math.round(Math.max(0, budget-proteinGoal*4-fatGoal*9)\/4));\n\n  const macroBox=$('macroList');\n  macroBox.innerHTML='';\n  [\n    {name:'蛋白质', val:protein, goal:proteinGoal, color:'var(--primary)'},\n    {name:'脂肪',   val:fat,     goal:fatGoal,     color:'var(--up-color)'},\n    {name:'碳水化合物', val:carb, goal:carbGoal,   color:'var(--down-color)'}\n  ].forEach(m=>{\n    const p=m.goal>0?Math.min(100, m.val\/m.goal*100):0;\n    const row=document.createElement('div');\n    row.innerHTML=`\n      <div class=\"macro-head\">\n        <span class=\"macro-name\">${m.name}<\/span>\n        <span class=\"macro-val\">${fmtNum(m.val,1)} \/ ${m.goal} 克<\/span>\n      <\/div>\n      <div class=\"macro-track\"><div class=\"macro-fill\" style=\"width:${p}%;background:${m.color}\"><\/div><\/div>\n    `;\n    macroBox.appendChild(row);\n  });\n\n  \/\/ 餐次\n  const mealBox=$('mealList'); mealBox.innerHTML='';\n  MEAL_ORDER.forEach(m=>{\n    const items=dayDiets.filter(r=>r.meal===m);\n    const total=items.reduce((s,r)=>s+(Number(r.kcal)||0),0);\n    const block=document.createElement('div'); block.className='meal-block';\n    const header=document.createElement('div'); header.className='meal-header';\n    const nm=document.createElement('span'); nm.className='meal-name'; nm.textContent=MEAL_LABELS[m];\n    const kc=document.createElement('span'); kc.className='meal-kcal'; kc.textContent=Math.round(total)+' 千卡';\n    const addBtn=document.createElement('button'); addBtn.className='meal-add-btn'; addBtn.textContent='+ 添加';\n    addBtn.onclick=(e)=>{ e.stopPropagation(); openDietModal(null, m); };\n    header.appendChild(nm); header.appendChild(kc); header.appendChild(addBtn);\n    block.appendChild(header);\n\n    const list=document.createElement('div'); list.className='meal-items';\n    if(items.length===0){\n      list.innerHTML='<div class=\"meal-empty\">暂无记录<\/div>';\n    } else {\n      items.forEach(it=>{\n        const row=document.createElement('div'); row.className='meal-item';\n        const main=document.createElement('div'); main.className='meal-item-main';\n        const nmEl=document.createElement('div'); nmEl.className='meal-item-name'; nmEl.textContent=it.name||'未命名';\n        const mEl=document.createElement('div'); mEl.className='meal-item-macro';\n        mEl.textContent=`蛋白 ${fmtNum(it.protein,1)}g · 脂肪 ${fmtNum(it.fat,1)}g · 碳水 ${fmtNum(it.carb,1)}g`;\n        main.appendChild(nmEl); main.appendChild(mEl);\n        const kcalEl=document.createElement('div'); kcalEl.className='meal-item-kcal';\n        kcalEl.textContent=Math.round(Number(it.kcal)||0)+' kcal';\n        row.appendChild(main); row.appendChild(kcalEl);\n        row.onclick=()=>openDietModal(it.id);\n        list.appendChild(row);\n      });\n    }\n    block.appendChild(list);\n    mealBox.appendChild(block);\n  });\n\n  \/\/ 运动\n  const exBox=$('exerciseList'); exBox.innerHTML='';\n  if(dayEx.length===0){\n    exBox.innerHTML='<div class=\"empty-tip\" style=\"padding:10px 0;font-size:13px;\">今天还没有运动记录<\/div>';\n  } else {\n    dayEx.forEach(it=>{\n      const row=document.createElement('div'); row.className='record-item';\n      const left=document.createElement('div');\n      const nmEl=document.createElement('div'); nmEl.className='rec-weight';\n      nmEl.style.fontSize='14px'; nmEl.style.marginBottom='2px';\n      nmEl.textContent=it.name||'运动';\n      const metaEl=document.createElement('div'); metaEl.className='rec-meta'; metaEl.textContent='运动消耗';\n      left.appendChild(nmEl); left.appendChild(metaEl);\n      const right=document.createElement('div'); right.className='rec-diff';\n      right.style.color='var(--down-color)';\n      right.textContent=Math.round(Number(it.kcal)||0)+' 千卡';\n      row.appendChild(left); row.appendChild(right);\n      row.onclick=()=>openExerciseModal(it.id);\n      exBox.appendChild(row);\n    });\n  }\n}\n\n\/* 日期导航 *\/\n$('dietPrevDay').onclick=()=>{ dietDate=addDays(dietDate,-1); renderDietTab(); };\n$('dietNextDay').onclick=()=>{ dietDate=addDays(dietDate,1); renderDietTab(); };\n$('dietDateLabel').onclick=()=>{ dietDate=getTodayStr(); renderDietTab(); };\n\n\/* 饮食弹窗 *\/\nfunction openDietModal(id, presetMeal){\n  const user=userList[currentViewUserIndex]; if(!user) return;\n  editingDietId=id;\n  $('errDietName').textContent='';\n  if(id){\n    const it=user.dietRecords.find(r=>r.id===id); if(!it) return;\n    $('dietAddTitle').textContent='编辑饮食记录';\n    $('deleteDietBtn').style.display='';\n    $('inpDietMeal').value=it.meal||'breakfast';\n    $('inpDietName').value=it.name||'';\n    $('inpDietKcal').value=fmtNum(it.kcal,0);\n    $('inpDietProtein').value=fmtNum(it.protein,1);\n    $('inpDietFat').value=fmtNum(it.fat,1);\n    $('inpDietCarb').value=fmtNum(it.carb,1);\n  } else {\n    $('dietAddTitle').textContent='添加饮食记录';\n    $('deleteDietBtn').style.display='none';\n    $('inpDietMeal').value=presetMeal||'breakfast';\n    $('inpDietName').value='';\n    $('inpDietKcal').value='';\n    $('inpDietProtein').value='';\n    $('inpDietFat').value='';\n    $('inpDietCarb').value='';\n  }\n  maskDietAdd.classList.add('show');\n}\n$('cancelDietAdd').onclick=()=>maskDietAdd.classList.remove('show');\nmaskDietAdd.onclick=e=>{ if(e.target===maskDietAdd) maskDietAdd.classList.remove('show'); };\n$('saveDietAdd').onclick=()=>{\n  const user=userList[currentViewUserIndex]; if(!user) return;\n  const name=$('inpDietName').value.trim();\n  if(!name){ $('errDietName').textContent='请输入食物名称'; return; }\n  const rec={\n    id: editingDietId || genId(),\n    date: dietDate,\n    meal: $('inpDietMeal').value,\n    name,\n    kcal: parseFloat($('inpDietKcal').value)||0,\n    protein: parseFloat($('inpDietProtein').value)||0,\n    fat: parseFloat($('inpDietFat').value)||0,\n    carb: parseFloat($('inpDietCarb').value)||0\n  };\n  if(editingDietId){\n    const i=user.dietRecords.findIndex(r=>r.id===editingDietId);\n    if(i>=0) user.dietRecords[i]=rec; else user.dietRecords.push(rec);\n  } else {\n    user.dietRecords.push(rec);\n  }\n  saveUsers();\n  maskDietAdd.classList.remove('show');\n  renderDietTab();\n};\n$('deleteDietBtn').onclick=()=>{\n  const user=userList[currentViewUserIndex];\n  if(!user||!editingDietId) return;\n  if(!confirm('确认删除这条饮食记录吗？')) return;\n  user.dietRecords=user.dietRecords.filter(r=>r.id!==editingDietId);\n  saveUsers(); maskDietAdd.classList.remove('show');\n  renderDietTab();\n};\n\n\/* 运动弹窗 *\/\n$('addExerciseBtn').onclick=()=>openExerciseModal(null);\nfunction openExerciseModal(id){\n  const user=userList[currentViewUserIndex]; if(!user) return;\n  editingExerciseId=id;\n  $('errExerciseName').textContent=''; $('errExerciseKcal').textContent='';\n  if(id){\n    const it=user.exerciseRecords.find(r=>r.id===id); if(!it) return;\n    $('exerciseAddTitle').textContent='编辑运动记录';\n    $('deleteExerciseBtn').style.display='';\n    $('inpExerciseName').value=it.name||'';\n    $('inpExerciseKcal').value=fmtNum(it.kcal,0);\n  } else {\n    $('exerciseAddTitle').textContent='添加运动';\n    $('deleteExerciseBtn').style.display='none';\n    $('inpExerciseName').value='';\n    $('inpExerciseKcal').value='';\n  }\n  maskExerciseAdd.classList.add('show');\n}\n$('cancelExerciseAdd').onclick=()=>maskExerciseAdd.classList.remove('show');\nmaskExerciseAdd.onclick=e=>{ if(e.target===maskExerciseAdd) maskExerciseAdd.classList.remove('show'); };\n$('saveExerciseAdd').onclick=()=>{\n  const user=userList[currentViewUserIndex]; if(!user) return;\n  const name=$('inpExerciseName').value.trim();\n  const kcalStr=$('inpExerciseKcal').value.trim();\n  $('errExerciseName').textContent=''; $('errExerciseKcal').textContent='';\n  let ok=true;\n  if(!name){ $('errExerciseName').textContent='请输入运动名称'; ok=false; }\n  const kcal=parseFloat(kcalStr);\n  if(!kcalStr||isNaN(kcal)||kcal<0){ $('errExerciseKcal').textContent='请输入有效消耗'; ok=false; }\n  if(!ok) return;\n  const rec={ id: editingExerciseId || genId(), date: dietDate, name, kcal };\n  if(editingExerciseId){\n    const i=user.exerciseRecords.findIndex(r=>r.id===editingExerciseId);\n    if(i>=0) user.exerciseRecords[i]=rec; else user.exerciseRecords.push(rec);\n  } else {\n    user.exerciseRecords.push(rec);\n  }\n  saveUsers();\n  maskExerciseAdd.classList.remove('show');\n  renderDietTab();\n};\n$('deleteExerciseBtn').onclick=()=>{\n  const user=userList[currentViewUserIndex];\n  if(!user||!editingExerciseId) return;\n  if(!confirm('确认删除这条运动记录吗？')) return;\n  user.exerciseRecords=user.exerciseRecords.filter(r=>r.id!==editingExerciseId);\n  saveUsers(); maskExerciseAdd.classList.remove('show');\n  renderDietTab();\n};\n\n\/* =========================================================\n   PK（弹窗）\n   ========================================================= *\/\n$('openPKBtn').onclick=()=>{\n  if(currentViewUserIndex===null) return;\n  renderPKTab();\n  maskPK.classList.add('show');\n};\n\/\/ 删除了 $('closePK').onclick... 避免报错\nmaskPK.onclick=e=>{ if(e.target===maskPK) maskPK.classList.remove('show'); };\n\nfunction renderPKTab(){\n  const container=$('pkContent'); container.innerHTML='';\n  if(currentViewUserIndex===null) return;\n  if(userList.length<=1){\n    container.innerHTML='<div class=\"empty-tip\" style=\"padding:20px 0;\">需要创建其他用户才能进行 PK<\/div>';\n    return;\n  }\n\n  const others=userList.filter((_,i)=>i!==currentViewUserIndex);\n  const wrap=document.createElement('div'); wrap.className='pk-options';\n  const selected=new Set();\n  others.forEach(u=>{\n    const idx=userList.indexOf(u);\n    const item=document.createElement('div'); item.className='pk-opt pk-opt-clickable'; item.dataset.idx=idx;\n    const av=document.createElement('span'); av.className='pk-opt-avatar';\n    renderAvatarVisual(av,u.avatarEmoji,u.avatarBg,28,u.avatarImage);\n    const nm=document.createElement('span'); nm.textContent=u.name;\n    item.appendChild(av); item.appendChild(nm);\n    item.onclick=()=>{\n      if(selected.has(idx)){ selected.delete(idx); item.classList.remove('selected'); }\n      else{ selected.add(idx); item.classList.add('selected'); }\n      startBtn.disabled = selected.size===0;\n    };\n    wrap.appendChild(item);\n  });\n  container.appendChild(wrap);\n\n  const startBtn=document.createElement('button');\n  startBtn.className='pk-start-btn'; startBtn.disabled=true; startBtn.textContent='开始 PK';\n  const closeBtn=document.createElement('button');\n  closeBtn.className='pk-start-btn secondary'; closeBtn.textContent='关闭';\n  closeBtn.onclick=()=>maskPK.classList.remove('show');\n  const bw=document.createElement('div'); bw.className='pk-footer-row';\n  bw.appendChild(closeBtn); bw.appendChild(startBtn);\n  container.appendChild(bw);\n\n  startBtn.onclick=()=>{\n    if(selected.size===0) return;\n    const sel=[...selected].map(Number);\n    renderPKResult(sel);\n  };\n}\nfunction getPeriodReduction(user, startDate, endDate){\n  const recs=getSortedRecords(user);\n  const inP=recs.filter(r=>{ const d=parseDate(r.date); return d>=startDate&&d<=endDate; });\n  if(inP.length===0) return null;\n  const lastW=Number(inP[inP.length-1].weight);\n  let refW;\n  if(inP.length>=2) refW=Number(inP[0].weight);\n  else {\n    const before=recs.filter(r=>parseDate(r.date)<startDate);\n    refW = before.length>0 ? Number(before[before.length-1].weight) : (Number(user.startWeight)||0);\n  }\n  return refW-lastW;\n}\nfunction getProgressPct(user){\n  const sw=Number(user.startWeight)||0, tw=Number(user.targetWeight)||0;\n  const cw=getCurrentWeight(user);\n  const total=sw-tw; if(total<=0) return null;\n  return ((sw-cw)\/total)*100;\n}\nfunction renderRankBlock(title, dateLabel, users, userIndices, valueFn, formatFn){\n  const entries=users.map((u,i)=>({ user:u, userIdx:userIndices[i], value:valueFn(u) }));\n  entries.sort((a,b)=>{\n    if(a.value===null&&b.value===null) return 0;\n    if(a.value===null) return 1;\n    if(b.value===null) return -1;\n    return b.value-a.value;\n  });\n  const valid=entries.filter(e=>e.value!==null);\n  const div=document.createElement('div'); div.className='pk-period';\n  const header=document.createElement('div'); header.className='pk-period-header';\n  const tt=document.createElement('span'); tt.className='pk-period-title'; tt.textContent=title;\n  header.appendChild(tt);\n  if(dateLabel){ const ds=document.createElement('span'); ds.className='pk-period-date'; ds.textContent=dateLabel; header.appendChild(ds); }\n  div.appendChild(header);\n  if(valid.length===0){\n    const empty=document.createElement('div'); empty.className='empty-tip';\n    empty.style.padding='6px 0'; empty.style.fontSize='12px'; empty.textContent='暂无数据';\n    div.appendChild(empty);\n  } else {\n    const list=document.createElement('div'); list.className='pk-user-list';\n    const topVal=valid[0].value;\n    const topCount=valid.filter(e=>Math.abs(e.value-topVal)<0.001).length;\n    const isTie=topCount>=2 && topVal>0.001;\n    valid.forEach((e,idx)=>{\n      const isWinner=idx===0 && e.value>0.001 && !isTie;\n      const isTieFirst=isTie && Math.abs(e.value-topVal)<0.001;\n      const display=formatFn(e.value, e.user);\n      const row=document.createElement('div');\n      row.className='pk-user-row'+(isWinner?' winner':'')+(isTieFirst?' tie':'');\n      const rank=document.createElement('span'); rank.className='pk-rank'; rank.textContent=idx+1;\n      row.appendChild(rank);\n      const av=document.createElement('span'); av.className='pk-user-avatar';\n      renderAvatarVisual(av,e.user.avatarEmoji,e.user.avatarBg,24,e.user.avatarImage);\n      row.appendChild(av);\n      const nm=document.createElement('span'); nm.className='pk-user-name'; nm.textContent=e.user.name;\n      row.appendChild(nm);\n      if(isWinner){ const tr=document.createElement('span'); tr.className='pk-trophy'; tr.textContent='🏆 获胜！'; row.appendChild(tr); }\n      else if(isTieFirst){ const tr=document.createElement('span'); tr.className='pk-trophy tie'; tr.textContent='🤝 平局'; row.appendChild(tr); }\n      const ch=document.createElement('span'); ch.className='pk-user-change '+display.cls; ch.textContent=display.text;\n      row.appendChild(ch); list.appendChild(row);\n    });\n    div.appendChild(list);\n    if(isTie){\n      const nw=document.createElement('div'); nw.className='pk-winner-text';\n      nw.style.color='var(--up-color)'; nw.textContent='并列第一，平局！';\n      div.appendChild(nw);\n    } else if(valid[0].value<=0.001){\n      const nw=document.createElement('div'); nw.className='pk-winner-text';\n      nw.style.color='var(--gray-text)'; nw.textContent='无获胜者（均未减重）';\n      div.appendChild(nw);\n    }\n  }\n  return div;\n}\nfunction renderPKResult(opponentIndices){\n  const currentIdx=currentViewUserIndex;\n  const allIndices=[currentIdx, ...opponentIndices];\n  const users=allIndices.map(i=>userList[i]);\n  const container=$('pkContent'); container.innerHTML='';\n  const h3=document.createElement('h3'); h3.textContent='PK 结果'; container.appendChild(h3);\n  const result=document.createElement('div'); result.className='pk-result';\n\n  const reductionFormat=v=>{\n    const abs=Math.abs(v);\n    if(abs<0.05) return { text:'无变化', cls:'same' };\n    if(v>0) return { text:`减重 ${fmt(abs)} 公斤`, cls:'down' };\n    return { text:`增重 ${fmt(abs)} 公斤`, cls:'up' };\n  };\n  const progressFormat=v=>{\n    if(v===null||!isFinite(v)) return { text:'--', cls:'same' };\n    const r=Math.round(v);\n    if(r>0) return { text:r+'%', cls:'down' };\n    if(r<0) return { text:r+'%', cls:'up' };\n    return { text:'0%', cls:'same' };\n  };\n\n  const today=new Date();\n  const todayStart=new Date(today.getFullYear(),today.getMonth(),today.getDate(),0,0,0);\n  const todayEnd=new Date(today.getFullYear(),today.getMonth(),today.getDate(),23,59,59);\n  const weekRange=getWeekRange(today);\n  const monthStart=new Date(today.getFullYear(),today.getMonth(),1);\n  const monthEnd=new Date(today.getFullYear(),today.getMonth()+1,0,23,59,59);\n  const yearStart=new Date(today.getFullYear(),0,1);\n  const yearEnd=new Date(today.getFullYear(),11,31,23,59,59);\n\n  result.appendChild(renderRankBlock('减重进度排名','整体', users, allIndices, u=>getProgressPct(u), progressFormat));\n  result.appendChild(renderRankBlock('日排名', cnDate(today), users, allIndices, u=>getPeriodReduction(u,todayStart,todayEnd), reductionFormat));\n  result.appendChild(renderRankBlock('周排名', cnRange(weekRange.start,weekRange.end), users, allIndices, u=>getPeriodReduction(u,weekRange.start,weekRange.end), reductionFormat));\n  result.appendChild(renderRankBlock('月排名', `${today.getFullYear()}年${today.getMonth()+1}月`, users, allIndices, u=>getPeriodReduction(u,monthStart,monthEnd), reductionFormat));\n  result.appendChild(renderRankBlock('年排名', `${today.getFullYear()}年`, users, allIndices, u=>getPeriodReduction(u,yearStart,yearEnd), reductionFormat));\n\n  container.appendChild(result);\n  const bw=document.createElement('div'); bw.style.marginTop='16px';\n  const back=document.createElement('button'); back.className='pk-start-btn secondary'; back.textContent='返回选择';\n  back.onclick=()=>renderPKTab();\n  bw.appendChild(back); container.appendChild(bw);\n}\n\n\/* =========================================================\n   回车 & resize\n   ========================================================= *\/\nfunction bindEnter(maskEl, btn){\n  maskEl.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); btn.click(); } });\n}\nbindEnter(maskCreate, $('submitCreate'));\nbindEnter(maskModify, $('saveModify'));\nbindEnter(maskRecord, $('saveRecord'));\nbindEnter(maskAvatarSelect, $('confirmAvatar'));\nbindEnter(maskAllRecords, $('closeAllRecords'));\nbindEnter(maskEmojiFull, $('closeEmojiFull'));\nmaskJumpDate.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); $('confirmJumpDate').click(); } });\nbindEnter(maskMetricEdit, $('saveMetricEdit'));\nbindEnter(maskHealthInfo, $('closeHealthInfo'));\nbindEnter(maskWeightEdit, $('saveWeightEdit'));\nbindEnter(maskMetricHistoryFull, $('closeMetricHistoryFull'));\nbindEnter(maskDietAdd, $('saveDietAdd'));\nbindEnter(maskExerciseAdd, $('saveExerciseAdd'));\n\nlet chartResizeTimer=null;\nfunction handleChartResize(){\n  clearTimeout(chartResizeTimer);\n  chartResizeTimer=setTimeout(()=>{\n    if(currentViewUserIndex===null) return;\n    if(!detailPage.classList.contains('show')) return;\n    const tab=getActiveTab();\n    if(tab==='combined') renderCombinedTab();\n  }, 200);\n}\nwindow.addEventListener('resize', handleChartResize);\nwindow.addEventListener('orientationchange', handleChartResize);\n\n\/* 用户选择弹窗开关 *\/\n\/* 无数据时的创建和导入按钮 *\/\n$('emptyCreateBtn').onclick = () => {\n  $('openCreate').click();\n};\n$('emptyImportBtn').onclick = () => {\n  triggerStandaloneImport();\n};\n\n\n$('openUserSelect').onclick=()=>{ \n  editMode='view'; \/\/ 每次打开重置为正常模式\n  renderUserSelectList(); \n  maskUserSelect.classList.add('show'); \n};\n\nfunction closeUserSelectAndReset() {\n  maskUserSelect.classList.remove('show');\n  editMode='view';\n  \/\/ 如果是从设置里进来的，关闭用户选择后重新打开设置\n  if(!maskSettings.classList.contains('show') && document.getElementById('tab-settings').classList.contains('show')) {\n    renderSettingsTab(true);\n    maskSettings.classList.add('show');\n  }\n}\n\n$('closeUserSelect').onclick = closeUserSelectAndReset;\n$('btnUserSelectDone').onclick = closeUserSelectAndReset;\n\n\/\/ 绑定编辑模式内的按钮\n$('openEdit').onclick = () => {\n  editMode = 'delete'; \/\/ 进入编辑状态（展示删除按钮）\n  renderUserSelectList();\n};\n\n$('btnUserSelectDelete').onclick = () => {\n  \/\/ 切换回普通编辑状态\n  editMode = 'delete'; \n  renderUserSelectList();\n};\nmaskUserSelect.onclick=e=>{ \n  if(e.target===maskUserSelect) {\n    maskUserSelect.classList.remove('show');\n    if(!maskSettings.classList.contains('show') && document.getElementById('tab-settings').classList.contains('show')) {\n      renderSettingsTab(true);\n      maskSettings.classList.add('show');\n    }\n  } \n};\n\n\/\/ =========================================================\n\/\/ 围度弹窗事件绑定\n\/\/ =========================================================\ndocument.addEventListener('DOMContentLoaded', () => {\n  $('popupBodyPartSelect').onchange = function(){\n    const part = this.value;\n    $('popupBodySideSelect').style.display = BODY_PARTS[part]?.hasSide ? 'block' : 'none';\n  };\n  maskBodyMetricAdd = $('maskBodyMetricAdd');\n  $('cancelPopupBodyMetric').onclick = () => {\n    if (maskBodyMetricAdd) maskBodyMetricAdd.classList.remove('show');\n  };\n  if (maskBodyMetricAdd) {\n    maskBodyMetricAdd.onclick = e => { if(e.target === maskBodyMetricAdd) maskBodyMetricAdd.classList.remove('show'); };\n  }\n  $('savePopupBodyMetric').onclick = () => {\n    const user = userList[currentViewUserIndex]; if(!user) return;\n    const part = $('popupBodyPartSelect').value;\n    const side = $('popupBodySideSelect').value;\n    const key = getBodyMetricKey(part, side);\n    const valStr = $('popupBodyMetricValue').value.trim();\n    const dateStr = $('popupBodyMetricDate').value;\n    const v = parseFloat(valStr);\n    if(!valStr || isNaN(v) || v <= 0 || v > 300){ alert('请输入有效的围度数值（厘米）'); return; }\n    if(!dateStr){ alert('请选择日期'); return; }\n    \n    user.bodyMetrics[key].push({ id: genId(), date: fixDate(dateStr), value: v });\n    saveUsers();\n    if (maskBodyMetricAdd) maskBodyMetricAdd.classList.remove('show');\n    renderBodyMetricsSection(user, globalUnit, unitLabel(globalUnit));\n  };\n});\n\/* 初始化 *\/\napplyTheme();\nbuildAvatarPanel();\nrenderSidebarUsers();\n\n\/\/ 确保主题色在 DOM 完全加载后再次应用（防止 CSS 变量被覆盖）\ndocument.addEventListener('DOMContentLoaded', () => {\n  applyTheme();\n});\n\nconst LAST_USER_KEY='weightRecordLastUser';\nlet lastIdxRaw = null;\ntry{ lastIdxRaw = localStorage.getItem(LAST_USER_KEY); }catch(e){}\nlet lastIdx = (lastIdxRaw !== null && lastIdxRaw !== '') ? Number(lastIdxRaw) : null;\n\n\/\/ maskUserSelect 已在文件前部统一声明\n\nif(userList.length > 0){\n  \/\/ 【核心修复】检查上次保存的索引是否有效，有效就打开上次的，无效才默认打开第一个\n  if(lastIdx !== null && userList[lastIdx]){\n    openUserDetail(lastIdx);\n  } else {\n    openUserDetail(0);\n  }\n} else {\n  \/\/ 没有历史用户时，默认展示\"体重\"页面，但数据为空\n  currentViewUserIndex=null;\n  try{ localStorage.removeItem(LAST_USER_KEY); }catch(e){}\n  detailPage.classList.add('show');\n  \n  \/\/ 激活\"体重\"Tab并移除置灰\n  sidebarNavBtns.forEach(b=>{ \n    b.disabled = false;

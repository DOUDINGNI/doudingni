"errModName\"><\/span><\/label><input type=\"text\" id=\"inpModifyName\"><\/div>\n\n    <!-- 体重历史（迁移自综合页） -->\n    <div class=\"form-item\">\n      <label>体重历史<\/label>\n      <div class=\"record-list modal-record-list\" id=\"recordList\"><\/div>\n      <div style=\"text-align:right;margin-top:6px;\"><button class=\"small-ghost-btn\" id=\"showAllRecordsBtn\">更多记录<\/button><\/div>\n    <\/div>\n\n    <!-- 围度历史（迁移自身体围度模块） -->\n    <div class=\"form-item\">\n      <label>围度历史<\/label>\n      <select id=\"metricHistorySelect\" class=\"metric-select\" style=\"margin-bottom:10px;\"><option value=\"neck\">颈围<\/option><option value=\"shoulder\">肩宽<\/option><option value=\"chest\">胸围<\/option><option value=\"waist\">腰围<\/option><option value=\"hip\">臀围<\/option><option value=\"arm\">臂围<\/option><option value=\"thigh\">大腿围<\/option><option value=\"calf\">小腿围<\/option><\/select>\n      <div class=\"metric-history-scroll modal-record-list\" id=\"metricHistoryList\"><\/div>\n      <div style=\"text-align:right;margin-top:6px;\"><button class=\"small-ghost-btn\" id=\"showAllMetricRecordsBtn\" style=\"display:none;\">更多记录<\/button><\/div>\n    <\/div>\n    \n    <div class=\"modal-footer\">\n      <button class=\"modal-btn cancel\" id=\"cancelModify\">取消<\/button>\n      <button class=\"modal-btn confirm\" id=\"saveModify\">保存<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- 编辑用户列表 -->\n<div class=\"mask\" id=\"maskEdit\">\n  <div class=\"modal\">\n    <h3>编辑用户<\/h3>\n    <div id=\"editUserList\"><\/div>\n    <div class=\"modal-footer\">\n      <button class=\"modal-btn cancel\" id=\"btnSort\">排序<\/button>\n      <button class=\"modal-btn cancel\" id=\"btnDelete\">删除<\/button>\n      <button class=\"modal-btn confirm\" id=\"closeEdit\">关闭<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- 头像选择 -->\n<div class=\"mask\" id=\"maskAvatarSelect\">\n  <div class=\"modal\">\n    <h3>自定义头像<\/h3>\n    <div class=\"avatar-modal-content\">\n      <div class=\"avatar-section\"><h4>头像预览<\/h4><div class=\"avatar-preview-big\" id=\"avatarPreviewBig\"><\/div><\/div>\n      <div class=\"avatar-section\"><h4>本地上传<\/h4>\n        <div class=\"upload-row\">\n          <button type=\"button\" class=\"upload-btn\" id=\"uploadAvatarBtn\">从本地选择图片<\/button>\n          <button type=\"button\" class=\"clear-img-btn\" id=\"clearUploadImg\">清除图片<\/button>\n        <\/div>\n        <input type=\"file\" id=\"avatarFileInput\" class=\"hidden-file\" accept=\"image\/*\">\n      <\/div>\n      <div class=\"avatar-section\"><h4>Emoji图案<\/h4>\n        <div class=\"emoji-grid\" id=\"emojiGrid\"><\/div>\n        <div class=\"emoji-footer\"><button type=\"button\" class=\"ghost-btn\" id=\"clearEmoji\">不使用<\/button><\/div>\n      <\/div>\n      <div class=\"avatar-section\"><h4>背景选择<\/h4>\n        <div class=\"bg-row\">\n          <button type=\"button\" class=\"color-select-btn\" id=\"openColorPicker\">颜色选择<\/button>\n          <input type=\"color\" id=\"colorPicker\" class=\"hidden-native-color\">\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"modal-footer\">\n      <button class=\"modal-btn cancel\" id=\"closeAvatarModal\">关闭<\/button>\n      <button class=\"modal-btn confirm\" id=\"confirmAvatar\">确定<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- 全部 Emoji -->\n<div class=\"mask\" id=\"maskEmojiFull\">\n  <div class=\"modal\">\n    <h3>全部 Emoji<\/h3>\n    <div class=\"emoji-full-grid\" id=\"emojiFullGrid\"><\/div>\n    <div class=\"modal-footer\"><button class=\"modal-btn confirm\" id=\"closeEmojiFull\">关闭<\/button><\/div>\n  <\/div>\n<\/div>\n\n<!-- 体重记录 -->\n<div class=\"mask\" id=\"maskRecord\">\n  <div class=\"modal\">\n    <h3 id=\"recordModalTitle\">添加体重记录<\/h3>\n    <div class=\"form-item\"><label>体重<span class=\"error-tip\" id=\"errRecWeight\"><\/span><\/label>\n      <div class=\"weight-input-wrap\"><input type=\"number\" step=\"0.1\" id=\"inpRecWeight\" placeholder=\"请输入体重\"><span class=\"weight-unit-tag\" id=\"recUnitTag\">公斤<\/span><\/div>\n    <\/div>\n    <div class=\"form-item\"><label>日期<span class=\"error-tip\" id=\"errRecDate\"><\/span><\/label><input type=\"date\" id=\"inpRecDate\"><\/div>\n    <div class=\"form-item\"><label>时间<span class=\"error-tip\" id=\"errRecTime\"><\/span><\/label><input type=\"time\" id=\"inpRecTime\"><\/div>\n    <div class=\"modal-footer\">\n      <button class=\"modal-btn danger\" id=\"deleteRecordBtn\">删除<\/button>\n      <button class=\"modal-btn cancel\" id=\"cancelRecord\">取消<\/button>\n      <button class=\"modal-btn confirm\" id=\"saveRecord\">确定<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- 全部记录 -->\n<div class=\"mask\" id=\"maskAllRecords\">\n  <div class=\"modal\">\n    <h3>全部体重记录<\/h3>\n    <div style=\"margin-bottom:10px;\">\n      <select id=\"allRecordsFilter\"><option value=\"\">全部月份<\/option><\/select>\n    <\/div>\n    <div class=\"record-list\" id=\"allRecordsList\"><\/div>\n    <div class=\"modal-footer\"><button class=\"modal-btn confirm\" id=\"closeAllRecords\">关闭<\/button><\/div>\n  <\/div>\n<\/div>\n\n<!-- 全部围度记录 -->\n<div class=\"mask\" id=\"maskMetricHistoryFull\">\n  <div class=\"modal\">\n    <h3 id=\"metricHistoryFullTitle\">全部围度记录<\/h3>\n    <div class=\"metric-history-scroll\" id=\"metricHistoryFullList\" style=\"max-height:55vh;\"><\/div>\n    <div class=\"modal-footer\"><button class=\"modal-btn confirm\" id=\"closeMetricHistoryFull\">关闭<\/button><\/div>\n  <\/div>\n<\/div>\n\n<!-- 跳转日期 -->\n<div class=\"mask\" id=\"maskJumpDate\">\n  <div class=\"modal\">\n    <h3>跳转到时间<\/h3>\n    \n    <div class=\"form-item\" style=\"margin: 15px 0;\">\n      <label>年份<\/label>\n      <select id=\"jumpYearSelect\"><\/select>\n    <\/div>\n    \n    <div class=\"form-item\" id=\"jumpTarget2Row\" style=\"margin: 15px 0;\">\n      <label id=\"jumpTarget2Label\">月份<\/label>\n      <select id=\"jumpTarget2Select\"><\/select>\n    <\/div>\n    \n    <div class=\"modal-footer\">\n      <button class=\"modal-btn cancel\" id=\"cancelJumpDate\">取消<\/button>\n      <button class=\"modal-btn confirm\" id=\"confirmJumpDate\">确定<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- 围度编辑 -->\n<div class=\"mask\" id=\"maskMetricEdit\">\n  <div class=\"modal\">\n    <h3 id=\"metricEditTitle\">修改围度记录<\/h3>\n    <div class=\"form-item\"><label>数值（厘米）<\/label><input type=\"number\" step=\"0.1\" id=\"inpMetricEditValue\"><\/div>\n    <div class=\"form-item\"><label>日期<\/label><input type=\"date\" id=\"inpMetricEditDate\"><\/div>\n    <div class=\"modal-footer\">\n      <button class=\"modal-btn danger\" id=\"deleteMetricRecord\">删除<\/button>\n      <button class=\"modal-btn cancel\" id=\"cancelMetricEdit\">取消<\/button>\n      <button class=\"modal-btn confirm\" id=\"saveMetricEdit\">保存<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- 健康信息弹窗 -->\n<div class=\"mask\" id=\"maskHealthInfo\">\n  <div class=\"modal\">\n    <h3 id=\"healthInfoTitle\">详情<\/h3>\n    <div id=\"healthInfoBody\"><\/div>\n    <div class=\"modal-footer\"><button class=\"modal-btn confirm\" id=\"closeHealthInfo\">知道了<\/button><\/div>\n  <\/div>\n<\/div>\n\n<!-- 体重快速编辑弹窗 -->\n<div class=\"mask\" id=\"maskWeightEdit\">\n  <div class=\"modal\">\n    <h3 id=\"weightEditTitle\">修改体重<\/h3>\n    <div class=\"form-item\"><label>体重（<span id=\"weightEditUnitLabel\">公斤<\/span>）<span class=\"error-tip\" id=\"errWeightEditValue\"><\/span><\/label>\n      <input type=\"number\" step=\"0.1\" id=\"inpWeightEditValue\">\n    <\/div>\n    <div class=\"form-item\"><label>日期<span class=\"error-tip\" id=\"errWeightEditDate\"><\/span><\/label>\n      <input type=\"date\" id=\"inpWeightEditDate\">\n    <\/div>\n    <div class=\"form-item\" id=\"weightEditTimeRow\" style=\"display:none;\">\n      <label>时间<\/label>\n      <input type=\"time\" id=\"inpWeightEditTime\">\n    <\/div>\n    <div class=\"modal-footer\">\n      <button class=\"modal-btn cancel\" id=\"cancelWeightEdit\">取消<\/button>\n      <button class=\"modal-btn confirm\" id=\"saveWeightEdit\">保存<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n    <!-- 基础信息独立编辑弹窗 -->\n    <div class=\"mask\" id=\"maskBasicEdit\">\n      <div class=\"modal\">\n        <h3 id=\"basicEditTitle\">编辑<\/h3>\n        <div class=\"form-item\" id=\"basicEditRowInput\" style=\"display:none;\">\n          <input type=\"text\" id=\"inpBasicEditValue\">\n        <\/div>\n        <div class=\"form-item\" id=\"basicEditRowSelect\" style=\"display:none;\">\n          <select id=\"inpBasicEditSelect\">\n            <option value=\"\">请选择<\/option>\n            <option value=\"male\">男<\/option>\n            <option value=\"female\">女<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"form-item\" id=\"basicEditRowDate\" style=\"display:none;\">\n          <input type=\"date\" id=\"inpBasicEditDate\">\n        <\/div>\n        <div class=\"modal-footer\">\n          <button class=\"modal-btn cancel\" id=\"cancelBasicEdit\">取消<\/button>\n          <button class=\"modal-btn confirm\" id=\"saveBasicEdit\">确定<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <!-- 数据传输弹窗 -->\n<div class=\"mask\" id=\"maskDataTransfer\">\n  <div class=\"modal\">\n    <h3>数据传输<\/h3>\n\n    <!-- 上半区：导入数据 -->\n    <div class=\"transfer-section\" id=\"importSection\">\n      <div class=\"transfer-section-title\">导入数据<\/div>\n      <div class=\"import-file-row\">\n        <input type=\"file\" id=\"importDataFile\" accept=\"application\/json,.json\" style=\"display:none;\">\n        <button class=\"import-select-btn\" id=\"btnSelectImportFile\">选择文件<\/button>\n        <span class=\"import-file-name\" id=\"importFileNameLabel\">JSON 格式<\/span>\n      <\/div>\n    <\/div>\n\n    <!-- 下半区：导出数据 -->\n    <div class=\"transfer-section\" id=\"exportSection\">\n      <div class=\"transfer-section-title\">导出数据<\/div>\n      <div class=\"form-item\" style=\"margin-bottom:0;\">\n        <select id=\"inpExportUser\">\n          <option value=\"\">选择要导出的用户<\/option>\n        <\/select>\n      <\/div>\n    <\/div>\n\n    <!-- 按钮区 -->\n    <div class=\"modal-footer\">\n      <button class=\"modal-btn cancel\" id=\"cancelTransfer\">取消<\/button>\n      <button class=\"modal-btn confirm\" id=\"btnImportData\" disabled>导入<\/button>\n      <button class=\"modal-btn confirm\" id=\"btnExportData\" disabled>导出<\/button>\n    <\/div>\n\n    <!-- 导入中\/结果状态 -->\n    <div id=\"transferResultView\" style=\"display:none; text-align:center;\">\n      <div id=\"transferResultMsg\" style=\"font-size:14px; margin-bottom:20px; line-height:1.6;\"><\/div>\n      <button class=\"modal-btn confirm\" id=\"closeTransferResult\">知道了<\/button>\n    <\/div>\n\n  <\/div>\n<\/div>\n\n<!-- 设置弹窗（由顶部图标打开） -->\n<div class=\"mask\" id=\"maskSettings\">\n  <div class=\"modal\" style=\"width:min(94%,480px)\">\n    <h3 style=\"margin-bottom:14px;\">设置<\/h3>\n    <div id=\"settingsModalBody\"><\/div>\n    <div class=\"modal-footer\">\n      <button class=\"modal-btn confirm\" id=\"closeSettingsModal\">关闭<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- 用户选择弹窗 -->\n<div class=\"mask\" id=\"maskUserSelect\">\n  <div class=\"modal\">\n    <!-- 这里的关闭按钮被移到下面了 -->\n    <h3 style=\"margin-bottom:14px;\">用户选择<\/h3>\n    \n    <div class=\"user-select-list\" id=\"userSelectList\"><\/div>\n    \n    <!-- 默认状态的操作按钮 -->\n    <div class=\"user-select-actions\" id=\"userSelectDefaultActions\">\n      <button class=\"sidebar-action-btn\" id=\"openCreate\">创建用户<\/button>\n      <button class=\"sidebar-action-btn\" id=\"openImportUser\">导入数据<\/button>\n      <button class=\"sidebar-action-btn\" id=\"openEdit\">编辑用户<\/button>\n      <button class=\"sidebar-action-btn\" id=\"setMainUser\">设置主用户<\/button>\n      <button class=\"sidebar-action-btn\" id=\"closeUserSelect\">关闭<\/button>\n    <\/div>\n    \n    <!-- 编辑模式下的操作按钮（默认隐藏） -->\n    <div class=\"user-select-actions\" id=\"userSelectEditActions\" style=\"display:none;\">\n      <button class=\"sidebar-action-btn\" id=\"btnUserSelectDelete\">删除<\/button>\n      <button class=\"sidebar-action-btn\" id=\"btnUserSelectDone\">完成<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<script>\n\/* =========================================================\n   部位定义\n   ========================================================= *\/\nconst BODY_PARTS = {\n  neck:{label:'颈围',hasSide:false}, shoulder:{label:'肩宽',hasSide:false},\n  chest:{label:'胸围',hasSide:false}, waist:{label:'腰围',hasSide:false},\n  hip:{label:'臀围',hasSide:false},\n  arm:{label:'臂围',hasSide:true}, thigh:{label:'大腿围',hasSide:true}, calf:{label:'小腿围',hasSide:true}\n};\nfunction emptyBodyMetrics(){\n  const o={};\n  for(const p in BODY_PARTS){\n    if(BODY_PARTS[p].hasSide){ o[p+'_L']=[];o[p+'_R']=[];o[p+'_N']=[]; }\n    else o[p]=[];\n  }\n  return o;\n}\nfunction getBodyMetricKey(part, side){\n  if(!BODY_PARTS[part]) return null;\n  if(!BODY_PARTS[part].hasSide) return part;\n  if(side==='L') return part+'_L';\n  if(side==='R') return part+'_R';\n  return part+'_N';\n}\nfunction getMetricLabel(key){\n  if(!key) return '';\n  if(key.endsWith('_L')) return (BODY_PARTS[key.slice(0,-2)]?.label||'')+'（左）';\n  if(key.endsWith('_R')) return (BODY_PARTS[key.slice(0,-2)]?.label||'')+'（右）';\n  if(key.endsWith('_N')) return BODY_PARTS[key.slice(0,-2)]?.label||'';\n  return BODY_PARTS[key]?.label||key;\n}\n\n\/* =========================================================\n   主题色彩\n   ========================================================= *\/\nconst THEME_KEY='weightRecordThemeConfig';\nconst PRIMARY_PRESETS=[\n  {id:'blue',  name:'蓝色', light:'#4080ff', dark:'#6699ff'},\n  {id:'green', name:'绿色', light:'#27ae60', dark:'#4cd07d'},\n  {id:'purple',name:'紫色', light:'#8b5cf6', dark:'#a78bfa'},\n  {id:'orange',name:'橙色', light:'#f0932b', dark:'#ffb057'},\n  {id:'pink',  name:'粉色', light:'#e8538f', dark:'#ff7fb2'},\n  {id:'teal',  name:'青色', light:'#0d9aa8', dark:'#2fc7d6'},\n  {id:'red',   name:'红色', light:'#e05252', dark:'#ff7878'},\n  {id:'indigo',name:'靛蓝', light:'#4a5fd6', dark:'#8a9bff'}\n];\nlet themeConfig={ primaryColor:'#4080ff', up:'#f0932b', down:'#27ae60' };\ntry{\n  const rawT=localStorage.getItem(THEME_KEY);\n  if(rawT){\n    const t=JSON.parse(rawT);\n    if(t&&typeof t==='object'){\n      if(t.primaryColor) themeConfig.primaryColor=t.primaryColor;\n      \/\/ 兼容旧版本数据\n      else if(t.primaryColorLight) themeConfig.primaryColor=t.primaryColorLight;\n      \n      if(t.up) themeConfig.up=t.up;\n      if(t.down) themeConfig.down=t.down;\n    }\n  }\n}catch(e){}\nfunction saveTheme(){ try{ localStorage.setItem(THEME_KEY, JSON.stringify(themeConfig)); }catch(e){} }\n\/* 供工作台外壳调用的对外接口 *\/\nfunction getWeightTheme(){ return { primaryColor: themeConfig.primaryColor, up: themeConfig.up, down: themeConfig.down, unit: globalUnit, dark: darkMode }; }\nfunction setWeightTheme(cfg){\n  if(!cfg) return;\n  if(cfg.primaryColor) themeConfig.primaryColor = cfg.primaryColor;\n  if(cfg.up) themeConfig.up = cfg.up;\n  if(cfg.down) themeConfig.down = cfg.down;\n  saveTheme();\n  applyTheme();\n}\nfunction getWeightUnit(){ return globalUnit; }\n\n\/* 供工作台外壳调用的添加入口 *\/\nfunction openAddWeightModal(){\n  if(currentViewUserIndex===null) return;\n  openRecordModal(null);\n}\nfunction openAddMetricModal(){\n  if(currentViewUserIndex===null) return;\n  const user=userList[currentViewUserIndex];\n  if(!user) return;\n  $('popupBodyMetricDate').value = getTodayStr();\n  $('popupBodyMetricValue').value = '';\n  const sel = $('popupBodyPartSelect');\n  if (sel) {\n    sel.value = 'waist';\n    const part = sel.value;\n    $('popupBodySideSelect').style.display = BODY_PARTS[part]?.hasSide ? 'block' : 'none';\n  }\n  if (maskBodyMetricAdd) maskBodyMetricAdd.classList.add('show');\n}\n\nfunction applyTheme(){\n  const b=document.body;\n  const currentPrimary = themeConfig.primaryColor || '#4080ff';\n  \n  b.style.setProperty('--primary', currentPrimary);\n  b.style.setProperty('--up-color', themeConfig.up);\n  b.style.setProperty('--down-color', themeConfig.down);\n\n  \/\/ 动态计算并注入四个状态色\n  function mixColor(hex1, hex2, weight) {\n    let h1 = hex1.replace('#', ''); let h2 = hex2.replace('#', '');\n    if (h1.length === 3) h1 = h1.split('').map(c => c + c).join('');\n    if (h2.length === 3) h2 = h2.split('').map(c => c + c).join('');\n    let r1 = parseInt(h1.substr(0,2),16), g1 = parseInt(h1.substr(2,2),16), b1 = parseInt(h1.substr(4,2),16);\n    let r2 = parseInt(h2.substr(0,2),16), g2 = parseInt(h2.substr(2,2),16), b2 = parseInt(h2.substr(4,2),16);\n    let r = Math.round(r1 * weight + r2 * (1 - weight));\n    let g = Math.round(g1 * weight + g2 * (1 - weight));\n    let b = Math.round(b1 * weight + b2 * (1 - weight));\n    return `rgb(${r}, ${g}, ${b})`;\n  }\n  \n  \/\/ 状态色：标准\/偏低用普通文字色，偏高\/过高用淡红色标注\n  const statusLow = 'var(--text)';\n  const statusNormal = 'var(--text)';\n  const statusHigh = '#e08a8a';\n  const statusVhigh = '#d95c5c';\n\n  b.style.setProperty('--status-color-low', statusLow);\n  b.style.setProperty('--status-color-normal', statusNormal);\n  b.style.setProperty('--status-color-high', statusHigh);\n  b.style.setProperty('--status-color-vhigh', statusVhigh);\n\n  \/\/ 同步更新 SVG 渐变颜色\n  const stops = document.querySelectorAll('#progGrad stop');\n  if(stops.length === 2){\n    stops[0].setAttribute('stop-color', currentPrimary);\n    stops[0].setAttribute('stop-opacity', '0.5');\n    stops[1].setAttribute('stop-color', currentPrimary);\n    stops[1].setAttribute('stop-opacity', '1');\n  }\n}\n\n\/* =========================================================\n   数据初始化\n   ========================================================= *\/\nconst STORAGE_KEY='weightRecordUsers';\nconst GLOBAL_UNIT_KEY='weightRecordGlobalUnit';\nconst DARK_MODE_KEY='weightRecordDarkMode';\nconst MAIN_USER_KEY='weightRecordMainUser';\nfunction getMainUserIndex(){\n  try{ const v=localStorage.getItem(MAIN_USER_KEY); return (v===null||v==='')?null:Number(v); }catch(e){ return null; }\n}\nfunction setMainUserIndex(idx){\n  try{ if(idx===null||idx===undefined) localStorage.removeItem(MAIN_USER_KEY); else localStorage.setItem(MAIN_USER_KEY, String(idx)); }catch(e){}\n}\nfunction isMainUser(idx){ return getMainUserIndex()===idx; }\nlet userList=[];\ntry{\n  const raw=localStorage.getItem(STORAGE_KEY);\n  if(raw){ const p=JSON.parse(raw); if(Array.isArray(p)) userList=p; }\n}catch(e){\n  console.warn('读取本地数据失败：',e);\n  try{\n    const rawBad=localStorage.getItem(STORAGE_KEY);\n    if(rawBad) localStorage.setItem(STORAGE_KEY+'_corrupt_'+Date.now(), rawBad);\n  }catch(_e){}\n  alert('本地数据读取失败，原始数据已另存一份副本。请先不要新建或修改数据，先导出备份。');\n  userList=[];\n}\n\nlet globalUnit='kg';\ntry{\n  const gu=localStorage.getItem(GLOBAL_UNIT_KEY);\n  if(gu==='kg'||gu==='jin') globalUnit=gu;\n}catch(e){}\n\nlet darkMode=false;\ntry{ darkMode=localStorage.getItem(DARK_MODE_KEY)==='1'; }catch(e){}\nif(darkMode) document.body.classList.add('dark');\n\nfunction setDarkMode(dark){\n  darkMode=!!dark;\n  document.body.classList.toggle('dark', darkMode);\n  try{ localStorage.setItem(DARK_MODE_KEY, darkMode?'1':'0'); }catch(e){}\n  applyTheme();\n  if(currentViewUserIndex!==null && detailPage.classList.contains('show')){\n    const tab=getActiveTab();\n    if(tab==='combined') renderCombinedTab();\n  }\n}\nfunction applyGlobalUnit(u){\n  if(u!=='kg'&&u!=='jin') return;\n  if(globalUnit===u) return;\n  globalUnit=u;\n  try{ localStorage.setItem(GLOBAL_UNIT_KEY,u); }catch(e){}\n  if(currentViewUserIndex!==null){\n    const tab=getActiveTab();\n    if(tab==='combined') renderCombinedTab();\n    else if(tab==='diet') renderDietTab();\n    if(getActiveSettingsVisible()) renderSettingsTab(true);\n    \/\/ 四张折线图的体重数值会随单位变化，重新渲染当前体重 Tab\n    if(tab==='combined' || tab==='weight') renderWeightTab();\n  }\n}\nfunction getActiveTab(){\n  const el=document.querySelector('.sidebar-nav-btn.active[data-tab]');\n  return el?el.dataset.tab:'combined';\n}\nfunction getActiveSettingsVisible(){\n  return maskSettings && maskSettings.classList.contains('show');\n}\n\nlet currentModifyIndex=null, currentViewUserIndex=null, avatarTarget=null, editMode='view';\nlet editingRecordId=null;\nlet tempAvatar={ emoji:null, bg:'#8899aa', image:null };\nlet selectedAvatar={ emoji:null, bg:'#8899aa', image:null };\nlet weekOffset=0, monthOffset=0, yearOffset=0;\nlet calYear=new Date().getFullYear(), calMonth=new Date().getMonth();\nlet currentMetricKey='neck';\nlet editingMetricKey=null, editingMetricId=null;\nlet editingWeightType=null;\nlet dietDate=getTodayStr();\nlet editingDietId=null;\nlet editingExerciseId=null;\n\nconst OLD_KEY_MAP={ armL:'arm_L', armR:'arm_R', thighL:'thigh_L', thighR:'thigh_R', calfL:'calf_L', calfR:'calf_R' };\nuserList.forEach(u=>{\n  if(!Array.isArray(u.records)) u.records=[];\n  u.records=u.records.filter(r=>r&&typeof r==='object');\n  u.records.forEach(r=>{\n    if(!r.id) r.id=genId();\n    const rw=Number(r.weight);\n    r.weight=(isFinite(rw)&&rw>0)?rw:0;\n    if(!r.date) r.date=u.startDate||getTodayStr();\n    if(!r.time) r.time='00:00';\n  });\n  const sw=Number(u.startWeight); u.startWeight=isNaN(sw)?0:sw;\n  const tw=Number(u.targetWeight); u.targetWeight=isNaN(tw)?0:tw;\n  if(u.height!==undefined && u.height!==null && u.height!==''){\n    const h=Number(u.height); u.height=isNaN(h)?null:h;\n  } else u.height=null;\n  if(!u.avatarImage) u.avatarImage=null;\n  if(!u.gender) u.gender='';\n  if(!u.birthDate) u.birthDate='';\n  if(!Array.isArray(u.bodyFatRecords)) u.bodyFatRecords=[];\n  if(!Array.isArray(u.dietRecords)) u.dietRecords=[];\n  if(!Array.isArray(u.exerciseRecords)) u.exerciseRecords=[];\n  if(!u.bodyMetrics){\n    u.bodyMetrics=emptyBodyMetrics();\n    (u.dimensionRecords||[]).forEach(r=>{\n      if(r.chest) u.bodyMetrics.chest.push({id:genId(),date:r.date,value:r.chest});\n      if(r.waist) u.bodyMetrics.waist.push({id:genId(),date:r.date,value:r.waist});\n      if(r.hip)   u.bodyMetrics.hip.push({id:genId(),date:r.date,value:r.hip});\n    });\n    delete u.dimensionRecords;\n  }\n  Object.keys(OLD_KEY_MAP).forEach(oldK=>{\n    if(u.bodyMetrics[oldK] && u.bodyMetrics[oldK].length){\n      const newK=OLD_KEY_MAP[oldK];\n      if(!u.bodyMetrics[newK]) u.bodyMetrics[newK]=[];\n      u.bodyMetrics[newK]=u.bodyMetrics[newK].concat(u.bodyMetrics[oldK]);\n    }\n    delete u.bodyMetrics[oldK];\n  });\n  const empty=emptyBodyMetrics();\n  for(const k in empty){\n    if(!Array.isArray(u.bodyMetrics[k])) u.bodyMetrics[k]=[];\n  }\n});\n\nconst emojiList=['😊','🥰','😎','🤍','💪','✨','🍃','🌿','☁️','🌸','🌼','🪴','🐱','🐶','🦋','🍀','🌙','☀️','🧘','🥗','🏃','🚴','🧊','🌱','🤎','💛','💚','💙','💜','🧡','❤️','🤖','🐰','🦊','🐻','🐼','🦁','🐯','🐨','🐸','🐵','🐔','🐧','🦄','🐝','🐢','🦖','🍎','🍊','🍋','🍉','🍇','🍓','🍒','🥝','🍍','🥭','🍑'];\n\n\/* =========================================================\n   工具\n   ========================================================= *\/\nfunction unitLabel(u){ return u==='jin'?'斤':'公斤'; }\nfunction toDisplay(kg,u){ return u==='jin'? kg*2 : kg; }\nfunction toKg(v,u){ return u==='jin'? v\/2 : v; }\nfunction fmt(v){ if(!isFinite(v)) return '--'; return (Math.round(v*10)\/10).toFixed(1); }\nfunction fmtInput(v){ if(!isFinite(v)) return ''; return String(Math.round(v*10)\/10); }\nfunction fmtNum(v,d){ const n=Number(v); if(!isFinite(n)) return '0'; const p=Math.pow(10,d||0); return String(Math.round(n*p)\/p); }\nfunction cnDate(d){ return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`; }\nfunction formatDateCn(s){\n  if(!s) return '';\n  const parts=s.split('-').map(Number);\n  if(parts.length<3) return s;\n  return `${parts[0]}年${parts[1]}月${parts[2]}日`;\n}\nfunction cnRange(s,e){\n  const y1=s.getFullYear(),m1=s.getMonth()+1,d1=s.getDate();\n  const y2=e.getFullYear(),m2=e.getMonth()+1,d2=e.getDate();\n  if(y1===y2&&m1===m2) return `${y1}年${m1}月${d1}日 - ${m2}月${d2}日`;\n  if(y1===y2) return `${y1}年${m1}月${d1}日 - ${m2}月${d2}日`;\n  return `${y1}年${m1}月${d1}日 - ${y2}年${m2}月${d2}日`;\n}\nfunction isTransparentBg(bg){ return bg==='transparent'; }\nfunction renderAvatarVisual(c,emoji,bg,size=44,image=null){\n  c.innerHTML=''; c.style.width=size+'px'; c.style.height=size+'px';\n  c.style.fontSize=Math.round(size*.5)+'px'; c.style.borderRadius='50%'; c.style.overflow='hidden';\n  if(image){\n    const img=document.createElement('img'); img.src=image;\n    img.style.cssText='width:100%;height:100%;object-fit:cover';\n    c.appendChild(img); c.style.backgroundImage='none'; c.style.backgroundColor='#ddd'; return;\n  }\n  c.innerText=emoji||'';\n  if(isTransparentBg(bg)){\n    c.style.backgroundImage='linear-gradient(45deg,#e5e5e5 25%,transparent 25%),linear-gradient(-45deg,#e5e5e5 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e5e5e5 75%),linear-gradient(-45deg,transparent 75%,#e5e5e5 75%)';\n    c.style.backgroundSize='10px 10px';\n    c.style.backgroundPosition='0 0, 0 5px, 5px -5px, -5px 0px';\n    c.style.backgroundColor='transparent';\n  } else {\n    c.style.backgroundImage='none'; c.style.backgroundSize='auto';\n    c.style.backgroundPosition='center'; c.style.backgroundColor=bg;\n  }\n}\nfunction fixDate(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; }\nfunction parseDate(s){ if(!s) return new Date(NaN); const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }\nfunction dateToStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }\nfunction getTodayStr(){ return dateToStr(new Date()); }\nfunction getNowTimeStr(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }\nfunction genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }\n\/* 把 dataURL 图片压成 maxSize 方图 JPEG，避免头像撑爆 localStorage 配额 *\/\nfunction compressImageDataUrl(dataUrl,maxSize,cb){\n  if(!dataUrl||dataUrl.indexOf('data:image')!==0){ cb(dataUrl); return; }\n  try{\n    const img=new Image();\n    img.onload=()=>{\n      try{\n        const S=maxSize||220, cv=document.createElement('canvas');\n        cv.width=S; cv.height=S;\n        const ctx=cv.getContext('2d');\n        ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,S,S);\n        const m=Math.min(img.width,img.height);\n        ctx.drawImage(img,(img.width-m)\/2,(img.height-m)\/2,m,m,0,0,S,S);\n        let out=dataUrl;\n        try{ out=cv.toDataURL('image\/jpeg',0.85); }catch(_){}\n        cb(out);\n      }catch(_){ cb(dataUrl); }\n    };\n    img.onerror=()=>cb(dataUrl);\n    img.src=dataUrl;\n  }catch(e){ cb(dataUrl); }\n}\n\/* 已存在的超大头像（>120KB）自动瘦身，避免每次保存都失败 *\/\nfunction compressOversizedAvatars(){\n  const targets=userList.filter(u=>u.avatarImage&&u.avatarImage.length>120000);\n  if(!targets.length) return;\n  let left=targets.length;\n  targets.forEach(u=>{\n    compressImageDataUrl(u.avatarImage,220,d=>{\n      u.avatarImage=d;\n      if(--left===0){ saveUsers(); if(currentViewUserIndex!==null&&userList[currentViewUserIndex]) renderCombinedTab(); }\n    });\n  });\n}\nfunction addDays(dateStr,n){ const d=parseDate(dateStr); d.setDate(d.getDate()+n); return dateToStr(d); }\nfunction saveUsers(){\n  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(userList)); return true; }\n  catch(e){\n    console.error(e);\n    const name=(e&&e.name)||'';\n    if(name==='QuotaExceededError'||e.code===22||e.code===1014){\n      let kb=0;\n      try{ kb=Math.round(new Blob([JSON.stringify(userList)]).size\/1024); }catch(_){}\n      alert('保存失败：浏览器本地存储空间已满（当前数据约 '+kb+' KB）。\\n请先到「设置 → 数据传输」导出备份，再删除体积过大的头像图片后重试。');\n    }else if(name==='SecurityError'){\n      showStorageBanner();\n    }else{\n      alert('保存失败（'+name+'）：本次修改尚未写入本地，请先导出备份。');\n    }\n    return false;\n  }\n}\n\/* 本地存储被禁用时的非阻断提示（不打断操作） *\/\nlet storageBannerShown=false;\nfunction showStorageBanner(){\n  if(storageBannerShown) return;\n  storageBannerShown=true;\n  try{\n    const d=document.createElement('div');\n    d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99999;background:#d0822e;color:#fff;font-size:13px;padding:8px 14px;text-align:center;line-height:1.5';\n    d.textContent='当前环境禁用了本地存储，本次修改刷新后会丢失。请用「启动.command」以本地服务方式打开本页面，或换用 Chrome \/ Edge。';\n    document.body.appendChild(d);\n  }catch(_){}\n}\n\n\/\/ 用户名唯一性检查\nfunction isNameTaken(name, excludeIdx){\n  const n=name.trim().toLowerCase();\n  if(!n) return false;\n  return userList.some((u,i)=> i!==excludeIdx && u.name.trim().toLowerCase()===n);\n}\n\nconst $ = id => document.getElementById(id);\nconst maskCreate=$('maskCreate'), maskEdit=$('maskEdit'), maskModify=$('maskModify');\nconst maskAvatarSelect=$('maskAvatarSelect'), maskEmojiFull=$('maskEmojiFull');\nconst maskRecord=$('maskRecord'), maskAllRecords=$('maskAllRecords');\nconst maskJumpDate=$('maskJumpDate'), maskMetricEdit=$('maskMetricEdit'), maskHealthInfo=$('maskHealthInfo');\nconst maskWeightEdit=$('maskWeightEdit'), maskDataTransfer=$('maskDataTransfer');\nconst maskPK=$('maskPK'), maskDietAdd=$('maskDietAdd'), maskExerciseAdd=$('maskExerciseAdd'), maskSettings=$('maskSettings');\nconst detailPage=$('detailPage');\n\/\/ maskBodyMetricAdd 延迟获取，因为该元素在 script 标签之后\nlet maskBodyMetricAdd = null;\n\/\/ 延迟获取，等 DOM 加载完再赋值\nconst mainEmpty=$('mainEmpty');\nconst sidebarNavBtns=document.querySelectorAll('.sidebar-nav-btn[data-tab]');\nconst emojiGrid=$('emojiGrid'), emojiFullGrid=$('emojiFullGrid');\n\/\/ detailTitleAvatar \/ detailTitleText 已从 DOM 移除，不再引用\nconst tabContents=document.querySelectorAll('.tab-content');\nconst recordList=$('recordList'), allRecordsList=$('allRecordsList');\nconst colorPicker=$('colorPicker');\n\n\/* 侧边栏功能Tab *\/\nsidebarNavBtns.forEach(b=>{\n  b.addEventListener('click',()=>{\n    if(b.disabled) return;\n    switchTab(b.dataset.tab);\n  });\n});\n\n\/* 设置面板交互：统一处理设置面板内的事件（原面板与弹窗克隆共用） *\/\nfunction rebindSettingsEvents(root){\n  const scope = root || document;\n  \n  \/\/ 绑定切换用户按钮\n  const uSelectBtn = scope.querySelector('#openUserSelect');\n  if(uSelectBtn) {\n    uSelectBtn.onclick = () => {\n      renderUserSelectList(); \n      maskUserSelect.classList.add('show');\n      \/\/ 不再关闭设置弹窗，让其保留在下方\n    };\n  }\n\n  \/\/ 绑定数据传输按钮\n  const dataTransferBtn = scope.querySelector('#openDataTransfer');\n  if(dataTransferBtn) {\n    dataTransferBtn.onclick = () => {\n      openDataTransferModal();\n    };\n  }\n\n  scope.querySelectorAll('.segment-btn[data-unit]').forEach(el=>{\n    el.onclick=()=>{\n      if (el.classList.contains('active')) return;\n      applyGlobalUnit(el.dataset.unit);\n      renderSettingsTab(getActiveSettingsVisible());\n    };\n  });\n  scope.querySelectorAll('.segment-btn[data-theme]').forEach(el=>{\n    el.onclick=()=>{\n      if (el.classList.contains('active')) return;\n      setDarkMode(el.dataset.theme==='dark');\n      renderSettingsTab(getActiveSettingsVisible());\n    };\n  });\n  const pColor = scope.querySelector('#primaryColorInput');\n  if(pColor) pColor.oninput=()=>{\n    themeConfig.primaryColor = pColor.value;\n    saveTheme(); applyTheme();\n  };\n  const upColor = scope.querySelector('#upColorInput');\n  if(upColor) upColor.oninput=()=>{\n    themeConfig.up=upColor.value;\n    saveTheme(); applyTheme();\n  };\n  const downColor = scope.querySelector('#downColorInput');\n  if(downColor) downColor.oninput=()=>{\n    themeConfig.down=downColor.value;\n    saveTheme(); applyTheme();\n  };\n}\nrebindSettingsEvents(document);\n\n\/* 顶部图标列事件 *\/\n\n\/* 点击主页的头像\/名字区域，直接打开“个人信息”修改弹窗 *\/\n$('topUserInfoClickArea').onclick = () => {\n  if(currentViewUserIndex!==null && currentViewUserIndex!==undefined){\n    openModifyModal(currentViewUserIndex);\n  }\n};\n$('closeSettingsModal').onclick=()=>maskSettings.classList.remove('show');\nmaskSettings.onclick=e=>{ if(e.target===maskSettings) maskSettings.classList.remove('show'); };\n\n\n\/\/ 统一打开数据传输弹窗：重置导入\/导出状态\nfunction openDataTransferModal(mode){\n  mode = mode || 'full';\n  $('transferResultView').style.display='none';\n  \/\/ 清空文件选择\n  $('importDataFile').value = '';\n  $('importFileNameLabel').textContent = 'JSON 格式';\n  \/\/ 填充导出用户下拉框\n  const sel = $('inpExportUser');\n  sel.innerHTML = '<option value=\"\">选择要导出的用户<\/option>';\n  userList.forEach((u, i) => {\n    const opt = document.createElement('option');\n    opt.value = i;\n    opt.textContent = u.name;\n    sel.appendChild(opt);\n  });\n  sel.value = '';\n  \/\/ 两个按钮默认置灰\n  $('btnImportData').disabled = true;\n  $('btnExportData').disabled = true;\n  \/\/ 仅导入模式：隐藏导出区与导出按钮\n  const onlyImport = (mode === 'import');\n  $('exportSection').style.display = onlyImport ? 'none' : '';\n  $('btnExportData').style.display = onlyImport ? 'none' : '';\n  maskDataTransfer.classList.add('show');\n}\n\n\/\/ 外部空状态触发的导入（仅显示导入功能）\nfunction triggerStandaloneImport() {\n  openDataTransferModal('import');\n}\n\n\/\/ 用户选择弹窗里的「导入用户数据」按钮\n$('openImportUser').onclick = () => {\n  maskUserSelect.classList.remove('show');\n  triggerStandaloneImport();\n};\n\n\/\/ 用户选择弹窗里的「设置为主用户」按钮\n$('setMainUser').onclick = () => {\n  if(currentViewUserIndex===null){ alert('请先选择一个用户'); return; }\n  setMainUserIndex(currentViewUserIndex);\n  renderUserSelectList();\n  renderCombinedTab();\n};\n\n\/\/ 👇 让取消按钮和点击遮罩层起作用 👇\n$('cancelTransfer').onclick = () => maskDataTransfer.classList.remove('show');\nmaskDataTransfer.onclick = e => { if(e.target === maskDataTransfer) maskDataTransfer.classList.remove('show'); };\n$('closeTransferResult').onclick=()=>maskDataTransfer.classList.remove('show');\n\n\/\/ 选择导出用户后激活导出按钮\n$('inpExportUser').onchange=()=>{\n  $('btnExportData').disabled = !$('inpExportUser').value;\n};\n\n\/\/ 导出逻辑\n$('btnExportData').onclick=()=>{\n  const selVal = $('inpExportUser').value;\n  \n  \/\/ 新增：如果没有选择，弹窗提示并中断\n  if(!selVal){\n    alert('请先选择要导出的用户！');\n    return;\n  }\n\n  let exportUsers = [];\n  let fileName = '';\n  \n  const idx = Number(selVal);\n  const u = userList[idx];\n  if(!u) {\n    alert('未找到该用户，请重新选择');\n    return;\n  }\n  exportUsers = [u];\n  fileName = `小园丁体重管理_备份_${u.name}.json`;\n  \n  try{\n    const data = {\n      app:'小园丁体重管理',\n      version:1,\n      exportedAt:new Date().toISOString(),\n      users:exportUsers\n    };\n    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application\/json'});\n    const url=URL.createObjectURL(blob);\n    const a=document.createElement('a');\n    a.href=url;\n    a.download=fileName;\n    document.body.appendChild(a);\n    a.click();\n    document.body.removeChild(a);\n    setTimeout(()=>URL.revokeObjectURL(url),1000);\n    maskDataTransfer.classList.remove('show');\n  }catch(e){\n    alert('导出失败：'+e.message);\n  }\n};\n\n\n\/\/ 修复点击无反应：在此处统一绑定点击和变更事件\n$('btnSelectImportFile').onclick=()=>{\n  $('importDataFile').click();\n};\n\n\/\/ 选中文件后，更新右侧的文字为文件名，并激活导入按钮\n$('importDataFile').onchange=(e)=>{\n  const f=e.target.files[0];\n  if(f){\n    $('importFileNameLabel').textContent = f.name;\n    $('btnImportData').disabled = false;\n  } else {\n    $('importFileNameLabel').textContent = 'JSON 格式';\n    $('btnImportData').disabled = true;\n  }\n};\n\n\/\/ 点击【导入】按钮时，读取并解析已选择的 JSON 文件\n$('btnImportData').onclick=()=>{\n  const f = $('importDataFile').files[0];\n  if(!f){\n    alert('请先点击上方【选择文件】按钮选择 JSON 备份文件！');\n    return;\n  }\n  \n  const reader=new FileReader();\n  reader.onload=ev=>{\n    let data;\n    try{\n      data=JSON.parse(ev.target.result);\n    }catch(err){\n      alert('文件格式错误：不是有效的 JSON 文件');\n      return;\n    }\n    \n    let importUsers = [];\n    if(Array.isArray(data)) importUsers = data;\n    else if(data && Array.isArray(data.users)) importUsers = data.users;\n    \n    if(importUsers.length === 0){\n      alert('文件内容不正确：未找到用户数据');\n      return;\n    }\n    \n    let addedCount = 0;\n    let renamedCount = 0;\n    let firstImportedIndex = userList.length;\n    \n    importUsers.forEach(u=>{\n      if(!Array.isArray(u.records)) u.records=[];\n      const sw=Number(u.startWeight); u.startWeight=isNaN(sw)?0:sw;\n      const tw=Number(u.targetWeight); u.targetWeight=isNaN(tw)?0:tw;\n      if(u.height!==undefined && u.height!==null && u.height!==''){\n        const h=Number(u.height); u.height=isNaN(h)?null:h;\n      } else u.height=null;\n      if(!u.avatarImage) u.avatarImage=null;\n      if(!u.gender) u.gender='';\n      if(!u.birthDate) u.birthDate='';\n      if(!Array.isArray(u.bodyFatRecords)) u.bodyFatRecords=[];\n      if(!Array.isArray(u.dietRecords)) u.dietRecords=[];\n      if(!Array.isArray(u.exerciseRecords)) u.exerciseRecords=[];\n      if(!u.bodyMetrics) u.bodyMetrics=emptyBodyMetrics();\n      const empty=emptyBodyMetrics();\n      for(const k in empty){\n        if(!Array.isArray(u.bodyMetrics[k])) u.bodyMetrics[k]=[];\n      }\n      u.id = genId();\n      \n      let originalName = u.name || '未知用户';\n      let finalName = originalName;\n      let counter = 1;\n      while(userList.some(existUser => existUser.name === finalName)){\n        finalName = originalName + '(导入' + (counter > 1 ? counter : '') + ')';\n        counter++;\n      }\n      if(finalName !== originalName) renamedCount++;\n      u.name = finalName;\n      \n      userList.push(u);\n      addedCount++;\n    });\n    \n    saveUsers();\n    \n    \/\/ 强制关闭所有弹窗\n    maskDataTransfer.classList.remove('show');\n    \/\/ 清理文件状态\n    $('importDataFile').value = '';\n    $('importFileNameLabel').textContent = 'JSON 格式';\n    \/\/ 导入按钮复位为禁用\n    $('btnImportData').disabled = true;\n    \n    renderSidebarUsers();\n    \n    if (addedCount > 0) {\n      openUserDetail(firstImportedIndex);\n      setTimeout(() => {\n        let msg = `成功导入了 ${addedCount} 个用户及其全部数据。`;\n        if(renamedCount > 0) msg += `\\n检测到有 ${renamedCount} 个重名用户，已自动添加后缀区分。`;\n        alert(msg);\n      }, 150);\n    }\n  };\n  reader.readAsText(f,'utf-8');\n};\n\nfunction renderSettingsTab(intoModal){\n  \/\/ 更新单位分段按钮的选中状态\n  document.querySelectorAll('.segment-btn[data-unit]').forEach(el=>{\n    el.classList.toggle('active', el.dataset.unit===globalUnit);\n  });\n  \n  \/\/ 更新模式分段按钮的选中状态\n  const cur=document.body.classList.contains('dark')?'dark':'light';\n  document.querySelectorAll('.segment-btn[data-theme]').forEach(el=>{\n    el.classList.toggle('active', el.dataset.theme===cur);\n  });\n\n  \/\/ 更新颜色选择器的值\n  $('primaryColorInput').value = themeConfig.primaryColor || '#4080ff';\n  $('upColorInput').value=themeConfig.up;\n  $('downColorInput').value=themeConfig.down;\n\n  if(intoModal){\n    \/\/ 将设置面板整体复制到弹窗中（只复制内容，不复制外层 trend-block 容器样式）\n    const src=document.getElementById('tab-settings');\n    const dst=$('settingsModalBody');\n    dst.innerHTML='';\n    if(src){\n      const clone=src.cloneNode(true);\n      clone.removeAttribute('id');\n      clone.className='';\n      clone.style.display='block';\n      dst.appendChild(clone);\n      \/\/ 重新绑定 clone 内的事件\n      rebindSettingsEvents(dst);\n    }\n  }\n}\n\/* 颜色输入事件已由 rebindSettingsEvents() 统一绑定 *\/\n\n\/* =========================================================\n   头像\n   ========================================================= *\/\nfunction renderAvatarPreviewBig(){\n  const el=$('avatarPreviewBig'); el.innerHTML=''; el.style.borderRadius='50%'; el.style.overflow='hidden';\n  if(tempAvatar.image){\n    const img=document.createElement('img'); img.src=tempAvatar.image;\n    img.style.cssText='width:100%;height:100%;object-fit:cover';\n    el.appendChild(img); el.style.background='#ddd'; return;\n  }\n  el.style.background='';\n  renderAvatarVisual(el, tempAvatar.emoji, tempAvatar.bg, 84);\n}\nfunction renderFormAvatarPreview(){\n  const dom=avatarTarget==='create'?$('btnCreateAvatar'):$('btnModAvatar');\n  const hasAny=selectedAvatar.emoji || selectedAvatar.image || !isTransparentBg(selectedAvatar.bg);\n  if(hasAny){\n    dom.textContent=''; dom.style.display='inline-flex'; dom.style.alignItems='center'; dom.style.gap='10px';\n    let a=dom.querySelector('.form-avatar-preview');\n    if(!a){ a=document.createElement('div'); a.className='form-avatar-preview'; dom.appendChild(a); }\n    renderAvatarVisual(a, selectedAvatar.emoji, selectedAvatar.bg, 52, selectedAvatar.image);\n  } else {\n    dom.innerHTML='自定义头像'; dom.style.display=''; dom.style.alignItems=''; dom.style.gap='';\n  }\n}\nfunction buildAvatarPanel(){\n  emojiGrid.innerHTML='';\n  emojiList.slice(0,23).forEach(e=>{\n    const s=document.createElement('div'); s.className='emoji-item'; s.textContent=e;\n    if(tempAvatar.emoji===e) s.classList.add('active');\n    s.onclick=()=>{ tempAvatar.emoji=e; tempAvatar.image=null; buildAvatarPanel(); renderAvatarPreviewBig(); };\n    emojiGrid.appendChild(s);\n  });\n  const m=document.createElement('div'); m.className='emoji-item more-btn'; m.textContent='更多';\n  m.onclick=()=>{ buildEmojiFullGrid(); maskEmojiFull.classList.add('show'); };\n  emojiGrid.appendChild(m);\n  if(!isTransparentBg(tempAvatar.bg)) colorPicker.value=tempAvatar.bg;\n  renderAvatarPreviewBig();\n}\nfunction buildEmojiFullGrid(){\n  emojiFullGrid.innerHTML='';\n  emojiList.forEach(e=>{\n    const s=document.createElement('div'); s.className='emoji-item'; s.textContent=e;\n    if(tempAvatar.emoji===e) s.classList.add('active');\n    s.onclick=()=>{ tempAvatar.emoji=e; tempAvatar.image=null; buildEmojiFullGrid(); buildAvatarPanel(); maskEmojiFull.classList.remove('show'); };\n    emojiFullGrid.appendChild(s);\n  });\n}\n$('closeEmojiFull').onclick=()=>maskEmojiFull.classList.remove('show');\nmaskEmojiFull.onclick=e=>{ if(e.target===maskEmojiFull) maskEmojiFull.classList.remove('show'); };\n$('openColorPicker').onclick=(e) => {\n  e.preventDefault();\n  \/\/ 移动端兼容写法\n  if (colorPicker.showPicker) {\n    colorPicker.showPicker();\n  } else {\n    colorPicker.click();\n  }\n};\ncolorPicker.oninput=()=>{ tempAvatar.bg=colorPicker.value; renderAvatarPreviewBig(); };\n$('clearEmoji').onclick=()=>{ tempAvatar.emoji=null; buildAvatarPanel(); renderAvatarPreviewBig(); };\n$('uploadAvatarBtn').onclick=()=>$('avatarFileInput').click();\n$('avatarFileInput').onchange=(e)=>{\n  const f=e.target.files[0]; if(!f) return;\n  const r=new FileReader();\n  r.onload=ev=>{ compressImageDataUrl(ev.target.result,220,d=>{ tempAvatar.image=d; renderAvatarPreviewBig(); }); };\n  r.readAsDataURL(f); e.target.value='';\n};\n$('clearUploadImg').onclick=()=>{ tempAvatar.image=null; renderAvatarPreviewBig(); };\n$('confirmAvatar').onclick=()=>{ selectedAvatar={...tempAvatar}; maskAvatarSelect.classList.remove('show'); renderFormAvatarPreview(); };\n$('closeAvatarModal').onclick=()=>{ tempAvatar={...selectedAvatar}; maskAvatarSelect.classList.remove('show'); };\n$('btnCreateAvatar').onclick=()=>{ avatarTarget='create'; tempAvatar={...selectedAvatar}; buildAvatarPanel(); maskAvatarSelect.classList.add('show'); };\n$('btnModAvatar').onclick=()=>{ avatarTarget='modify'; tempAvatar={...selectedAvatar}; buildAvatarPanel(); maskAvatarSelect.classList.add('show'); };\n\n\/* =========================================================\n   首页 & 详情页\n   ========================================================= *\/\nfunction renderSidebarUsers(){\n  renderUserSelectList();\n}\nfunction renderUserSelectList(){\n  const box=$('userSelectList');\n  if(!box) return;\n  box.innerHTML='';\n  if(userList.length===0){\n    box.innerHTML='<div class=\"empty-tip\" style=\"padding:16px 0;font-size:13px;\">暂无用户，请点击下方「创建用户」<\/div>';\n    return;\n  }\n  \n  \/\/ 根据 editMode 来控制底部按钮组的显示\n  const defaultActions = $('userSelectDefaultActions');\n  const editActions = $('userSelectEditActions');\n  if (defaultActions && editActions) {\n    if (editMode === 'view') {\n      defaultActions.style.display = 'flex';\n      editActions.style.display = 'none';\n      box.style.maxHeight = '50vh';\n    } else {\n      defaultActions.style.display = 'none';\n      editActions.style.display = 'flex';\n      box.style.maxHeight = '45vh';\n    }\n  }\n\n  userList.forEach((u,idx)=>{\n    const row=document.createElement('div');\n    \/\/ 如果是编辑\/排序模式，去掉点击选中当前用户的高亮\n    const isCurrent = (currentViewUserIndex===idx && editMode==='view');\n    row.className='user-select-item'+(isCurrent?' current':'');\n    \n    const left = document.createElement('div');\n    left.style.cssText = 'display:flex; align-items:center; gap:10px; flex:1; min-width:0;';\n    const av=document.createElement('div'); av.className='avatar';\n    renderAvatarVisual(av,u.avatarEmoji,u.avatarBg,34,u.avatarImage);\n    const nm=document.createElement('span'); nm.className='user-select-name'; nm.textContent=u.name;\n    left.appendChild(av); left.appendChild(nm);\n    if(isMainUser(idx)){\n      const mt=document.createElement('span'); mt.className='main-user-tag'; mt.textContent='主用户';\n      left.appendChild(mt);\n    }\n    \n    if (editMode === 'delete') {\n      const delBtn = document.createElement('button'); \n      delBtn.className='del-inline-btn'; \n      delBtn.textContent='删除';\n      delBtn.onclick = (e) => {\n        e.stopPropagation();\n        if(confirm(`确认删除用户[${u.name}]？删除后所有记录会全部清除！`)){\n          userList.splice(idx,1); saveUsers();\n          if (userList.length === 0) {\n            currentViewUserIndex = null;\n            try{ localStorage.removeItem('weightRecordLastUser'); }catch(e){}\n            closeUserSelectAndReset();\n            renderCombinedTab();\n          } else {\n            if(currentViewUserIndex === idx){\n              openUserDetail(0);\n            } else if(currentViewUserIndex !== null && currentViewUserIndex > idx){\n              openUserDetail(currentViewUserIndex - 1);\n            }\n            renderUserSelectList();\n          }\n        }\n      };\n      row.appendChild(left);\n      row.appendChild(delBtn);\n    } else {\n      \/\/ 正常模式\n      if(isCurrent){\n        const tag=document.createElement('span'); tag.className='user-select-tag'; tag.textContent='当前用户';\n        row.appendChild(left); row.appendChild(tag);\n      } else {\n        row.appendChild(left);\n      }\n      row.onclick=()=>{\n        openUserDetail(idx);\n        maskUserSelect.classList.remove('show'); \n      };\n    }\n    box.appendChild(row);\n  });\n}\nfunction openUserDetail(idx){\n  currentViewUserIndex=idx;\n  try{ localStorage.setItem('weightRecordLastUser', String(idx)); }catch(e){}\n  const u=userList[idx]; if(!u) return;\n  \n  \/\/ 1. 侧边栏高亮刷新\n  renderSidebarUsers();\n  \n  \/\/ 2. 激活功能Tab\n  sidebarNavBtns.forEach(b=>b.disabled=false);\n  \n  \/\/ 3. 显示主内容，隐藏空提示\n  if(mainEmpty) mainEmpty.style.display='none';\n  detailPage.classList.add('show');\n  \n  \/\/ 4. 重置各类时间偏移和状态\n  weekOffset=0; monthOffset=0; yearOffset=0;\n  calYear=new Date().getFullYear(); calMonth=new Date().getMonth();\n  dietDate=getTodayStr();\n  \n  \/\/ 5. 确定当前应该激活的 Tab\n  let activeTab=getActiveTab();\n  if(!activeTab || !['combined','diet'].includes(activeTab)) activeTab='combined';\n  \n  sidebarNavBtns.forEach(b=>{\n    b.classList.toggle('active', b.dataset.tab===activeTab);\n  });\n\n  \/\/ 【核心修复1】：无论当前在哪个 Tab，都必须先把“体重”面板显示出来，让容器有宽度，保证图表能正确渲染！\n  tabContents.forEach(c=>{\n    c.classList.toggle('show', c.id==='tab-combined');\n  });\n\n  \/\/ 【核心修复2】：手动直接调用各个子渲染函数，彻底切断对旧数据的依赖\n  $('userCardEmpty').style.display = 'none';\n  $('userCardHasData').style.display = 'flex';\n  \n  \/\/ 更新顶部用户卡片信息\n  const tAvatar=$('topUserAvatar');\n  if(tAvatar){\n    renderAvatarVisual(tAvatar,u.avatarEmoji,u.avatarBg,52,u.avatarImage);\n    tAvatar.style.cursor='pointer';\n    tAvatar.onclick=(e)=>{\n      e.stopPropagation();\n      openModifyModal(idx);\n    };\n  }\n  const tName=$('topUserName');\n  if(tName){\n    tName.innerHTML = u.name + (isMainUser(idx) ? ' <span class=\"main-user-tag\">主用户<\/span>' : '');\n    tName.style.cursor='pointer';\n    tName.onclick=(e)=>{\n      e.stopPropagation();\n      openModifyModal(idx);\n    };\n  }\n  if ($('calendarSingle')) $('calendarSingle').style.display = 'block';\n\n  \/\/ 确保PK按钮显示且层级靠前\n  $('openPKBtn').style.display = 'flex';\n  $('openPKBtn').style.zIndex = '10';\n\n  \/\/ 严格按照顺序，传入新用户 u 的数据进行渲染：\n  renderWeightTab();                                                \/\/ 顶部数据、环形进度、身体围度、体重历史\n  renderCalendarSingle(u, globalUnit, unitLabel(globalUnit));       \/\/ 体重日历\n  renderOverallChart(u, globalUnit, unitLabel(globalUnit));         \/\/ 计划周期图表\n  renderWeekChart(u, globalUnit, unitLabel(globalUnit));            \/\/ 每周图表\n  renderMonthChart(u, globalUnit, unitLabel(globalUnit));           \/\/ 每月图表\n  renderYearChart(u, globalUnit, unitLabel(globalUnit));            \/\/ 每年图表\n\n  \/\/ 6. 如果目标 Tab 不是体重，再把面板切回去，并渲染对应内容\n  if(activeTab !== 'combined'){\n    tabContents.forEach(c=>{\n      c.classList.toggle('show', c.id===`tab-${activeTab}`);\n    });\n    if(activeTab === 'diet') renderDietTab();\n  }\n  \n  \/\/ 7. 关闭弹窗并刷新列表\n  renderUserSelectList();\n  maskUserSelect.classList.remove('show');\n}\n\nfunction switchTab(k){\n  \/\/ 无论当前有没有用户，都强制更新按钮样式和面板显示\n  sidebarNavBtns.forEach(b=>{\n    b.classList.toggle('active', b.dataset.tab===k);\n  });\n  \/\/ 先把目标面板显示出来，再渲染，保证图表容器宽度有效\n  tabContents.forEach(c=>c.classList.toggle('show', c.id===`tab-${k}`));\n\n  \/\/ 强制渲染对应内容\n  if(k==='combined') renderCombinedTab();\n  else if(k==='diet') renderDietTab();\n}\n\n\/* =========================================================\n   记录 & 计算工具\n   ========================================================= *\/\nfunction getSortedRecords(user){\n  const arr=Array.isArray(user.records)?[...user.records]:[];\n  arr.sort((a,b)=>{\n    const ka=(a.date||'')+' '+(a.time||'00:00');\n    const kb=(b.date||'')+' '+(b.time||'00:00');\n    return ka<kb?-1:ka>kb?1:0;\n  });\n  return arr;\n}\nfunction getCurrentWeight(user){\n  const r=getSortedRecords(user);\n  for(let i=r.length-1;i>=0;i--){\n    const w=Number(r[i].weight);\n    if(isFinite(w)&&w>0) return w;\n  }\n  return Number(user.startWeight)||0;\n}\nfunction getRecordDiffMap(user){\n  const recs=getSortedRecords(user);\n  const map={}; const startW=Number(user.startWeight)||0;\n  for(let i=0;i<recs.length;i++){\n    const refW=(i===0)?startW:Number(recs[i-1].weight);\n    const d=Number(recs[i].weight)-refW;\n    let dir='same';\n    if(d>0.05) dir='up'; else if(d<-0.05) dir='down';\n    map[recs[i].id]={ diff:d, dir, isFirst:i===0 };\n  }\n  return map;\n}\nfunction calcAge(birthDate){\n  if(!birthDate) return null;\n  const b=parseDate(birthDate); if(isNaN(b.getTime())) return null;\n  const today=new Date();\n  let age=today.getFullYear()-b.getFullYear();\n  const m=today.getMonth()-b.getMonth();\n  if(m<0||(m===0&&today.getDate()<b.getDate())) age--;\n  return (age>=0&&age<=150)?age:null;\n}\nfunction calcBMR(user){\n  const h=Number(user.height)||0;\n  const w=getCurrentWeight(user)||0;\n  const g=user.gender;\n  const age=calcAge(user.birthDate);\n  if(!h||!w||!g||age===null) return null;\n  const base=10*w+6.25*h-5*age;\n  return g==='male'? base+5 : base-161;\n}\nfunction getBMRLevel(bmr) {\n  if (bmr === null) return null;\n  \/\/ BMR 的正常范围是 ±10%，我们以此为基准设定档位\n  return { level: '标准', cls: 'bf-normal' }; \n}\nfunction calcBodyFatFromBMI(user){\n  const h=Number(user.height)||0;\n  const w=getCurrentWeight(user)||0;\n  const g=user.gender;\n  const age=calcAge(user.birthDate);\n  if(!h||!w||!g||age===null) return null;\n  const bmi=w\/Math.pow(h\/100,2);\n  const sex=g==='male'?1:0;\n  const bf=1.2*bmi+0.23*age-10.8*sex-5.4;\n  if(bf<0||bf>70) return null;\n  return bf;\n}\nfunction getBodyFatInfo(user){\n  const auto=calcBodyFatFromBMI(user);\n  if(auto!==null) return { value:auto, auto:true };\n  const recs=user.bodyFatRecords||[];\n  if(recs.length>0){\n    const last=[...recs].sort((a,b)=> a.date<b.date?-1:1).pop();\n    return { value:Number(last.value), auto:false };\n  }\n  return null;\n}\nfunction bodyFatLevel(v, gender){\n  if(gender === 'female'){\n    if(v < 20) return { level:'偏低', cls:'bf-low' };\n    if(v <= 30) return { level:'标准', cls:'bf-normal' };\n    if(v <= 35) return { level:'偏高', cls:'bf-high' };\n    return { level:'过高', cls:'bf-vhigh' };\n  } else {\n    if(v < 10) return { level:'偏低', cls:'bf-low' };\n    if(v <= 20) return { level:'标准', cls:'bf-normal' };\n    if(v <= 25) return { level:'偏高', cls:'bf-high' };\n    return { level:'过高', cls:'bf-vhigh' };\n  }\n}\nfunction bmiLevel(bmi){\n  if(bmi<18.5) return { level:'偏低', cls:'bf-low' };\n  if(bmi<24) return { level:'标准', cls:'bf-normal' };\n  if(bmi<28) return { level:'偏高', cls:'bf-high' };\n  return { level:'过高', cls:'bf-vhigh' };\n}\n\n\/* =========================================================\n   体重 Tab\n   ========================================================= *\/\nfunction renderWeightTab(){\n  const idx=currentViewUserIndex; if(idx===null||!userList[idx]) return;\n  const user=userList[idx]; const unit=globalUnit; const ul=unitLabel(unit);\n  const startW=Number(user.startWeight)||0, targetW=Number(user.targetWeight)||0;\n  const currentW=getCurrentWeight(user);\n\n  $('ovStart').textContent=fmt(toDisplay(startW,unit));\n  $('ovStartUnit').textContent=ul;\n  $('ovCurrent').textContent=fmt(toDisplay(currentW,unit));\n  $('ovCurrentUnit').textContent=ul;\n  $('ovTarget').textContent=fmt(toDisplay(targetW,unit));\n  $('ovTargetUnit').textContent=ul;\n\n  const startD=parseDate(user.startDate);\n  const today=new Date(); today.setHours(0,0,0,0);\n  let days=0;\n  if(!isNaN(startD.getTime())){ days=Math.floor((today-startD)\/86400000); if(days<0) days=0; }\n  $('statDays').textContent=`减重第 ${days} 天`;\n\n  const recs=getSortedRecords(user);\n  const lastRec=recs.length?recs[recs.length-1]:null;\n  const endD=lastRec?parseDate(lastRec.date):startD;\n  const weeks=(!isNaN(startD.getTime())&&!isNaN(endD.getTime()))?(endD-startD)\/(7*86400000):0;\n  const lost=startW-currentW;\n  const remain=Math.abs(currentW-targetW);\n  let speed=null;\n  if(weeks>0.02) speed=lost\/weeks;\n\n  renderStatViz(user, unit, ul, speed, remain);\n\n  const changeEl=$('statBodyChange');\n  const lostDisp=toDisplay(lost,unit);\n  const lostRounded=Math.round(lostDisp*10)\/10;\n  if(Math.abs(lostRounded)<0.05){\n    changeEl.textContent=`0 ${ul}`;\n    changeEl.style.color='var(--same-color)';\n  } else if(lostRounded>0){\n    changeEl.textContent=`-${fmt(Math.abs(lostRounded))} ${ul}`;\n    changeEl.style.color='var(--down-color)';\n  } else {\n    changeEl.textContent=`+${fmt(Math.abs(lostRounded))} ${ul}`;\n    changeEl.style.color='var(--up-color)';\n  }\n\n  $('statRemain').textContent= remain<=0.05?'已达成 🎉':fmt(toDisplay(remain,unit))+' '+ul;\n\n  renderBodyMetricsSection(user, unit, ul);\n  renderRecordList(user, unit, ul);\n}\n\n\/* =========================================================\n   综合页渲染（合并 记录 + 趋势）\n   仅做调度，复用既有子渲染函数，不新增计算逻辑\n   ========================================================= *\/\nfunction renderCombinedTab(){\n  const idx=currentViewUserIndex; \n  \n  \/\/ 如果当前没有用户数据\n  if(idx===null || !userList[idx]){\n    $('openPKBtn').style.display = 'none'; \/\/ 隐藏PK按钮\n    $('userCardEmpty').style.display = 'flex';\n    $('userCardHasData').style.display = 'none';\n    \n    \/\/ 1. 清空上方基本卡片\n    $('ovStart').textContent = '--'; $('ovStartUnit').textContent = '';\n    $('ovCurrent').textContent = '--'; $('ovCurrentUnit').textContent = '';\n    $('ovTarget').textContent = '--'; $('ovTargetUnit').textContent = '';\n    \n    \/\/ 2. 清空减重进展环和文字\n    $('vizProgressPct').textContent = '0%';\n    $('vizProgressRing').setAttribute('stroke-dashoffset', '245.0');\n    $('vizSpeedInner').innerHTML = '';\n    $('ovStart').textContent = '--'; $('ovStartUnit').textContent = '';\n    $('ovCurrent').textContent = '--'; $('ovCurrentUnit').textContent = '';\n    $('ovTarget').textContent = '--'; $('ovTargetUnit').textContent = '';\n    $('statDays').textContent = '减重第 0 天';\n    $('statBodyChange').textContent = '--';\n    $('statRemain').textContent = '--';\n    $('vizETA').textContent = '--';\n\n    \/\/ 3. 重置日历为当前月并正常显示（无体重数据）\n    const now = new Date();\n    calYear = now.getFullYear();\n    calMonth = now.getMonth();\n    \n    $('calTitle').textContent = `${calYear}年${calMonth + 1}月`;\n    if ($('calendarSingle')) $('calendarSingle').style.display = 'block';\n    \n    \/\/ 构造一个没有任何记录的假用户对象，复用现有日历渲染逻辑\n    const emptyUser = {\n      startDate: '2000-01-01',\n      targetDate: '2000-01-01',\n      records: []\n    };\n    renderCalendarSingle(emptyUser, globalUnit, unitLabel(globalUnit));\n    \n    \/\/ 4. 清空体重历史\n    $('recordList').innerHTML = '<div class=\"empty-tip\">暂无体重记录<\/div>';\n    \n    \/\/ 5. 清空右侧 4 张图表及分析标签，并隐藏外框\n    $('overallRange').textContent = '';\n    $('chartOverall').innerHTML = '<div class=\"empty-tip\" style=\"padding:20px 0;\">暂无数据<\/div>'; \n    $('stageOverall').innerHTML = '';\n    $('chartWeek').innerHTML = '<div class=\"empty-tip\" style=\"padding:20px 0;\">暂无数据<\/div>';\n    $('stageWeek').innerHTML = '';\n    $('chartMonth').innerHTML = '<div class=\"empty-tip\" style=\"padding:20px 0;\">暂无数据<\/div>'; \n    $('stageMonth').innerHTML = '';\n    $('chartYear').innerHTML = '<div class=\"empty-tip\" style=\"padding:20px 0;\">暂无数据<\/div>'; \n    $('stageYear').innerHTML = '';\n    \n    \/\/ 6. 清空身体围度与指数\n    $('bodyFigure').innerHTML = '<svg viewBox=\"0 0 100 200\" preserveAspectRatio=\"xMidYMid meet\" xmlns=\"http:\/\/www.w3.org\/2000\/svg\" style=\"opacity:0.15;width:100%;height:100%;\"><circle cx=\"50\" cy=\"22\" r=\"11\" fill=\"var(--text)\"\/><rect x=\"46\" y=\"33\" width=\"8\" height=\"9\" fill=\"var(--text)\" rx=\"2\"\/><path d=\"M 50 42 C 30 50 30 70 32 90 C 34 110 30 128 30 140 L 70 140 C 70 128 66 110 68 90 C 70 70 70 50 50 42 Z\" fill=\"var(--text)\"\/><\/svg>';\n    $('topInfoCol3').innerHTML = `\n      <div class=\"top-info-item\"><span class=\"top-info-label\">性别<\/span><span class=\"top-info-value\">--<\/span><\/div>\n      <div class=\"top-info-item\"><span class=\"top-info-label\">年龄<\/span><span class=\"top-info-value\">--<\/span><\/div>\n      <div class=\"top-info-item\"><span class=\"top-info-label\">身高<\/span><span class=\"top-info-value\">--<\/span><\/div>\n      <div class=\"top-info-item\"><span class=\"top-info-label\">体重<\/span><span class=\"top-info-value\">--<\/span><\/div>\n    `;\n    $('topInfoCol1').innerHTML = `\n      <div class=\"top-info-item\"><span class=\"top-info-label\">基础代谢<\/span><span class=\"top-info-value\">--<\/span><\/div>\n      <div class=\"top-info-item\"><span class=\"top-info-label\">BMI<\/span><span class=\"top-info-value\">--<\/span><\/div>\n      <div class=\"top-info-item\"><span class=\"top-info-label\">体脂率<\/span><span class=\"top-info-value\">--<\/span><\/div>\n      <div class=\"top-info-item\"><span class=\"top-info-label\">腰臀比<\/span><span class=\"top-info-value\">--<\/span><\/div>\n    `;\n\n    $('bodyShapeLabel').textContent = '';\n    if($('metricHistoryList')) $('metricHistoryList').innerHTML = '';\n    \n    return; \/\/ 终止执行\n  }\n\n  \/\/ 如果有用户，正常显示\n  $('openPKBtn').style.display = 'flex'; \/\/ 显示PK按钮\n  $('userCardEmpty').style.display = 'none';\n  $('userCardHasData').style.display = 'flex';\n  \n  const user=userList[idx];\n  const unit=globalUnit, ul=unitLabel(unit);\n\n  \/\/ 顶部用户卡片\n  const tAvatar=$('topUserAvatar');\n  if(tAvatar) renderAvatarVisual(tAvatar,user.avatarEmoji,user.avatarBg,52,user.avatarImage);\n  const tName=$('topUserName');\n  if(tName) {\n    tName.innerHTML = user.name + (isMainUser(currentViewUserIndex) ? ' <span class=\"main-user-tag\">主用户<\/span>' : '');\n    tName.style.cursor='pointer';\n    tName.onclick=(e)=>{\n      e.stopPropagation();\n      openModifyModal(currentViewUserIndex);\n    };\n  }\n  const tAvatarClick=$('topUserAvatar');\n  if(tAvatarClick){\n    tAvatarClick.style.cursor='pointer';\n    tAvatarClick.onclick=(e)=>{\n      e.stopPropagation();\n      openModifyModal(currentViewUserIndex);\n    };\n  }\n\n  \/\/ 1) 顶部三卡片 + 环形进度 + 身体变化\/剩余\/ETA\n  renderWeightTab();   \/\/ 内含 renderStatViz + 卡片填充 + 围度 + 体重历史\n\n  \/\/ 2) 日历\n  renderCalendarSingle(user, unit, ul);\n\n  \/\/ 3) 4 张图表\n  renderOverallChart(user, unit, ul);\n  renderWeekChart(user, unit, ul);\n  renderMonthChart(user, unit, ul);\n  renderYearChart(user, unit, ul);\n}\n\nfunction renderStatViz(user, unit, ul, speed, remain){\n  const startW=Number(user.startWeight)||0, targetW=Number(user.targetWeight)||0;\n  const currentW=getCurrentWeight(user);\n  const total=startW-targetW, done=startW-currentW;\n  let pct= total!==0 ? (done\/total)*100 : 0;\n  pct=Math.max(0, Math.min(100, pct));\n\n  const ringLength = 245.0; \/\/ 78半径半圆弧长\n  const offset = ringLength * (1 - pct \/ 100);\n  const ring = $('vizProgressRing');\n  ring.setAttribute('stroke-dasharray', ringLength);\n  ring.setAttribute('stroke-dashoffset', offset);\n  $('vizProgressPct').textContent=pct.toFixed(0)+'%';\n\n  const speedEl=$('vizSpeedInner');\n  \n  if(speed!==null && isFinite(speed)){\n    let tag, tagColor;\n    if(speed>1){ tag='快'; tagColor='var(--down-color)'; }\n    else if(speed>=0.5){ tag='正常'; tagColor='var(--text)'; }\n    else { tag='慢'; tagColor='var(--up-color)'; }\n    speedEl.innerHTML = `减重速度：<span data-no-hover-color=\"1\" style=\"font-weight:600; font-size:14px; color:${tagColor};\">${tag}<\/span>`;\n  } else {\n    speedEl.innerHTML = `减重速度：<span style=\"font-weight:400; font-size:14px; color:var(--text)\">--<\/span>`;\n  }\n\n  const etaEl=$('vizETA');\n  if(remain<=0.05){\n    etaEl.textContent='已达成 🎉';\n  } else if(speed && speed>0 && isFinite(speed)){\n    const daysNeed=(remain\/speed)*7;\n    if(isFinite(daysNeed) && daysNeed<365*20){\n      const eta=new Date(Date.now()+daysNeed*86400000);\n      etaEl.textContent=`${eta.getFullYear()}年${eta.getMonth()+1}月${eta.getDate()}日`;\n    } else {\n      etaEl.textContent='--';\n    }\n  } else {\n    etaEl.textContent='--';\n  }\n}\n\n\/* =========================================================\n   体重历史 & 全部记录\n   ========================================================= *\/\nfunction makeDiffEl(info, unit, ul){\n  const diffEl=document.createElement('div'); diffEl.className='rec-diff';\n  if(!info){ diffEl.classList.add('diff-same'); diffEl.textContent='—'; return diffEl; }\n  if(info.isFirst){\n    diffEl.classList.add('diff-same');\n    diffEl.textContent=`0 ${ul}`;\n    return diffEl;\n  }\n  const d=Math.round(toDisplay(info.diff,unit)*10)\/10;\n  if(info.dir==='same'){ diffEl.classList.add('diff-same'); diffEl.textContent=`0 ${ul}`; }\n  else if(info.dir==='up'){ diffEl.classList.add('diff-up'); diffEl.textContent=`+${fmt(d)} ${ul}`; }\n  else { diffEl.classList.add('diff-down'); diffEl.textContent=`-${fmt(Math.abs(d))} ${ul}`; }\n  return diffEl;\n}\nfunction renderRecordList(user, unit, ul){\n  recordList.innerHTML='';\n  const recs=getSortedRecords(user);\n  const recent=recs.slice(-3).reverse();\n  if(recent.length===0){\n    recordList.innerHTML='<div class=\"empty-tip\">暂无体重记录，点击上方体重卡片添加<\/div>';\n    return;\n  }\n  const diffMap=getRecordDiffMap(user);\n  recent.forEach(rec=>{\n    const item=document.createElement('div'); item.className='record-item';\n    const left=document.createElement('div');\n    const wEl=document.createElement('div'); wEl.className='rec-weight';\n    wEl.textContent=fmt(toDisplay(Number(rec.weight),unit))+' '+ul;\n    const metaEl=document.createElement('div'); metaEl.className='rec-meta';\n    metaEl.textContent=`${rec.date} ${rec.time||''}`.trim();\n    left.appendChild(wEl); left.appendChild(metaEl);\n    item.appendChild(left); item.appendChild(makeDiffEl(diffMap[rec.id], unit, ul));\n    item.onclick=()=>openRecordModal(rec.id);\n    recordList.appendChild(item);\n  });\n}\nfunction refreshAllRecords(filterMonth){\n  const user=userList[currentViewUserIndex]; if(!user) return;\n  const unit=globalUnit; const ul=unitLabel(unit);\n  let recs=getSortedRecords(user).reverse();\n  if(filterMonth) recs=recs.filter(r=>(r.date||'').startsWith(filterMonth));\n  const diffMap=getRecordDiffMap(user);\n  allRecordsList.innerHTML='';\n  if(recs.length===0){ allRecordsList.innerHTML='<div class=\"empty-tip\">暂无记录<\/div>'; return; }\n  recs.forEach(rec=>{\n    const item=document.createElement('div'); item.className='record-item';\n    const left=document.createElement('div');\n    const wEl=document.createElement('div'); wEl.className='rec-weight';\n    wEl.textContent=fmt(toDisplay(Number(rec.weight),unit))+' '+ul;\n    const metaEl=document.createElement('div'); metaEl.className='rec-meta';\n    metaEl.textContent=`${rec.date} ${rec.time||''}`.trim();\n    left.appendChild(wEl); left.appendChild(metaEl);\n    item.appendChild(left); item.appendChild(makeDiffEl(diffMap[rec.id], unit, ul));\n    item.onclick=()=>{ maskAllRecords.classList.remove('show'); openRecordModal(rec.id); };\n    allRecordsList.appendChild(item);\n  });\n}\n$('showAllRecordsBtn').onclick=()=>{\n  const user=userList[currentViewUserIndex]; if(!user) return;\n  const recs=getSortedRecords(user);\n  const months=[...new Set(recs.map(r=>(r.date||'').slice(0,7)).filter(Boolean))].sort().reverse();\n  const sel=$('allRecordsFilter');\n  sel.innerHTML='<option value=\"\">全部月份<\/option>';\n  months.forEach(m=>{ const o=document.createElement('option'); o.value=m; o.textContent=m; sel.appendChild(o); });\n  sel.value='';\n  sel.onchange=()=>refreshAllRecords(sel.value);\n  refreshAllRecords('');\n  maskAllRecords.classList.add('show');\n};\n$('closeAllRecords').onclick=()=>maskAllRecords.classList.remove('show');\nmaskAllRecords.onclick=e=>{ if(e.target===maskAllRecords) maskAllRecords.classList.remove('show'); };\n\nfunction openRecordModal(id, presetDate){\n  const user=userList[currentViewUserIndex]; if(!user) return;\n  const unit=globalUnit; const ul=unitLabel(unit);\n  editingRecordId=id;\n  $('recUnitTag').textContent=ul;\n  if(id===null){\n    $('recordModalTitle').textContent='添加体重记录';\n    $('deleteRecordBtn').style.display='none';\n    $('inpRecWeight').value='';\n    $('inpRecDate').value=presetDate||getTodayStr();\n    $('inpRecTime').value=getNowTimeS it))) rec.weight=Math.round(wKg*100)\/100;\n      rec.date=date; rec.time=timeStr;\n      undo=()=>{ rec.weight=old.weight; rec.date=old.date; rec.time=old.time; };\n    }\n  }\n  if(!saveUsers()){ if(undo) undo(); return; }\n  maskRecord.classList.remove('show');\n  if(getActiveTab()==='combined') renderCombinedTab();\n  else renderWeightTab();\n};\n$('deleteRecordBtn').onclick=()=>{\n  const user=userList[currentViewUserIndex];\n  if(!user||!editingRecordId) return;\n  const target=user.records.find(r=>r&&r.id===editingRecordId);\n  if(!target) return;\n  if(!confirm('确认删除这条体重记录吗？')) return;\n  const backup=user.records.slice();\n  user.records=user.records.filter(r=>r!==target);\n  if(!saveUsers()){ user.records=backup; return; }\n  maskRecord.classList.remove('show');\n  if(getActiveTab()==='combined') renderCombinedTab();\n  else renderWeightTab();\n};\n\n\/* =========================================================\n   点击卡片\n   ========================================================= *\/\nfunction openWeightEditModal(type){\n  const user=userList[currentViewUserIndex]; if(!user) return;\n  editingWeightType=type;\n  const unit=globalUnit;\n  $('weightEditUnitLabel').textContent=unitLabel(unit);\n  $('errWeightEditValue').textContent=''; $('errWeightEditDate').textContent='';\n\n  if(type==='start'){\n    $('weightEditTitle').textContent='初始体重';\n    $('inpWeightEditValue').value=fmtInput(toDisplay(Number(user.startWeight),unit));\n    $('inpWeightEditDate').value=user.startDate||getTodayStr();\n    $('weightEditTimeRow').style.display='none';\n  } else if(type==='target'){\n    $('weightEditTitle').textContent='目标体重';\n    $('inpWeightEditValue').value=fmtInput(toDisplay(Number(user.targetWeight),unit));\n    $('inpWeightEditDate').value=user.targetDate||getTodayStr();\n    $('weightEditTimeRow').style.display='none';\n  }\n  maskWeightEdit.classList.add('show');\n}\ndocument.body.addEventListener('click', (e)=>{\n  \/\/ 只有点击事件源是真正的数字 span 时，才触发\n  const clickedSpan = e.target.closest('span');\n  if(!clickedSpan) return;\n  \n  \/\/ 向上寻找带有 data-edit 的父级\n  const item = clickedSpan.closest('.ov-item[data-edit]');\n  if(!item) return;\n  \n  \/\/ 排除掉减重速度区域（vizSpeedInner 及其内部 span）→ 弹出速度说明\n  if(clickedSpan.id === 'vizSpeedInner' || clickedSpan.closest('#vizSpeedInner')){\n    openHealthInfo('speed');\n    return;\n  }\n\n  const type=item.dataset.edit;\n  if(type==='current'){\n    openRecordModal(null);\n  } else {\n    openWeightEditModal(type);\n  }\n});\n$('cancelWeightEdit').onclick=()=>maskWeightEdit.classList.remove('show');\nmaskWeightEdit.onclick=e=>{ if(e.target===maskWeightEdit) maskWeightEdit.classList.remove('show'); };\n\n\/* =========================================================\n   基础信息独立编辑（性别\/年龄\/身高）\n   ========================================================= *\/\nlet editingBasicType = null;\nfunction openBasicEditModal(type) {\n  const user = userList[currentViewUserIndex];\n  if (!user) return;\n  editingBasicType = type;\n  \n  $('basicEditRowInput').style.display = 'none';\n  $('basicEditRowSelect').style.display = 'none';\n  $('basicEditRowDate').style.display = 'none';\n\n  if (type === 'gender') {\n    $('basicEditTitle').textContent = '编辑性别';\n    $('basicEditRowSelect').style.display = 'block';\n    $('inpBasicEditSelect').value = user.gender || '';\n  } else if (type === 'birth') {\n    $('basicEditTitle').textContent = '编辑出生年月日';\n    $('basicEditRowDate').style.display = 'block';\n    $('inpBasicEditDate').value = user.birthDate || '';\n  } else if (type === 'height') {\n    $('basicEditTitle').textContent = '编辑身高（厘米）';\n    $('basicEditRowInput').style.display = 'block';\n    $('inpBasicEditValue').type = 'number';\n    $('inpBasicEditValue').step = '0.1';\n    $('inpBasicEditValue').value = user.height || '';\n  }\n  \n  maskBasicEdit.classList.add('show');\n}\n\nconst maskBasicEdit = $('maskBasicEdit');\n$('cancelBasicEdit').onclick = () => maskBasicEdit.classList.remove('show');\nmaskBasicEdit.onclick = e => { if(e.target === maskBasicEdit) maskBasicEdit.classList.remove('show'); };\n\n$('saveBasicEdit').onclick = () => {\n  const user = userList[currentViewUserIndex];\n  if (!user || !editingBasicType) return;\n\n  if (editingBasicType === 'gender') {\n    user.gender = $('inpBasicEditSelect').value;\n  } else if (editingBasicType === 'birth') {\n    user.birthDate = $('inpBasicEditDate').value;\n  } else if (editingBasicType === 'height') {\n    const val = parseFloat($('inpBasicEditValue').value);\n    if (isNaN(val) || val <= 0) { alert('请输入有效身高'); return; }\n    user.height = val;\n  }\n  \n  saveUsers();\n  maskBasicEdit.classList.remove('show');\n  if (getActiveTab() === 'combined') renderCombinedTab();\n  else renderWeightTab();\n};\nbindEnter(maskBasicEdit, $('saveBasicEdit'));\n$('saveWeightEdit').onclick=()=>{\n  const user=userList[currentViewUserIndex];\n  if(!user||!editingWeightType) return;\n  const unit=globalUnit;\n  const vStr=$('inpWeightEditValue').value.trim();\n  const v=parseFloat(vStr);\n  const dateStr=$('inpWeightEditDate').value;\n  $('errWeightEditValue').textContent=''; $('errWeightEditDate').textContent='';\n  if(!vStr||isNaN(v)||v<=0){ $('errWeightEditValue').textContent='请输入有效体重'; return; }\n  const vKg=toKg(v,unit);\n  if(vKg>500){ $('errWeightEditValue').textContent='数值过大'; return; }\n  if(!dateStr){ $('errWeightEditDate').textContent='请选择日期'; return; }\n  const date=fixDate(dateStr);\n\n  if(editingWeightType==='start'){\n    user.startWeight=vKg; user.startDate=date;\n  } else if(editingWeightType==='target'){\n    user.targetWeight=vKg; user.targetDate=date;\n  }\n  saveUsers();\n  maskWeightEdit.classList.remove('show');\n  if(getActiveTab()==='combined') renderCombinedTab();\n  else renderWeightTab();\n};\n\n\/* =========================================================\n   身体围度与指数\n   ========================================================= *\/\nfunction getLatestMetric(user, key){\n  const arr=user.bodyMetrics[key]||[];\n  if(arr.length===0) return null;\n  return [...arr].sort((a,b)=> a.date<b.date?-1 : a.date>b.date?1:0).pop();\n}\n\nfunction renderBodyMetricsSection(user, unit, ul){\n  renderBodyFigureAndInfo(user);\n  renderMetricTrendChart(user);\n  renderMetricHistoryList(user);\n}\nfunction renderBodyFigureAndInfo(user){\n  const get=k=>{ const r=getLatestMetric(user,k); return r?Number(r.value):null; };\n  const shoulder=get('shoulder'), chest=get('chest'), waist=get('waist'), hip=get('hip');\n\n  \/\/ 如果全都没填，展示默认轮廓\n  const isAllEmpty = !shoulder && !chest && !waist && !hip;\n  \n  \/\/ 人体图 SVG 生成（完全保留原逻辑）\n  const W=100,H=200,cx=50;\n  \n  \/\/ 为了防止数据不全导致小人变畸形，缺失的部位统一使用合理的默认值。\n  \/\/ 默认值参考：肩宽40，胸围85，腰围75，臀围90\n  const sh=shoulder||40, ch=chest||85, wa=waist||75, hi=hip||90;\n  const maxV=Math.max(sh||100, ch||100, wa||100, hi||100), minV=Math.min(sh||50, ch||50, wa||50, hi||50);\n  const rng=Math.max(maxV-minV,1);\n  \/\/ 将真实数值映射为屏幕宽度\n  const scale=v=> 16 + ((v-minV)\/rng)*24;\n  const shHW=scale(sh||100), chHW=scale(ch||100)\/2, waHW=scale(wa||100)\/2, hiHW=scale(hi||100)\/2;\n  \n  const yHead=22,rHead=11,yNeckTop=33,yNeckBot=42,yShoulder=48,yChest=72,yWaist=100,yHip=128;\n  \n  const color='var(--primary)';\n  let svg=`<svg viewBox=\"0 0 ${W} ${H}\" preserveAspectRatio=\"xMidYMid meet\" xmlns=\"http:\/\/www.w3.org\/2000\/svg\">`;\n  \n  \/\/ 如果完全没有数据，显示提示文字，并绘制最基础的轮廓（图1效果）\n  if (isAllEmpty) {\n    svg += `<circle cx=\"${cx}\" cy=\"40\" r=\"18\" fill=\"var(--text)\" opacity=\"0.1\"\/>`;\n    svg += `<rect x=\"${cx-6}\" y=\"60\" width=\"12\" height=\"15\" fill=\"var(--text)\" opacity=\"0.1\" rx=\"2\"\/>`;\n    svg += `<path d=\"M ${cx-25} 85 Q ${cx} 75 ${cx+25} 85 L ${cx+30} 160 Q ${cx} 170 ${cx-30} 160 Z\" fill=\"var(--text)\" opacity=\"0.1\"\/>`;\n    svg += `<rect x=\"${cx-20}\" y=\"165\" width=\"14\" height=\"50\" rx=\"4\" fill=\"var(--text)\" opacity=\"0.1\"\/>`;\n    svg += `<rect x=\"${cx+6}\" y=\"165\" width=\"14\" height=\"50\" rx=\"4\" fill=\"var(--text)\" opacity=\"0.1\"\/>`;\n    svg += `<text x=\"${cx}\" y=\"110\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--gray-text)\">请添先加身体数据<\/text>`;\n    svg += `<\/svg>`;\n    $('bodyFigure').innerHTML = svg;\n  } else {\n    \/\/ 头部\n    svg += `<circle cx=\"${cx}\" cy=\"${yHead}\" r=\"${rHead}\" fill=\"${color}\" opacity=\"0.28\"\/>`;\n  \/\/ 脖子\n  svg += `<rect x=\"${cx-4}\" y=\"${yNeckTop}\" width=\"8\" height=\"${yNeckBot-yNeckTop}\" fill=\"${color}\" opacity=\"0.28\" rx=\"2\"\/>`;\n  \n  const shapeInfo=getBodyShape(shoulder, chest, waist, hip);\n  const whrInfo=getWaistHipRatioInfo(waist, hip, user.gender);\n\n  \/\/ 根据体型比例，绘制真实躯干轮廓\n  const path=`M ${cx-shHW} ${yShoulder} Q ${cx-shHW-2} ${yShoulder+4}, ${cx-chHW} ${yChest} Q ${cx-chHW+1} ${yChest+6}, ${cx-waHW} ${yWaist} Q ${cx-waHW-1} ${yWaist+6}, ${cx-hiHW} ${yHip} Q ${cx-hiHW+1} ${yHip+12}, ${cx-hiHW+3} ${yHip+14} L ${cx+hiHW-3} ${yHip+14} Q ${cx+hiHW-1} ${yHip+12}, ${cx+hiHW} ${yHip} Q ${cx+waHW+1} ${yWaist+6}, ${cx+waHW} ${yWaist} Q ${cx+chHW-1} ${yChest+6}, ${cx+chHW} ${yChest} Q ${cx+shHW+2} ${yShoulder+4}, ${cx+shHW} ${yShoulder} Z`;\n  svg += `<path d=\"${path}\" fill=\"${color}\" opacity=\"0.15\" stroke=\"${color}\" stroke-width=\"1.5\" stroke-linejoin=\"round\"\/>`;\n\n  \/\/ 四肢\n  const armW=6, armLen=50, armX=shHW+1;\n  svg += `<rect x=\"${cx-armX-armW}\" y=\"${yShoulder+2}\" width=\"${armW}\" height=\"${armLen}\" rx=\"3\" fill=\"${color}\" opacity=\"0.2\"\/>`;\n  svg += `<rect x=\"${cx+armX}\" y=\"${yShoulder+2}\" width=\"${armW}\" height=\"${armLen}\" rx=\"3\" fill=\"${color}\" opacity=\"0.2\"\/>`;\n  const legGap=4, legW=12;\n  svg += `<rect x=\"${cx-legGap-legW}\" y=\"${yHip+14}\" width=\"${legW}\" height=\"55\" rx=\"4\" fill=\"${color}\" opacity=\"0.2\"\/>`;\n  svg += `<rect x=\"${cx+legGap}\" y=\"${yHip+14}\" width=\"${legW}\" height=\"55\" rx=\"4\" fill=\"${color}\" opacity=\"0.2\"\/>`;\n  svg += `<rect x=\"${cx-legGap-10}\" y=\"${yHip+70}\" width=\"10\" height=\"40\" rx=\"3\" fill=\"${color}\" opacity=\"0.18\"\/>`;\n  svg += `<rect x=\"${cx+legGap}\" y=\"${yHip+70}\" width=\"10\" height=\"40\" rx=\"3\" fill=\"${color}\" opacity=\"0.18\"\/>`;\n\n  \/\/ 竖向虚线参考线\n  svg += `<line x1=\"${cx}\" y1=\"${yNeckBot}\" x2=\"${cx}\" y2=\"${yHip+20}\" stroke=\"${color}\" stroke-width=\"1\" opacity=\"0.4\" stroke-dasharray=\"2,2\"\/>`;\n\n    svg+=`<\/svg>`;\n    $('bodyFigure').innerHTML=svg;\n  }\n  const h=Number(user.height);\n  const cw=getCurrentWeight(user);\n  let bmiVal=null, bmiInfo=null;\n  if(h>0){ bmiVal=cw\/Math.pow(h\/100,2); bmiInfo=bmiLevel(bmiVal); }\n  const bfInfo=getBodyFatInfo(user);\n  let bfTxt='--', bfCls='';\n  if(bfInfo){\n    const bfLv=bodyFatLevel(bfInfo.value, user.gender);\n    bfTxt=`${bfInfo.value.toFixed(1)}% ${bfLv.level}`;\n    bfCls=bfLv.cls;\n  }\n  const bmr=calcBMR(user);\n\n  \/\/ 渲染模块2（性别、年龄、身高）\n  const emptyTip = '<span class=\"top-info-empty\">点击设置<\/span>';\n  const genderTxt = user.gender === 'male' ? '男' : (user.gender === 'female' ? '女' : emptyTip);\n  const age = calcAge(user.birthDate);\n  const ageTxt = (age !== null) ? age + ' 岁' : emptyTip;\n  const heightTxt = (h > 0) ? h + ' 厘米' : emptyTip;\n  const _unit = (typeof globalUnit === 'string') ? globalUnit : 'kg';\n  const weightTxt = (cw > 0) ? (fmt(toDisplay(cw, _unit)) + ' ' + unitLabel(_unit)) : emptyTip;\n  $('topInfoCol3').innerHTML = `\n    <div class=\"top-info-item\" onclick=\"openBasicEditModal('gender')\"><span class=\"top-info-label\">性别<\/span><span class=\"top-info-value\" id=\"topInfoGenderVal\">${genderTxt}<\/span><\/div>\n    <div class=\"top-info-item\" onclick=\"openBasicEditModal('birth')\"><span class=\"top-info-label\">年龄<\/span><span class=\"top-info-value\" id=\"topInfoAgeVal\">${ageTxt}<\/span><\/div>\n    <div class=\"top-info-item\" onclick=\"openBasicEditModal('height')\"><span class=\"top-info-label\">身高<\/span><span class=\"top-info-value\" id=\"topInfoHeightVal\">${heightTxt}<\/span><\/div>\n    <div class=\"top-info-item\"><span class=\"top-info-label\">体重<\/span><span class=\"top-info-value\" style=\"cursor:default\">${weightTxt}<\/span><\/div>\n  `;\n\n  \/\/ 渲染第一列（基础代谢、BMI、体脂率、腰臀比）\n  const whrTop = getWaistHipRatioInfo(waist, hip, user.gender);\n  $('topInfoCol1').innerHTML = `\n    <div class=\"top-info-item\" onclick=\"openHealthInfo('bmr')\"><span class=\"top-info-label\">基础代谢<\/span><span class=\"top-info-value\">${bmr !== null ? `<span class=\"val-only\">${Math.round(bmr)}<\/span> <span class=\"status-txt\" style=\"color:var(--text)\">标准<\/span>` : emptyTip}<\/span><\/div>\n    <div class=\"top-info-item\" onclick=\"openHealthInfo('bmi')\"><span class=\"top-info-label\">BMI<\/span><span class=\"top-info-value\">${bmiVal ? `<span class=\"val-only\">${bmiVal.toFixed(1)}<\/span> <span class=\"${bmiInfo.cls} status-txt\">${bmiInfo.level}<\/span>` : emptyTip}<\/span><\/div>\n    <div class=\"top-info-item\" onclick=\"openHealthInfo('bodyfat')\"><span class=\"top-info-label\">体脂率<\/span><span class=\"top-info-value\">${bfInfo ? `<span class=\"val-only\">${bfInfo.value.toFixed(1)}%<\/span> <span class=\"${bfCls} status-txt\">${bodyFatLevel(bfInfo.value, user.gender).level}<\/span>` : emptyTip}<\/span><\/div>\n    <div class=\"top-info-item\" onclick=\"openHealthInfo('whr')\"><span class=\"top-info-label\">腰臀比<\/span><span class=\"top-info-value\">${whrTop ? `<span class=\"val-only\">${whrTop.ratio.toFixed(2)}<\/span> <span class=\"${whrTop.cls} status-txt\">${whrTop.level}<\/span>` : emptyTip}<\/span><\/div>\n  `;\n  \n\n\n  \/\/ 体型：小人下方只保留体型文字（不加粗），腰臀比已移到左侧卡片\n  const shp=getBodyShape(shoulder, chest, waist, hip);\n  $('bodyShapeLabel').innerHTML = shp ? `<span class=\"fig-label-item\" onclick=\"openHealthInfo('shape')\">体型 <span class=\"fig-label-value\">${shp.label}<\/span><\/span>` : '';\n\n}\n\n\/\/ 点击\"+\"号打开围度记录弹窗\ndocument.addEventListener('DOMContentLoaded', function() {\n  maskBodyMetricAdd = document.getElementById('maskBodyMetricAdd');\n  const addBtn = docume

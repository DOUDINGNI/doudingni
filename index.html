<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>个人工作台</title>
<!--
  单文件工作台：
  · 外壳负责左侧导航、各模块标题栏、统一设置（主题色 / 日夜 / 导航顺序 / 数据导入导出）
  · 体重、外语、知识库三个子应用以字符串常量内嵌，运行时用同源 iframe + document.write 挂载，
    这样各自的 CSS / JS 互不干扰；切换模块时保留各自状态
  · 维护方式：.workbuddy/tools/ 下拆出子应用源码单独修改，再用 repack.py 打包回本文件
-->
<style>
:root{
  --bg:#f5f5f7;--card:#ffffff;--text:#222222;--gray:#8a8a8e;--border:#e6e6ea;
  --primary:#8e7a9e;--radius:16px;--shadow:0 1px 3px rgba(0,0,0,.05);
}
body.dark{--bg:#1c1c1e;--card:#2c2c2e;--text:#f0f0f2;--gray:#9a9aa0;--border:#3f3f44;--shadow:0 1px 3px rgba(0,0,0,.3)}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);min-height:100vh;transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.app{display:flex;min-height:100vh}
.sidebar{width:216px;flex:none;background:var(--card);border-right:1px solid var(--border);
  padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.brand{font-size:16px;font-weight:700;letter-spacing:.5px;padding:0 8px;display:flex;align-items:center;gap:10px}
.brand .sub{font-size:11px;color:var(--gray);font-weight:400;letter-spacing:0}
.brand-avatar{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--border);overflow:hidden;background-size:cover;background-position:center}
.brand-avatar img{width:100%;height:100%;object-fit:cover}
.brand-text{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand-name{font-size:19px;font-weight:800;letter-spacing:.5px}
.brand-sub{font-size:10px;color:var(--gray);font-weight:500;letter-spacing:2px;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-btn{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;font-size:14px;color:var(--text);transition:.15s;text-align:left}
.nav-btn:hover{background:var(--bg)}
.nav-btn.active{background:var(--primary);color:#fff;font-weight:600}
.nav-btn .ico{font-size:15px;width:18px;text-align:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side-btn{padding:9px 10px;border-radius:10px;font-size:13px;color:var(--gray);border:1px solid var(--border);text-align:center;display:flex;align-items:center;justify-content:center;gap:7px}
.side-btn:hover{color:var(--text);border-color:var(--primary)}
.tip{font-size:11px;color:var(--gray);line-height:1.6;padding:0 6px}
.main{flex:1;min-width:0;padding:22px 26px 14px;display:flex;flex-direction:column}
.host{width:100%;max-width:1400px;margin:0 auto}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.back-btn{display:none}
.bar:empty{display:none}
/* 移动端首页 */
.home{display:none;flex-direction:column}
.home-top{display:flex;align-items:center;gap:10px;margin:2px 2px 14px}
.home-avatar{width:34px;height:34px;font-size:16px}
.home-brand-text{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.home-name{font-size:17px;font-weight:800;letter-spacing:.4px}
.home-sub{font-size:9px;letter-spacing:2px;color:var(--gray);margin-top:2px;font-weight:500}
.home-set{margin-left:auto;width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--gray);display:flex;align-items:center;justify-content:center;flex:none}
.home-set:active{color:var(--primary);border-color:var(--primary)}
.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.home-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 13px;display:flex;flex-direction:column;align-items:flex-start;gap:9px;text-align:left;transition:.15s;min-height:84px;min-width:0;position:relative}
.home-card:active{transform:scale(.985);border-color:var(--primary)}
.home-card.active::after{content:'';position:absolute;top:11px;right:11px;width:6px;height:6px;border-radius:50%;background:var(--primary)}
.hc-ico{font-size:21px;line-height:1}
.hc-name{font-size:13.5px;font-weight:600;line-height:1.3}
.hc-desc{font-size:11px;color:var(--gray);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.page-title{font-size:19px;font-weight:700}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;background:var(--border);padding:3px;border-radius:11px}
.tabs button{padding:6px 14px;border-radius:8px;font-size:13px;color:var(--gray);transition:.15s}
.tabs button.active{background:var(--card);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.btn{padding:6px 12px;border-radius:9px;font-size:13px;color:var(--gray);border:1px solid var(--border);background:var(--card);transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{color:var(--text);border-color:var(--primary)}
.btn .ic{width:15px;height:15px;flex:none}
.ic{width:15px;height:15px;flex:none;display:block}
.side-btn .ic{width:15px;height:15px}
.cd-btn{font-size:12px;color:var(--gray);border:1px solid var(--border);border-radius:9px;padding:6px 12px;background:var(--card);transition:.15s;display:inline-flex;align-items:center;gap:6px}
.cd-btn:hover{color:var(--text);border-color:var(--primary)}
.color-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;font-size:13px;color:var(--gray);border:1px solid var(--border);background:var(--card)}
.color-chip input[type=color]{width:20px;height:20px;border:none;border-radius:5px;background:none;padding:0;cursor:pointer}
.color-chip input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.color-chip input[type=color]::-webkit-color-swatch{border:1px solid var(--border);border-radius:5px}
.frame{width:100%;height:calc(100vh - 106px);min-height:600px;border:none;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);display:block}
.ph{margin-top:40px;text-align:center;color:var(--gray)}
.ph-icon{font-size:52px;margin-bottom:10px}
.ph-name{font-size:20px;font-weight:700;color:var(--text);margin-bottom:8px}
.ph-desc{font-size:13px;max-width:520px;margin:0 auto 14px;line-height:1.7}
.ph-feats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.ph-feat{font-size:12px;padding:4px 10px;border:1px solid var(--border);border-radius:20px}
.ph-tag{font-size:12px;color:var(--gray)}

/* 统一设置模态框 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.mask.show{display:flex}
.modal{background:var(--card);border-radius:var(--radius);box-shadow:0 10px 40px rgba(0,0,0,.2);width:min(94%,440px);max-height:88vh;overflow-y:auto;padding:22px}
.modal h3{font-size:16px;font-weight:700;margin-bottom:18px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:none}
.set-label{font-size:14px;color:var(--text)}
.set-desc{font-size:12px;color:var(--gray);margin-top:2px}
.seg{display:flex;gap:2px;background:var(--border);padding:2px;border-radius:9px}
.seg button{padding:5px 12px;border-radius:7px;font-size:12px;color:var(--gray);transition:.15s}
.seg button.active{background:var(--card);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.select{font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);outline:none}
.set-btn{padding:7px 14px;border-radius:9px;font-size:13px;color:#fff;background:var(--primary);transition:.15s}
.set-btn:hover{opacity:.9}
.set-btn.ghost{background:transparent;color:var(--gray);border:1px solid var(--border)}
.set-btn.ghost:hover{color:var(--text);border-color:var(--primary)}
.set-color{width:28px;height:28px;border:none;border-radius:7px;background:none;padding:0;cursor:pointer}
.set-color::-webkit-color-swatch-wrapper{padding:0}
.set-color::-webkit-color-swatch{border:1px solid var(--border);border-radius:7px}
.set-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.nav-order-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--border);border-radius:9px;cursor:grab;background:var(--bg);transition:.12s;user-select:none}
.nav-order-item:hover{border-color:var(--primary)}
.nav-order-item.dragging{opacity:.45}
.nav-order-item.drag-before{box-shadow:0 -2px 0 var(--primary)}
.nav-order-item.drag-after{box-shadow:0 2px 0 var(--primary)}
.nav-order-grip{width:16px;height:16px;color:var(--gray);flex:none}
.nav-order-label{flex:1;font-size:13px}
@media(max-width:860px){
  .app{flex-direction:column;min-height:100vh}
  .sidebar{display:none}
  .home:not([hidden]){display:flex}
  .main{padding:12px 10px 16px}
  .host{max-width:none}
  /* 标题居中 + 左侧返回 */
  .page-head{flex-direction:column;align-items:stretch;gap:9px;position:relative;padding-top:1px;margin-bottom:11px}
  .page-title{text-align:center;font-size:17px;line-height:34px;padding:0 42px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .back-btn{display:flex;position:absolute;left:0;top:1px;width:34px;height:34px;border-radius:10px;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--card);color:var(--text);z-index:2}
  .back-btn svg{width:17px;height:17px}
  .back-btn:active{color:var(--primary);border-color:var(--primary)}
  /* 工具条：单行横向滑动，避免挤压换行 */
  .bar{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;gap:7px;padding:0 1px 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .bar::-webkit-scrollbar{display:none}
  .bar>*{flex:none}
  .btn{padding:6px 10px;font-size:12.5px}
  .cd-btn{padding:6px 10px;font-size:11.5px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .tabs{padding:2px}
  .tabs button{padding:6px 10px;font-size:12.5px}
  .color-chip{padding:5px 8px;font-size:12px}
  .frame{height:calc(100vh - 128px);height:calc(100dvh - 128px);min-height:440px;border-radius:12px}
  .ph{margin-top:24px}
  .ph-icon{font-size:44px}
  .modal{width:100%;padding:18px}
  .set-row{padding:10px 0}
}
@media(max-width:400px){
  .home-grid{gap:8px}
  .home-card{padding:12px 11px;min-height:78px}
  .hc-ico{font-size:19px}
  .hc-name{font-size:13px}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-avatar" id="brandAvatar"></span>
      <span class="brand-text">
        <span class="brand-name">个人工作台</span>
        <span class="brand-sub">WORKBENCH</span>
      </span>
    </div>
    <nav class="nav" id="moduleNav"></nav>
    <div class="side-foot">
      <button class="side-btn" id="openSettingsBtn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>设置</button>
    </div>
  </aside>

  <main class="main">
    <!-- 移动端首页：入口列表 -->
    <div class="home" id="hostHome" hidden>
      <div class="home-top">
        <span class="brand-avatar home-avatar" id="homeAvatar"></span>
        <span class="home-brand-text">
          <span class="home-name">个人工作台</span>
          <span class="home-sub">WORKBENCH</span>
        </span>
        <button class="home-set" id="homeSetBtn" aria-label="设置">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
      <div class="home-grid" id="homeGrid"></div>
    </div>

    <!-- 体重 / 饮食 / 运动 -->
    <div class="host" id="hostWeight" hidden>
      <div class="page-head">
        <button class="back-btn" data-back aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div class="page-title" id="weightTitle">⚖️ 体重记录</div>
        <div class="bar">
          <button class="btn" id="wAddBtn" title="添加体重 / 添加围度"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>添加</button>
          <button class="btn" id="wUserBtn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>切换用户</button>
          <div class="seg" id="weightUnitSeg">
            <button data-u="kg" class="active">公斤</button>
            <button data-u="jin">斤</button>
          </div>
          <span class="color-chip">上升 <input type="color" id="weightUpColor"></span>
          <span class="color-chip">下降 <input type="color" id="weightDownColor"></span>
        </div>
      </div>
      <iframe class="frame" id="frameWeight" title="体重管理"></iframe>
    </div>

    <!-- 外语学习 -->
    <div class="host" id="hostLang" hidden>
      <div class="page-head">
        <button class="back-btn" data-back aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div class="page-title">🌍 外语学习</div>
        <div class="bar">
          <div class="tabs" id="langTabs">
            <button data-view="plan" class="active">学习任务</button>
            <button data-view="papers">做题记录</button>
            <button data-view="review">学习复盘</button>
          </div>
          <button class="btn" id="langRecordBtn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>学习记录</button>
          <button class="btn" id="langCatColorBtn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18h6a3 3 0 0 0 3-3V9a6 6 0 0 0-6-6z"/><circle cx="8" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="16" cy="12" r="1"/></svg>学科色</button>
          <button class="cd-btn" id="langCdBtn" title="点击编辑考试日期与目标分数"><span id="langCd">--</span></button>
        </div>
      </div>
      <iframe class="frame" id="frameLang" title="外语学习"></iframe>
    </div>

    <!-- 知识库 -->
    <div class="host" id="hostNotes" hidden>
      <div class="page-head">
        <button class="back-btn" data-back aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div class="page-title">📚 知识库</div>
        <div class="bar">
          <button class="btn" id="notesImportBtn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>导入 CSV</button>
          <input type="file" id="notesCsvFile" accept=".csv,text/csv" hidden>
          <button class="btn" id="notesAddBtn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>新建笔记</button>
        </div>
      </div>
      <iframe class="frame" id="frameNotes" title="知识库"></iframe>
    </div>

    <!-- 其余模块占位 -->
    <div class="host" id="hostPH" hidden>
      <div class="page-head">
        <button class="back-btn" data-back aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div class="page-title" id="phTitle"></div>
        <div class="bar"></div>
      </div>
      <div id="phBody"></div>
    </div>
  </main>
</div>

<!-- 统一设置模态框 -->
<div class="mask" id="maskSettings">
  <div class="modal">
    <h3>工作台设置</h3>

    <div class="set-row">
      <div>
        <div class="set-label">模式</div>
        <div class="set-desc">日间 / 夜间，全局生效</div>
      </div>
      <div class="seg" id="globalThemeSeg">
        <button data-t="light">日间</button>
        <button data-t="dark">夜间</button>
      </div>
    </div>

    <div class="set-row">
      <div>
        <div class="set-label">主题色</div>
        <div class="set-desc">所有界面主色，全局生效</div>
      </div>
      <input type="color" class="set-color" id="globalThemeColor" value="#4080ff">
    </div>

    <div class="set-row" style="flex-direction:column;align-items:stretch;gap:10px">
      <div>
        <div class="set-label">导航顺序</div>
        <div class="set-desc">调整左侧导航栏模块的显示顺序</div>
      </div>
      <div id="navOrderList" style="display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto"></div>
    </div>

    <div class="set-row" style="flex-direction:column;align-items:stretch;gap:10px">
      <div>
        <div class="set-label">数据传输</div>
        <div class="set-desc">选择要备份或恢复的模块数据</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <select class="select" id="transferModule">
          <option value="weight">体重数据</option>
          <option value="lang">外语学习数据</option>
          <option value="notes">知识库数据</option>

e=date]{flex:1.2;min-width:130px;font-size:13px;padding:0 8px;height:36px}\n.body-record-row button{padding:0 14px;font-size:13px;border-radius:6px;border:none;background:var(--primary);color:#fff;cursor:pointer;flex-shrink:0;height:36px}\n.body-figure-row{display:flex;gap:12px;align-items:stretch;margin:6px 0 16px}\n.body-figure{width:90px;flex-shrink:0;background:var(--bg);border-radius:12px;padding:4px;display:flex;align-items:center;justify-content:center;overflow:hidden}\n.body-figure svg{width:100%;height:100%;display:block}\n\/* 将单列改为两行三列网格 *\/\n.body-info{\n  flex:1;\n  display:grid;\n  grid-template-columns:repeat(3, 1fr);\n  gap:8px;\n  min-width:0;\n}\n\/* 调整每个方框内的排版，适应三列 *\/\n.body-info-item{\n  display:flex;\n  flex-direction:column;\n  justify-content:center;\n  gap:4px;\n  cursor:pointer;\n  background:var(--bg);\n  border:1px solid transparent;\n  padding:10px 6px;\n  border-radius:8px;\n  text-align:center;\n}\n.body-info-item .info-label{color:var(--gray-text);font-size:11px;flex-shrink:0}\n.body-info-item .info-value{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;width:100%}\n\/* 状态色改为读取 JS 动态注入的变量 *\/\n.bf-low{color:var(--status-color-low);}\n.bf-normal{color:var(--status-color-normal);}\n.bf-high{color:var(--status-color-high);}\n.bf-vhigh{color:var(--status-color-vhigh);}\n\n.whr-excellent{color:var(--status-color-normal);}\n.whr-good{color:var(--status-color-normal);}\n.whr-normal{color:var(--status-color-high);}\n.metric-dual-row{display:flex;gap:16px;margin-top:12px;align-items:flex-start}\n.metric-col:first-child{flex:6;min-width:0;display:flex;flex-direction:column;}\n.metric-col:last-child{flex:4;min-width:0;display:flex;flex-direction:column;}\n.metric-col-title{font-size:13px;font-weight:600;margin-bottom:6px}\n.metric-col select{font-size:12px;padding:0 6px;margin-bottom:8px;height:32px}\n\n\/* =========================================================\n   新增：强制围度历史列表与体重历史字体完全一致\n {flex:1;min-width:0}\n.metric-history-item .mh-value{font-weight:600;font-size:12px}\n.metric-history-item .mh-date{font-size:10px;color:var(--gray-text)}\n.metric-history-item .mh-diff{font-size:11px;font-weight:600;white-space:nowrap}\n.metric-history-item .mh-diff.up{color:var(--up-color)}\n.metric-history-item .mh-diff.down{color:var(--down-color)}\n.metric-history-item .mh-diff.same{color:var(--same-color)}\n.hi-current{text-align:center;padding:14px;margin-bottom:14px;background:var(--card-bg);border-radius:12px}\n.hi-current-val{font-size:28px;font-weight:700;line-height:1.1}\n.hi-current-lbl{font-size:12px;color:var(--gray-text);margin-top:6px}\n.hi-table{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}\n.hi-row{display:flex;justify-content:space-between;padding:9px 12px;border-radius:8px;background:var(--bg);font-size:13px;border:1px solid transparent}\n.hi-row.active{background:rgba(64,128,255,.12);border-color:rgba(64,128,255,.35);font-weight:600}\n.hi-row .hi-level{font-weight:500}\n.hi-row.active .hi-level{font-weight:700}\n.hi-row .val-only{color:var(--text);font-weight:500;}\n.hi-desc{font-size:12px;color:var(--gray-text);line-height:1.7;padding:10px 12px;background:var(--bg);border-radius:8px}\n\n@media (max-width:480px){\n  .metric-dual-row{flex-direction:column}\n  .metric-col{width:100%;flex:none}\n}\n\/* ===== 综合页：全新的 4 行网格布局 ===== *\/\n.combined-grid {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 20px;\n  align-items: start;\n  margin-top: 20px;\n}\n\n\/* 针对每一行的通栏\/双列排布 *\/\n.combined-row-1 {\n  grid-column: 1 \/ -1;\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 20px;\n}\n.combined-row-2 {\n  grid-column: 1 \/ -1;\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 20px;\n}\n\n\/* 内部消除一些多余的外边距 *\/\n.combined-grid > div > .stat-panel,\n.combined-grid > div > .trend-block {\n  margin-bottom: 0 !important;\n}\n.combined-grid > .combined-row-1 > div,\n.combined-grid > .combined-row-2 > div {\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n}\n\n\/* 移动端回退：单列 *\/\n@media (max-width:767px) {\n  .combined-row-1,\n  .combined-row-2 {\n    grid-template-columns: 1fr;\n  }\n}\n\n\/* 综合页顶部卡片通栏——weight-overview 已有样式，无需改 *\/\n#tab-combined .weight-overview{margin-bottom:18px}\n@media (max-width:420px){\n  .viz-ring-wrap{width:110px;height:110px}\n  .viz-ring-pct{font-size:22px}\n  .viz-ring-speed-inner{font-size:10px;margin-top:4px}\n  .viz-ring-speed-inner .speed-tag{font-size:11px}\n  .viz-info-row{font-size:11px;padding:5px 7px}\n  .viz-info-val{font-size:11px}\n  .brand-title{font-size:22px;letter-spacing:2px}\n  .container{padding-left:14px;padding-right:14px}\n  .detail-page{padding-left:14px;padding-right:14px}\n  .nav-btn{font-size:9px}\n  .diet-remain-value{font-size:36px}\n}\n@media (max-width:360px){\n  .ov-num{font-size:18px}\n  .ov-label{font-size:11px}\n  .viz-ring-wrap{width:96px;height:96px}\n  .viz-ring-pct{font-size:19px}\n  .viz-info-row{font-size:10px;padding:4px 6px}\n  .viz-info-val{font-size:10px}\n  .body-figure{width:78px}\n  .container{padding-left:12px;padding-right:12px}\n}\n\n\/* ===== 顶部通栏 4 卡片 + 图标列 ===== *\/\n.top-cards{\n  display:grid;\n  grid-template-columns:1.2fr 1fr 1fr 1fr auto;\n  gap:10px;\n  margin-bottom:18px;\n}\n\/* 顶部通栏右侧纵向图标列 *\/\n.top-icon-col{\n  display:flex;\n  flex-direction:column;\n  align-items:center;\n  justify-content:space-between;\n  gap:10px;\n  background:var(--card-bg);\n  border-radius:14px;\n  padding:12px 10px;\n  min-width:56px;\n}\n.top-icon-btn{\n  border:none;\n  background:transparent;\n  color:var(--gray-text);\n  width:36px;\n  height:36px;\n  border-radius:10px;\n  display:flex;\n  align-items:center;\n  justify-content:center;\n  cursor:pointer;\n  padding:0;\n  transition:.15s;\n}\n.top-icon-btn:hover{background:var(--bg);color:var(--primary)}\n.top-icon-btn:active{transform:scale(.92)}\n.top-icon-btn svg{width:20px;height:20px}\n.user-card{\n  background:var(--card-bg);\n  border-radius:14px;\n  padding:14px 16px;\n  display:flex;\n  flex-direction:column;\n  align-items:center;\n  justify-content:center;\n  gap:8px;\n  min-width:0;\n}\n.user-card-avatar{width:52px;height:52px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:24px;background:#ccc;flex-shrink:0}\n.user-card-avatar img{width:100%;height:100%;object-fit:cover}\n\/* 让这一行变成一个整体，并在卡片中居中 *\/\n.user-card-name-row{\n  display:flex;\n  flex-direction:row;\n  align-items:center;\n  justify-content:center;\n  gap:6px;\n  max-width:95%;\n  margin:0 auto;\n}\n\/* 名字文字居中且自适应宽度 *\/\n.user-card-name{\n  font-size:15px;\n  font-weight:600;\n  overflow:hidden;\n  text-overflow:ellipsis;\n  white-space:nowrap;\n  text-align:center;\n  transition:color .15s;\n}\n\/* 删除了 hover 变色的样式，鼠标悬浮时不再变色 *\/\n.switch-user-btn{\n  border:none;\n  background:transparent; \/* 去掉了原有底色 *\/\n  color:var(--gray-text); \/* 使用灰色字，避免视觉太抢 *\/\n  width:22px;height:22px;border-radius:50%;\n  display:flex;align-items:center;justify-content:center;\n  cursor:pointer;flex-shrink:0;padding:0;transition:.15s;\n}\n.switch-user-btn:hover{\n  color:var(--primary); \/* 鼠标悬浮时稍微变主题色 *\/\n}\n.switch-user-btn:active{transform:scale(.92)}\n.switch-user-btn svg{width:14px;height:14px}\n\n\/* 新增：数字在上，标题在下，且居中对齐 *\/\n.ov-item{\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n  gap: 6px; \/* 数字和下方标题的间距 *\/\n  padding: 16px 12px;\n}\n\/* ===== 鼠标悬浮数字变色效果 ===== *\/\n\/* 只让三个体重数字变色；单位与「减重速度」都不参与 *\/\n#ovStart, #ovTarget, #ovCurrent {\n  transition: color 0.2s ease-in-out;\n}\n\/* 只有鼠标落在数字本身时才变主题色；悬停「减重速度」不会影响 72.8 *\/\n.ov-item[data-edit]:hover #ovStart,\n.ov-item[data-edit]:hover #ovTarget,\n#ovCurrent:hover {\n  color: var(--primary) !important;\n}\n\/* 减重速度区域锁定原色，任何悬停都不会改变「慢\/正常\/快」的颜色 *\/\n#vizSpeedInner, #vizSpeedInner span {\n  transition: none !important;\n}\n.ov-item[data-edit]:hover #vizSpeedInner,\n.ov-item[data-edit]:hover #vizSpeedInner span {\n  color: inherit;\n}\n.ov-item .ov-value{\n  justify-content: center;\n  align-items: baseline;\n  margin-bottom: 0;\n}\n\/* 放大数字 *\/\n.ov-item .ov-num {\n  font-size: clamp(26px, 8vw, 32px); \/* 显著放大字体，并且保持响应式 *\/\n  font-weight: 700;\n  line-height: 1;\n}\n\/* 放大单位并微调对齐 *\/\n.ov-item .ov-unit {\n  font-size: 13px;\n}\n\/* 标题字号微调，颜色调灰 *\/\n.ov-item .ov-label{\n  text-align: center;\n  margin-bottom: 0;\n  font-size: 13px;\n  color: var(--gray-text);\n}\n.weight-cards-row {\n  display: flex;\n  gap: 12px;\n}\n.weight-cards-row > .ov-item {\n  flex: 1;\n  padding: 20px 10px;\n}\/* ===== 响应式 ===== *\/\n@media (max-width:900px){}\n@media (max-width:767px){}\n@media (max-width:560px){}\n\n\/* ===== 左右两栏布局（替代原 combined-row） ===== *\/\n.combined-grid{\n  display:grid;\n  grid-template-columns:1fr 1fr;\n  gap:20px;\n  align-items:start;\n  margin-top:20px;\n}\n.combined-col{display:flex;flex-direction:column;gap:20px;min-width:0}\n.combined-col > .trend-block,\n.combined-col > .stat-panel{margin-bottom:0 !important}\n\n\/* ===== 用户选择弹窗 ===== *\/\n.user-select-list{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto;margin-bottom:14px}\n.user-select-item{\n  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;\n  cursor:pointer;background:var(--bg);transition:.15s;\n}\n.user-select-item:hover{background:var(--card-bg)}\n.user-select-item.current{background:var(--primary);color:#fff}\n.user-select-item.current .user-select-name{color:#fff}\n.user-select-item .avatar{width:34px;height:34px;font-size:17px}\n.user-select-name{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.user-select-tag{margin-left:auto;font-size:11px;opacity:.85;flex-shrink:0}\n.main-user-tag{display:inline-block;margin-left:8px;padding:1px 8px;font-size:11px;font-weight:600;color:#fff;background:var(--primary);border-radius:10px;flex-shrink:0;vertical-align:middle}\n.user-select-actions{display:flex;gap:6px;flex-wrap:wrap}\n\/* 把最小宽度从 100px 缩小到 60px，并允许文字不换行 *\/\n.user-select-actions{display:flex;gap:6px;flex-wrap:nowrap}\n.user-select-actions .sidebar-action-btn{flex:1 1 0;min-width:0;text-align:center;white-space:nowrap;padding:9px 2px;font-size:12.5px;overflow:hidden;text-overflow:clip}\n\n#maskUserSelect{z-index:10040}\n\n\/* ===== 响应式 ===== *\/\n@media (max-width:900px){\n  .top-cards{grid-template-columns:1fr 1fr}\n}\n@media (max-width:767px){\n  .combined-grid{grid-template-columns:1fr}\n  .combined-col-left{order:1}\n  .combined-col-right{order:2}\n}\n@media (max-width:560px){\n  .top-cards{grid-template-columns:1fr}\n}\n\/* 无用户时的空状态按钮 *\/\n.btn-primary-sm {\n  background: var(--primary); color: #fff; border: none;\n  padding: 8px 12px; border-radius: 8px; cursor: pointer;\n  font-size: 13px; width: 100%; font-weight: 500;\n  transition: opacity 0.2s;\n}\n.btn-primary-sm:hover { opacity: 0.8; }\n.btn-secondary-sm {\n  background: var(--bg); color: var(--text); border: 1px solid var(--border);\n  padding: 8px 12px; border-radius: 8px; cursor: pointer;\n  font-size: 13px; width: 100%; font-weight: 500;\n  transition: border-color 0.2s, color 0.2s;\n}\n.btn-secondary-sm:hover { border-color: var(--primary); color: var(--primary); }\n\/* ===== 顶部四卡片布局 ===== *\/\n.top-cards-flex {\n  display: flex;\n  gap: 16px;\n  align-items: stretch; \/* 确保高度一致 *\/\n  width: 100%;\n}\n.top-card-item {\n  background: var(--card-bg);\n  border-radius: 14px;\n  padding: 20px;\n  display: flex;\n  flex-direction: column;\n  justify-content: center;\n  align-items: center;\n  position: relative;\n  min-width: 0;\n  flex: 1; \/* 默认等宽 *\/\n}\n\/* 模块1稍微窄一点点，模块4稍微窄一点点，中间两个宽一点（可根据实际视觉效果微调） *\/\n.top-card-item.card-user { flex: 0.9; }\n.top-card-item:nth-child(2),\n.top-card-item:nth-child(3) { flex: 1.1; }\n.top-card-item:nth-child(4) { flex: 1; }\n\n\/* 针对模块2里身高的上边距 *\/\n.top-card-item .top-info-item {\n  margin-top: 0; \/* 清除原本的内联 margin-top 影响 *\/\n}\n\/* ===== 全新主页网格排版 ===== *\/\n.new-layout-grid{display:flex;flex-direction:column;gap:20px;}\n.layout-row{width:100%;}\n.row-two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:stretch;}\n\n\/* 第一行：统一大卡片 *\/\n.row-top{\n  display: block;\n  background: transparent; \/* 移除原本的大背景，让内部模块独立 *\/\n}\n.col-left-card{\n  background: transparent;\n  border-radius: 14px;\n  padding: 0;\n  display: flex;\n  flex-direction: row;\n  align-items: stretch;\n  gap: 20px;\n}\n\n\/* 第一行：左侧图标列 *\/\n.col-icons{\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: flex-start;\n  gap: 16px;\n  width: 40px;\n  flex-shrink: 0;\n}\n.col-icons .top-icon-btn{\n  width: 36px;\n  height: 36px;\n  border-radius: 10px;\n  color: var(--gray-text);\n}\n.col-icons .top-icon-btn:hover{\n  background: var(--bg);\n  color: var(--primary);\n}\n\n\/* 第一行：内部信息与图形网格 *\/\n.info-figure-group{\n  flex: 1;\n  display: grid;\n  grid-template-columns: 1fr 2.5fr; \/* 中间头像固定，右侧数据扩展 *\/\n  gap: 30px;\n  align-items: center;\n}\n\n\/* 第一行：右侧数据与人体图（横向三等分） *\/\n.info-figure-group > div:last-child {\n  display: grid;\n  grid-template-columns: 1fr 1fr 120px;\n  gap: 16px;\n  align-items: center;\n}\n\n\/* 第一行：信息列 *\/\n.col-info{\n  display:flex;\n  flex-direction:column;\n  justify-content:center;\n  gap:10px;\n}\n.col-info .top-info-item{\n  display:flex;\n  justify-content:space-between;\n  align-items:center;\n  font-size:13px;\n  padding:10px 14px;\n  background:var(--bg); \n  border-radius:8px;\n  border: none; \n  flex: 1;\n}\n.top-icon-col{\n  display:none !important;\n}\n.col-info .top-info-label{color:var(--gray-text);}\n.col-info .top-info-value{font-weight:600;color:var(--text);cursor:pointer;}\n.col-info .top-info-empty{color:var(--gray-text);font-weight:400;font-size:12px;}\n\n\/* 新增：让数值和标签各自应用对应状态的颜色 *\/\n.col-info .top-info-value .val-only { color: var(--text); }\n.col-info .top-info-value .status-txt { color: var(--text); font-size: 12px; font-weight: 500; margin-left: 4px; }\n\/* 状态色：标准=正文色、偏低=次要色、偏高=淡红、过高=深红 *\/\n.col-info .top-info-value .status-txt.bf-normal { color: var(--text); }\n.col-info .top-info-value .status-txt.bf-low { color: var(--gray-text); }\n.col-info .top-info-value .status-txt.bf-high { color: var(--status-color-high); }\n.col-info .top-info-value .status-txt.bf-vhigh { color: var(--status-color-vhigh); }\n.col-figure{position:relative;}\n.figure-add-btn{\n  position:absolute;right:4px;bottom:4px;width:26px;height:26px;\n  background:var(--primary);color:#fff;border-radius:50%;\n  display:flex;align-items:center;justify-content:center;\n  font-size:18px;font-weight:bold;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.2);\n  transition:transform .15s;\n  line-height: 1;\n  padding: 0;\n}\n.figure-add-btn:hover{transform:scale(1.05);}\n\n\/* 第一行：人体图 *\/\n.col-figure{\n  display:flex;\n  flex-direction:column;\n  align-items:center;\n  justify-content:center;\n  cursor:default;\n  transition:.15s;\n  border-radius:12px;\n  padding:8px;\n}\n.col-figure .body-figure{width:100%;height:138px;margin:0;padding:0;background:transparent;}\n.body-shape-label{display:flex;flex-direction:column;align-items:center;gap:3px;}\n.body-shape-label .fig-label-item{font-size:13px;font-weight:500;color:var(--text);cursor:pointer;line-height:1.3;}\n.body-shape-label .fig-label-value{font-weight:400;}\n.body-shape-label .fig-label-item b{font-weight:500;}\n.body-shape-label .fig-label-item:hover{color:var(--primary);}\n\n\/* 响应式调整 *\/\n@media (max-width: 900px){\n  .col-left-card {\n    flex-direction: column;\n    align-items: center;\n  }\n  .col-icons {\n    flex-direction: row;\n    width: 100%;\n    justify-content: center;\n    margin-bottom: 20px;\n  }\n  .info-figure-group {\n    grid-template-columns: 1fr;\n    width: 100%;\n  }\n  .info-figure-group > div:last-child {\n    grid-template-columns: 1fr 1fr;\n  }\n  .col-left-card > div[style*=\"flex-direction: row; gap: 20px;\"] {\n    flex-direction: column !important;\n  }\n  .col-left-card > div[style*=\"flex-direction: row; gap: 20px;\"] > div[style*=\"flex: 2.5\"] {\n    grid-template-columns: 1fr 1fr !important;\n  }\n}\n\n\/* ===== 手机窄屏：结构模块一律单列，避免挤压 ===== *\/\n@media (max-width:600px){\n  .new-layout-grid{gap:12px}\n  .row-two-col{grid-template-columns:1fr !important;gap:12px}\n  .combined-grid,.combined-row-1,.combined-row-2,.top-cards{grid-template-columns:1fr !important;gap:12px}\n  .top-cards-flex{flex-direction:column;gap:10px}\n  .top-card-item,.top-card-item.card-user,.top-card-item:nth-child(2),.top-card-item:nth-child(3),.top-card-item:nth-child(4){flex:none;width:100%}\n  .info-figure-group{grid-template-columns:1fr !important;gap:12px !important}\n  .info-figure-group>div:last-child{grid-template-columns:1fr !important;gap:10px !important}\n  .col-left-card{padding:14px !important;gap:12px !important}\n  .row-top{padding:14px !important}\n  .stat-card,.trend-block{margin-bottom:0}\n}\n<\/style>\n<\/head>\n<body>\n\n<div class=\"app-layout\">\n\n  <aside class=\"sidebar\">\n  <div class=\"sidebar-brand\">小园丁体重管理<\/div>\n\n\n\n  <div class=\"sidebar-nav\" id=\"sidebarNav\">\n    <button class=\"sidebar-nav-btn\" data-tab=\"combined\" disabled>\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"7\" rx=\"1.5\"\/><rect x=\"3\" y=\"13\" width=\"8\" height=\"7\" rx=\"1.5\"\/><rect x=\"13\" y=\"13\" width=\"8\" height=\"7\" rx=\"1.5\"\/><\/svg>\n      <span>体重<\/span>\n    <\/button>\n    <button class=\"sidebar-nav-btn\" data-tab=\"diet\" disabled>\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 11h18a9 9 0 0 1-9 9 9 9 0 0 1-9-9z\"\/><path d=\"M8 7.5c0-1.4.9-1.9.9-3.3M12 7.5c0-1.4.9-1.9.9-3.3M16 7.5c0-1.4.9-1.9.9-3.3\"\/><\/svg>\n      <span>饮食<\/span>\n    <\/button>\n  <\/div>\n<\/aside>\n\n  <!-- 右侧主内容区 -->\n  <main class=\"main-area\">\n    <div class=\"main-inner\">\n      <!-- 删掉了原来的 mainEmpty，让内容区默认展示 -->\n\n            <div class=\"detail-page show\" id=\"detailPage\">\n\n  <!-- ===== Tab 1：综合（合并 记录 + 趋势） ===== -->\n  <div class=\"tab-content show\" id=\"tab-combined\">\n\n        <!-- ===== 全新的页面网格排版 ===== -->\n    <div class=\"new-layout-grid\" id=\"weightOverview\">\n      \n            <!-- ✅ 第一行（统一大卡片，内部横向分为：图标 \/ 头像 \/ 数据） -->\n      <div class=\"layout-row row-top\">\n        <!-- 四卡片统一容器 -->\n        <div class=\"top-cards-flex\">\n          \n          <!-- 模块 1：头像、用户名、设置图标 -->\n          <div class=\"top-card-item card-user\">\n            <div class=\"user-card\" id=\"topUserInfoClickArea\" style=\"background:transparent; padding:0; width: 100%; cursor: pointer; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center;\" title=\"点击修改个人信息\">\n              <div id=\"userCardHasData\" style=\"display:none; flex-direction:column; align-items:center; justify-content:center; width:100%;\">\n                <div class=\"user-card-avatar\" id=\"topUserAvatar\" style=\"margin-bottom: 12px; width: 70px; height: 70px;\"><\/div>\n                <div class=\"user-card-name-row\" style=\"display:flex; flex-direction:row; align-items:center; justify-content:center; gap:6px; width:100%;\">\n                  <span class=\"user-card-name\" id=\"topUserName\" style=\"font-size: 18px;\"><\/span>\n                <\/div>\n              <\/div>\n              <div id=\"userCardEmpty\" style=\"display:flex; flex-direction:column; gap:8px; width:100%;\">\n                <button class=\"btn-primary-sm\" id=\"emptyCreateBtn\">创建用户<\/button>\n                <button class=\"btn-secondary-sm\" id=\"emptyImportBtn\">导入数据<\/button>\n              <\/div>\n            <\/div>\n          <\/div>\n\n          <!-- 模块 2：性别、年龄、身高 -->\n          <div class=\"top-card-item\">\n            <div class=\"col-info\" id=\"topInfoCol3\" style=\"gap:12px; width:100%;\">\n              <div class=\"top-info-item\" onclick=\"openBasicEditModal('gender')\">\n                <span class=\"top-info-label\">性别<\/span>\n                <span class=\"top-info-value\" id=\"topInfoGenderVal\">--<\/span>\n              <\/div>\n              <div class=\"top-info-item\" onclick=\"openBasicEditModal('birth')\">\n                <span class=\"top-info-label\">年龄<\/span>\n                <span class=\"top-info-value\" id=\"topInfoAgeVal\">--<\/span>\n              <\/div>\n              <div class=\"top-info-item\" onclick=\"openBasicEditModal('height')\">\n                <span class=\"top-info-label\">身高<\/span>\n                <span class=\"top-info-value\" id=\"topInfoHeightVal\">--<\/span>\n              <\/div>\n            <\/div>\n          <\/div>\n\n          <!-- 模块 3：基础代谢、BMI、体脂率 -->\n          <div class=\"top-card-item\">\n            <div class=\"col-info\" id=\"topInfoCol1\" style=\"gap:12px; width:100%;\"><\/div>\n          <\/div>\n\n          <!-- 模块 4：体型示意图小人、体型文字 -->\n          <div class=\"top-card-item\" style=\"justify-content:center;\">\n            <div class=\"col-figure\" id=\"topFigureCol\" style=\"width:100%; height:100%; justify-content:center; gap:2px;\">\n              <div class=\"body-figure\" id=\"bodyFigure\" style=\"width: 100%; height: 138px; margin-bottom: 0;\"><\/div>\n              <div class=\"body-shape-label\" id=\"bodyShapeLabel\" style=\"text-align: center; font-size: 13px; font-weight: 500; color: var(--text); line-height:1.3;\"><\/div>\n            <\/div>\n          <\/div>\n\n        <\/div>\n      <\/div>\n\n      <!-- ✅ 第二行（左右两栏） -->\n      <div class=\"layout-row row-two-col\">\n        <!-- 左栏：拆分为上下两部分 -->\n        <div class=\"col-half left-col\">\n                    <div class=\"stat-panel\" style=\"margin-bottom:0;\">\n            <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;\">\n              <h3 class=\"viz-panel-title\" style=\"margin-bottom:0;\">减重进展<\/h3>\n              <button class=\"top-icon-btn\" id=\"openPKBtn\" aria-label=\"PK 对比\" style=\"width:28px; height:28px;\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 21h8M12 17v4M6 3h12v5a6 6 0 0 1-12 0z\"\/><path d=\"M6 5H3v2a4 4 0 0 0 4 4M18 5h3v2a4 4 0 0 1-4 4\"\/><\/svg>\n              <\/button>\n            <\/div>\n            \n            <!-- 圆弧与数据容器 -->\n            <div style=\"position:relative; width:100%; max-width: 420px; margin: 0 auto; height: 140px;\">\n              <!-- 圆弧 SVG -->\n              <svg viewBox=\"0 0 240 140\" style=\"width:100%; height:100%; display:block;\">\n                <defs>\n                  <linearGradient id=\"progGrad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\">\n                    <stop offset=\"0%\" stop-color=\"var(--primary)\" stop-opacity=\"0.5\"\/>\n                    <stop offset=\"100%\" stop-color=\"var(--primary)\"\/>\n                  <\/linearGradient>\n                <\/defs>\n                <!-- 刻度线 -->\n                <g transform=\"translate(120, 125)\" stroke=\"var(--border)\" stroke-width=\"1.5\" stroke-linecap=\"round\">\n                  <line x1=\"-70\" y1=\"0\" x2=\"-78\" y2=\"0\" transform=\"rotate(-90)\" \/>\n                  <line x1=\"-70\" y1=\"0\" x2=\"-78\" y2=\"0\" transform=\"rotate(-60)\" \/>\n                  <line x1=\"-70\" y1=\"0\" x2=\"-78\" y2=\"0\" transform=\"rotate(-30)\" \/>\n                  <line x1=\"-70\" y1=\"0\" x2=\"-78\" y2=\"0\" transform=\"rotate(0)\" \/>\n                  <line x1=\"-70\" y1=\"0\" x2=\"-78\" y2=\"0\" transform=\"rotate(30)\" \/>\n                  <line x1=\"-70\" y1=\"0\" x2=\"-78\" y2=\"0\" transform=\"rotate(60)\" \/>\n                  <line x1=\"-70\" y1=\"0\" x2=\"-78\" y2=\"0\" transform=\"rotate(90)\" \/>\n                <\/g>\n                <!-- 背景轨道 -

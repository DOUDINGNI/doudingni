te-arrow:hover{background:var(--green-soft);color:var(--green)}\n  .back-today-btn{\n    border:none;background:none;color:var(--muted);\n    font-size:12px;cursor:pointer;transition:.15s;\n    padding:4px 8px;border-radius:7px;margin-left:8px;\n    white-space:nowrap;font-family:inherit;\n  }\n  .back-today-btn:hover{background:var(--green-soft);color:var(--green)}\n  .show-archived-btn{\n    border:none;background:none;color:var(--muted);\n    font-size:11.5px;cursor:pointer;transition:.15s;\n    padding:4px 8px;border-radius:7px;margin-left:2px;\n    white-space:nowrap;font-family:inherit;\n  }\n  .show-archived-btn:hover{background:var(--green-soft);color:var(--green)}\n  .show-archived-btn.on{background:var(--green-soft);color:var(--green);font-weight:600}\n\n  .view-head{\n    display:flex;justify-content:space-between;align-items:flex-end;\n    gap:18px;flex-wrap:wrap;margin-bottom:18px;\n  }\n  .view-head h1{font-size:23px;font-weight:700;letter-spacing:-.3px;line-height:1.3}\n  .date-line{font-size:12.5px;color:var(--muted);margin-top:7px}\n\n  .card{\n    background:var(--card);border-radius:var(--radius);border:none;\n    padding:18px;box-shadow:0 2px 10px rgba(30,42,38,.06);\n  }\n  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}\n  .card-head h2{font-size:14px;font-weight:700;letter-spacing:.3px}\n  .pill{\n    font-size:11.5px;color:var(--green);background:var(--green-soft);\n    padding:3px 10px;border-radius:999px;font-weight:600;white-space:nowrap;\n  }\n  .primary-btn{\n    background:var(--green);color:#fff;border:none;border-radius:10px;\n    padding:10px 20px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;\n  }\n  .primary-btn:hover{background:var(--green-2)}\n  .danger-btn{\n    background:var(--danger);color:#fff;border:none;border-radius:10px;\n    padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;\n  }\n  .danger-btn:hover{filter:brightness(. flex-direction:column;gap:0;\n    max-height:480px;overflow-y:auto;overflow-x:hidden;\n    padding-right:12px; \/* 👈 右侧留白，防止滚动条遮挡文字 *\/\n    padding-left:6px;  \/* 👈 左侧稍微往里缩一点 *\/\n    scrollbar-width: none; \/* Firefox 默认隐藏滚动条 *\/\n  }\n  \n  \/* 针对 Chrome\/Safari 默认隐藏滚动条 *\/\n  .done-tree::-webkit-scrollbar {\n    width: 6px;\n  }\n  .done-tree::-webkit-scrollbar-thumb {\n    background: transparent; \/* 平时透明不可见 *\/\n    border-radius: 10px;\n  }\/* 👇 鼠标悬停在列表上时，才显示滚动条 *\/\n  .done-tree:hover::-webkit-scrollbar-thumb {\n    background: var(--aux-line);\n  }\n  .done-tree:hover::-webkit-scrollbar-thumb:hover {\n    background: var(--muted);\n  }\n  .done-tree::-webkit-scrollbar-track {\n    background: transparent;\n  }\n\n  .done-tree-item{\n    padding:7px 0;border-bottom:1px solid var(--aux-line);\n  }\n  .done-tree-item:last-child{border-bottom:none}\n\n  .done-row{\n    display:flex;align-items:flex-start;gap:10px;\n  }\n\n  .done-name-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}\n\n  .done-cat-name{\n    font-size:12.5px;font-weight:700;line-height:1.4;\n    display:flex;align-items:center;gap:6px;word-break:break-word;\n  }\n  .done-cat-dot{width:8px;height:8px;border-radius:2px;flex:none}\n\n  .done-top-name{\n    font-size:12px;font-weight:400;color:var(--ink);\n    line-height:1.4;word-break:break-word;padding-left:14px;\n  }\n  .done-top-name .fix-tag{\n    display:inline-block;font-size:10px;padding:0 6px;border-radius:99px;\n    background:var(--green-soft);color:var(--green);margin-left:4px;font-weight:600;\n  }\n\n.done-sub-name{\n  font-size:11px;font-weight:400;color:var(--muted);\n  line-height:1.4;word-break:break-word;padding-left:26px;\n}\n\n.done-item-row {\n  display: flex;\n  align-items: flex-start;\n  gap: 10px;\n}\n\n.done-cat-name,\n.done-top-name,\n.done-sub-name {\n  flex: 1;\n  min-width: 0;\n}\n\n.done-cat-name {\n  font-size: 12.5px; font-weight: 700;\n  display: flex; align-items: center; gap: 6px;\n}\n.done-c ],['w2','Task 2']] }\n];\n\n\/* 系统固定真题任务定义 *\/\nconst SYSTEM_FIXED_TASKS = {\n  listening: { id:'__sys_fixed_listening__', text:'听力真题练习', category:'listening' },\n  reading:   { id:'__sys_fixed_reading__',   text:'阅读真题练习', category:'reading' },\n  writing:   { id:'__sys_fixed_writing__',   text:'写作真题练习', category:'writing' }\n};\nconst SYSTEM_FIXED_IDS = Object.keys(SYSTEM_FIXED_TASKS).map(k => SYSTEM_FIXED_TASKS[k].id);\n\n\/* 真题元数据：根据学科返回可选项 *\/\nconst PAPER_OPTIONS = {\n  listening: {\n    label: '听力真题',\n    parts: [\n      { key:'l1', name:'Part 1' },\n      { key:'l2', name:'Part 2' },\n      { key:'l3', name:'Part 3' },\n      { key:'l4', name:'Part 4' }\n    ]\n  },\n  reading: {\n    label: '阅读真题',\n    parts: [\n      { key:'r1', name:'Passage 1' },\n      { key:'r2', name:'Passage 2' },\n      { key:'r3', name:'Passage 3' }\n    ]\n  },\n  writing: {\n    label: '写作真题',\n    parts: [\n      { key:'w1', name:'Task 1' },\n      { key:'w2', name:'Task 2' }\n    ]\n  }\n};\n\n\/* ============================================================\n   日期工具\n============================================================ *\/\nfunction dkey(d){\n  d = d || new Date();\n  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');\n}\nfunction logicalNow(){\n  const n = new Date();\n  if(n.getHours() < DAY_START_HOUR){\n    const d = new Date(n); d.setDate(d.getDate() - 1); return d;\n  }\n  return n;\n}\nfunction logicalKey(){ return dkey(logicalNow()); }\nfunction shiftDateKey(key, days){\n  const d = new Date(key + 'T00:00:00'); d.setDate(d.getDate() + days); return dkey(d);\n}\nfunction fmtHM(ts){\n  if(!ts) return '--:--';\n  const d = new Date(ts);\n  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');\n}\nfunction timeStrToTs(dateKey, hm){\n  if(!hm) return 0;\n  const parts = hm.split(':');\n  const h = Number(parts[0]), m = Number(parts[1]);\n  if(isNaN(h) || isNaN(m)) return 0;\n  const d = new Date(dateKey + 'T00:00:00');\n  d.setHours(h, m, 0, 0);\n  return d.getTime();\n}\nfunction fmtDurationParts(sec){\n  const totalMin = Math.max(0, Math.round(sec \/ 60));\n  const h = Math.floor(totalMin \/ 60);\n  const m = totalMin % 60;\n  return { h, m, totalMin };\n}\nfunction fmtDuration(sec){\n  const { h, m } = fmtDurationParts(sec);\n  if(h > 0 && m > 0) return h + ' 小时 ' + m + ' 分钟';\n  if(h > 0) return h + ' 小时';\n  return m + ' 分钟';\n}\nfunction fmtDurationShort(sec){\n  const { h, m } = fmtDurationParts(sec);\n  if(h > 0 && m > 0) return h + '小时 ' + m + '分钟';\n  if(h > 0) return h + '小时';\n  return m + '分钟';\n}\nfunction hmToMinutes(h, m){\n  const hh = Number(h) || 0;\n  const mm = Number(m) || 0;\n  return hh * 60 + mm;\n}\n\n\/* ============================================================\n   主题 \/ 颜色\n============================================================ *\/\nfunction hexToRgb(hex){\n  const h = hex.replace('#','');\n  const n = h.length === 3 ? h.split('').map(c => c+c).join('') : h;\n  const num = parseInt(n, 16);\n  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };\n}\nfunction rgbToHex(r,g,b){\n  return '#' + [r,g,b].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');\n}\nfunction mixHex(hex, target, ratio){\n  const a = hexToRgb(hex), b = hexToRgb(target);\n  return rgbToHex(\n    a.r + (b.r - a.r) * ratio,\n    a.g + (b.g - a.g) * ratio,\n    a.b + (b.b - a.b) * ratio\n  );\n}\nfunction lighten(hex, ratio){ return mixHex(hex, '#ffffff', ratio); }\nfunction darken(hex, ratio){ return mixHex(hex, '#000000', ratio); }\n\nfunction getCategories(){\n  const custom = state.settings.catColors || {};\n  return DEFAULT_CATEGORIES.map(c => ({\n    ...c,\n    color: custom[c.key] && custom[c.key].color ? custom[c.key].color : c.color,\n    soft: custom[c.key] && custom[c.key].soft ? custom[c.key].soft : c.soft\n  }));\n}\nfunction catByKey(key){ return getCategories().find(c => c.key === key); }\nfunction catName(key){ const c = catByKey(key); return c ? c.name : key; }\nfunction catStyle(c){\n  return '--cat-color:' + c.color + ';--cat-soft:' + c.soft + ';';\n}\n\n\/* 供工作台外壳调用的对外接口：统一设置主题与主题色 *\/\nfunction setLangTheme(theme, themeColor){\n  if(theme === 'dark' || theme === 'light'){\n    state.settings.theme = theme;\n  }\n  if(themeColor){\n    state.settings.themeColor = themeColor;\n  }\n  applyTheme();\n  try{ if(typeof save === 'function') save(); }catch(e){}\n}\nfunction getLangTheme(){\n  return { theme: state.settings.theme || 'light', themeColor: state.settings.themeColor || '#2f5d50' };\n}\n\nfunction openLangGoalModal(){\n  const goals = state.settings.goals || {};\n  document.getElementById('examDate').value = state.settings.examDate || '';\n  document.getElementById('goalL').value = goals.l || '';\n  document.getElementById('goalR').value = goals.r || '';\n  document.getElementById('goalW').value = goals.w || '';\n  document.getElementById('goalS').value = goals.s || '';\n  document.getElementById('goalModal').classList.add('show');\n}\nfunction openLangCatColorModal(){\n  openSettingsModal();\n}\nfunction langExportBackup(){ exportBackup(); }\nfunction langImportBackup(file){ importBackup(file); }\n\nfunction applyTheme(){\n  const theme = state.settings.theme || 'light';\n  const themeColor = state.settings.themeColor || '#2f5d50';\n  \/\/ 辅助色已固定为工作台统一配色，不再允许用户自定义\n  const aux = DEFAULT_AUX;\n  const cats = getCategories();\n  const auxSet = DEFAULT_AUX_SETTINGS;\n\n  document.documentElement.setAttribute('data-theme', theme);\n\n  const root = document.documentElement.style;\n\n  if(theme === 'dark'){\n    const auxDark = mixHex(aux, '#2c2c2c', 0.88);\n    const auxLineDark = mixHex(aux, '#2c2c2c', 0.7);\n    root.setProperty('--bg', '#2c2c2c');\n    root.setProperty('--card', '#1a1a1a');\n    root.setProperty('--ink', '#eeeeee');\n    root.setProperty('--muted', '#aaaaaa');\n    root.setProperty('--aux', auxDark);\n    root.setProperty('--aux-bg', auxSet.inputBg ? mixHex(auxSet.inputBg, '#1a1a1a', 0.9) : mixHex(aux, '#1a1a1a', 0.9));\n    root.setProperty('--aux-line', auxLineDark);\n    root.setProperty('--line', auxLineDark);\n    root.setProperty('--green', lighten(themeColor, 0.55));\n    root.setProperty('--green-2', lighten(themeColor, 0.35));\n    root.setProperty('--green-soft', mixHex(themeColor, '#1a1a1a', 0.82));\n    root.setProperty('--blue', lighten(themeColor, 0.45));\n    root.setProperty('--blue-soft', mixHex(themeColor, '#1a1a1a', 0.8));\n    root.setProperty('--page-bg', auxSet.pageBg ? mixHex(auxSet.pageBg, '#2c2c2c', 0.88) : auxDark);\n    root.setProperty('--start-bg', auxSet.startBtn ? mixHex(auxSet.startBtn, '#1a1a1a', 0.7) : mixHex(themeColor, '#1a1a1a', 0.82));\n    root.setProperty('--start-fg', '#000');\n    root.setProperty('--progress-track', auxSet.progressTrack ? mixHex(auxSet.progressTrack, '#2c2c2c', 0.7) : auxLineDark);\n    root.setProperty('--toggle-bg', auxSet.toggleBg ? mixHex(auxSet.toggleBg, '#2c2c2c', 0.7) : auxLineDark);\n    root.setProperty('--toggle-active', '#1a1a1a');\n    root.setProperty('--checkin-off', auxSet.checkinOff ? mixHex(auxSet.checkinOff, '#2c2c2c', 0.7) : auxLineDark);\n    root.setProperty('--checkin-on', auxSet.checkinOn ? lighten(auxSet.checkinOn, 0.3) : lighten(themeColor, 0.55));\n  } else {\n    const auxLine = darken(aux, 0.06);\n    const auxBg = lighten(aux, 0.6);\n    root.setProperty('--bg', auxSet.pageBg || aux);\n    root.setProperty('--card', '#ffffff');\n    root.setProperty('--ink', '#2b3a4a');\n    root.setProperty('--muted', '#7b8b9a');\n    root.setProperty('--aux', aux);\n    root.setProperty('--aux-bg', auxBg);\n    root.setProperty('--aux-line', auxLine);\n    root.setProperty('--line', auxLine);\n    root.setProperty('--green', themeColor);\n    root.setProperty('--green-2', darken(themeColor, 0.12));\n    root.setProperty('--green-soft', lighten(themeColor, 0.86));\n    root.setProperty('--blue', '#3f6f8f');\n    root.setProperty('--blue-soft', '#e4eef4');\n    root.setProperty('--page-bg', auxSet.pageBg || aux);\n    root.setProperty('--start-bg', auxSet.startBtn || lighten(themeColor, 0.86));\n    root.setProperty('--start-fg', '#000');\n    root.setProperty('--progress-track', auxSet.progressTrack || auxLine);\n    root.setProperty('--toggle-bg', auxSet.toggleBg || auxLine);\n    root.setProperty('--toggle-active', '#ffffff');\n    root.setProperty('--checkin-off', auxSet.checkinOff || auxLine);\n    root.setProperty('--aux-bg', auxSet.inputBg || auxBg);\n    root.setProperty('--checkin-on', auxSet.checkinOn || themeColor);\n  }\n\n  cats.forEach(c => {\n    root.setProperty('--cat-' + c.key + '-color', c.color);\n    root.setProperty('--cat-' + c.key + '-soft', theme === 'dark'\n      ? mixHex(c.color, '#1a1a1a', 0.78)\n      : c.soft);\n  });\n}\n\n\/* ============================================================\n   存储\n============================================================ *\/\nfunction uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }\n\nfunction makeEmptyState(){\n  const s = {\n    settings: {\n      examDate: '', goals: {}, catOrder: DEFAULT_CAT_ORDER.slice(), taskOrder: {},\n      theme:'light', themeColor:'#2f5d50', auxColor:DEFAULT_AUX,\n      auxSettings: Object.assign({}, DEFAULT_AUX_SETTINGS),\n      catColors:{}\n    },\n    tasks: {}, dayStatus: {}, papers: {},\n    collapsedTasks: [] \/\/ 👈 新增：保存折叠的任务 ID\n  };\n  DEFAULT_CATEGORIES.forEach(c => s.settings.taskOrder[c.key] = []);\n  return s;\n}\n\nfunction normalizeStatus(st){\n  if(!st) st = {};\n  if(!Array.isArray(st.sessions)) st.sessions = [];\n  if(typeof st.runningStart !== 'number') st.runningStart = 0;\n  return st;\n}\n\n\/* 确保 3 个系统固定真题一级任务存在 *\/\nfunction ensureSystemFixedTasks(s){\n  if(!s || !s.tasks) return;\n  if(!s.settings) s.settings = {};\n  if(!s.settings.taskOrder) s.settings.taskOrder = {};\n  DEFAULT_CATEGORIES.forEach(c => {\n    if(!Array.isArray(s.settings.taskOrder[c.key])) s.settings.taskOrder[c.key] = [];\n  });\n\n  Object.keys(SYSTEM_FIXED_TASKS).forEach(catKey => {\n    const def = SYSTEM_FIXED_TASKS[catKey];\n    if(!s.tasks[def.id]){\n      s.tasks[def.id] = {\n        id: def.id,\n        text: def.text,\n        note: '',\n        category: def.category,\n        parentId: '',\n        completeRule: 'any',\n        startDate: '2000-01-01',\n        endDate: null,\n        createdAt: 0,\n        archived: false,\n        deleted: false,\n        isSystemFixed: true,\n        fixedCategory: def.category\n      };\n    } else {\n      const t = s.tasks[def.id];\n      t.isSystemFixed = true;\n      t.fixedCategory = def.category;\n      t.text = def.text;\n      t.category = def.category;\n      t.parentId = '';\n      t.archived = false;\n      t.deleted = false;\n      t.startDate = t.startDate || '2000-01-01';\n      t.endDate = null;\n    }\n    \/* 确保在对应学科任务顺序最前面 *\/\n    const order = s.settings.taskOrder[def.category];\n    const idx = order.indexOf(def.id);\n    if(idx > 0){\n      order.splice(idx, 1);\n      order.unshift(def.id);\n    } else if(idx === -1){\n      order.unshift(def.id);\n    }\n  });\n}\n\nfunction migrateSubtasksToChildTasks(s){\n  if(!s || !s.tasks) return;\n  const order = s.settings && s.settings.taskOrder ? s.settings.taskOrder : {};\n  Object.keys(s.tasks).forEach(id => {\n    const t = s.tasks[id];\n    if(!t) return;\n    if(!Array.isArray(t.subtasks) || !t.subtasks.length) return;\n    if(!Array.isArray(order[t.category])) order[t.category] = [];\n    t.subtasks.forEach(sub => {\n      const childId = sub.id || uid();\n      if(s.tasks[childId]) return;\n      s.tasks[childId] = {\n        id: childId,\n        text: sub.text || '二级任务',\n        note: '',\n        category: t.category,\n        parentId: id,\n        startDate: t.startDate || dkey(),\n        endDate: t.endDate || null,\n        createdAt: Date.now(),\n        archived: !!t.archived,\n        deleted: false\n      };\n      order[t.category].push(childId);\n    });\n    Object.keys(s.dayStatus || {}).forEach(k => {\n      const dd = s.dayStatus[k];\n      const st = dd && dd.statuses && dd.statuses[id];\n      if(!st || !st.subtaskStatus) return;\n      Object.keys(st.subtaskStatus).forEach(sid => {\n        const ss = st.subtaskStatus[sid];\n        if(!ss) return;\n        if(!dd.statuses[sid]) dd.statuses[sid] = { done:false, sessions:[], runningStart:0 };\n        dd.statuses[sid].done = !!ss.done;\n        if(Array.isArray(ss.sessions)) dd.statuses[sid].sessions = ss.sessions.slice();\n        if(ss.runningStart) dd.statuses[sid].runningStart = ss.runningStart;\n      });\n    });\n    t.subtasks = [];\n    if(t.completeRule !== 'any') t.completeRule = 'all';\n  });\n}\n\nfunction normalizeState(s){\n  if(!s) return makeEmptyState();\n  if(!s.collapsedTasks) s.collapsedTasks = []; \/\/ 👈 新增：兼容老数据\n  if(s.days && !s.tasks){\n    const n = makeEmptyState();\n    n.settings.examDate = (s.settings && s.settings.examDate) || '';\n    n.settings.goals = (s.settings && s.settings.goals) || {};\n    n.settings.theme = (s.settings && s.settings.theme) || 'light';\n    n.settings.themeColor = (s.settings && s.settings.themeColor) || '#2f5d50';\n    n.settings.auxColor = (s.settings && (s.settings.auxColor || s.settings.pageBg)) || DEFAULT_AUX;\n    n.settings.catColors = (s.settings && s.settings.catColors) || {};\n    n.settings.catOrder = (s.settings && Array.isArray(s.settings.catOrder) && s.settings.catOrder.length)\n      ? s.settings.catOrder.slice() : DEFAULT_CAT_ORDER.slice();\n    n.papers = s.papers || {};\n    Object.keys(s.days).sort().forEach(k => {\n      const day = s.days[k]; if(!day) return;\n      if(!n.dayStatus[k]) n.dayStatus[k] = { statuses: {}, fixed:{} };\n      DEFAULT_CATEGORIES.forEach(c => {\n        (day.tasks && day.tasks[c.key] || []).forEach(t => {\n          const taskId = t.id || uid();\n          if(!n.tasks[taskId]){\n            n.tasks[taskId] = {\n              id: taskId, text: t.text || '', note: t.note || '',\n              category: c.key, parentId: '', startDate: t.startDate || k, endDate: t.endDate || null,\n              createdAt: Date.now(), archived: false, deleted: false\n            };\n            n.settings.taskOrder[c.key].push(taskId);\n          }\n          const st = { done: !!t.done, sessions: [], runningStart: 0 };\n          if(t.seconds){\n            const base = timeStrToTs(k, '21:00') || Date.now();\n            st.sessions.push({ id: uid(), startAt: base - t.seconds*1000, endAt: base });\n          }\n          if(t.startedAt) st.runningStart = t.startedAt;\n          n.dayStatus[k].statuses[taskId] = st;\n        });\n      });\n    });\n    s = n;\n  }\n\n  s.settings = s.settings || {};\n  s.settings.goals = s.settings.goals || {};\n  s.settings.theme = s.settings.theme === 'dark' ? 'dark' : 'light';\n  s.settings.themeColor = s.settings.themeColor || '#2f5d50';\n  s.settings.auxColor = s.settings.auxColor || s.settings.pageBg || DEFAULT_AUX;\n  delete s.settings.pageBg;\n  s.settings.auxSettings = Object.assign({}, DEFAULT_AUX_SETTINGS, s.settings.auxSettings || {});\n  s.settings.catColors = s.settings.catColors || {};\n  s.settings.catOrder = Array.isArray(s.settings.catOrder) && s.settings.catOrder.length\n    ? s.settings.catOrder : DEFAULT_CAT_ORDER.slice();\n  s.settings.catOrder = s.settings.catOrder.filter(k => k !== 'papers');\n  s.settings.taskOrder = s.settings.taskOrder || {};\n  DEFAULT_CATEGORIES.forEach(c => {\n    if(!Array.isArray(s.settings.taskOrder[c.key])) s.settings.taskOrder[c.key] = [];\n  });\n  s.tasks = s.tasks || {}; s.dayStatus = s.dayStatus || {}; s.papers = s.papers || {};\n\n  DEFAULT_CATEGORIES.forEach(c => {\n    s.settings.taskOrder[c.key] = s.settings.taskOrder[c.key].filter(id => s.tasks[id]);\n  });\n  Object.keys(s.tasks).forEach(id => {\n    const t = s.tasks[id];\n    if(typeof t.note !== 'string') t.note = '';\n    if(typeof t.archived !== 'boolean') t.archived = false;\n    if(typeof t.deleted !== 'boolean') t.deleted = false;\n    if(!t.category || !DEFAULT_CATEGORIES.find(c => c.key === t.category)) t.category = 'vocab';\n    if(typeof t.parentId !== 'string') t.parentId = '';\n    if(t.parentId === id || (t.parentId && !s.tasks[t.parentId])) t.parentId = '';\n    if(t.isSystemFixed) t.completeRule = 'any';\n    else if(t.parentId) t.completeRule = 'all';\n    else if(t.completeRule !== 'any') t.completeRule = 'all';\n    if(typeof t.isSystemFixed !== 'boolean') t.isSystemFixed = false;\n    if(typeof t.isPaperSub !== 'boolean') t.isPaperSub = false;\n    if(t.isPaperSub && !t.paperDate) {\n      \/* 旧数据兼容：如果没有paperDate，默认取创建日期，若还没有就取今天 *\/\n      t.paperDate = t.createdAt ? dkey(new Date(t.createdAt)) : logicalKey();\n    }\n  });\n  Object.keys(s.tasks).forEach(id => {\n    const t = s.tasks[id];\n    if(t.parentId){\n      const p = s.tasks[t.parentId];\n      if(p){\n        t.category = p.category;\n        let cur = p, guard = 0;\n        while(cur && cur.parentId && guard++ < 100){\n          if(cur.parentId === id){ t.parentId = ''; break; }\n          cur = s.tasks[cur.parentId];\n        }\n      } else {\n        t.parentId = '';\n      }\n    }\n  });\n\n  migrateSubtasksToChildTasks(s);\n\n  Object.keys(s.dayStatus).forEach(k => {\n    const dd = s.dayStatus[k];\n    if(!dd.statuses) dd.statuses = {};\n    Object.keys(dd.statuses).forEach(id => {\n      dd.statuses[id] = normalizeStatus(dd.statuses[id]);\n      if(dd.statuses[id].subtaskStatus) dd.statuses[id].subtaskStatus = {};\n    });\n    if(!dd.fixed) dd.fixed = {};\n  });\n\n  Object.keys(s.tasks).forEach(id => {\n    const t = s.tasks[id];\n    if(t.parentId && s.tasks[t.parentId]) t.category = s.tasks[t.parentId].category;\n  });\n\n  ensureSystemFixedTasks(s);\n\n  return s;\n}\n\nfunction loadState(){\n  try{\n    const raw = localStorage.getItem(STORE_KEY);\n    if(raw) return normalizeState(JSON.parse(raw));\n  }catch(e){}\n  for(const key of LEGACY_KEYS){\n    try{\n      const old = localStorage.getItem(key);\n      if(old) return normalizeState(JSON.parse(old));\n    }catch(e){}\n  }\n  return makeEmptyState();\n}\nlet state = loadState();\n\nfunction save(){\n  try{\n    localStorage.setItem(STORE_KEY, JSON.stringify(state));\n  }catch(e){\n    if(e && (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED')){\n      toast('存储空间已满，修改可能未保存。请在设置里导出备份并清理旧数据。');\n    } else {\n      toast('保存失败：浏览器存储不可用');\n    }\n    console.error('save failed', e);\n  }\n}\n\nfunction exportBackup(){\n  try{\n    const data = JSON.stringify(state, null, 2);\n    const blob = new Blob([data], { type: 'application\/json' });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url;\n    a.download = 'ielts-desk-backup-' + dkey() + '.json';\n    document.body.appendChild(a);\n    a.click();\n    a.remove();\n    setTimeout(() => URL.revokeObjectURL(url), 1000);\n    toast('已导出备份');\n  }catch(e){\n    toast('导出失败');\n  }\n}\n\nfunction importBackup(file){\n  const reader = new FileReader();\n  reader.onload = () => {\n    try{\n      const obj = JSON.parse(reader.result);\n      const next = normalizeState(obj);\n      askConfirm('导入备份？', '这会覆盖当前全部数据，且不可撤销。', () => {\n        state = next;\n        save();\n        applyTheme();\n        renderAll();\n        toast('导入成功');\n      }, '确定导入');\n    }catch(e){\n      toast('文件格式有误');\n    }\n  };\n  reader.readAsText(file);\n}\n\nfunction getDayStatus(dateKey){\n  if(!state.dayStatus[dateKey]){\n    state.dayStatus[dateKey] = { statuses: {}, focus: 0, log: '', mood: 0, fixed:{} };\n  }\n  const dd = state.dayStatus[dateKey];\n  if(!dd.fixed) dd.fixed = {};\n  return dd;\n}\n\nfunction getTaskStatus(dateKey, taskId){\n  const d = getDayStatus(dateKey);\n  if(!d.statuses[taskId]){\n    d.statuses[taskId] = { done: false, sessions: [], runningStart: 0 };\n  } else {\n    normalizeStatus(d.statuses[taskId]);\n  }\n  return d.statuses[taskId];\n}\n\nfunction taskAppliesTo(task, dateKey){\n  if(!task) return false;\n  if(task.startDate && dateKey < task.startDate) return false;\n  if(task.endDate && dateKey > task.endDate) return false;\n  return true;\n}\n\nlet showArchived = false;\n\/\/ 👇 改为从 state 中读取折叠状态\nlet collapsedTasks = new Set(state.collapsedTasks || []);  \n\nfunction sortTasksTree(list, catKey){\n  const byParent = {};\n  list.forEach(t => {\n    const p = t.parentId || '';\n    if(!byParent[p]) byParent[p] = [];\n    byParent[p].push(t);\n  });\n  const orderArr = state.settings.taskOrder[catKey] || [];\n  const sortFn = (a, b) => {\n    const ia = orderArr.indexOf(a.id), ib = orderArr.indexOf(b.id);\n    if(ia === -1 && ib === -1) return 0;\n    if(ia === -1) return 1;\n    if(ib === -1) return -1;\n    return ia - ib;\n  };\n  const result = [];\n  function walk(parentId){\n    (byParent[parentId] || []).slice().sort(sortFn).forEach(t => {\n      result.push(t);\n      walk(t.id);\n    });\n  }\n  walk('');\n  return result;\n}\n\nfunction getTasksForDate(dateKey, includeArchived){\n  const result = {};\n  DEFAULT_CATEGORIES.forEach(c => {\n    result[c.key] = [];\n    \n    \/\/ 用来快速判断某个任务（或其父级）在今天是否应该显示\n    const taskValidityCache = {};\n\n    const isTaskValidToday = (id) => {\n      if (taskValidityCache[id] !== undefined) return taskValidityCache[id];\n      \n      const t = state.tasks[id];\n      if (!t || t.deleted) return false;\n      if (t.archived && !includeArchived) return false;\n      \n      \/\/ 如果自身时间不匹配\n      if (!taskAppliesTo(t, dateKey)) {\n        taskValidityCache[id] = false;\n        return false;\n      }\n      \n      \/\/ 真题子任务特有：只在那一天显示\n      if (t.isPaperSub && t.paperDate && t.paperDate !== dateKey) {\n        taskValidityCache[id] = false;\n        return false;\n      }\n\n      \/\/ 👇 最核心的“连坐”逻辑：如果它有父级，但父级在今天不显示，它自己也不能显示\n      if (t.parentId) {\n        if (!state.tasks[t.parentId]) {\n           taskValidityCache[id] = false;\n           return false;\n        }\n        if (!isTaskValidToday(t.parentId)) {\n           taskValidityCache[id] = false;\n           return false;\n        }\n      }\n      \n      taskValidityCache[id] = true;\n      return true;\n    };\n\n    (state.settings.taskOrder[c.key] || []).forEach(taskId => {\n      const task = state.tasks[taskId];\n      if(!task || task.category !== c.key) return;\n      \n      \/\/ 使用递归校验，确保父级不在的话，子级也不推入列表\n      if (!isTaskValidToday(taskId)) return;\n      \n      if(task.parentId && !state.tasks[task.parentId]) {\n        task.parentId = ''; \n      }\n      \n      result[c.key].push(task);\n    });\n    \n    result[c.key] = sortTasksTree(result[c.key], c.key);\n  });\n  return result;\n}\n\n\/* ============================================================\n   统一时长 \/ 状态工具\n============================================================ *\/\nfunction sessionSeconds(s){ return Math.max(0, (s.endAt - s.startAt) \/ 1000); }\n\nfunction statusSeconds(st, includeRunning){\n  if(!st) return 0;\n  let sec = 0;\n  (st.sessions || []).forEach(s => sec += sessionSeconds(s));\n  if(includeRunning !== false && st.runningStart){\n    sec += Math.max(0, (Date.now() - st.runningStart) \/ 1000);\n  }\n  return sec;\n}\n\nfunction finishRunning(st, endAt){\n  if(!st || !st.runningStart) return null;\n  if(!st.sessions) st.sessions = [];\n  const sess = { id: uid(), startAt: st.runningStart, endAt: endAt || Date.now() };\n  st.sessions.push(sess);\n  st.runningStart = 0;\n  return sess;\n}\n\n\/* ============================================================\n   一致性修复\n============================================================ *\/\nfunction reconcileDayStatus(){\n  Object.keys(state.dayStatus).forEach(k => {\n    const dd = state.dayStatus[k];\n    if(!dd || !dd.statuses) return;\n    Object.keys(dd.statuses).forEach(id => {\n      const t = state.tasks[id];\n      if(!t || t.deleted){\n        delete dd.statuses[id];\n        return;\n      }\n      if(!taskAppliesTo(t, k)){\n        if(dd.statuses[id].sessions && dd.statuses[id].sessions.length){\n          const target = getTaskStatus(t.startDate || k, id);\n          dd.statuses[id].sessions.forEach(s => target.sessions.push(s));\n        }\n        dd.statuses[id].sessions = [];\n        dd.statuses[id].done = false;\n        dd.statuses[id].runningStart = 0;\n      }\n    });\n  });\n\n  Object.keys(state.tasks).forEach(id => {\n    const t = state.tasks[id];\n    if(t && t.parentId && state.tasks[t.parentId]){\n      if(t.category !== state.tasks[t.parentId].category){\n        const oldCat = t.category;\n        const newCat = state.tasks[t.parentId].category;\n        if(state.settings.taskOrder[oldCat]){\n          state.settings.taskOrder[oldCat] = state.settings.taskOrder[oldCat].filter(x => x !== id);\n        }\n        if(!state.settings.taskOrder[newCat]) state.settings.taskOrder[newCat] = [];\n        state.settings.taskOrder[newCat].push(id);\n        t.category = newCat;\n      }\n    }\n  });\n\n  DEFAULT_CATEGORIES.forEach(c => {\n    state.settings.taskOrder[c.key] = (state.settings.taskOrder[c.key] || []).filter(id => state.tasks[id] && !state.tasks[id].deleted);\n  });\n\n  \/\/ 👇 新增：强制清理“丢失父级”或“错误挂载”的二级任务\n  Object.keys(state.tasks).forEach(id => {\n    const t = state.tasks[id];\n    if (!t) return;\n    \n    \/\/ 如果它的 parentId 指向的任务已经不存在了，或者等于自己，强制清空\n    if (t.parentId && (!state.tasks[t.parentId] || t.parentId === id)) {\n      t.parentId = '';\n    }\n  });\n\n  ensureSystemFixedTasks(state);\n}\n\n\/* ============================================================\n   通用工具\n============================================================ *\/\nfunction escapeHtml(s){\n  return String(s).replace(\/[&<>\"']\/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n}\nfunction fmtTimer(sec){\n  sec = Math.max(0, Math.floor(sec));\n  const h = Math.floor(sec\/3600), m = Math.floor(sec%3600\/60), s = sec%60;\n  if(h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');\n  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');\n}\nlet toastTimer;\nfunction toast(msg){\n  const el = document.getElementById('toast');\n  el.textContent = msg;\n  el.classList.add('show');\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);\n}\nfunction showModalError(boxId, msgId, msg) {\n  const box = document.getElementById(boxId);\n  const el = document.getElementById(msgId);\n  if(el) {\n    el.textContent = msg;\n    el.style.display = 'block';\n    el.style.animation = 'none';\n    el.offsetHeight;\n    el.style.animation = 'shake 0.3s ease';\n  }\n  if(box) box.scrollTo({ top: 0, behavior: 'smooth' });\n}\nfunction clearModalError(msgId) {\n  const el = document.getElementById(msgId);\n  if(el) {\n    el.style.display = 'none';\n    el.textContent = '';\n  }\n}\nfunction iconSvg(key){\n  const ic = ICONS[key] || ICONS.vocab;\n  return '<svg viewBox=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" ' +\n    'stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">' + ic + '<\/svg>';\n}\n\nfunction orderedCategories(){\n  const map = {};\n  DEFAULT_CATEGORIES.forEach(c => map[c.key] = c);\n  const result = [];\n  state.settings.catOrder.forEach(k => {\n    if(map[k]){ result.push(map[k]); delete map[k]; }\n  });\n  Object.keys(map).forEach(k => result.push(map[k]));\n  return result.map(c => catByKey(c.key));\n}\n\n\/* ============================================================\n   确认弹窗\n============================================================ *\/\nlet confirmCallback = null;\nfunction askConfirm(title, text, onOk, okLabel){\n  document.getElementById('confirmTitle').textContent = title;\n  document.getElementById('confirmText').textContent = text || '';\n  document.getElementById('confirmOk').textContent = okLabel || '确定';\n  confirmCallback = onOk;\n  document.getElementById('confirmModal').classList.add('show');\n}\nfunction closeConfirm(){\n  document.getElementById('confirmModal').classList.remove('show');\n  confirmCallback = null;\n}\ndocument.getElementById('confirmCancel').addEventListener('click', closeConfirm);\ndocument.getElementById('confirmOk').addEventListener('click', () => {\n  const cb = confirmCallback; closeConfirm(); if(cb) cb();\n});\ndocument.getElementById('confirmModal').addEventListener('click', e => {\n  if(e.target.id === 'confirmModal') closeConfirm();\n});\n\n\/* ============================================================\n   顶部 \/ 侧栏\n============================================================ *\/\nfunction calcOverallGoal(goals){\n  const vals = ['l','r','w','s'].map(k => Number(goals[k]) || 0).filter(v => v > 0);\n  if(!vals.length) return '';\n  const avg = vals.reduce((a,b) => a+b, 0) \/ vals.length;\n  return (Math.round(avg * 2) \/ 2).toFixed(1);\n}\n\nfunction renderHeader(){\n  const now = new Date();\n  const h = now.getHours();\n  let greet = '今天也来学一点';\n  if(h < DAY_START_HOUR) greet = '夜深了，好好休息才能迎接更好的一天';\n  else if(h < 11) greet = '早上好，先做最小的一件事';\n  else if(h < 14) greet = '中午好，来一段专注吧';\n  else if(h < 18) greet = '下午好，保持节奏';\n  else if(h < 22) greet = '晚上好，今天还差一点点';\n  else greet = '夜深了，收个尾就休息';\n  document.getElementById('greeting').textContent = greet;\n\n  const num = document.getElementById('cdNum');\n  const dateEl = document.getElementById('cdDate');\n  const goalsEl = document.getElementById('sideGoals');\n  const goals = state.settings.goals || {};\n\n  if(!state.settings.examDate){\n    num.textContent = '--';\n    dateEl.textContent = '点击设置考试日期';\n  } else {\n    const exam = new Date(state.settings.examDate + 'T00:00:00');\n    const base = new Date(); base.setHours(0,0,0,0);\n    const diff = Math.round((exam - base)\/86400000);\n    num.textContent = Math.max(0, diff);\n    dateEl.textContent = state.settings.examDate;\n  }\n\n  const overall = calcOverallGoal(goals);\n  if(overall){\n    const parts = [];\n    if(goals.l) parts.push('听力 ' + goals.l);\n    if(goals.r) parts.push('阅读 ' + goals.r);\n    if(goals.w) parts.push('写作 ' + goals.w);\n    if(goals.s) parts.push('口语 ' + goals.s);\n    goalsEl.innerHTML = '<div class=\"goals-main\">目标分数 ' + escapeHtml(overall) + '<\/div>' +\n      (parts.length ? '<span class=\"goals-sub\">' + parts.join(' · ') + '<\/span>' : '');\n  } else {\n    goalsEl.innerHTML = '<span class=\"goals-empty\">未设置目标分数<\/span>';\n  }\n}\n\n\/* ============================================================\n   日期导航\n============================================================ *\/\nlet viewDate = logicalKey();\n\nfunction updateDateNav(){\n  document.getElementById('viewDateInput').value = viewDate;\n  const d = new Date(viewDate + 'T00:00:00');\n  const w = '日一二三四五六'[d.getDay()];\n  document.getElementById('dateText').textContent =\n    (d.getMonth()+1) + '月' + d.getDate() + '日 · 周' + w;\n  const isToday = (viewDate === logicalKey());\n  document.getElementById('backToday').hidden = isToday;\n\n  const archBtn = document.getElementById('showArchivedBtn');\n  archBtn.classList.toggle('on', showArchived);\n  archBtn.textContent = showArchived ? '隐藏已归档任务' : '显示已归档任务';\n}\n\nfunction setViewDate(k){\n  viewDate = k;\n  updateDateNav();\n  renderPlan();\n}\n\ndocument.getElementById('dateBtn').addEventListener('click', () => {\n  const inp = document.getElementById('viewDateInput');\n  inp.value = viewDate;\n  try { if(typeof inp.showPicker === 'function'){ inp.showPicker(); return; } } catch(e){}\n  inp.focus(); inp.click();\n});\ndocument.getElementById('prevDay').addEventListener('click', () => setViewDate(shiftDateKey(viewDate, -1)));\ndocument.getElementById('nextDay').addEventListener('click', () => setViewDate(shiftDateKey(viewDate, 1)));\ndocument.getElementById('backToday').addEventListener('click', () => setViewDate(logicalKey()));\ndocument.getElementById('viewDateInput').addEventListener('change', e => {\n  const v = e.target.value;\n  if(v) setViewDate(v); else e.target.value = viewDate;\n});\ndocument.getElementById('showArchivedBtn').addEventListener('click', () => {\n  showArchived = !showArchived;\n  updateDateNav();\n  renderPlan();\n});\n\n\/* ============================================================\n   每日任务渲染\n============================================================ *\/\nlet draggedTask = null;\nlet draggedCat = null;\n\nfunction renderCatCard(c, tasks, dateKey, isLive){\n  let doneCount = 0;\n  tasks.forEach(t => { if(getTaskStatus(dateKey, t.id).done) doneCount++; });\n  const total = tasks.length;\n  const pct = total ? Math.round(doneCount\/total * 100) : 0;\n\n  \/\/ 用一个变量记录被折叠的父级ID，这样在循环时就可以跳过它的子项\n  let hideChildrenOf = null;\n\n  const items = tasks.length ? tasks.map(t => {\n    \/\/ 如果当前任务的父级、或爷爷级被折叠了，直接返回空，不渲染\n    if (t.parentId) {\n      if (t.parentId === hideChildrenOf) return '';\n      const parentTask = state.tasks[t.parentId];\n      if (parentTask && parentTask.parentId && parentTask.parentId === hideChildrenOf) return '';\n    }\n\n    const st = getTaskStatus(dateKey, t.id);\n    const running = !!st.runningStart;\n    const hasTime = running || (st.sessions || []).length > 0;\n    const isSub = !!t.parentId;\n    const isSystemFixed = !!t.isSystemFixed;\n    const isPaperSub = !!t.isPaperSub;\n\n    \/* 系统固定真题任务 *\/\n    if(isSystemFixed){\n      return '<li class=\"task system-fixed' + (st.done ? ' done' : '') + '\" data-cat=\"' + c.key + '\" data-id=\"' + t.id + '\" data-fixed=\"1\" style=\"' + catStyle(c) + '\">' +\n        '<div class=\"check\" data-cat=\"' + c.key + '\" data-id=\"' + t.id + '\">' + (st.done ? '✓' : '') + '<\/div>' +\n        '<div class=\"task-body\" data-fixed-manage=\"' + t.id + '\" data-cat=\"' + c.key + '\">' +\n          '<div class=\"task-text\">' + escapeHtml(t.text) + '<\/div>' +\n        '<\/div>' +\n        '<div class=\"task-actions\">' +\n          '<button class=\"fixed-paper-btn\" data-fixed-add=\"' + t.id + '\" data-cat=\"' + c.key + '\" style=\"' + catStyle(c) + '\">+ 添加真题<\/button>' +\n        '<\/div>' +\n      '<\/li>';\n    }\n\n    \/\/ 判断有没有子任务\n    const hasChildren = tasks.some(x => x.parentId === t.id);\n    const isCollapsed = collapsedTasks.has(t.id);\n    \/\/ 如果这个任务被折叠了，告诉后面的子任务要隐藏\n    if (isCollapsed && hasChildren) {\n      hideChildrenOf = t.id;\n    }\n\n    let actionsHtml = '';\n    if(isPaperSub){\n      actionsHtml = '<div class=\"task-actions\">' +\n        (hasTime ? '<span class=\"timer-display\" style=\"color:' + c.color + '\" data-tcat=\"' + c.key + '\" data-tid=\"' + t.id + '\">' + fmtTimer(statusSeconds(st)) + '<\/span>' : '') +\n        (isLive && !t.archived ? '<button class=\"start-btn' + (running ? ' on' : '') + '\" data-cat=\"' + c.key + '\" data-id=\"' + t.id + '\">' + (running ? '结束学习' : '开始学习') + '<\/button>' : '') +\n      '<\/div>';\n    } else if(hasTime && !hasChildren){ \n      actionsHtml = '<div class=\"task-actions\">' +\n        '<span class=\"timer-display\" style=\"color:' + c.color + '\" data-tcat=\"' + c.key + '\" data-tid=\"' + t.id + '\">' + fmtTimer(statusSeconds(st)) + '<\/span>' +\n        (isLive && !t.archived ? '<button class=\"start-btn' + (running ? ' on' : '') + '\" data-cat=\"' + c.key + '\" data-id=\"' + t.id + '\">' + (running ? '结束学习' : '开始学习') + '<\/button>' : '') +\n      '<\/div>';\n    } else if(hasTime && hasChildren){ \n      actionsHtml = '<div class=\"task-actions\">' +\n        '<span class=\"timer-display\" style=\"color:' + c.color + '\" data-tcat=\"' + c.key + '\" data-tid=\"' + t.id + '\">' + fmtTimer(statusSeconds(st)) + '<\/span>' +\n      '<\/div>';\n    } else if(isLive && !t.archived && !hasChildren && !isPaperSub){\n      actionsHtml = '<div class=\"task-actions\">' +\n        '<button class=\"start-btn\" data-cat=\"' + c.key + '\" data-id=\"' + t.id + '\">开始学习<\/button>' +\n      '<\/div>';\n    }\n\n    const archivedBadge = t.archived ? '<span class=\"archived-badge\">已归档<\/span>' : '';\n    const noteHtml = t.note ? '<div class=\"task-note\">' + escapeHtml(t.note) + '<\/div>' : '';\n    const parentTaskRef = t.parentId ? state.tasks[t.parentId] : null;\n    const isSubSub = isSub && parentTaskRef && !!parentTaskRef.parentId;\n    const boldStyle = (isSub || isSubSub) ? '' : ' style=\"font-weight:700;\"';\n\n        let prefixHtml = '';\n    if (isSubSub) {\n      prefixHtml = '<span class=\"subsub-indent\">└<\/span>';\n    } else if (isSub) {\n      prefixHtml = '<span class=\"sub-indent\">└<\/span>';\n    }\n\n    \/\/ 将折叠按钮放在名字后面，并加大尺寸\n    let toggleHtml = '';\n    if (hasChildren) {\n      \/\/ 使用 SVG 绘制折叠箭头，大小更可控\n      const arrowIcon = isCollapsed \n        ? '<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"9 18 15 12 9 6\"><\/polyline><\/svg>'\n        : '<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"6 9 12 15 18 9\"><\/polyline><\/svg>';\n        \n      toggleHtml = '<span class=\"toggle-btn\" data-toggle-task=\"' + t.id + '\" style=\"cursor:pointer; margin-left:8px; color:var(--muted); display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; vertical-align:middle;\">' + arrowIcon + '<\/span>';\n    }\n\n    return '<li class=\"task' + (st.done ? ' done' : '') + (t.archived ? ' archived' : '') + (isSubSub ? ' subsub-level' : (isSub ? ' sub-level' : '')) + '\" draggable=\"true\" data-cat=\"' + c.key + '\" data-id=\"' + t.id + '\" style=\"' + catStyle(c) + '\">' +\n      prefixHtml +\n      '<div class=\"check\" data-cat=\"' + c.key + '\" data-id=\"' + t.id + '\">' + (st.done ? '✓' : '') + '<\/div>' +\n      '<div class=\"task-body\" data-cat=\"' + c.key + '\" data-id=\"' + t.id + '\">' +\n        '<div class=\"task-text\"' + boldStyle + ' style=\"display:flex; align-items:center;\">' + \n          '<span>' + escapeHtml(t.text) + archivedBadge + '<\/span>' + \n          toggleHtml + \n        '<\/div>' +\n        noteHtml +\n      '<\/div>' + actionsHtml +\n    '<\/li>';\n  }).join('') : '<li class=\"empty\">还没有任务，点右上角 + 新建<\/li>';\n\n  return '<div class=\"cat-card\" data-cat=\"' + c.key + '\" style=\"' + catStyle(c) + '\">' +\n    '<div class=\"cat-head\" draggable=\"true\">' +\n      '<div class=\"cat-ico\">' + iconSvg(c.key) + '<\/div>' +\n      '<div class=\"cat-name\">' + c.name + '<\/div>' +\n      '<span class=\"cat-count\">' + doneCount + '\/' + total + '<\/span>' +\n      '<div class=\"cat-head-right\">' +\n        '<button class=\"add-icon-btn\" data-add-cat=\"' + c.key + '\" title=\"新建任务\">+<\/button>' +\n      '<\/div>' +\n    '<\/div>' +\n    '<div class=\"cat-bar\"><div style=\"width:' + pct + '%\"><\/div><\/div>' +\n    '<ul class=\"cat-tasks\">' + items + '<\/ul>' +\n  '<\/div>';\n}\n\nfunction renderPlan(){\n  reconcileDayStatus();\n  const tasksByCat = getTasksForDate(viewDate, showArchived);\n  const isLive = (viewDate === logicalKey());\n  const ordered = orderedCategories();\n  const half = Math.ceil(ordered.length \/ 2);\n  const left = ordered.slice(0, half);\n  const right = ordered.slice(half);\n\n  document.getElementById('catColLeft').innerHTML =\n    left.map(c => renderCatCard(c, tasksByCat[c.key] || [], viewDate, isLive)).join('');\n  document.getElementById('catColRight').innerHTML =\n    right.map(c => renderCatCard(c, tasksByCat[c.key] || [], viewDate, isLive)).join('');\n}\n\nfunction toggleTask(dateKey, cat, taskId){\n  const task = state.tasks[taskId];\n  if(!task) return;\n  const st = getTaskStatus(dateKey, taskId);\n  finishRunning(st);\n  st.done = !st.done;\n  save();\n  if(st.done && dateKey === logicalKey()) toast('完成一件');\n}\n\nlet pendingFinish = null;\n\nfunction startLearning(dateKey, taskId){\n  const st = getTaskStatus(dateKey, taskId);\n  if(st.runningStart) return;\n  st.runningStart = Date.now();\n  save();\n  renderPlan();\n}\nfunction openFinishModal(dateKey, taskId){\n  const st = getTaskStatus(dateKey, taskId);\n  if(!st.runningStart) return;\n  const startAt = st.runningStart;\n  const endAt = Date.now();\n  pendingFinish = { dateKey, taskId, startAt, endAt };\n  document.getElementById('finishTime').textContent = fmtHM(startAt) + ' – ' + fmtHM(endAt);\n  document.getElementById('finishMins').textContent = Math.max(0, Math.round((endAt - startAt)\/60000)) + ' 分钟';\n  document.getElementById('finishModal').classList.add('show');\n}\n\ndocument.getElementById('finishOk').addEventListener('click', () => {\n  if(pendingFinish){\n    const { dateKey, taskId, endAt } = pendingFinish;\n    const st = getTaskStatus(dateKey, taskId);\n    finishRunning(st, endAt);\n    st.done = true;\n    \n    const task = state.tasks[taskId];\n    if (task && task.parentId) {\n      applyCompleteRuleToTask(task.parentId, dateKey);\n    } else if (task && !task.parentId) {\n      applyCompleteRuleToTask(taskId, dateKey);\n      \/\/ 新增：如果是一级任务，子任务也一起打钩\n      getChildTasks(taskId).forEach(c => {\n        getTaskStatus(dateKey, c.id).done = true;\n      });\n    }\n    \/* 新增：如果该任务属于系统固定真题，也刷新父级 *\/\n    if (task && task.parentId && state.tasks[task.parentId] && state.tasks[task.parentId].isSystemFixed) {\n       applyCompleteRuleToTask(task.parentId, dateKey);\n    }\n\n    save();\n    pendingFinish = null;\n    document.getElementById('finishModal').classList.remove('show');\n    renderPlan();\n    if(editTaskId === taskId) renderEditSessionList();\n    toast('已记录本次学习');\n  }\n});\n\ndocument.getElementById('finishDelete').addEventListener('click', () => {\n  if(pendingFinish){\n    const { dateKey, taskId } = pendingFinish;\n    askConfirm('确定删除本次专注时间吗？', '删除后这段时间不会计入专注记录。', () => {\n      const st = getTaskStatus(dateKey, taskId);\n      st.runningStart = 0;\n      save();\n      pendingFinish = null;\n      document.getElementById('finishModal').classList.remove('show');\n      renderPlan();\n      if(editTaskId === taskId) renderEditSessionList();\n      toast('已删除本次专注');\n    }, '确定删除');\n  }\n});\n\ndocument.getElementById('finishModal').addEventListener('click', e => {\n  if(e.target.id === 'finishModal'){\n    pendingFinish = null;\n    e.currentTarget.classList.remove('show');\n  }\n});\n\n\/* ============================================================\n   学科 \/ 层级 下拉工具\n============================================================ *\/\nfunction fillCategorySelect(sel, selectedKey){\n  sel.innerHTML = DEFAULT_CATEGORIES.map(c =>\n    '<option value=\"' + c.key + '\"' + (c.key === selectedKey ? ' selected' : '') + '>' + c.name + '<\/option>'\n  ).join('');\n}\nfunction fillParentSelect(sel, catKey, excludeId, selectedId){\n  const tops = (state.settings.taskOrder[catKey] || [])\n    .map(id => state.tasks[id])\n    .filter(t => {\n      \/\/ 👇 关键修复：必须是有效任务、未删除、不是系统固定任务，且绝对没有 parentId（即真正的一级任务）\n      if (!t || t.deleted || t.isSystemFixed) return false;\n      if (t.parentId && t.parentId !== '') return false; \n      if (t.id === excludeId) return false;\n      \/\/ 可选：如果这个一级任务今天\/当前不生效，也不显示（取决于你的习惯，一般不需要加）\n      return true;\n    });\n  if(!tops.length){\n    sel.innerHTML = '<option value=\"\">（该学科暂无一级任务）<\/option>';\n    return;\n  }\n  sel.innerHTML = tops.map(t =>\n    '<option value=\"' + t.id + '\"' + (t.id === selectedId ? ' selected' : '') + '>' + escapeHtml(t.text) + '<\/option>'\n  ).join('');\n}\nfunction updateParentRowVisibility(levelValue, parentRowEl, parentSel, catKey, excludeId, selectedId){\n  const isSub = levelValue === 'sub';\n  parentRowEl.hidden = !isSub;\n  if(isSub) fillParentSelect(parentSel, catKey, excludeId, selectedId);\n}\n\n\/* 填充“所属二级任务”下拉：列出该学科所有二级任务（parentId 指向一级任务） *\/\nfunction fillSubParentSelect(sel, catKey, excludeId, selectedId){\n  const order = state.settings.taskOrder[catKey] || [];\n  const subs = order\n    .map(id => state.tasks[id])\n    .filter(t => t && !t.deleted && t.parentId && state.tasks[t.parentId] && !state.tasks[t.parentId].parentId && t.id !== excludeId);\n  if(!subs.length){\n    sel.innerHTML = '<option value=\"\">（该学科暂无二级任务）<\/option>';\n    return;\n  }\n  sel.innerHTML = subs.map(t =>\n    '<option value=\"' + t.id + '\"' + (t.id === selectedId ? ' selected' : '') + '>' + escapeHtml(t.text) + '<\/option>'\n  ).join('');\n}\n\nfunction updateAddParentVisibility(levelValue){\n  const parentRow = document.getElementById('amParentRow');\n  const subParentRow = document.getElementById('amSubParentRow');\n  const cat = document.getElementById('amCategory').value || (addTarget && addTarget.cat);\n  if(levelValue === 'sub'){\n    parentRow.hidden = false;\n    subParentRow.hidden = true;\n    fillParentSelect(document.getElementById('amParent'), cat, null, null);\n  } else if(levelValue === 'subsub'){\n    parentRow.hidden = true;\n    subParentRow.hidden = false;\n    fillSubParentSelect(document.getElementById('amSubParent'), cat, null, null);\n  } else {\n    parentRow.hidden = true;\n    subParentRow.hidden = true;\n  }\n}\n\n\/* ============================================================\n   真题选择弹窗（新版）\n============================================================ *\/\nlet pickerState = null;\n\nfunction openPaperPicker(systemTaskId){\n  const task = state.tasks[systemTaskId];\n  if(!task || !task.isSystemFixed) return;\n  const catKey = task.fixedCategory;\n  const opt = PAPER_OPTIONS[catKey];\n  if(!opt) return;\n\n  pickerState = {\n    systemTaskId,\n    catKey,\n    selected: new Set(),\n    options: opt\n  };\n\n  document.getElementById('ppmTitle').textContent = '选择' + opt.label;\n  document.getElementById('paperPickerModal').classList.add('show');\n  renderPicker();\n}\n\nfunction renderPicker(){\n  if(!pickerState) return;\n  const { selected, options, catKey } = pickerState;\n  const container = document.getElementById('ppmListContainer');\n  \n  let html = '';\n  BOOKS.forEach(b => {\n    html += '<div class=\"ppm-academic-title\">剑雅 ' + b + '<\/div>';\n    TESTS.forEach(t => {\n      html += '<div class=\"ppm-test-block\">';\n      html += '<div class=\"ppm-test-title\">Test ' + t + '<\/div>';\n      html += '<div class=\"ppm-parts-row\">';\n      \n      options.parts.forEach(p => {\n        const pid = b + '-t' + t + '-' + p.key;\n        const isOn = selected.has(pid) ? ' on' : '';\n        html += '<button class=\"ppm-part-btn' + isOn + '\" data-ppm-part=\"' + pid + '\">' + p.name + '<\/button>';\n      });\n      \n      html += '<\/div><\/div>';\n    });\n  });\n\n  container.innerHTML = html;\n  renderPickerSelected();\n}\n\nfunction pickerPartName(pid){\n  if(!pickerState) return pid;\n  const parts = pid.split('-');\n  const partKey = parts[2];\n  const p = pickerState.options.parts.find(x => x.key === partKey);\n  return p ? p.name : partKey;\n}\n\nfunction renderPickerSelected(){\n  if(!pickerState) return;\n  const { selected } = pickerState;\n  const textEl = document.getElementById('ppmSelectedText');\n  if(!selected.size){\n    textEl.textContent = '还没有选择条目';\n    textEl.style.color = 'var(--muted)';\n    textEl.style.fontStyle = 'normal';\n    return;\n  }\n  \n  const list = Array.from(selected).map(pid => {\n    const parts = pid.split('-');\n    return '剑雅 ' + parts[0] + ' · Test ' + parts[1].replace('t','') + ' · ' + pickerPartName(pid);\n  });\n  \n  textEl.textContent = list.join('，');\n  textEl.style.color = 'var(--green)';\n  textEl.style.fontStyle = 'normal';\n}\n\n\/\/ 绑定点击事件（采用事件委托，避免重复绑定）\ndocument.getElementById('ppmListContainer').addEventListener('click', e => {\n  const btn = e.target.closest('[data-ppm-part]');\n  if(!btn || !pickerState) return;\n  const pid = btn.dataset.ppmPart;\n  \n  if(pickerState.selected.has(pid)) {\n    pickerState.selected.delete(pid);\n    btn.classList.remove('on');\n  } else {\n    pickerState.selected.add(pid);\n    btn.classList.add('on');\n  }\n  renderPickerSelected();\n});\n\ndocument.getElementById('ppmCancel').addEventListener('click', () => {\n  pickerState = null;\n  document.getElementById('paperPickerModal').classList.remove('show');\n});\ndocument.getElementById('paperPickerModal').addEventListener('click', e => {\n  if(e.target.id === 'paperPickerModal'){\n    pickerState = null;\n    e.currentTarget.classList.remove('show');\n  }\n});\n\ndocument.getElementById('ppmConfirm').addEventListener('click', () => {\n  if(!pickerState) return;\n  if(!pickerState.selected.size){ toast('请至少选择一个部分'); return; }\n  const { systemTaskId, catKey, selected, options } = pickerState;\n  const parts = Array.from(selected).sort();\n\n  let added = 0;\n  parts.forEach(pid => {\n    \/* 检查是否已存在同一真题子任务（同名、同父级、未删除） *\/\n    const label = buildPaperTaskName(catKey, pid);\n    const exists = Object.keys(state.tasks).some(id => {\n      const t = state.tasks[id];\n      return t && !t.deleted && t.parentId === systemTaskId && t.text === label;\n    });\n    if(exists) return;\n\n    const taskId = uid();\n    state.tasks[taskId] = {\n      id: taskId,\n      text: label,\n      note: '',\n      category: catKey,\n      parentId: systemTaskId,\n      completeRule: 'all',\n      startDate: viewDate,\n      endDate: viewDate,\n      createdAt: Date.now(),\n      archived: false,\n      deleted: false,\n      isSystemFixed: false,\n      isPaperSub: true,\n      paperDate: viewDate, \/* 新增：保存当前查看的日期 *\/\n      paperMeta: { book: pid.split('-')[0], test: pid.split('-')[1], part: pid.split('-')[2] }\n    };\n    if(!state.settings.taskOrder[catKey]) state.settings.taskOrder[catKey] = [];\n    state.settings.taskOrder[catKey].push(taskId);\n    added++;\n  });\n\n  save();\n  pickerState = null;\n  document.getElementById('paperPickerModal').classList.remove('show');\n  renderPlan();\n  if(fixedPaperManageId) renderFixedPaperList();\n  if(added > 0) toast('已添加 ' + added + ' 条真题');\n  else toast('这些真题已存在');\n});\n\nfunction buildPaperTaskName(catKey, pid){\n  const parts = pid.split('-');\n  const b = parts[0], t = parts[1].replace('t',''), partKey = parts[2];\n  const p = PAPER_OPTIONS[catKey].parts.find(x => x.key === partKey);\n  const partName = p ? p.name : partKey;\n  return '剑雅 ' + b + ' · Test ' + t + ' · ' + partName;\n}\n\n\/* ============================================================\n   固定真题一级任务管理弹窗\n============================================================ *\/\nlet fixedPaperManageId = null;\nlet fixedPaperManageDate = null; \/\/ 新增：记录弹窗对应的日期\n\nfunction openFixedPaperManage(systemTaskId){\n  const task = state.tasks[systemTaskId];\n  if(!task || !task.isSystemFixed) return;\n  fixedPaperManageId = systemTaskId;\n  fixedPaperManageDate = viewDate; \/\/ 新增：把当前日期存下来\n  document.getElementById('fpmTitle').textContent = task.text;\n  renderFixedPaperList();\n  document.getElementById('fixedPaperModal').classList.add('show');\n}\n\nfunction renderFixedPaperList(){\n  if(!fixedPaperManageId) return;\n  const children = Object.keys(state.tasks)\n    .map(id => state.tasks[id])\n    .filter(t => t && !t.deleted && t.parentId === fixedPaperManageId && t.paperDate === fixedPaperManageDate)\n    .sort((a,b) => (a.createdAt || 0) - (b.createdAt || 0));\n\n  const box = document.getElementById('fpmList');\n  if(!children.length){\n    box.innerHTML = '<div class=\"empty\">今日无练习<\/div>';\n    return;\n  }\n  box.innerHTML = children.map(t => {\n    const sec = taskTotalSeconds(t.id);\n    return '<div class=\"record-item\">' +\n      '<div class=\"record-info record-clickable\" data-fpm-open=\"' + t.id + '\">' +\n        '<div class=\"record-name\">' + escapeHtml(t.text) + '<\/div>' +\n        '<div class=\"record-meta\">累计专注 ' + fmtDuration(sec) + '<\/div>' +\n      '<\/div>' +\n      '<button class=\"sub-del-btn\" data-fpm-del=\"' + t.id + '\" title=\"删除这条真题\">×<\/button>' +\n    '<\/div>';\n  }).join('');\n}\n\ndocument.getElementById('fpmList').addEventListener('click', e => {\n  const openBtn = e.target.closest('[data-fpm-open]');\n  if(openBtn){\n    const taskId = openBtn.dataset.fpmOpen;\n    const task = state.tasks[taskId];\n    if(!task) return;\n    document.getElementById('fixedPaperModal').classList.remove('show');\n    fixedPaperManageId = null;\n    openEditModal(task.category, taskId);\n    return;\n  }\n  const delBtn = e.target.closest('[data-fpm-del]');\n  if(delBtn){\n    const taskId = delBtn.dataset.fpmDel;\n    const task = state.tasks[taskId];\n    if(!task) return;\n    askConfirm('确定删除这条真题？', '「' + task.text + '」及其所有专注记录都会删除，不可恢复。', () => {\n      hardRemoveTask(taskId);\n      save();\n      renderPlan();\n      renderFixedPaperList();\n    }, '确定删除');\n    return;\n  }\n});\n\ndocument.getElementById('fpmClose').addEventListener('click', () => {\n  fixedPaperManageId = null;\n  document.getElementById('fixedPaperModal').classList.remove('show');\n});\ndocument.getElementById('fixedPaperModal').addEventListener('click', e => {\n  if(e.target.id === 'fixedPaperModal'){\n    fixedPaperManageId = null;\n    e.currentTarget.classList.remove('show');\n  }\n});\n\n\/* ============================================================\n   新建任务\n============================================================ *\/\nlet addTarget = null;\nlet addSubs = [];\nlet addSubDragId = null;\nlet addSubSubs = [];\nlet addSubSubParentId = null;\n\nlet currentAddParentId = null;\nlet currentAddLevel = 'top';\n\nfunction openAddModal(cat, parentId = '', level = 'top'){\n  clearModalError('amErrorMsg');\n  addTarget = { cat: cat };\n  addSubs = [];\n  addSubSubs = [];\n  currentAddParentId = parentId;\n  currentAddLevel = level;\n\n  document.getElementById('amTaskText').value = '';\n  document.getElementById('amTaskNote').value = '';\n  \n  const parentTask = parentId ? state.tasks[parentId] : null;\n  const finalCat = parentTask ? parentTask.category : cat;\n\n  \/\/ 👇 智能带入父级时间范围\n  let defaultStart = viewDate;\n  let defaultEnd = '';\n  let defaultEndless = true;\n\n  if (parentTask) {\n    \/\/ 如果父级有开始时间，且当前视图日期早于父级开始时间，则默认用父级的\n    if (parentTask.startDate && defaultStart < parentTask.startDate) {\n      defaultStart = parentTask.startDate;\n    }\n    \/\/ 如果父级有结束时间，自动填入并取消无限期\n    if (parentTask.endDate) {\n      defaultEnd = parentTask.endDate;\n      defaultEndless = false;\n    }\n  }\n\n  document.getElementById('amStartDate').value = defaultStart;\n  document.getElementById('amEndDate').value = defaultEnd;\n  document.getElementById('amEndless').checked = defaultEndless;\n  document.getElementById('amEndDate').disabled = defaultEndless;\n\n  fillCategorySelect(document.getElementById('amCategory'), finalCat);\n  \n  if (level === 'sub' && parentTask) {\n    \/\/ 情况A：一级任务下的加号 -> 新建二级任务\n    document.getElementById('amTitle').textContent = '新建二级任务';\n    document.getElementById('amCategory').value = parentTask.category;\n    document.getElementById('amLevel').value = 'sub';\n    document.getElementById('amLevel').disabled = true; \/\/ 锁定层级\n    document.getElementById('amParentRow').hidden = false;\n    fillParentSelect(document.getElementById('amParent'), parentTask.category, null, parentId);\n    document.getElementById('amParent').disabled = true; \/\/ 锁定所属父级\n    \n    \/\/ 👇 新建二级任务时，下面所有的添加区域都不要显示\n    document.getElementById('amChildAreas').style.display = 'none';\n  } else if (level === 'subSub' && parentTask) {\n    \/\/ 情况B：二级任务下的加号 -> 新建三级任务\n    document.getElementById('amTitle').textContent = '新建三级任务';\n    document.getElementById('amCategory').value = parentTask.category;\n    document.getElementById('amLevel').value = 'subsub';\n    document.getElementById('amLevel').disabled = true; \n    document.getElementById('amParentRow').hidden = false;\n    \n    \/\/ 👇 修改1：把标题改成“所属二级任务”\n    document.getElementById('amParentLabelText').textContent = '所属二级任务';\n    \n    \/\/ 👇 修改2：清空并填入当前点击的二级任务（parentTask）\n    const parentSel = document.getElementById('amParent');\n    parentSel.innerHTML = '<option value=\"' + parentTask.id + '\" selected>' + escapeHtml(parentTask.text) + '<\/option>';\n    parentSel.disabled = true; \n    \n    \/\/ 👇 新建三级任务时，最底层，什么添加区域都不需要\n    document.getElementById('amChildAreas').style.display = 'none';\n  } else {\n    \/\/ 情况C：直接新建一级任务\n    document.getElementById('amTitle').textContent = '新建任务';\n    document.getElementById('amLevel').value = 'top';\n    document.getElementById('amLevel').disabled = false;\n    document.getElementById('amParentRow').hidden = true;\n    document.getElementById('amParentLabelText').textContent = '所属一级任务'; \/\/ 👈 还原标题\n    document.getElementById('amParent').innerHTML = '';\n    document.getElementById('amParent').disabled = false;\n    \n    \/\/ 👇 新建一级任务时，也不需要显示下方添加区域\n    document.getElementById('amChildAreas').style.display = 'none';\n  }\n\n  renderAddSubList();\n  renderAddSubSubList();\n  const modalEl = document.getElementById('addModal');\n  modalEl.style.zIndex = '10005';\n  modalEl.classList.add('show');\n  setTimeout(() => document.getElementById('amTaskText').focus(), 50);\n}\n\ndocument.getElementById('amEndless').addEventListener('change', e => {\n  const endInput = document.getElementById('amEndDate');\n  endInput.disabled = e.target.checked;\n  if(e.target.checked) {\n    endInput.value = '';\n  } else {\n    \/\/ 👇 取消勾选无限期时，自动填入开始日期（如果没有开始日期就用今天\/当前查看的日期）\n    const startVal = document.getElementById('amStartDate').value;\n    endInput.value = startVal || viewDate;\n  }\n});\n\ndocument.getElementById('amCategory').addEventListener('change', e => {\n  updateAddParentVisibility(document.getElementById('amLevel').value);\n  refreshAmSubSubParentSelect();\n});\ndocument.getElementById('amLevel').addEventListener('change', e => {\n  updateAddParentVisibility(e.target.value);\n});\n\nfunction renderAddSubList(){\n  const list = document.getElementById('amSubList');\n  if(!addSubs.length){\n    list.innerHTML = '<li class=\"sub-edit-empty\">还没有二级任务<\/li>';\n    return;\n  }\n  list.innerHTML = addSubs.map(s =>\n    '<li class=\"sub-edit-item\" draggable=\"true\" data-add-sid=\"' + s.id + '\">' +\n      '<span class=\"sub-edit-text\" data-add-edit=\"' + s.id + '\">' + escapeHtml(s.text) + '<\/span>' +\n      '<button class=\"sub-del-btn\" type=\"button\" data-am-sub-del=\"' + s.id + '\">×<\/button>' +\n    '<\/li>'\n  ).join('');\n}\n\nfunction startAddSubEdit(spanEl){\n  const subId = spanEl.dataset.addEdit;\n  const text = spanEl.textContent;\n  const input = document.createElement('input');\n  input.type = 'text'; input.value = text; input.className = 'sub-inline-input'; input.maxLength = 60;\n  spanEl.replaceWith(input); input.focus(); input.select();\n  const item = input.closest('.sub-edit-item');\n  if(item) item.setAttribute('draggable', 'false');\n  const finish = () => {\n    const s = addSubs.find(x => x.id === subId);\n    if(s && input.value.trim()) s.text = input.value.trim();\n    renderAddSubList();\n  };\n  input.addEventListener('blur', finish);\n  input.addEventListener('keydown', ev => {\n    if(ev.key === 'Enter'){ ev.preventDefault(); input.blur(); }\n    if(ev.key === 'Escape'){ ev.preventDefault(); input.value = text; input.blur(); }\n  });\n}\n\nfunction addAddSub(){\n  const s = { id: uid(), text: '新二级任务' };\n  addSubs.push(s); renderAddSubList();\n  setTimeout(() => {\n    const el = document.querySelector('[data-add-edit=\"' + s.id + '\"]');\n    if(el) startAddSubEdit(el);\n  }, 30);\n}\n\ndocument.getElementById('amSubList').addEventListener('dragstart', e => {\n  if(e.target.closest('input')){ e.preventDefault(); return; }\n  const item = e.target.closest('.sub-edit-item');\n  if(!item) return;\n  addSubDragId = item.dataset.addSid;\n  item.classList.add('dragging');\n  e.dataTransfer.effectAllowed = 'move';\n  e.dataTransfer.setData('text\/plain', 'sub');\n});\ndocument.getElementById('amSubList').addEventListener('dragover', e => {\n  if(!addSubDragId) return;\n  const item = e.target.closest('.sub-edit-item');\n  if(!item || item.dataset.addSid === addSubDragId) return;\n  e.preventDefault();\n  document.querySelectorAll('#amSubList .drag-over').forEach(x => x.classList.remove('drag-over'));\n  item.classList.add('drag-over');\n});\ndocument.getElementById('amSubList').addEventListener('dragleave', e => {\n  const item = e.target.closest('.sub-edit-item');\n  if(item) item.classList.remove('drag-over');\n});\ndocument.getElementById('amSubList').addEventListener('drop', e => {\n  e.preventDefault();\n  if(!addSubDragId) return;\n  const item = e.target.closest('.sub-edit-item');\n  if(!item || item.dataset.addSid === addSubDragId) return;\n  const targetId = item.dataset.addSid;\n  const fromIdx = addSubs.findIndex(s => s.id === addSubDragId);\n  const toIdx = addSubs.findIndex(s => s.id === targetId);\n  if(fromIdx < 0 || toIdx < 0) return;\n  const [moved] = addSubs.splice(fromIdx, 1);\n  addSubs.splice(toIdx, 0, moved);\n  renderAddSubList();\n});\ndocument.getElementById('amSubList').addEventListener('dragend', () => {\n  addSubDragId = null;\n  document.querySelectorAll('#amSubList .dragging, #amSubList .drag-over').forEach(x => {\n    x.classList.remove('dragging');\n    x.classList.remove('drag-over');\n  });\n});\n\nfunction renderAddSubSubList(){\n  const list = document.getElementById('amSubSubList');\n  if(!addSubSubs.length){\n    list.innerHTML = '<li class=\"sub-edit-empty\">还没有三级任务<\/li>';\n    return;\n  }\n  list.innerHTML = addSubSubs.map(s =>\n    '<li class=\"sub-edit-item\"><span class=\"sub-edit-text\">' + escapeHtml(s.text) + '<\/span>' +\n    '<button class=\"sub-del-btn\" type=\"button\" onclick=\"addSubSubs=addSubSubs.filter(x=>x.id!==\\'' + s.id + '\\');renderAddSubSubList()\">×<\/button><\/li>'\n  ).join('');\n}\n\ndocument.getElementById('amSubSubAddBtn').addEventListener('click', () => {\n  const s = { id: uid(), text: '新三级任务' };\n  addSubSubs.push(s);\n  renderAddSubSubList();\n  setTimeout(() => {\n    const li = document.getElementById('amSubSubList').lastElementChild;\n    if(!li) return;\n    const textEl = li.querySelector('.sub-edit-text');\n    const input = document.createElement('input');\n    input.type = 'text'; input.value = s.text; input.className = 'sub-inline-input'; input.maxLength = 60;\n    textEl.replaceWith(input); input.focus(); input.select();\n    const finish = () => {\n      if(input.value.trim()) s.text = input.value.trim();\n      renderAddSubSubList();\n    };\n    input.addEventListener('blur', finish);\n    input.addEventListener('keydown', ev => {\n      if(ev.key === 'Enter'){ ev.preventDefault(); input.blur(); }\n      if(ev.key === 'Escape'){ ev.preventDefault(); input.value = s.text; input.blur(); }\n    });\n  }, 30);\n});\n\nfunction saveNewTask(){\n  const text = document.getElementById('amTaskText').value.trim();\n  if(!text){ toast('请先填写任务内容'); return; }\n  const note = document.getElementById('amTaskNote').value.trim();\n  const startDate = document.getElementById('amStartDate').value || viewDate;\n  const endless = document.getElementById('amEndless').checked;\n  const endDate = endless ? null : (document.getElementById('amEndDate').value || null);\n  if(endDate && endDate < startDate){ \n    showModalError('amBox', 'amErrorMsg', '结束日期不能早于开始日期，已自动为您修正');\n    document.getElementById('amEndDate').value = startDate; \n    return; \n  }\n\n  \/\/ 👇 新增：跨层级时间校验（需要在获取 parentId 之后进行）\n\n  const cat = document.getElementById('amCategory').value || addTarget.cat;\n  const level = document.getElementById('amLevel').value;\n  let parentId = '';\n  if(currentAddLevel === 'subSub'){\n    \/* 三级任务：直接挂在点 + 的那个二级任务下 *\/\n    parentId = currentAddParentId;\n    if(!parentId){ toast('没有找到所属二级任务'); return; }\n  } else if(level === 'sub'){\n    parentId = document.getElementById('amParent').value;\n    if(!parentId){ toast('请选择一个所属一级任务'); return; }\n  }\n  const parentTask = parentId ? state.tasks[parentId] : null;\n  if(parentTask && parentTask.isSystemFixed){ toast('固定真题任务下不能手动添加子任务，请用「+ 添加真题」'); return; }\n    \/\/ 👇 新增：跨层级时间校验\n  if (parentTask) {\n    if (parentTask.startDate && startDate < parentTask.startDate) {\n      showModalError('amBox', 'amErrorMsg', '开始日期不能早于上级任务「' + parentTask.text + '」的开始日期');\n      return;\n    }\n    if (parentTask.endDate && endDate && endDate > parentTask.endDate) {\n      showModalError('amBox', 'amErrorMsg', '结束日期不能晚于上级任务「' + parentTask.text + '」的结束日期');\n      return;\n    }\n    if (parentTask.endDate && !endDate) {\n       showModalError('amBox', 'amErrorMsg', '上级设置了结束日期，本任务不能选择无限期');\n       return;\n    }\n  }\n  if(currentAddLevel === 'subSub' && parentTask && !parentTask.parentId){\n    toast('三级任务的上级必须是二级任务'); return;\n  }\n  const finalCat = parentTask ? parentTask.category : cat;\n\n  const taskId = uid();\n  state.tasks[taskId] = {\n    id: taskId, text: text, note: note, category: finalCat,\n    parentId: parentId,\n    completeRule: 'all',\n    startDate: startDate, endDate: endDate,\n    createdAt: Date.now(), archived: false, deleted: false,\n    isSystemFixed: false,\n    isPaperSub: false\n  };\n  if(!state.settings.taskOrder[finalCat]) state.settings.taskOrder[finalCat] = [];\n  state.settings.taskOrder[finalCat].push(taskId);\n\n  \/\/ 注意：这里不需要处理 addSubs 和 addSubSubs 的预设插入逻辑了\n  \/\/ 因为我们现在采用逐个添加的方式。之前遗留的 addSubs\/addSubSubs 空数组不需要使用\n  \n  save();\n  document.getElementById('addModal').classList.remove('show');\n  renderPlan();\n  \/\/ 刷新当前打开的详情页\n  if (editTaskId) {\n    const t = state.tasks[editTaskId];\n    if (t) openEditModal(t.category, editTaskId);\n  }\n  toast('任务已添加');\n}\n\ndocument.getElementById('amSubAddBtn').addEventListener('click', addAddSub);\ndocument.getElementById('amSave').addEventListener('click', saveNewTask);\ndocument.getElementById('amCancel').addEventListener('click', () => {\n  document.getElementById('addModal').classList.remove('show');\n});\n\ndocument.getElementById('amSubList').addEventListener('click', e => {\n  const textEl = e.target.closest('[data-add-edit]');\n  if(textEl){ startAddSubEdit(textEl); return; }\n  const btn = e.target.closest('[data-am-sub-del]');\n  if(!btn) return;\n  addSubs = addSubs.filter(s => s.id !== btn.dataset.amSubDel);\n  renderAddSubList();\n});\ndocument.getElementById('addModal').addEventListener('click', e => {\n  if(e.target.id === 'addModal') e.currentTarget.classList.remove('show');\n});\n\n\/* ============================================================\n   编辑任务\n============================================================ *\/\nlet editTaskId = null;\nlet draggedSubId = null;\nlet editingSessionId = null;\n\nfunction openEditModal(cat, id){\n  clearModalError('emErrorMsg');\n  const task = state.tasks[id];\n  if(!task) return;\n\n  \/* 系统固定真题任务：打开管理弹窗 *\/\n  if(task.isSystemFixed){\n    openFixedPaperManage(id);\n    return;\n  }\n\n  editTaskId = id;\n  editingSessionId = null;\n\n  const isPaperSub = !!task.isPaperSub;\n\n  document.getElementById('emTaskText').value = task.text;\n  document.getElementById('emTaskText').disabled = isPaperSub;\n  document.getElementById('emTaskNote').value = task.note || '';\n  document.getElementById('emStartDate').value = task.startDate || viewDate;\n  const endless = !task.endDate;\n  document.getElementById('emEndless').checked = endless;\n  const endInput = document.getElementById('emEndDate');\n  endInput.disabled = endless;\n  endInput.value = task.endDate || '';\n\n  fillCategorySelect(document.getElementById('emCategory'), task.category);\n  document.getElementById('emCategory').disabled = isPaperSub;\n  \n  \/\/ 👇 修改1：正确识别三级任务，并设置层级和父级下拉\n  const parentTask = task.parentId ? state.tasks[task.parentId] : null;\n  const isSubSub = !!(parentTask && parentTask.parentId);\n  \n  const levelVal = isSubSub ? 'subsub' : (task.parentId ? 'sub' : 'top');\n  document.getElementById('emLevel').value = levelVal;\n  document.getElementById('emLevel').disabled = isPaperSub;\n  \n  document.getElementById('emParentRow').hidden = !task.parentId;\n  const parentLabelEl = document.getElementById('emParentRow').firstChild; \n  if (parentLabelEl && parentLabelEl.nodeType === 3) {\n    parentLabelEl.textContent = isSubSub ? '所属二级任务' : '所属一级任务';\n  }\n\n  if (task.parentId) {\n    if (isSubSub) {\n      document.getElementById('emParent').innerHTML = '<option value=\"' + parentTask.id + '\" selected>' + escapeHtml(parentTask.text) + '<\/option>';\n    } else {\n      fillParentSelect(document.getElementById('emParent'), task.category, id, task.parentId);\n    }\n  } else {\n    document.getElementById('emParent').innerHTML = '';\n  }\n  document.getElementById('emParent').disabled = isPaperSub;\n\n  \/\/ 👇 只要它有子任务（不管是一级还是二级），都显示完成规则\n  const ruleRow = document.getElementById('emRuleRow');\n  const hasChildren = getChildTasks(id).length > 0;\n  if(hasChildren){\n    ruleRow.hidden = false;\n    document.getElementById('emCompleteRule').value = task.completeRule === 'any' ? 'any' : 'all';\n  } else {\n    ruleRow.hidden = true;\n  }\n\n  const isSub = !!task.parentId;\n  \/\/ 👇 修改2：如果是三级任务或真题子任务，把整个子任务区域（标题、加号、列表）彻底隐藏\n  document.getElementById('emSubList').parentElement.style.display = (isPaperSub || isSubSub) ? 'none' : '';\n  document.getElementById('emSubSubArea').style.display = 'none'; \n\n  const subTitleEl = document.getElementById('emSubTitle');\n  if (subTitleEl) {\n    subTitleEl.textContent = isSub ? '三级任务' : '二级任务';\n  }\n  \n  document.getElementById('emStartDate').closest('label').style.display = isPaperSub ? 'none' : '';\n  document.getElementById('emEndDate').closest('label').style.display = isPaperSub ? 'none' : '';\n  document.getElementById('emEndless').closest('.endless-row').style.display = isPaperSub ? 'none' : '';\n\n  document.getElementById('emSessStart').value = '';\n  document.getElementById('emSessEnd').value = '';\n  document.getElementById('emSessH').value = '';\n  document.getElementById('emSessM').value = '';\n  document.getElementById('emSessAddRow').hidden = true;\n\n  const archBtn = document.getElementById('emArchive');\n  if(isPaperSub){\n    archBtn.style.display = 'none';\n  } else {\n    archBtn.style.display = '';\n    if(task.archived){\n      archBtn.textContent = '取消归档';\n      archBtn.classList.add('is-archived');\n    } else {\n      archBtn.textContent = '归档';\n      archBtn.classList.remove('is-archived');\n    }\n  }\n\n  renderEditSubList();\n  renderEditSessionList();\n  document.getElementById('editModal').classList.add('show');\n  setTimeout(() => { if(!isPaperSub) document.getElementById('emTaskText').focus(); }, 50);\n}\n\ndocument.getElementById('emEndless').addEventListener('change', e => {\n  const endInput = document.getElementById('emEndDate');\n  endInput.disabled = e.target.checked;\n  if(e.target.checked) {\n    endInput.value = '';\n  } else {\n    \/\/ 👇 取消勾选无限期时，自动填入开始日期（如果没有开始日期就用今天\/当前查看的日期）\n    const startVal = document.getElementById('emStartDate').value;\n    endInput.value = startVal || viewDate;\n  }\n});\n\ndocument.getElementById('emCategory').addEventListener('change', e => {\n  const level = document.getElementById('emLevel').value;\n  updateParentRowVisibility(level, document.getElementById('emParentRow'), document.getElementById('emParent'), e.target.value, editTaskId, null);\n});\ndocument.getElementById('emLevel').addEventListener('change', e => {\n  const cat = document.getElementById('emCategory').value;\n  updateParentRowVisibility(e.target.value, document.getElementById('emParentRow'), document.getElementById('emParent'), cat, editTaskId, null);\n  \n  \/\/ 👇 根据是否有下级任务来决定是否显示完成规则\n  const hasChildren = editTaskId ? getChildTasks(editTaskId).length > 0 : false;\n  document.getElementById('emRuleRow').hidden = !hasChildren;\n});\n\nfunction renderEditSessionList(){\n  if(!editTaskId) return;\n  const st = getTaskStatus(viewDate, editTaskId);\n  const list = document.getElementById('emSessionList');\n  const sessions = (st.sessions || []).slice().sort((a,b) => a.startAt - b.startAt);\n  if(!sessions.length){\n    list.innerHTML = '<li class=\"session-empty\">还没有专注记录<\/li>';\n    return;\n  }\n  list.innerHTML = sessions.map(s => {\n    if(editingSessionId === s.id){\n      return '<li class=\"session-item editing\" data-sid=\"' + s.id + '\">' +\n        '<input type=\"time\" class=\"sess-time\" data-sess-start=\"' + s.id + '\" value=\"' + fmtHM(s.startAt) + '\">' +\n        '<span class=\"session-dash\">–<\/span>' +\n        '<input type=\"time\" class=\"sess-time\" data-sess-end=\"' + s.id + '\" value=\"' + fmtHM(s.endAt) + '\">' +\n        '<button class=\"sess-ok\" data-sess-save=\"' + s.id + '\" title=\"保存\">✓<\/button>' +\n        '<button class=\"sess-cancel\" data-sess-cancel=\"' + s.id + '\" title=\"取消\">×<\/button>' +\n      '<\/li>';\n    }\n    return '<li class=\"session-item\" data-sid=\"' + s.id + '\">' +\n      '<span class=\"session-time\">' + fmtHM(s.startAt) + ' – ' + fmtHM(s.endAt) + '<\/span>' +\n      '<span class=\"session-mins\">' + fmtDuration(sessionSeconds(s)) + '<\/span>' +\n      '<button class=\"sess-edit\" data-sess-edit=\"' + s.id + '\" title=\"编辑\">✎<\/button>' +\n      '<button class=\"sess-del\" data-sess-del=\"' + s.id + '\" title=\"删除\">×<\/button>' +\n    '<\/li>';\n  }).join('');\n}\n\ndocument.getElementById('emSessAddBtn').addEventListener('click', () => {\n  const row = document.getElementById('emSessAddRow');\n  row.hidden = !row.hidden;\n  if(!row.hidden) document.getElementById('emSessStart').focus();\n});\n\nfunction getChildTasks(taskId){\n  const task = state.tasks[taskId];\n  if(!task) return [];\n  const arr = state.settings.taskOrder[task.category] || [];\n  return arr.map(id => state.tasks[id])\n    .filter(t => t && !t.deleted && t.parentId === taskId);\n}\n\nfunction renderEditSubList(){\n  if(!editTaskId) return;\n  const task = state.tasks[editTaskId];\n  if(!task) return;\n\n  const list = document.getElementById('emSubList');\n  const allChildren = getChildTasks(editTaskId);\n  const children = allChildren.filter(t => taskAppliesTo(t, viewDate));\n\n  if(!children.length){\n    list.innerHTML = '<li class=\"sub-edit-empty\">点右上角 + 添加<\/li>';\n    return;\n  }\n\n  list.innerHTML = children.map(t => {\n    return '<li class=\"sub-edit-item\" draggable=\"true\" data-child-id=\"' + t.id + '\">' +\n      '<span class=\"sub-edit-text\" data-em-edit=\"' + t.id + '\">' + escapeHtml(t.text) + '<\/span>' +\n    '<\/li>';\n  }).join('');\n}\n\nfunction startEditSubtask(spanEl){\n  if(!editTaskId) return;\n  const childId = spanEl.dataset.emEdit;\n  const child = state.tasks[childId];\n  if(!child) return;\n  if(child.isPaperSub){ toast('真题名称由系统生成，不能修改'); return; }\n  const text = child.text;\n  const input = document.createElement('input');\n  input.type = 'text'; input.value = text; input.className = 'sub-inline-input'; input.maxLength = 60;\n  spanEl.replaceWith(input);\n  const item = input.closest('.sub-edit-item');\n  if(item) item.setAttribute('draggable', 'false');\n  input.focus(); input.select();\n  const finish = () => {\n    if(input.value.trim()) child.text = input.value.trim();\n    save(); renderEditSubList(); renderPlan();\n  };\n  input.addEventListener('blur', finish);\n  input.addEventListener('keydown', ev => {\n    if(ev.key === 'Enter'){ ev.preventDefault(); input.blur(); }\n    if(ev.key === 'Escape'){ ev.preventDefault(); input.value = text; input.blur(); }\n  });\n}\n\nfunction addEditSub(){\n  if(!editTaskId) return;\n  const task = state.tasks[editTaskId];\n  if(!task) return;\n  if(task.isSystemFixed){ toast('固定真题任务请用「+ 添加真题」'); return; }\n\n  if(task.parentId){\n    \/* 当前是二级任务 -> 新建三级 *\/\n    openAddModal(task.category, editTaskId, 'subSub');\n  } else {\n    \/* 当前是一级任务 -> 新建二级 *\/\n    openAddModal(task.category, editTaskId, 'sub');\n  }\n}\n\nfunction applyCompleteRuleToTask(taskId, dateKey){\n  const task = state.tasks[taskId];\n  if(!task) r

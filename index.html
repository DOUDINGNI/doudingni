 return;\n  const date = document.getElementById('pmDate').value || dkey();\n  const score = document.getElementById('pmScore').value.trim();\n  const note = document.getElementById('pmNote').value.trim();\n  if(!state.papers[currentPaper]) state.papers[currentPaper] = [];\n  state.papers[currentPaper].push({ id: uid(), date: date, score: score, note: note });\n  save();\n  document.getElementById('pmScore').value = '';\n  document.getElementById('pmNote').value = '';\n  renderPmList();\n  renderPapers();\n  toast('已记录一次完成');\n}\n\n\/* ============================================================\n   设置弹窗\n============================================================ *\/\nfunction openSettingsModal(){\n  const cats = getCategories();\n  const row = document.getElementById('catColorRow');\n  row.innerHTML = cats.map(c => {\n    const custom = state.settings.catColors && state.settings.catColors[c.key] && state.settings.catColors[c.key].color\n      ? state.settings.catColors[c.key].color : c.color;\n    return '<div class=\"color-field\">' +\n      '<input type=\"color\" data-cat-color=\"' + c.key + '\" value=\"' + custom + '\">' +\n      '<span>' + c.name + '<\/span>' +\n    '<\/div>';\n  }).join('');\n\n  document.getElementById('settingsModal').classList.add('show');\n}\n\ndocument.getElementById('catColorRow').addEventListener('input', e => {\n  const inp = e.target.closest('[data-cat-color]');\n  if(!inp) return;\n  if(!state.settings.catColors) state.settings.catColors = {};\n  state.settings.catColors[inp.dataset.catColor] = {\n    color: inp.value,\n    soft: lighten(inp.value, 0.86)\n  };\n  save();\n  applyTheme();\n  renderPlan();\n});\n\n\n\ndocument.getElementById('settingsCancel').addEventListener('click', () => {\n  document.getElementById('settingsModal').classList.remove('show');\n});\n\ndocument.getElementById('settingsModal').addEventListener('click', e => {\n  if(e.target.id === 'settingsModal'){\n    e.currentTarget.classList.remove('show');\n  }\n});\n\ndocument.getElementById('settingsBtn').addEventListener('click', openSettingsModal);\n\/\/ 👇 新增：清空数据按钮\n\n\/* ============================================================\n   目标设置\n============================================================ *\/\ndocument.getElementById('sideCountdown').addEventListener('click', () => {\n  const goals = state.settings.goals || {};\n  document.getElementById('examDate').value = state.settings.examDate || '';\n  document.getElementById('goalL').value = goals.l || '';\n  document.getElementById('goalR').value = goals.r || '';\n  document.getElementById('goalW').value = goals.w || '';\n  document.getElementById('goalS').value = goals.s || '';\n  document.getElementById('goalModal').classList.add('show');\n});\ndocument.getElementById('goalCancel').addEventListener('click', () => {\n  document.getElementById('goalModal').classList.remove('show');\n});\ndocument.getElementById('goalSave').addEventListener('click', () => {\n  const val = id => document.getElementById(id).value.trim();\n  state.settings.examDate = val('examDate');\n  state.settings.goals = { l: val('goalL'), r: val('goalR'), w: val('goalW'), s: val('goalS') };\n  save();\n  document.getElementById('goalModal').classList.remove('show');\n  renderHeader();\n  toast('目标已保存');\n});\ndocument.getElementById('goalModal').addEventListener('click', e => {\n  if(e.target.id === 'goalModal') e.currentTarget.classList.remove('show');\n});\n\n\/* ============================================================\n   真题事件\n============================================================ *\/\ndocument.getElementById('bookGrid').addEventListener('click', e => {\n  const head = e.target.closest('[data-toggle]');\n  if(head){\n    const b = Number(head.dataset.toggle);\n    if(openBooks.has(b)) openBooks.delete(b); else openBooks.add(b);\n    renderPapers();\n    return;\n  }\n  const part = e.target.closest('.part-btn');\n  if(part){ openPaper(part.dataset.paper, part.dataset.label); return; }\n});\ndocument.getElementById('pmSave').addEventListener('click', savePaperRun);\ndocument.getElementById('pmClose').addEventListener('click', () => {\n  document.getElementById('paperModal').classList.remove('show');\n  currentPaper = null;\n});\ndocument.getElementById('paperModal').addEventListener('click', e => {\n  if(e.target.id === 'paperModal'){\n    e.currentTarget.classList.remove('show');\n    currentPaper = null;\n  }\n});\ndocument.getElementById('pmScore').addEventListener('keydown', e => {\n  if(e.key === 'Enter') savePaperRun();\n});\ndocument.getElementById('pmNote').addEventListener('keydown', e => {\n  if(e.key === 'Enter') savePaperRun();\n});\ndocument.getElementById('pmList').addEventListener('click', e => {\n  const btn = e.target.closest('.pm-del');\n  if(!btn || !currentPaper) return;\n  state.papers[currentPaper] = (state.papers[currentPaper] || []).filter(r => r.id !== btn.dataset.run);\n  save();\n  renderPmList();\n  renderPapers();\n  toast('已删除这条记录');\n});\n\n\/* ============================================================\n   视图切换\n============================================================ *\/\nfunction switchView(name){\n  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === name));\n  document.getElementById('view-plan').hidden = (name !== 'plan');\n  document.getElementById('view-papers').hidden = (name !== 'papers');\n  document.getElementById('view-review').hidden = (name !== 'review');\n  if(name === 'plan') renderPlan();\n  if(name === 'papers') renderPapers();\n  if(name === 'review') renderReview();\n  window.scrollTo(0, 0);\n}\ndocument.querySelector('.nav').addEventListener('click', e => {\n  const btn = e.target.closest('.nav-item');\n  if(btn) switchView(btn.dataset.view);\n});\n\n\/* ============================================================\n   计时刷新\n============================================================ *\/\nsetInterval(() => {\n  if(document.getElementById('view-plan').hidden) return;\n  if(viewDate !== logicalKey()) return;\n  document.querySelectorAll('.timer-display').forEach(el => {\n    const taskId = el.dataset.tid;\n    if(!taskId) return;\n    const st = getTaskStatus(viewDate, taskId);\n    if(st && st.runningStart) el.textContent = fmtTimer(statusSeconds(st));\n  });\n}, 1000);\n\nlet lastLogicalKey = logicalKey();\nsetInterval(() => {\n  const current = logicalKey();\n  if(current !== lastLogicalKey){\n    const wasOnLiveDay = (viewDate === lastLogicalKey);\n    lastLogicalKey = current;\n    if(wasOnLiveDay) setViewDate(current);\n    else updateDateNav();\n    renderHeader();\n  }\n}, 30000);\n\n\/* ============================================================\n   全量渲染 & 启动\n============================================================ *\/\nfunction renderAll(){\n  renderHeader();\n  updateDateNav();\n  renderPlan();\n  renderPapers();\n  renderReview();\n}\n\napplyTheme();\nrenderAll();\n<\/script>\n<\/body>\n<\/html>";</script>

<script>/* 内嵌子应用③：知识库 */
const NOTES_APP_HTML="<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>知识库<\/title>\n<style>\n:root{\n  --bg:#f5f5f7; --card:#ffffff; --ink:#222222; --muted:#8a8a8e; --line:#e6e6ea;\n  --primary:#8e7a9e; --primary-soft:#f1ecf6;\n  --xhs:#ff2e51; --xhs-soft:#ffecef; --dy:#1f1f24; --dy-soft:#efeff2;\n  --radius:14px;\n}\n[data-theme=\"dark\"]{\n  --bg:#1c1c1e; --card:#2c2c2e; --ink:#f0f0f2; --muted:#9a9aa0; --line:#3f3f44;\n  --primary-soft:#332b3c;\n  --xhs:#ff6b83; --xhs-soft:#3a2529; --dy:#d8d8de; --dy-soft:#3a3a3f;\n}\n*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}\nhtml,body{min-height:100%}\nbody{background:var(--bg);color:var(--ink);padding:14px 16px 30px;transition:background .25s,color .25s}\nbutton{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}\n[hidden]{display:none !important}\ninput,textarea,select{font-family:inherit;outline:none}\n\n.nb{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:14px}\n\n\/* ---------- 区块 ---------- *\/\n.nb-sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px 18px}\n.nb-sec-head{display:flex;align-items:center;gap:10px;margin-bottom:13px;flex-wrap:wrap}\n.nb-sec-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;letter-spacing:.3px}\n.nb-sec-title::before{content:'';width:3px;height:14px;border-radius:2px;background:var(--primary);display:block}\n.nb-sec-desc{font-size:12px;color:var(--muted);margin-left:auto}\n.mini-btn{\n  margin-left:auto;font-size:12.5px;padding:5px 12px;border-radius:8px;border:1px solid var(--line);\n  color:var(--muted);transition:.15s;white-space:nowrap;\n}\n.mini-btn:hover{color:var(--primary);border-color:var(--primary)}\n.link-btn{font-size:12px;color:var(--primary);margin-left:auto;white-space:nowrap}\n.link-btn:hover{opacity:.75}\n\n\/* ---------- 累计收录 ---------- *\/\n.stat-row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:10px}\n.stat-tile{\n  border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;\n  justify-content:center;gap:3px;min-width:0;background:var(--bg);\n}\n.stat-tile.hero{background:var(--primary-soft);border-color:transparent}\n.stat-tile .num{font-size:24px;font-weight:800;line-height:1.15;letter-spacing:.5px;font-variant-numeric:tabular-nums}\n.stat-tile.hero .num{font-size:34px;color:var(--primary)}\n.stat-tile .lbl{font-size:12px;color:var(--muted)}\n.stat-tile .lbl b{color:var(--ink);font-weight:600}\n\n\/* ---------- 最近收录 ---------- *\/\n.recent-list{display:flex;flex-direction:column;gap:2px}\n.recent-item{\n  display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:10px;transition:.13s;\n  cursor:pointer;min-width:0;\n}\n.recent-item:hover{background:var(--bg)}\n.recent-dot{width:7px;height:7px;border-radius:50%;background:var(--primary);flex:none;opacity:.75}\n.recent-title{\n  font-size:13.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\n}\n.recent-cat{font-size:11px;color:var(--primary);background:var(--primary-soft);padding:2px 8px;border-radius:6px;flex:none}\n.recent-date{font-size:11.5px;color:var(--muted);flex:none}\n.recent-empty{font-size:12.5px;color:var(--muted);padding:14px 4px;line-height:1.7}\n\n\/* ---------- 门类 ---------- *\/\n.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:9px}\n.cat-item{\n  border:1px solid var(--line);border-radius:11px;padding:10px 12px;display:flex;align-items:center;gap:8px;\n  transition:.15s;cursor:pointer;min-width:0;background:var(--bg);\n}\n.cat-item:hover{border-color:var(--primary)}\n.cat-item.active{border-color:var(--primary);background:var(--primary-soft)}\n.cat-name{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.cat-count{font-size:11.5px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}\n.cat-ops{display:flex;gap:2px;flex:none;opacity:0;transition:.15s}\n.cat-item:hover .cat-ops{opacity:1}\n.cat-op{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}\n.cat-op svg{width:13px;height:13px}\n.cat-op:hover{background:var(--card);color:var(--primary)}\n.cat-op.del:hover{color:#e05a5a}\n\n\/* ---------- 全部知识 ---------- *\/\n.all-tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}\n.nt-search{position:relative;flex:1;min-width:180px;max-width:320px}\n.nt-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted)}\n.nt-search input{\n  width:100%;padding:8px 12px 8px 32px;border-radius:10px;border:1px solid var(--line);\n  background:var(--bg);color:var(--ink);font-size:13px;\n}\n.nt-search input::placeholder{color:var(--muted)}\n.nt-chips{display:flex;gap:6px;flex-wrap:wrap}\n.nt-chip{\n  padding:6px 12px;border-radius:20px;font-size:12.5px;border:1px solid var(--line);\n  background:transparent;color:var(--muted);transition:.15s;white-space:nowrap;\n}\n.nt-chip:hover{color:var(--ink)}\n.nt-chip.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}\n\n.nt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:11px;align-items:stretch}\n.nt-card{\n  background:var(--bg);border-radius:var(--radius);padding:13px 14px 12px;cursor:pointer;\n  border:1px solid transparent;transition:.15s;display:flex;flex-direction:column;gap:7px;position:relative;min-width:0;\n}\n.nt-card:hover{border-color:var(--primary);transform:translateY(-1px)}\n.nt-card-top{display:flex;align-items:center;gap:7px;min-width:0}\n.nt-src{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;flex:none}\n.nt-src.xhs{background:var(--xhs-soft);color:var(--xhs)}\n.nt-src.dy{background:var(--dy-soft);color:var(--dy)}\n.nt-src.other{background:var(--primary-soft);color:var(--primary)}\n.nt-cat{font-size:11px;color:var(--muted);background:var(--card);padding:2px 7px;border-radius:6px;flex:none;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.nt-date{font-size:11px;color:var(--muted);margin-left:auto;flex:none}\n.nt-title{font-size:13.5px;font-weight:700;line-height:1.45;word-break:break-word}\n.nt-title.empty{color:var(--muted);font-weight:500}\n.nt-body{\n  font-size:12.5px;line-height:1.6;color:var(--muted);white-space:pre-wrap;word-break:break-word;\n  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;\n}\n.nt-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto;padding-top:2px}\n.nt-tag{font-size:11px;color:var(--primary);background:var(--primary-soft);padding:2px 8px;border-radius:6px}\n.nt-del{\n  position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:6px;display:none;\n  align-items:center;justify-content:center;color:var(--muted);background:var(--card);font-size:12px;\n}\n.nt-card:hover .nt-del{display:flex}\n.nt-del:hover{color:#e05a5a}\n.nt-empty{\n  grid-column:1\/-1;text-align:center;color:var(--muted);font-size:13px;line-height:1.8;\n  padding:40px 18px;background:var(--bg);border-radius:var(--radius);\n}\n.nt-empty b{display:block;font-size:14.5px;color:var(--ink);margin-bottom:5px;font-weight:600}\n\n\/* ---------- 知识问答 ---------- *\/\n.qa-bar{display:flex;gap:8px;flex-wrap:wrap}\n.qa-bar input{\n  flex:1;min-width:180px;padding:10px 13px;border-radius:10px;border:1px solid var(--line);\n  background:var(--bg);color:var(--ink);font-size:13.5px;\n}\n.qa-bar input::placeholder{color:var(--muted)}\n.qa-samples{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}\n.qa-sample{font-size:11.5px;padding:4px 10px;border-radius:20px;border:1px dashed var(--line);color:var(--muted);white-space:nowrap}\n.qa-sample:hover{color:var(--primary);border-color:var(--primary)}\n.qa-result{margin-top:13px}\n.qa-answer{border-radius:12px;background:var(--primary-soft);padding:14px 15px;margin-bottom:12px}\n.qa-answer-label{font-size:11.5px;color:var(--primary);font-weight:700;letter-spacing:.5px;margin-bottom:7px}\n.qa-answer-text{font-size:13.5px;line-height:1.85;word-break:break-word}\n.qa-answer-cite{font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.7}\n.qa-answer-cite b{color:var(--ink);font-weight:600}\n.qa-hits{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:9px}\n.qa-hit{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 12px;cursor:pointer;min-width:0}\n.qa-hit:hover{border-color:var(--primary)}\n.qa-hit-top{display:flex;align-items:center;gap:7px;margin-bottom:5px}\n.qa-hit-no{font-size:10.5px;font-weight:700;color:#fff;background:var(--primary);width:16px;height:16px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex:none}\n.qa-hit-title{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.qa-hit-snippet{font-size:11.5px;color:var(--muted);line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}\n.qa-hit-snippet em{font-style:normal;color:var(--primary);background:var(--primary-soft);padding:0 2px;border-radius:3px}\n.qa-tip{font-size:12.5px;color:var(--muted);line-height:1.8;padding:6px 2px}\n\n\/* ---------- 弹窗 ---------- *\/\n.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}\n.mask.show{display:flex}\n.box{\n  background:var(--card);border-radius:16px;width:min(94%,560px);max-height:88vh;overflow-y:auto;\n  padding:20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.18);\n}\n.box.sm{width:min(94%,400px)}\n.box h3{font-size:16px;font-weight:700;margin-bottom:16px}\n.field{margin-bottom:12px}\n.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}\n.field input[type=text],.field textarea,.field select{\n  width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);\n  background:var(--bg);color:var(--ink);font-size:13.5px;\n}\n.field textarea{min-height:180px;resize:vertical;line-height:1.65}\n.field-row{display:flex;gap:10px;flex-wrap:wrap}\n.field-row .field{flex:1;min-width:130px}\n.box-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}\n.btn{padding:8px 18px;border-radius:9px;font-size:13.5px;border:1px solid var(--line);color:var(--muted);background:transparent;white-space:nowrap}\n.btn:hover{color:var(--ink)}\n.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}\n.btn.primary:hover{opacity:.9;color:#fff}\n.btn.danger{color:#e05a5a;border-color:transparent;margin-right:auto}\n.btn:disabled{opacity:.5;cursor:not-allowed}\n\n@media(max-width:760px){\n  body{padding:12px 10px 26px}\n  .nb{gap:11px}\n  .nb-sec{padding:14px 13px 15px;border-radius:14px}\n  .stat-row{grid-template-columns:1fr;gap:8px}\n  .stat-tile{flex-direction:row;align-items:center;justify-content:space-between;padding:10px 13px}\n  .stat-tile .num{font-size:19px}\n  .stat-tile.hero .num{font-size:26px}\n  .cat-grid{grid-template-columns:1fr}\n  .cat-ops{opacity:1}\n  .nt-grid{grid-template-columns:1fr}\n  .qa-hits{grid-template-columns:1fr}\n  .all-tools{flex-direction:column;align-items:stretch}\n  .nt-search{max-width:none}\n  .nt-chips{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;-webkit-overflow-scrolling:touch}\n  .nb-sec-desc{display:none}\n  .recent-cat{display:none}\n}\n<\/style>\n<\/head>\n<body>\n<div class=\"nb\">\n  <section class=\"nb-sec\">\n    <div class=\"nb-sec-head\">\n      <h2 class=\"nb-sec-title\">累计收录<\/h2>\n      <span class=\"nb-sec-desc\" id=\"statsDesc\"><\/span>\n    <\/div>\n    <div class=\"stat-row\" id=\"statRow\"><\/div>\n  <\/section>\n\n  <section class=\"nb-sec\">\n    <div class=\"nb-sec-head\">\n      <h2 class=\"nb-sec-title\">最近收录<\/h2>\n      <button class=\"link-btn\" id=\"recentAll\">查看全部<\/button>\n    <\/div>\n    <div class=\"recent-list\" id=\"recentList\"><\/div>\n  <\/section>\n\n  <section class=\"nb-sec\">\n    <div class=\"nb-sec-head\">\n      <h2 class=\"nb-sec-title\">门类<\/h2>\n      <button class=\"mini-btn\" id=\"catAdd\">＋ 新增门类<\/button>\n    <\/div>\n    <div class=\"cat-grid\" id=\"catGrid\"><\/div>\n  <\/section>\n\n  <section class=\"nb-sec\" id=\"secAll\">\n    <div class=\"nb-sec-head\">\n      <h2 class=\"nb-sec-title\">全部知识<\/h2>\n      <span class=\"nb-sec-desc\" id=\"allDesc\"><\/span>\n    <\/div>\n    <div class=\"all-tools\">\n      <div class=\"nt-search\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"\/><path d=\"M20 20l-3.5-3.5\"\/><\/svg>\n        <input type=\"text\" id=\"ntSearch\" placeholder=\"搜索标题、内容、标签\">\n      <\/div>\n      <div class=\"nt-chips\" id=\"ntChips\"><\/div>\n    <\/div>\n    <div class=\"nt-grid\" id=\"ntGrid\"><\/div>\n  <\/section>\n\n  <section class=\"nb-sec\">\n    <div class=\"nb-sec-head\">\n      <h2 class=\"nb-sec-title\">知识问答<\/h2>\n      <span class=\"nb-sec-desc\">基于已收录内容检索回答<\/span>\n    <\/div>\n    <div class=\"qa-bar\">\n      <input type=\"text\" id=\"qaInput\" placeholder=\"向知识库提问，例如：雅思写作怎么开头？\">\n      <button class=\"btn primary\" id=\"qaAsk\">提问<\/button>\n    <\/div>\n    <div class=\"qa-samples\" id=\"qaSamples\"><\/div>\n    <div class=\"qa-result\" id=\"qaResult\"><\/div>\n  <\/section>\n<\/div>\n\n<!-- 笔记编辑 -->\n<div class=\"mask\" id=\"ntMask\">\n  <div class=\"box\">\n    <h3 id=\"ntModalTitle\">新建笔记<\/h3>\n    <div class=\"field\">\n      <label>标题<\/label>\n      <input type=\"text\" id=\"ntTitle\" placeholder=\"给这条笔记起个标题\">\n    <\/div>\n    <div class=\"field-row\">\n      <div class=\"field\">\n        <label>来源<\/label>\n        <select id=\"ntSource\">\n          <option value=\"xhs\">小红书<\/option>\n          <option value=\"dy\">抖音<\/option>\n          <option value=\"other\">其他<\/option>\n        <\/select>\n      <\/div>\n      <div class=\"field\">\n        <label>门类<\/label>\n        <select id=\"ntCat\"><\/select>\n      <\/div>\n    <\/div>\n    <div class=\"field\">\n      <label>标签（用逗号分隔）<\/label>\n      <input type=\"text\" id=\"ntTags\" placeholder=\"如：雅思写作, 模板\">\n    <\/div>\n    <div class=\"field\">\n      <label>内容<\/label>\n      <textarea id=\"ntContent\" placeholder=\"粘贴收藏的笔记内容、要点或自己的整理…\"><\/textarea>\n    <\/div>\n    <div class=\"field\">\n      <label>原文链接（可选）<\/label>\n      <input type=\"text\" id=\"ntLink\" placeholder=\"https:\/\/…\">\n    <\/div>\n    <div class=\"box-foot\">\n      <button class=\"btn danger\" id=\"ntDelete\" style=\"display:none\">删除<\/button>\n      <button class=\"btn\" id=\"ntCancel\">取消<\/button>\n      <button class=\"btn primary\" id=\"ntSave\">保存<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- 门类编辑 -->\n<div class=\"mask\" id=\"catMask\">\n  <div class=\"box sm\">\n    <h3 id=\"catModalTitle\">新增门类<\/h3>\n    <div class=\"field\">\n      <label>门类名称<\/label>\n      <input type=\"text\" id=\"catName\" placeholder=\"如：雅思写作、时间管理\">\n    <\/div>\n    <div class=\"box-foot\">\n      <button class=\"btn\" id=\"catCancel\">取消<\/button>\n      <button class=\"btn primary\" id=\"catSave\">保存<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- 导入结果 -->\n<div class=\"mask\" id=\"impMask\">\n  <div class=\"box sm\">\n    <h3>导入结果<\/h3>\n    <div id=\"impBody\" style=\"font-size:13.5px;line-height:1.95;color:var(--muted)\"><\/div>\n    <div class=\"box-foot\">\n      <button class=\"btn primary\" id=\"impClose\">知道了<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\nconst STORE_KEY = 'workbenchNotesV1';\nconst CAT_KEY = 'workbenchNotesCatsV1';\nconst SOURCES = { xhs:{name:'小红书', cls:'xhs'}, dy:{name:'抖音', cls:'dy'}, other:{name:'其他', cls:'other'} };\n\nlet notes = [];\nlet cats = [];\nlet filter = 'all';      \/\/ 'all' | 'none' | 门类 id\nlet keyword = '';\nlet editingId = null;\nlet editingCatId = null;\n\n\/* ---------------- 基础工具 ---------------- *\/\nfunction esc(s){\n  return String(s == null ? '' : s).replace(\/&\/g,'&amp;').replace(\/<\/g,'&lt;').replace(\/>\/g,'&gt;').replace(\/\"\/g,'&quot;');\n}\nfunction $(id){ return document.getElementById(id); }\nfunction uid(p){ return p + Date.now().toString(36) + Math.floor(Math.random()*1296).toString(36); }\nfunction fmtDate(ts){\n  if(!ts) return '';\n  const d = new Date(ts);\n  const now = new Date();\n  const sameYear = d.getFullYear() === now.getFullYear();\n  return (sameYear ? '' : d.getFullYear() + '年') + (d.getMonth()+1) + '月' + d.getDate() + '日';\n}\nfunction parseTags(str){\n  return String(str || '').split(\/[,，;；\\s]+\/).map(t => t.replace(\/^#\/, '').trim()).filter(Boolean).slice(0, 8);\n}\nfunction uniq(arr){ return Array.from(new Set(arr)); }\n\n\/* 去重指纹：标题 + 正文 归一化后取哈希，长度一并参与，避免碰撞误判 *\/\nfunction normText(s){\n  return String(s || '')\n    .replace(\/[\\s　]+\/g,'')\n    .replace(\/[，。！？、；：“”‘’\"'（）()\\[\\]【】《》<>·—\\-_.,!?;:|\/\\\\@#$%^&*+=~`]\/g,'')\n    .toLowerCase();\n}\nfunction hashStr(s){\n  let h = 5381;\n  for(let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;\n  return h.toString(36);\n}\nfunction signature(title, content, link){\n  const t = normText(title), c = normText(content);\n  if(!c && !t && link) return 'L' + hashStr(String(link).trim().toLowerCase());\n  return 'S' + hashStr(t + '|' + c) + '-' + (t.length + c.length);\n}\n\n\/* ---------------- 存取 ---------------- *\/\nfunction load(){\n  try{\n    const raw = localStorage.getItem(STORE_KEY);\n    notes = raw ? (JSON.parse(raw) || []) : [];\n    if(!Array.isArray(notes)) notes = [];\n  }catch(e){ notes = []; }\n  try{\n    const raw = localStorage.getItem(CAT_KEY);\n    cats = raw ? (JSON.parse(raw) || []) : [];\n    if(!Array.isArray(cats)) cats = [];\n  }catch(e){ cats = []; }\n\n  \/\/ 兼容旧数据：补齐字段与指纹\n  let dirty = false;\n  notes.forEach(n => {\n    if(!n.id){ n.id = uid('n'); dirty = true; }\n    if(!Array.isArray(n.tags)){ n.tags = []; dirty = true; }\n    if(n.category && !cats.some(c => c.name === n.category)){\n      cats.push({ id: uid('c'), name: n.category, createdAt: Date.now() });\n      dirty = true;\n    }\n    if(!n.sig){ n.sig = signature(n.title, n.content, n.link); dirty = true; }\n  });\n  if(dirty) save();\n}\nfunction save(){\n  try{ localStorage.setItem(STORE_KEY, JSON.stringify(notes)); }catch(e){}\n  try{ localStorage.setItem(CAT_KEY, JSON.stringify(cats)); }catch(e){}\n}\nfunction catName(id){\n  const c = cats.find(x => x.id === id);\n  return c ? c.name : '';\n}\nfunction noteCat(n){ return n.category || ''; }\n\n\/* ---------------- 累计收录 ---------------- *\/\nfunction renderStats(){\n  const total = notes.length;\n  const week = Date.now() - 7*86400000;\n  const recent7 = notes.filter(n => (n.createdAt || 0) >= week).length;\n  const tagCount = uniq(notes.reduce((a, n) => a.concat(n.tags || []), [])).length;\n  const catCount = cats.filter(c => notes.some(n => noteCat(n) === c.name)).length;\n  $('statRow').innerHTML =\n    '<div class=\"stat-tile hero\"><div class=\"num\">' + total + '<\/div><div class=\"lbl\">已收录知识（条）<\/div><\/div>' +\n    '<div class=\"stat-tile\"><div class=\"num\">' + catCount + '<\/div><div class=\"lbl\">已使用门类<\/div><\/div>' +\n    '<div class=\"stat-tile\"><div class=\"num\">' + tagCount + '<\/div><div class=\"lbl\">标签数<\/div><\/div>' +\n    '<div class=\"stat-tile\"><div class=\"num\">' + (recent7 ? '+' + recent7 : '0') + '<\/div><div class=\"lbl\">近 7 天新增<\/div><\/div>';\n  $('statsDesc').textContent = total ? ('最近更新 ' + fmtDate(Math.max.apply(null, notes.map(n => n.updatedAt || n.createdAt || 0)))) : '';\n}\n\n\/* ---------------- 最近收录 ---------------- *\/\nfunction renderRecent(){\n  const box = $('recentList');\n  const list = notes.slice().sort((a,b) => (b.createdAt || b.updatedAt || 0) - (a.createdAt || a.updatedAt || 0)).slice(0, 5);\n  if(!list.length){\n    box.innerHTML = '<div class=\"recent-empty\">还没有收录内容。点右上角「导入 CSV」或「新建笔记」开始整理吧。<\/div>';\n    return;\n  }\n  box.innerHTML = list.map(n =>\n    '<div class=\"recent-item\" data-id=\"' + n.id + '\">' +\n      '<span class=\"recent-dot\"><\/span>' +\n      '<span class=\"recent-title\">' + esc(n.title || (n.content || '').slice(0, 40) || '（未命名笔记）') + '<\/span>' +\n      (noteCat(n) ? '<span class=\"recent-cat\">' + esc(noteCat(n)) + '<\/span>' : '') +\n      '<span class=\"recent-date\">' + fmtDate(n.createdAt || n.updatedAt) + '<\/span>' +\n    '<\/div>').join('');\n  box.querySelectorAll('.recent-item').forEach(el => {\n    el.onclick = () => openEditor(el.dataset.id);\n  });\n}\n\n\/* ---------------- 门类 ---------------- *\/\nfunction renderCats(){\n  const box = $('catGrid');\n  const rows = cats.map(c => ({ c, n: notes.filter(x => noteCat(x) === c.name).length }));\n  const noneN = notes.filter(x => !noteCat(x)).length;\n  rows.push({ c: { id: '__none__', name: '未分类' }, n: noneN });\n\n  box.innerHTML = rows.map(({c, n}) => {\n    const active = (filter === c.id) || (c.id === '__none__' && filter === 'none');\n    const isNone = c.id === '__none__';\n    return '<div class=\"cat-item' + (active ? ' active' : '') + '\" data-cat=\"' + (isNone ? 'none' : c.id) + '\">' +\n      '<span class=\"cat-name\">' + esc(c.name) + '<\/span>' +\n      '<span class=\"cat-count\">' + n + '<\/span>' +\n      (isNone ? '' :\n        '<span class=\"cat-ops\">' +\n          '<button class=\"cat-op\" data-edit=\"' + c.id + '\" title=\"重命名\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20h9\"\/><path d=\"M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z\"\/><\/svg><\/button>' +\n          '<button class=\"cat-op del\" data-del=\"' + c.id + '\" title=\"删除\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6L6 18M6 6l12 12\"\/><\/svg><\/button>' +\n        '<\/span>') +\n    '<\/div>';\n  }).join('');\n\n  box.querySelectorAll('.cat-item').forEach(el => {\n    el.onclick = e => {\n      const ed = e.target.closest('[data-edit]');\n      if(ed){ e.stopPropagation(); openCatEditor(ed.dataset.edit); return; }\n      const dl = e.target.closest('[data-del]');\n      if(dl){ e.stopPropagation(); removeCat(dl.dataset.del); return; }\n      filter = el.dataset.cat;\n      renderAll();\n      const sec = $('secAll');\n      if(sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });\n    };\n  });\n}\nfunction openCatEditor(id){\n  editingCatId = id || null;\n  const c = id ? cats.find(x => x.id === id) : null;\n  $('catModalTitle').textContent = c ? '编辑门类' : '新增门类';\n  $('catName').value = c ? c.name : '';\n  $('catMask').classList.add('show');\n  setTimeout(() => { try{ $('catName').focus(); }catch(e){} }, 60);\n}\nfunction closeCatEditor(){\n  $('catMask').classList.remove('show');\n  editingCatId = null;\n}\nfunction saveCat(){\n  const name = $('catName').value.trim().slice(0, 20);\n  if(!name){ alert('请填写门类名称'); return; }\n  if(cats.some(c => c.name === name && c.id !== editingCatId)){ alert('该门类已存在'); return; }\n  if(editingCatId){\n    const c = cats.find(x => x.id === editingCatId);\n    if(c){\n      const old = c.name;\n      c.name = name;\n      notes.forEach(n => { if(n.category === old) n.category = name; });\n    }\n  }else{\n    cats.push({ id: uid('c'), name: name, createdAt: Date.now() });\n  }\n  save(); renderAll(); closeCatEditor();\n}\nfunction removeCat(id){\n  const c = cats.find(x => x.id === id);\n  if(!c) return;\n  const n = notes.filter(x => noteCat(x) === c.name).length;\n  if(!confirm('删除门类「' + c.name + '」？' + (n ? ('其中 ' + n + ' 条笔记会变为未分类。') : ''))) return;\n  cats = cats.filter(x => x.id !== id);\n  notes.forEach(x => { if(x.category === c.name) x.category = ''; });\n  if(filter === id) filter = 'all';\n  save(); renderAll();\n}\n\n\/* ---------------- 全部知识 ---------------- *\/\nfunction renderChips(){\n  const items = [{ k:'all', name:'全部', n: notes.length }, { k:'none', name:'未分类', n: notes.filter(x => !noteCat(x)).length }]\n    .concat(cats.map(c => ({ k:c.id, name:c.name, n: notes.filter(x => noteCat(x) === c.name).length })));\n  $('ntChips').innerHTML = items.map(it =>\n    '<button class=\"nt-chip' + (filter === it.k ? ' active' : '') + '\" data-f=\"' + it.k + '\">' + esc(it.name) + ' ' + it.n + '<\/button>'\n  ).join('');\n  $('ntChips').querySelectorAll('.nt-chip').forEach(b => {\n    b.onclick = () => { filter = b.dataset.f; renderAll(); };\n  });\n}\nfunction filteredNotes(){\n  const kw = keyword.trim().toLowerCase();\n  return notes.filter(n => {\n    if(filter === 'none'){ if(noteCat(n)) return false; }\n    else if(filter !== 'all'){ if(noteCat(n) !== catName(filter)) return false; }\n    if(!kw) return true;\n    const hay = [n.title, n.content, (n.tags || []).join(' '), noteCat(n)].join(' ').toLowerCase();\n    return hay.indexOf(kw) >= 0;\n  }).sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));\n}\nconst MAX_CARDS = 300;\nfunction renderAllNotes(){\n  const grid = $('ntGrid');\n  const list = filteredNotes();\n  $('allDesc').textContent = list.length === notes.length ? (notes.length + ' 条') : (list.length + ' \/ ' + notes.length + ' 条');\n  if(!list.length){\n    grid.innerHTML = '<div class=\"nt-empty\"><b>' + (notes.length ? '没有匹配的内容' : '知识库还是空的') + '<\/b>' +\n      (notes.length ? '换个关键词或门类筛选试试' : '用「导入 CSV」批量导入，或「新建笔记」手动添加') + '<\/div>';\n    return;\n  }\n  const shown = list.slice(0, MAX_CARDS);\n  grid.innerHTML = shown.map(n => {\n    const src = SOURCES[n.source] || SOURCES.other;\n    const tags = (n.tags || []).map(t => '<span class=\"nt-tag\">#' + esc(t) + '<\/span>').join('');\n    return '<div class=\"nt-card\" data-id=\"' + n.id + '\">' +\n      '<div class=\"nt-card-top\"><span class=\"nt-src ' + src.cls + '\">' + src.name + '<\/span>' +\n        (noteCat(n) ? '<span class=\"nt-cat\">' + esc(noteCat(n)) + '<\/span>' : '') +\n        '<span class=\"nt-date\">' + fmtDate(n.updatedAt || n.createdAt) + '<\/span><\/div>' +\n      '<div class=\"nt-title' + (n.title ? '' : ' empty') + '\">' + esc(n.title || '（未命名笔记）') + '<\/div>' +\n      (n.content ? '<div class=\"nt-body\">' + esc(n.content) + '<\/div>' : '') +\n      (tags ? '<div class=\"nt-tags\">' + tags + '<\/div>' : '') +\n      '<button class=\"nt-del\" data-del=\"' + n.id + '\" title=\"删除\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:12px;height:12px\"><path d=\"M18 6L6 18M6 6l12 12\"\/><\/svg><\/button>' +\n    '<\/div>';\n  }).join('') + (list.length > shown.length\n    ? '<div class=\"nt-empty\" style=\"padding:18px\">还有 ' + (list.length - shown.length) + ' 条未显示，用搜索或门类筛选可以更快定位<\/div>'\n    : '');\n\n  grid.querySelectorAll('.nt-card').forEach(card => {\n    card.onclick = e => {\n      const del = e.target.closest('[data-del]');\n      if(del){ e.stopPropagation(); removeNote(del.dataset.del); return; }\n      openEditor(card.dataset.id);\n    };\n  });\n}\n\n\/* ---------------- 笔记编辑 ---------------- *\/\nfunction fillCatOptions(selected){\n  const sel = $('ntCat');\n  sel.innerHTML = '<option value=\"\">未分类<\/option>' +\n    cats.map(c => '<option value=\"' + esc(c.name) + '\">' + esc(c.name) + '<\/option>').join('');\n  sel.value = selected && cats.some(c => c.name === selected) ? selected : '';\n}\nfunction openEditor(id){\n  editingId = id || null;\n  const n = id ? notes.find(x => x.id === id) : null;\n  $('ntModalTitle').textContent = n ? '编辑笔记' : '新建笔记';\n  $('ntTitle').value = n ? (n.title || '') : '';\n  $('ntSource').value = n ? (n.source || 'xhs') : 'xhs';\n  fillCatOptions(n ? noteCat(n) : catName(filter === 'all' || filter === 'none' ? '' : filter));\n  $('ntTags').value = n && n.tags ? n.tags.join(', ') : '';\n  $('ntContent').value = n ? (n.content || '') : '';\n  $('ntLink').value = n ? (n.link || '') : '';\n  $('ntDelete').style.display = n ? 'inline-block' : 'none';\n  $('ntMask').classList.add('show');\n  setTimeout(() => { try{ $('ntTitle').focus(); }catch(e){} }, 60);\n}\nfunction closeEditor(){\n  $('ntMask').classList.remove('show');\n  editingId = null;\n}\nfunction saveNote(){\n  const title = $('ntTitle').value.trim();\n  const content = $('ntContent').value.trim();\n  if(!title && !content){ alert('标题或内容至少填一项'); return; }\n  const category = $('ntCat').value;\n  const link = $('ntLink').value.trim();\n  const sig = signature(title, content, link);\n\n  if(editingId){\n    const i = notes.findIndex(x => x.id === editingId);\n    if(i >= 0){\n      notes[i] = Object.assign({}, notes[i], {\n        title: title, content: content, source: $('ntSource').value,\n        tags: parseTags($('ntTags').value), link: link, category: category,\n        sig: sig, updatedAt: Date.now()\n      });\n    }\n  } else {\n    const linkKey = link.toLowerCase();\n    if(notes.some(n => n.sig === sig || (linkKey && String(n.link || '').trim().toLowerCase() === linkKey))){\n      alert('知识库里已经有相同内容了，无需重复添加。'); return;\n    }\n    notes.push({\n      id: uid('n'), title: title, content: content, source: $('ntSource').value,\n      tags: parseTags($('ntTags').value), link: link, category: category, sig: sig,\n      createdAt: Date.now(), updatedAt: Date.now()\n    });\n  }\n  save(); renderAll(); closeEditor();\n}\nfunction removeNote(id){\n  const n = notes.find(x => x.id === id);\n  if(!n) return;\n  if(!confirm('确定删除「' + (n.title || '未命名笔记') + '」？')) return;\n  notes = notes.filter(x => x.id !== id);\n  save(); renderAll(); closeEditor();\n}\n\n\/* ---------------- CSV 导入 ---------------- *\/\nconst FIELD_ALIAS = {\n  title:    ['标题','title','名称','name','题目','主题','笔记标题','heading'],\n  content:  ['内容','content','正文','笔记','描述','desc','description','note','text','详情','摘要','answer','body'],\n  source:   ['来源','source','平台','platform','渠道'],\n  category: ['门类','分类','category','类目','目录','cat','group','板块'],\n  tags:     ['标签','tags','tag','关键词','keywords','keyword'],\n  link:     ['链接','link','url','网址','原文链接','原文地址','href'],\n  date:     ['日期','date','时间','time','创建时间','收藏时间','created','createdat','datetime']\n};\nfunction normHeader(s){\n  return String(s || '').toLowerCase().replace(\/[\\s　_\\-:：()（）\\[\\]【】]\/g,'');\n}\nfunction detectDelimiter(text){\n  const line = text.split(\/\\r?\\n\/)[0] || '';\n  const comma = (line.match(\/,\/g) || []).length;\n  const tab = (line.match(\/\\t\/g) || []).length;\n  const semi = (line.match(\/;\/g) || []).length;\n  if(tab > comma && tab >= semi) return '\\t';\n  if(semi > comma && semi > tab) return ';';\n  return ',';\n}\nfunction parseCSV(text, delim){\n  text = String(text).replace(\/^\\uFEFF\/, '');\n  const rows = [];\n  let row = [], cell = '', inQ = false;\n  for(let i = 0; i < text.length; i++){\n    const ch = text[i];\n    if(inQ){\n      if(ch === '\"'){\n        if(text[i+1] === '\"'){ cell += '\"'; i++; }\n        else inQ = false;\n      } else cell += ch;\n    }else{\n      if(ch === '\"') inQ = true;\n      else if(ch === delim){ row.push(cell); cell = ''; }\n      else if(ch === '\\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }\n      else if(ch === '\\r'){ \/* 忽略 *\/ }\n      else cell += ch;\n    }\n  }\n  if(cell.length || row.length){ row.push(cell); rows.push(row); }\n  return rows.filter(r => r.some(c => String(c).trim() !== ''));\n}\nfunction mapHeader(header){\n  const map = {};\n  header.forEach((h, i) => {\n    const key = normHeader(h);\n    if(!key) return;\n    for(const field in FIELD_ALIAS){\n      if(map[field] !== undefined) continue;\n      if(FIELD_ALIAS[field].some(a => key === a || key.indexOf(a) >= 0)){ map[field] = i; return; }\n    }\n  });\n  return map;\n}\nfunction parseDate(v){\n  const s = String(v || '').trim();\n  if(!s) return null;\n  if(\/^\\d{10}$\/.test(s)) return Number(s) * 1000;\n  if(\/^\\d{13}$\/.test(s)) return Number(s);\n  const m = s.match(\/(\\d{4})\\D{1,2}(\\d{1,2})\\D{1,2}(\\d{1,2})\/);\n  if(m){\n    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));\n    if(!isNaN(d.getTime())) return d.getTime();\n  }\n  const t = Date.parse(s.replace(\/\\\/\/g, '-'));\n  return isNaN(t) ? null : t;\n}\nfunction mapSource(v){\n  const s = String(v || '').toLowerCase();\n  if(\/小红书|xhs|xingtu|redbook|red\/.test(s)) return 'xhs';\n  if(\/抖音|douyin|dy|tiktok\/.test(s)) return 'dy';\n  return 'other';\n}\n\n\/* 由 CSV 文本导入；返回统计结果 *\/\nfunction importCSVText(text){\n  const delim = detectDelimiter(text);\n  const rows = parseCSV(text, delim);\n  const res = { total: 0, added: 0, dup: 0, bad: 0, cats: [] };\n  if(!rows.length) return res;\n\n  const map = mapHeader(rows[0]);\n  const hasHeader = Object.keys(map).length > 0;\n  const body = hasHeader ? rows.slice(1) : rows;\n  if(!hasHeader){ map.title = 0; map.content = 1; }\n\n  const seen = new Set(notes.map(n => n.sig));\n  const seenLinks = new Set(notes.map(n => String(n.link || '').trim().toLowerCase()).filter(Boolean));\n  body.forEach(cols => {\n    res.total++;\n    const pick = f => (map[f] !== undefined ? String(cols[map[f]] == null ? '' : cols[map[f]]).trim() : '');\n    let title = pick('title');\n    let content = pick('content');\n    const link = pick('link');\n    if(!title && !content){ res.bad++; return; }\n\n    const sig = signature(title, content, link);\n    const linkKey = String(link || '').trim().toLowerCase();\n    if(seen.has(sig) || (linkKey && seenLinks.has(linkKey))){ res.dup++; return; }\n\n    const catRaw = pick('category').slice(0, 20);\n    let cat = '';\n    if(catRaw){\n      const exist = cats.find(c => c.name === catRaw);\n      if(exist) cat = exist.name;\n      else { cats.push({ id: uid('c'), name: catRaw, createdAt: Date.now() }); cat = catRaw; res.cats.push(catRaw); }\n    }\n    const ts = parseDate(pick('date')) || Date.now();\n    if(!title) title = content.slice(0, 30);\n\n    notes.push({\n      id: uid('n'),\n      title: title.slice(0, 200),\n      content: content,\n      source: mapSource(pick('source')),\n      category: cat,\n      tags: parseTags(pick('tags')),\n      link: link,\n      sig: sig,\n      createdAt: ts,\n      updatedAt: ts\n    });\n    seen.add(sig);\n    if(linkKey) seenLinks.add(linkKey);\n    res.added++;\n  });\n  save();\n  return res;\n}\n\nfunction importCSVFile(file){\n  return new Promise((resolve, reject) => {\n    const rd = new FileReader();\n    rd.onerror = () => reject(new Error('文件读取失败'));\n    rd.onload = ev => {\n      try{\n        const text = String(ev.target.result || '');\n        if(!text.trim()){ reject(new Error('文件内容为空')); return; }\n        const res = importCSVText(text);\n        renderAll();\n        showImportResult(file.name, res);\n        resolve(res);\n      }catch(err){ reject(err); }\n    };\n    rd.readAsText(file, 'UTF-8');\n  });\n}\nfunction showImportResult(name, r){\n  const lines = [];\n  lines.push('<div style=\"color:var(--ink);font-weight:600;margin-bottom:6px\">' + esc(name) + '<\/div>');\n  lines.push('共读取 <b style=\"color:var(--ink)\">' + r.total + '<\/b> 行 · 新增 <b style=\"color:var(--primary)\">' + r.added + '<\/b> 条');\n  if(r.dup) lines.push('自动跳过重复内容 <b style=\"color:var(--ink)\">' + r.dup + '<\/b> 条');\n  if(r.bad) lines.push('忽略空行 \/ 无效行 <b style=\"color:var(--ink)\">' + r.bad + '<\/b> 条');\n  if(r.cats.length) lines.push('新增门类：' + r.cats.map(esc).join('、'));\n  if(!r.added && !r.dup) lines.push('没有可导入的内容，请检查文件是否有表头（标题、内容、门类…）');\n  $('impBody').innerHTML = lines.join('<br>');\n  $('impMask').classList.add('show');\n}\n\n\/* ---------------- 知识问答 ---------------- *\/\nfunction tokenize(str){\n  const s = String(str || '').toLowerCase();\n  const out = [];\n  const words = s.match(\/[a-z0-9]+\/g) || [];\n  words.forEach(w => { if(w.length >= 2) out.push(w); });\n  const zh = s.match(\/[\\u4e00-\\u9fa5]+\/g) || [];\n  zh.forEach(seg => {\n    if(seg.length === 1){ out.push(seg); return; }\n    for(let i = 0; i < seg.length - 1; i++) out.push(seg.slice(i, i+2));\n    if(seg.length <= 4) out.push(seg);\n  });\n  return uniq(out);\n}\nconst STOP = new Set(['什么','怎么','如何','为什','么样','可以','需要','哪些','一个','这个','那个','我们','你们','他们','是不','不是','有没','没有','的话','吗','呢','的','了','和','与','及','是','在','有','我','你','他','她','它']);\nfunction qaIndex(){\n  const docs = notes.map(n => {\n    const text = [n.title, noteCat(n), (n.tags || []).join(' '), n.content].join(' ');\n    const toks = tokenize(text);\n    const tf = Object.create(null);\n    toks.forEach(t => { tf[t] = (tf[t] || 0) + 1; });\n    return { n, tf, len: toks.length || 1 };\n  });\n  const df = Object.create(null);\n  docs.forEach(d => { for(const t in d.tf) df[t] = (df[t] || 0) + 1; });\n  return { docs, df, N: docs.length || 1 };\n}\nfunction splitSentences(text){\n  return String(text || '')\n    .replace(\/([。！？!?；;])\/g, '$1\\n')\n    .split(\/\\n+\/)\n    .map(s => s.trim())\n    .filter(s => s.length >= 6);\n}\nfunction snippetOf(text, qTokens, len){\n  const sents = splitSentences(text);\n  if(!sents.length) return String(text || '').slice(0, len || 120);\n  let best = sents[0], bestScore = -1;\n  sents.forEach(s => {\n    const t = tokenize(s);\n    const sc = t.filter(x => qTokens.indexOf(x) >= 0).length \/ Math.sqrt(t.length + 1);\n    if(sc > bestScore){ bestScore = sc; best = s; }\n  });\n  return best.length > (len || 120) ? best.slice(0, len || 120) + '…' : best;\n}\nfunction highlight(text, qTokens){\n  let out = esc(text);\n  const raw = String(text || '');\n  \/\/ 只对双字中文词做高亮，避免碎片化\n  const terms = qTokens.filter(t => \/^[\\u4e00-\\u9fa5]{2}$\/.test(t)).slice(0, 8);\n  if(!terms.length) return out;\n  const lower = raw.toLowerCase();\n  const marks = [];\n  terms.forEach(t => {\n    let i = lower.indexOf(t);\n    while(i >= 0 && marks.length < 40){ marks.push([i, i + t.length]); i = lower.indexOf(t, i + t.length); }\n  });\n  if(!marks.length) return out;\n  marks.sort((a, b) => a[0] - b[0]);\n  const merged = [];\n  marks.forEach(m => {\n    const last = merged[merged.length - 1];\n    if(last && m[0] <= last[1]) last[1] = Math.max(last[1], m[1]);\n    else merged.push(m.slice());\n  });\n  let res = '', pos = 0;\n  merged.forEach(([s, e]) => {\n    res += esc(raw.slice(pos, s)) + '<em>' + esc(raw.slice(s, e)) + '<\/em>';\n    pos = e;\n  });\n  res += esc(raw.slice(pos));\n  return res;\n}\nlet lastAnswerNotes = [];\n\nfunction ask(){\n  const q = $('qaInput').value.trim();\n  const box = $('qaResult');\n  if(!q){ $('qaInput').focus(); return; }\n  if(!notes.length){\n    box.innerHTML = '<div class=\"qa-tip\">知识库还是空的，先导入或新建一些内容再来提问吧。<\/div>';\n    return;\n  }\n  const qTokens = tokenize(q).filter(t => !STOP.has(t));\n  if(!qTokens.length){\n    box.innerHTML = '<div class=\"qa-tip\">换个更具体的问题试试，比如「雅思写作怎么开头」。<\/div>';\n    return;\n  }\n  const idx = qaIndex();\n  const scored = idx.docs.map(d => {\n    let score = 0;\n    qTokens.forEach(t => {\n      const f = d.tf[t];\n      if(!f) return;\n      const idf = Math.log(1 + idx.N \/ (1 + (idx.df[t] || 0)));\n      score += (1 + Math.log(f)) * idf;\n    });\n    \/\/ 标题命中额外加权\n    const titleTf = tokenize(d.n.title || '');\n    score += qTokens.filter(t => titleTf.indexOf(t) >= 0).length * 0.8;\n    return { n: d.n, score: score \/ Math.sqrt(d.len \/ 40 + 1) };\n  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score).slice(0, 5);\n\n  if(!scored.length){\n    box.innerHTML = '<div class=\"qa-tip\">没有找到相关内容。可以换个说法，或先把相关资料导入知识库。<\/div>';\n    return;\n  }\n\n  \/\/ 抽取回答句：标题\/标签命中的笔记优先，取其中与问题最贴近的句子\n  const sentences = [];\n  scored.forEach((hit, hi) => {\n    const src = hit.n;\n    const sents = splitSentences(src.content || src.title || '');\n    const ranked = sents.map((s, si) => {\n      const st = tokenize(s);\n      const sc = qTokens.filter(t => st.indexOf(t) >= 0).length;\n      return { s, si, sc };\n    }).filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc || a.si - b.si);\n    ranked.slice(0, 2).forEach(r => sentences.push({ text: r.s, no: hi + 1, sc: r.sc \/ (1 + hi * 0.35) }));\n  });\n  sentences.sort((a, b) => b.sc - a.sc);\n  const picked = [];\n  const seen = new Set();\n  sentences.forEach(s => {\n    const k = normText(s.text).slice(0, 30);\n    if(seen.has(k) || picked.length >= 3) return;\n    seen.add(k); picked.push(s);\n  });\n\n  const answerText = picked.length\n    ? picked.map(p => p.text.replace(\/\\s+\/g, ' ').slice(0, 160) + '〔' + p.no + '〕').join(' ')\n    : snippetOf(scored[0].n.content || scored[0].n.title, qTokens, 150);\n\n  const citeList = scored.slice(0, 3).map((h, i) => '<b>' + (i + 1) + '.<\/b> ' + esc(h.n.title || '（未命名笔记）')).join('　');\n\n  box.innerHTML =\n    '<div class=\"qa-answer\">' +\n      '<div class=\"qa-answer-label\">参考回答<\/div>' +\n      '<div class=\"qa-answer-text\">' + esc(answerText).replace(\/〔(\\d)〕\/g, '<sup style=\"color:var(--primary);font-weight:700\">[$1]<\/sup>') + '<\/div>' +\n      '<div class=\"qa-answer-cite\">依据：' + citeList + '<\/div>' +\n    '<\/div>' +\n    '<div class=\"qa-hits\">' + scored.map((h, i) =>\n      '<div class=\"qa-hit\" data-id=\"' + h.n.id + '\">' +\n        '<div class=\"qa-hit-top\"><span class=\"qa-hit-no\">' + (i + 1) + '<\/span>' +\n          '<span class=\"qa-hit-title\">' + esc(h.n.title || '（未命名笔记）') + '<\/span><\/div>' +\n        '<div class=\"qa-hit-snippet\">' + highlight(snippetOf(h.n.content || h.n.title, qTokens, 110), qTokens) + '<\/div>' +\n      '<\/div>').join('') + '<\/div>';\n\n  box.querySelectorAll('.qa-hit').forEach(el => {\n    el.onclick = () => openEditor(el.dataset.id);\n  });\n  lastAnswerNotes = scored.map(s => s.n.id);\n}\nfunction renderQaSamples(){\n  const samples = ['雅思写作怎么开头', '时间管理方法', '怎么提高听力'];\n  $('qaSamples').innerHTML = samples.map(s => '<button class=\"qa-sample\">' + esc(s) + '<\/button>').join('');\n  $('qaSamples').querySelectorAll('.qa-sample').forEach(b => {\n    b.onclick = () => { $('qaInput').value = b.textContent; ask(); };\n  });\n}\n\n\/* ---------------- 主题接口（外壳调用） ---------------- *\/\nfunction mixHex(a, b, r){\n  const pa = String(a).replace('#',''), pb = String(b).replace('#','');\n  if(pa.length < 6 || pb.length < 6) return a;\n  const na = parseInt(pa, 16), nb = parseInt(pb, 16);\n  const ch = sh => Math.round(((na >> sh) & 255) + (((nb >> sh) & 255) - ((na >> sh) & 255)) * r);\n  return '#' + [16, 8, 0].map(sh => ch(sh).toString(16).padStart(2, '0')).join('');\n}\nfunction setNotesTheme(dark, primaryColor){\n  const isDark = !!dark;\n  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');\n  if(primaryColor){\n    document.documentElement.style.setProperty('--primary', primaryColor);\n    document.documentElement.style.setProperty('--primary-soft', mixHex(primaryColor, isDark ? '#2c2c2e' : '#ffffff', isDark ? 0.76 : 0.88));\n  }\n}\nfunction openNewNote(){ openEditor(null); }\nfunction getNotesStats(){\n  return { total: notes.length, categories: cats.length };\n}\n\n\/* ---------------- 事件 ---------------- *\/\nfunction renderAll(){\n  renderStats();\n  renderRecent();\n  renderCats();\n  renderChips();\n  renderAllNotes();\n}\n$('ntCancel').onclick = closeEditor;\n$('ntSave').onclick = saveNote;\n$('ntDelete').onclick = () => { if(editingId) removeNote(editingId); };\n$('ntMask').addEventListener('click', e => { if(e.target.id === 'ntMask') closeEditor(); });\n$('ntSearch').addEventListener('input', e => { keyword = e.target.value; renderChips(); renderAllNotes(); });\n\n$('catAdd').onclick = () => openCatEditor(null);\n$('catCancel').onclick = closeCatEditor;\n$('catSave').onclick = saveCat;\n$('catName').addEventListener('keydown', e => { if(e.key === 'Enter') saveCat(); });\n$('catMask').addEventListener('click', e => { if(e.target.id === 'catMask') closeCatEditor(); });\n\n$('recentAll').onclick = () => { $('secAll').scrollIntoView({ behavior: 'smooth', block: 'start' }); };\n$('qaAsk').onclick = ask;\n$('qaInput').addEventListener('keydown', e => { if(e.key === 'Enter') ask(); });\n$('impClose').onclick = () => $('impMask').classList.remove('show');\n$('impMask').addEventListener('click', e => { if(e.target.id === 'impMask') $('impMask').classList.remove('show'); });\n\ndocument.addEventListener('keydown', e => {\n  if(e.key === 'Escape'){ closeEditor(); closeCatEditor(); $('impMask').classList.remove('show'); }\n});\n\nload();\nrenderAll();\nrenderQaSamples();\n<\/script>\n<\/body>\n<\/html>\n";</script>

<script>
/* =====================================================
   工作台外壳
   ===================================================== */
const MODULES=[
  {id:'weight',  icon:'⚖️', name:'体重记录', app:'weight', tab:'combined'},
  {id:'diet',    icon:'🍚', name:'饮食记录', app:'weight', tab:'diet'},
  {id:'exercise',icon:'🏃', name:'运动记录', app:'weight', tab:'diet'},
  {id:'period',  icon:'🌸', name:'经期记录', desc:'记录经期起止，预测下次经期与排卵期，关联体重与心情波动。', feats:['周期日历','经期预测','症状记录','排卵期提醒']},
  {id:'finance', icon:'💰', name:'记账', desc:'日常收支记录，分类统计与月度报表，掌握钱花在哪里。', feats:['收支分类','月度报表','预算管理','图表分析']},
  {id:'diary',   icon:'📔', name:'日记', desc:'随手记录每天的生活与想法，支持标签与检索回顾。', feats:['富文本编辑','标签分类','日历视图','那年今日']},
  {id:'language',icon:'🌍', name:'外语学习', app:'lang'},
  {id:'habit',   icon:'✅', name:'习惯打卡', desc:'自定义习惯，每日打卡，连续天数与完成率统计。', feats:['自定义习惯','连续天数','完成率热力图','提醒']},
  {id:'todo',    icon:'📅', name:'日程待办', desc:'日程安排与待办清单，按日期管理，支持优先级与完成状态。', feats:['今日视图','优先级','重复任务','月历视图']},
  {id:'goal',    icon:'🎯', name:'短期目标', desc:'设定短期目标并拆解里程碑，追踪进度直至达成。', feats:['目标拆解','进度追踪','截止日期','复盘']},
  {id:'mood',    icon:'😊', name:'心情记录', desc:'每日心情打卡与随笔，心情趋势曲线，关注自己的情绪变化。', feats:['心情指数','心情日历','趋势曲线','关键词']},
  {id:'notes',   icon:'📚', name:'知识库', app:'notes'},
];
const MK='workbenchActiveModule', DK='workbenchDarkMode';
const W_THEME_KEY='weightRecordThemeConfig', L_STORE='ielts_desk_v32', MOD_ORDER_KEY='workbenchModuleOrder';
let activeModule='weight';
try{ const m=localStorage.getItem(MK); if(MODULES.some(x=>x.id===m)) activeModule=m; }catch(e){}
/* 窄屏：先看首页入口，再进入功能页 */
const MOBILE_MQ=window.matchMedia('(max-width:860px)');
let onHome=MOBILE_MQ.matches;
let dark=false;
try{ dark=localStorage.getItem(DK)==='1'; }catch(e){}
if(dark) document.body.classList.add('dark');

const $=id=>document.getElementById(id);

/* 模块顺序：读取自定义顺序，缺省用默认顺序补齐 */
function orderedModules(){
  let order=null;
  try{ order=JSON.parse(localStorage.getItem(MOD_ORDER_KEY)||'null'); }catch(e){ order=null; }
  const ids=MODULES.map(m=>m.id);
  if(!Array.isArray(order)) order=ids;
  // 过滤无效 id，并按当前 MODULES 顺序补齐缺失项
  const seen=new Set();
  const result=[];
  order.forEach(id=>{ if(ids.includes(id) && !seen.has(id)){ seen.add(id); result.push(id); } });
  ids.forEach(id=>{ if(!seen.has(id)){ seen.add(id); result.push(id); } });
  return result.map(id=>MODULES.find(m=>m.id===id));
}

function renderNav(){
  const list=orderedModules();
  $('moduleNav').innerHTML=list.map(m=>
    '<button class="nav-btn'+(m.id===activeModule?' active':'')+'" data-mod="'+m.id+'"><span class="ico">'+m.icon+'</span>'+m.name+'</button>'
  ).join('');
  $('moduleNav').querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>openModule(b.dataset.mod));
}

/* 移动端首页：全部入口 */
function renderHome(){
  const box=$('homeGrid'); if(!box) return;
  box.innerHTML=orderedModules().map(m=>{
    const desc=m.desc?'<span class="hc-desc">'+m.desc+'</span>':'';
    return '<button class="home-card'+(m.id===activeModule?' active':'')+'" data-mod="'+m.id+'">'+
      '<span class="hc-ico">'+m.icon+'</span><span class="hc-name">'+m.name+'</span>'+desc+'</button>';
  }).join('');
  box.querySelectorAll('.home-card').forEach(b=>b.onclick=()=>openModule(b.dataset.mod));
}
function openModule(id){
  activeModule=id;
  onHome=false;
  try{ localStorage.setItem(MK,id); }catch(e){}
  renderAll();
  try{ window.scrollTo(0,0); }catch(e){}
}
function goHome(){
  onHome=true;
  renderAll();
  try{ window.scrollTo(0,0); }catch(e){}
}

function mountFrame(frame, html, hideCss){
  if(!frame||frame.dataset.mounted==='1') return frame&&frame.contentDocument;
  let d=null;
  try{ d=frame.contentDocument||(frame.contentWindow&&frame.contentWindow.document); }catch(e){ return null; }
  if(!d) return null;
  try{
    d.open(); d.write(html); d.close();
    frame.dataset.mounted='1';
    if(hideCss){ const st=d.createElement('style'); st.textContent=hideCss; d.head.appendChild(st); }
    return d;
  }catch(e){
    const tip=document.createElement('div');
    tip.className='frame'; tip.style.cssText+=';padding:40px;text-align:center;color:var(--gray)';
    tip.textContent='当前环境无法内嵌运行子应用，请用「启动.command」以本地服务方式打开本页面。';
    frame.parentNode.replaceChild(tip,frame);
    return null;
  }
}
const HIDE_WEIGHT_SIDE='.app-layout > aside.sidebar{display:none !important}.main-area .main-inner{padding:18px 20px 50px !important;max-width:1400px}.app-layout{min-height:0 !important}@media(max-width:600px){.main-area .main-inner{padding:10px 10px 24px !important}.detail-page{padding:0 !important}}';
const HIDE_LANG_SIDE='.sidebar{display:none !important} main{padding:18px 16px 60px !important}.app{min-height:0 !important}@media(max-width:600px){main{padding:10px 10px 24px !important}}';
const HIDE_NOTES_STYLE='';
/* ---------- 主题下发：只作用于已挂载的 iframe，未挂载的在首次挂载时补发 ---------- */
const HOSTS=['hostWeight','hostLang','hostNotes','hostPH'];
function isMounted(id){ const f=$(id); return !!f && f.dataset.mounted==='1'; }
function childWin(id){ const f=$(id); return isMounted(id) ? f.contentWindow : null; }
function applyWeightTheme(){
  const w=childWin('frameWeight'); if(!w) return;
  try{ if(w.setDarkMode) w.setDarkMode(dark); }catch(e){}
}
function applyLangTheme(color){
  const w=childWin('frameLang'); if(!w) return;
  try{ if(w.setLangTheme) w.setLangTheme(dark?'dark':'light', color||readWeightTheme().primaryColor); }catch(e){}
}
function applyNotesTheme(color){
  const w=childWin('frameNotes'); if(!w) return;
  try{ if(w.setNotesTheme) w.setNotesTheme(dark, color||readWeightTheme().primaryColor); }catch(e){}
}
/* 外壳侧持久化体重主题配置，避免子应用未挂载时设置丢失 */
function saveThemeConfig(patch){
  let cfg={};
  try{ cfg=JSON.parse(localStorage.getItem(W_THEME_KEY)||'{}')||{}; }catch(e){ cfg={}; }
  const next=Object.assign({}, cfg, patch);
  try{ localStorage.setItem(W_THEME_KEY, JSON.stringify(next)); }catch(e){}
  return next;
}

/* 主题色统一入口：先落盘，再下发给已挂载的子应用 */
function setThemeColor(patch){
  saveThemeConfig(patch);
  const w=childWin('frameWeight');
  try{ if(w&&w.setWeightTheme) w.setWeightTheme(patch); }catch(e){}
  if(patch.primaryColor){
    document.documentElement.style.setProperty('--primary', patch.primaryColor);
    applyLangTheme(patch.primaryColor);
    applyNotesTheme(patch.primaryColor);
  }
}

function weightDoc(){
  const fresh=!isMounted('frameWeight');
  const doc=mountFrame($('frameWeight'), WEIGHT_APP_HTML, HIDE_WEIGHT_SIDE);
  if(doc&&fresh) applyWeightTheme();
  return doc;
}
function langDoc(){
  const fresh=!isMounted('frameLang');
  const doc=mountFrame($('frameLang'), IELTS_APP_HTML, HIDE_LANG_SIDE);
  if(doc&&fresh) applyLangTheme();
  return doc;
}
function notesDoc(){
  const fresh=!isMounted('frameNotes');
  const doc=mountFrame($('frameNotes'), NOTES_APP_HTML, HIDE_NOTES_STYLE);
  if(doc&&fresh) applyNotesTheme();
  return doc;
}
function weightWin(){ const d=weightDoc(); return d&&d.defaultView; }
function langWin(){ const d=langDoc(); return d&&d.defaultView; }
function notesWin(){ const d=notesDoc(); return d&&d.defaultView; }

function switchWeightTab(tab){
  const w=weightWin(); if(!w) return;
  try{ if(typeof w.switchTab==='function') w.switchTab(tab); }catch(e){}
}
function switchLangView(v){
  const d=langDoc(); if(!d) return;
  const b=d.querySelector('.nav-item[data-view="'+v+'"]'); if(b) b.click();
  const tabs=$('langTabs'); if(tabs) tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));
  setTimeout(syncLangCd,250);
}
function syncLangCd(){
  const f=$('frameLang'), el=$('langCd'); if(!f||!el) return;
  const d=f.contentDocument; if(!d) return;
  const n=d.getElementById('cdNum'), dt=d.getElementById('cdDate'), g=d.getElementById('sideGoals');
  if(!n){ el.textContent=''; return; }
  const num=(n.textContent||'').trim(), date=(dt&&dt.textContent||'').trim(), goal=(g&&g.textContent||'').trim().replace(/\s+/g,' ');
  el.textContent=(num&&num!=='--')?('距考试 '+num+' 天 · '+(date||'未设日期')+(goal?' · '+goal:'')):'点击设置考试日期与目标分';
}

/* ---------- 主题同步 ---------- */
function readWeightTheme(){
  let cfg={ primaryColor:'#4080ff', up:'#f0932b', down:'#27ae60' };
  try{ const raw=localStorage.getItem(W_THEME_KEY); if(raw){ const t=JSON.parse(raw); if(t&&typeof t==='object'){ if(t.primaryColor) cfg.primaryColor=t.primaryColor; else if(t.primaryColorLight) cfg.primaryColor=t.primaryColorLight; if(t.up) cfg.up=t.up; if(t.down) cfg.down=t.down; } } }catch(e){}
  return cfg;
}
function syncTheme(){
  document.body.classList.toggle('dark',dark);
  try{ localStorage.setItem(DK,dark?'1':'0'); }catch(e){}
  const primary=readWeightTheme().primaryColor;
  document.documentElement.style.setProperty('--primary', primary);
  applyWeightTheme();
  applyLangTheme(primary);
  applyNotesTheme(primary);
}
function syncWeightColorChips(){
  const c=readWeightTheme();
  $('weightUpColor').value=c.up;
  $('weightDownColor').value=c.down;
  $('globalThemeColor').value=c.primaryColor;
}

/* 同步品牌头像：读取主用户头像显示在侧栏 */
function syncBrandAvatar(){
  const boxes=document.querySelectorAll('.brand-avatar');
  if(!boxes.length) return;
  let html='🙂', bg='var(--border)';
  try{
    let mainIdx=null;
    const mv=localStorage.getItem('weightRecordMainUser');
    if(mv!==null && mv!=='') mainIdx=Number(mv);
    const users=JSON.parse(localStorage.getItem('weightRecordUsers')||'[]');
    let u=null;
    if(mainIdx!==null && users[mainIdx]) u=users[mainIdx];
    else if(users.length>0) u=users[0];
    if(u && u.avatarImage){ html='<img src="'+u.avatarImage+'" alt="">'; bg='var(--border)'; }
    else if(u && u.avatarEmoji){ html=u.avatarEmoji; bg=u.avatarBg||'var(--border)'; }
  }catch(e){}
  boxes.forEach(box=>{
    if(html.indexOf('<img')===0) box.innerHTML=html;
    else box.textContent=html;
    box.style.background=bg;
  });
}

/* ---------- 体重工具栏：单位 + 涨跌色 ---------- */
function refreshWeightUnitSeg(){
  const w=weightWin(); let unit='kg';
  try{ if(w&&w.getWeightUnit) unit=w.getWeightUnit(); }catch(e){}
  $('weightUnitSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.u===unit));
}

/* ---------- 统一设置 ---------- */
function renderNavOrder(){
  const list=orderedModules();
  const box=$('navOrderList');
  box.innerHTML=list.map((m,i)=>`
    <div class="nav-order-item" draggable="true" data-nav-id="${m.id}">
      <svg class="nav-order-grip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/></svg>
      <span class="nav-order-label">${m.icon} ${m.name}</span>
    </div>`).join('');
  // 拖拽排序
  let dragId=null;
  box.querySelectorAll('.nav-order-item').forEach(item=>{
    item.addEventListener('dragstart',()=>{ dragId=item.dataset.navId; item.classList.add('dragging'); });
    item.addEventListener('dragend',()=>{ item.classList.remove('dragging'); });
    item.addEventListener('dragover',e=>{
      e.preventDefault();
      const after=item.dataset.navId===dragId?null:item;
      if(!after) return;
      const rect=after.getBoundingClientRect();
      const offset=e.clientY-rect.top;
      if(offset>rect.height/2){ after.classList.add('drag-after'); after.classList.remove('drag-before'); }
      else { after.classList.add('drag-before'); after.classList.remove('drag-after'); }
    });
    item.addEventListener('dragleave',()=>{ item.classList.remove('drag-before','drag-after'); });
    item.addEventListener('drop',e=>{
      e.preventDefault();
      item.classList.remove('drag-before','drag-after');
      if(!dragId || dragId===item.dataset.navId) return;
      const order=orderedModules().map(x=>x.id);
      const from=order.indexOf(dragId), to=order.indexOf(item.dataset.navId);
      if(from<0||to<0) return;
      order.splice(from,1);
      const newTo=order.indexOf(item.dataset.navId);
      order.splice(newTo,0,dragId);
      try{ localStorage.setItem(MOD_ORDER_KEY, JSON.stringify(order)); }catch(e){}
      renderNavOrder();
      renderNav();
      dragId=null;
    });
  });
}
function renderTransferWeightUsers(){
  const sel=$('transferWeightUser');
  let users=[];
  try{ users=JSON.parse(localStorage.getItem('weightRecordUsers')||'[]'); }catch(e){}
  if(users.length>0){
    sel.innerHTML='<option value="__all__">全部用户</option>'+users.map((u,i)=>'<option value="'+i+'">'+(u.name||('用户'+(i+1)))+'</option>').join('');
    sel.style.display='';
  }else{
    sel.innerHTML='';
    sel.style.display='none';
  }
}
function openGlobalSettings(){
  syncWeightColorChips();
  $('globalThemeSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.t===(dark?'dark':'light')));
  renderNavOrder();
  renderTransferWeightUsers();
  $('maskSettings').classList.add('show');
}
function closeGlobalSettings(){ $('maskSettings').classList.remove('show'); }

/* 数据传输：按模块导出 / 导入 */
function pad(n){ return String(n).padStart(2,'0'); }
function dkey(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function downloadJSON(obj, name){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function transferExport(){
  const mod=$('transferModule').value;
  if(mod==='weight'){
    try{
      const users=JSON.parse(localStorage.getItem('weightRecordUsers')||'[]');
      const userSel=$('transferWeightUser').value;
      let outUsers=users;
      let suffix='';
      if(userSel && userSel!=='__all__'){
        const idx=Number(userSel);
        outUsers=[users[idx]];
        suffix='_'+(users[idx].name||('用户'+(idx+1)));
      }
      const data={ app:'个人工作台·体重记录', version:2, exportedAt:new Date().toISOString(), users:outUsers };
      downloadJSON(data, '体重数据_备份'+suffix+'_'+dkey()+'.json');
      alert('已导出体重数据备份');
    }catch(e){ alert('导出失败：'+e.message); }
  }else if(mod==='notes'){
    try{
      const raw=localStorage.getItem('workbenchNotesV1')||'[]';
      const catsRaw=localStorage.getItem('workbenchNotesCatsV1')||'[]';
      downloadJSON({ app:'个人工作台·知识库', version:2, exportedAt:new Date().toISOString(), notes:JSON.parse(raw), categories:JSON.parse(catsRaw) }, '知识库_备份_'+dkey()+'.json');
      alert('已导出知识库数据备份');
    }catch(e){ alert('导出失败：'+e.message); }
  }else{
    try{
      const raw=localStorage.getItem(L_STORE)||'{}';
      downloadJSON(JSON.parse(raw), '外语学习_备份_'+dkey()+'.json');
      alert('已导出外语学习数据备份');
    }catch(e){ alert('导出失败：'+e.message); }
  }
}
function transferImport(file){
  const mod=$('transferModule').value;
  const rd=new FileReader();
  rd.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(mod==='weight'){
        const list=Array.isArray(data)?data:(data&&Array.isArray(data.users)?data.users:null);
        if(!list){ alert('文件格式不正确：未找到体重用户数据'); return; }
        localStorage.setItem('weightRecordUsers', JSON.stringify(list));
        reloadWeight();
        alert('体重数据已导入');
      }else if(mod==='notes'){
        const arr=Array.isArray(data)?data:(data&&Array.isArray(data.notes)?data.notes:null);
        if(!arr){ alert('文件格式不正确：未找到知识库数据'); return; }
        localStorage.setItem('workbenchNotesV1', JSON.stringify(arr));
        const cats=data&&Array.isArray(data.categories)?data.categories:null;
        if(cats) localStorage.setItem('workbenchNotesCatsV1', JSON.stringify(cats));
        reloadNotes();
        alert('知识库数据已导入');
      }else{
        localStorage.setItem(L_STORE, JSON.stringify(data));
        reloadLang();
        alert('外语学习数据已导入');
      }
      closeGlobalSettings();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  rd.readAsText(file);
}
function reloadWeight(){
  const f=$('frameWeight'); if(f.dataset.mounted==='1'){ f.dataset.mounted=''; f.src='about:blank'; setTimeout(()=>{ weightDoc(); },50); }
}
function reloadNotes(){
  const f=$('frameNotes'); if(f && f.dataset.mounted==='1'){ f.dataset.mounted=''; f.src='about:blank'; setTimeout(()=>{ notesDoc(); },50); }
}
function reloadLang(){
  const f=$('frameLang'); if(f.dataset.mounted==='1'){ f.dataset.mounted=''; f.src='about:blank'; setTimeout(()=>{ langDoc(); if(activeModule==='language') setTimeout(syncLangCd,400); },50); }
}

/* ---------- 渲染 ---------- */
function renderPlaceholder(m){
  $('phTitle').textContent=m.icon+' '+m.name;
  $('phBody').innerHTML='<div class="ph"><div class="ph-icon">'+m.icon+'</div>'+
    '<div class="ph-desc">'+m.desc+'</div>'+
    '<div class="ph-feats">'+m.feats.map(f=>'<span class="ph-feat">'+f+'</span>').join('')+'</div>'+
    '<div class="ph-tag">框架已就绪 · 功能规划中</div></div>';
}
function renderAll(){
  renderNav();
  renderHome();
  syncBrandAvatar();
  const mobile=MOBILE_MQ.matches;
  if(!mobile) onHome=false;
  const m=MODULES.find(x=>x.id===activeModule);
  HOSTS.forEach(id=>{ $(id).hidden=true; });
  $('hostHome').hidden=!(mobile&&onHome);
  if(mobile&&onHome) return;
  if(m.app==='weight'){
    $('hostWeight').hidden=false;
    $('weightTitle').textContent=m.icon+' '+m.name;
    weightDoc(); switchWeightTab(m.tab); refreshWeightUnitSeg(); syncWeightColorChips();
  }else if(m.app==='lang'){
    $('hostLang').hidden=false; langDoc(); setTimeout(syncLangCd,400);
  }else if(m.app==='notes'){
    $('hostNotes').hidden=false; notesDoc();
  }else{
    $('hostPH').hidden=false; renderPlaceholder(m);
  }
}

/* ---------- 事件绑定 ---------- */
$('wAddBtn').onclick=()=>{ $('maskAddMenu').classList.add('show'); };
$('cancelAddMenu').onclick=()=>$('maskAddMenu').classList.remove('show');
$('maskAddMenu').addEventListener('click',e=>{ if(e.target===$('maskAddMenu')) $('maskAddMenu').classList.remove('show'); });
$('addWeightBtn').onclick=()=>{ $('maskAddMenu').classList.remove('show'); try{ const w=weightWin(); if(w&&w.openAddWeightModal) w.openAddWeightModal(); }catch(e){} };
$('addMetricBtn').onclick=()=>{ $('maskAddMenu').classList.remove('show'); try{ const w=weightWin(); if(w&&w.openAddMetricModal) w.openAddMetricModal(); }catch(e){} };
$('wUserBtn').onclick=()=>{ try{ const w=weightWin(); if(w&&w.renderUserSelectList){ w.renderUserSelectList(); const ms=w.document.getElementById('maskUserSelect'); if(ms) ms.classList.add('show'); } }catch(e){} };
$('weightUnitSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  try{ const w=weightWin(); if(w&&w.applyGlobalUnit) w.applyGlobalUnit(b.dataset.u); }catch(e){}
  refreshWeightUnitSeg();
});
$('weightUpColor').oninput=e=>setThemeColor({ up:e.target.value });
$('weightDownColor').oninput=e=>setThemeColor({ down:e.target.value });

$('langTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>switchLangView(b.dataset.view));
$('langRecordBtn').onclick=()=>{ try{ const d=langDoc(); const b=d&&d.getElementById('recordBtn'); if(b) b.click(); }catch(e){} };
$('langCatColorBtn').onclick=()=>{ try{ const l=langWin(); if(l&&l.openLangCatColorModal) l.openLangCatColorModal(); }catch(e){} };
$('notesAddBtn').onclick=()=>{ try{ const n=notesWin(); if(n&&n.openNewNote) n.openNewNote(); }catch(e){} };
$('notesImportBtn').onclick=()=>$('notesCsvFile').click();
$('notesCsvFile').addEventListener('change',e=>{
  const f=e.target.files[0]; e.target.value='';
  if(!f) return;
  let w=null;
  try{ w=notesWin(); }catch(err){}
  if(!w||!w.importCSVFile){ alert('知识库还在加载，请稍后再试'); return; }
  try{
    const p=w.importCSVFile(f);
    if(p&&p.catch) p.catch(err=>alert('导入失败：'+(err&&err.message||err)));
  }catch(err){ alert('导入失败：'+err.message); }
});
$('homeSetBtn').onclick=openGlobalSettings;
document.addEventListener('click',e=>{ if(e.target.closest('[data-back]')) goHome(); });
$('langCdBtn').onclick=()=>{ try{ const l=langWin(); if(l&&l.openLangGoalModal) l.openLangGoalModal(); }catch(e){} };

/* 统一设置 */
$('openSettingsBtn').onclick=openGlobalSettings;
$('closeSettingsBtn').onclick=closeGlobalSettings;
$('maskSettings').addEventListener('click',e=>{ if(e.target===$('maskSettings')) closeGlobalSettings(); });
$('globalThemeSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  dark = b.dataset.t==='dark';
  syncTheme();
  $('globalThemeSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));
});
$('globalThemeColor').oninput=e=>setThemeColor({ primaryColor:e.target.value });
$('transferExportBtn').onclick=transferExport;
$('transferImportBtn').onclick=()=>$('transferImportFile').click();
$('transferImportFile').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) transferImport(f); e.target.value=''; });
$('transferModule').addEventListener('change',()=>{ 
  const isWeight=$('transferModule').value==='weight';
  const sel=$('transferWeightUser');
  if(isWeight){ renderTransferWeightUsers(); } else { sel.style.display='none'; }
});

/* 断点切换：进入窄屏回到首页，回到宽屏直接看内容 */
const onMqChange=()=>{ onHome=MOBILE_MQ.matches; renderAll(); };
if(MOBILE_MQ.addEventListener) MOBILE_MQ.addEventListener('change',onMqChange);
else if(MOBILE_MQ.addListener) MOBILE_MQ.addListener(onMqChange);

let resizeTimer=null;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    const w=childWin('frameWeight'); if(!w) return;
    try{ if(w.handleChartResize) w.handleChartResize(); }catch(e){}
  },120);
});

syncTheme();
renderAll();
</script>

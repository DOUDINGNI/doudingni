<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<title>跟学伙伴 · 七年级上册</title>
<style>
/* =========================================================
   道德与法治 七年级上册 · 跟学伙伴
   样式：单文件、移动优先、随屏幕自适应
   ========================================================= */
:root{
  --bg:#f7f5f0;
  --surface:#ffffff;
  --surface2:#fbf9f4;
  --ink:#1f2429;
  --ink2:#454c55;
  --muted:#7c838f;
  --line:#e8e3d8;
  --line2:#f1ede4;
  --accent:#b4552d;
  --good:#2c7a58;
  --good-bg:#e8f4ed;
  --bad:#b93b30;
  --bad-bg:#fdeceb;
  --warn-bg:#fdf6e6;
  --warn-line:#efd9a3;
  --r:16px;
  --shadow:0 1px 2px rgba(31,36,41,.04), 0 10px 28px -16px rgba(31,36,41,.22);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:16px;line-height:1.72;letter-spacing:.01em;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:var(--accent)}
::selection{background:#f6e2d3}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(247,245,240,.86);
  backdrop-filter:saturate(1.4) blur(14px);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1040px;margin:0 auto;padding:10px 16px;
  display:flex;align-items:center;gap:14px;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{
  width:38px;height:38px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(150deg,#c05e34,#8f3f21);
  color:#fff;display:grid;place-items:center;
  font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:.02em;
  box-shadow:0 6px 14px -6px rgba(143,63,33,.7);
}
.brand-txt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand-txt b{font-size:16px;font-family:var(--serif);letter-spacing:.04em}
.brand-txt span{font-size:11.5px;color:var(--muted);letter-spacing:.06em}
.tabs{margin-left:auto;display:none;gap:4px;background:#efece4;padding:4px;border-radius:12px}
.tabs button{
  padding:7px 16px;border-radius:9px;font-size:14px;color:var(--ink2);
  transition:.18s;white-space:nowrap;
}
.tabs button.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(31,36,41,.1)}
.hdr-progress{display:none;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.hdr-progress .bar{width:76px;height:6px;background:#e6e1d6;border-radius:99px;overflow:hidden}
.hdr-progress .bar i{display:block;height:100%;background:linear-gradient(90deg,#3f9b76,#2c7a58);border-radius:99px;transition:width .4s}

/* ---------- 布局 ---------- */
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 40px}
.view{display:none;animation:fade .28s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.page-head{margin-bottom:16px}
.page-head h1{
  font-family:var(--serif);font-size:clamp(21px,5.2vw,27px);letter-spacing:.02em;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.page-head .sub{color:var(--muted);font-size:13.5px;margin-top:5px}
.page-head .sub b{color:var(--accent);font-weight:600}

.hint{
  display:flex;gap:9px;align-items:flex-start;
  background:var(--surface2);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;font-size:13.5px;color:var(--ink2);margin-top:12px;
}
.hint .ic{flex:0 0 auto;font-size:15px;line-height:1.5}

/* ---------- 单元切换 ---------- */
.chips{
  display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:8px 14px;border-radius:99px;border:1px solid var(--line);
  background:#fff;font-size:13.5px;color:var(--ink2);white-space:nowrap;
  transition:.18s;display:flex;align-items:center;gap:7px;
}
.chip .dot{width:7px;height:7px;border-radius:99px;background:var(--c,#bbb)}
.chip:hover{border-color:#d8d0c2}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
.chip.active .dot{background:#fff}
.chip.sm{padding:6px 12px;font-size:12.5px}

/* ---------- 思维导图 ---------- */
.unit-banner{
  border-radius:var(--r);padding:18px 18px 16px;margin-bottom:18px;
  border:1px solid var(--line);position:relative;overflow:hidden;
  background:var(--surface);
}
.unit-banner:before{
  content:'';position:absolute;inset:0 0 auto 0;height:4px;background:var(--c);
}
.unit-banner h2{
  font-family:var(--serif);font-size:19px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
}
.unit-banner h2 span{color:var(--c)}
.unit-banner p{color:var(--ink2);font-size:13.8px;margin-top:8px}
.unit-goal{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.unit-goal i{
  font-style:normal;font-size:12px;color:var(--ink2);
  background:var(--tint);border:1px solid rgba(0,0,0,.045);
  padding:3px 9px;border-radius:99px;
}

.lesson-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;
}
.lc-head{
  display:flex;align-items:center;gap:10px;padding:14px 16px;width:100%;text-align:left;
}
.lc-head .no{
  flex:0 0 auto;font-size:11.5px;letter-spacing:.06em;color:#fff;background:var(--c);
  padding:3px 9px;border-radius:6px;font-weight:600;
}
.lc-head .tt{font-family:var(--serif);font-size:17px;font-weight:600;flex:1;min-width:0}
.lc-head .cnt{font-size:12px;color:var(--muted);flex:0 0 auto}
.chev{width:9px;height:9px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);
  transform:rotate(45deg);transition:.22s;flex:0 0 auto;margin-right:2px}
.closed > .lc-head .chev, .closed > .mm-node .chev{transform:rotate(-45deg)}
.lc-tools{display:flex;gap:6px;padding:0 16px 12px}
.tool{
  font-size:12px;color:var(--ink2);border:1px solid var(--line);background:#fff;
  padding:4px 10px;border-radius:99px;
}
.tool:active{background:#f3efe6}

.mm{padding:2px 16px 18px}
.mm-root{
  display:inline-flex;align-items:center;gap:8px;background:var(--c);color:#fff;
  padding:7px 14px;border-radius:10px;font-size:14px;font-weight:600;
  box-shadow:0 6px 16px -10px rgba(0,0,0,.5);
}
.mm-branches{
  margin:12px 0 0 12px;padding-left:16px;
  border-left:2px dashed color-mix(in srgb,var(--c) 40%,#ddd);
}
.mm-branch{position:relative;margin-bottom:12px}
.mm-branch:before{
  content:'';position:absolute;left:-16px;top:19px;width:14px;height:2px;
  background:color-mix(in srgb,var(--c) 40%,#ddd);
}
.mm-node{
  display:inline-flex;align-items:center;gap:9px;font-size:14px;font-weight:600;
  background:var(--tint);border:1px solid color-mix(in srgb,var(--c) 26%,#fff);
  color:var(--ink);padding:7px 13px;border-radius:9px;text-align:left;
}
.mm-node b{color:var(--c);font-size:12px;font-weight:600;opacity:.85}
.mm-leaves{margin:9px 0 0 6px;padding-left:16px;border-left:1px solid var(--line2)}
.mm-branch.closed .mm-leaves{display:none}

.leaf{
  border:1px solid var(--line2);border-radius:11px;background:var(--surface2);
  margin-bottom:8px;overflow:hidden;transition:.18s;
}
.leaf.open{background:#fff;border-color:color-mix(in srgb,var(--c) 30%,#fff);
  box-shadow:0 6px 18px -14px rgba(0,0,0,.4)}
.leaf-head{display:flex;gap:9px;padding:10px 12px;width:100%;text-align:left;align-items:flex-start}
.leaf-head .idx{
  flex:0 0 auto;width:19px;height:19px;border-radius:6px;background:var(--c);color:#fff;
  font-size:11px;display:grid;place-items:center;margin-top:3px;font-weight:600;
}
.leaf-head .lt{
  flex:1;font-size:13.8px;line-height:1.68;color:var(--ink2);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.leaf.open .lt{-webkit-line-clamp:unset;display:block;color:var(--ink)}
.leaf-more{display:none;padding:0 12px 12px 40px}
.leaf.open .leaf-more{display:block}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.kw i{
  font-style:normal;font-size:11.5px;color:color-mix(in srgb,var(--c) 78%,#333);
  background:#fff;border:1px solid color-mix(in srgb,var(--c) 28%,#fff);
  padding:2px 8px;border-radius:99px;
}
.tip{
  display:flex;gap:8px;font-size:12.8px;line-height:1.66;color:#7a5a1f;
  background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:9px;padding:8px 10px;
}
.tip b{flex:0 0 auto;color:#a97417;font-weight:700}

/* ---------- 跟学 ---------- */
.stepper{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;
}
.sp-head{
  display:flex;align-items:center;gap:10px;padding:14px 16px 10px;flex-wrap:wrap;
}
.sp-head .badge{
  font-size:11.5px;padding:3px 9px;border-radius:6px;background:var(--c);color:#fff;font-weight:600;
}
.sp-head .title{font-family:var(--serif);font-size:16.5px;font-weight:600;flex:1;min-width:0}
.sp-head .count{font-size:12.5px;color:var(--muted)}
.sp-bar{height:5px;background:#efeae0;margin:0 16px;border-radius:99px;overflow:hidden}
.sp-bar i{display:block;height:100%;background:linear-gradient(90deg,#4aa07e,#2c7a58);transition:width .35s;border-radius:99px}
.sp-body{padding:18px 16px 6px;min-height:180px}
.sp-nav{
  display:flex;gap:9px;padding:14px 16px 16px;border-top:1px solid var(--line2);margin-top:14px;
  align-items:center;
}
.btn{
  padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;
  background:var(--ink);color:#fff;transition:.16s;white-space:nowrap;
}
.btn:active{transform:scale(.985)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.good{background:var(--good)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-size:13px}
.sp-nav .grow{flex:1}

.step-tag{font-size:12.5px;color:var(--muted);letter-spacing:.04em;margin-bottom:8px}
.step-h{font-family:var(--serif);font-size:clamp(18px,4.6vw,21px);margin-bottom:4px}
.step-p{font-size:15px;line-height:1.85;color:var(--ink2)}
.step-p.strong{color:var(--ink);font-size:15.5px}
.scene-box{
  background:linear-gradient(180deg,var(--tint),#fff);border:1px solid var(--line);
  border-radius:13px;padding:16px;font-size:15px;line-height:1.85;color:var(--ink2);
}
.scene-box .qline{margin-top:12px;font-size:14px;color:var(--accent);font-weight:500}
.contrast-table{display:grid;gap:10px;margin-top:6px}
.crow{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.crow>div{padding:10px 13px;font-size:14px;line-height:1.7}
.crow .w{background:var(--bad-bg);color:#8c2f26}
.crow .r{background:var(--good-bg);color:#1f5c42}
.crow .k{font-size:11.5px;font-weight:700;letter-spacing:.08em;opacity:.75;display:block;margin-bottom:2px}
.check-wrap .qcard{margin:0 0 12px;box-shadow:none}
.lesson-goal{margin-top:12px;display:grid;gap:7px}
.lesson-goal div{display:flex;gap:8px;font-size:14px;color:var(--ink2)}
.lesson-goal div:before{content:'✓';color:var(--good);font-weight:700;flex:0 0 auto}
.sum-list{display:grid;gap:10px;margin-top:10px}
.sum-item{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--surface2)}
.sum-item h4{font-size:14px;font-family:var(--serif);display:flex;gap:8px;align-items:center}
.sum-item h4 em{font-style:normal;font-size:11.5px;color:#fff;background:var(--c);padding:2px 7px;border-radius:5px}
.sum-item .kw{margin:8px 0 0}

.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.dots button{
  width:22px;height:6px;border-radius:99px;background:#ded8cb;transition:.2s;
}
.dots button.on{background:var(--ink)}
.dots button.cur{background:var(--good);width:30px}

/* ---------- 测试 ---------- */
.method-grid{display:grid;gap:10px;margin:14px 0 6px}
.method{
  background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden;
}
.method>button{display:flex;align-items:center;gap:9px;padding:12px 14px;width:100%;text-align:left}
.method .mt{font-weight:600;font-size:14.5px;flex:1}
.method .tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--c);color:#fff}
.method .body{display:none;padding:0 14px 14px}
.method.open .body{display:block}
.method ol{margin:6px 0 0;padding-left:20px;font-size:13.8px;color:var(--ink2);line-height:1.78}
.method ol li{margin-bottom:5px}
.method .pf{
  margin-top:10px;font-size:13px;color:#8c2f26;background:var(--bad-bg);
  border-radius:9px;padding:9px 11px;line-height:1.7;
}

.test-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 12px}
.test-head h3{font-family:var(--serif);font-size:17px;flex:1}
.score-pill{
  font-size:13px;padding:5px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);
}
.score-pill b{color:var(--good)}

.qcard{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:15px 16px;margin-bottom:12px;box-shadow:var(--shadow);
}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.qno{
  width:22px;height:22px;border-radius:7px;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-size:12.5px;font-weight:600;flex:0 0 auto;
}
.qtype{font-size:11.5px;padding:2px 8px;border-radius:5px;background:var(--tint,#f1ede4);color:var(--c,#6b6b6b);font-weight:600}
.qmark{margin-left:auto;font-size:12px;color:var(--muted)}
.qtext{font-size:15px;line-height:1.8;white-space:pre-line}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{
  display:flex;gap:10px;align-items:flex-start;text-align:left;
  border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;
  font-size:14.2px;line-height:1.7;transition:.15s;width:100%;
}
.opt:hover{border-color:#d6cebf;background:var(--surface2)}
.opt i{
  flex:0 0 auto;width:21px;height:21px;border-radius:6px;background:#f1ede4;color:var(--ink2);
  display:grid;place-items:center;font-size:12px;font-weight:700;font-style:normal;margin-top:2px;
}
.opt.right{border-color:#8fc4a9;background:var(--good-bg)}
.opt.right i{background:var(--good);color:#fff}
.opt.wrong{border-color:#e3a7a1;background:var(--bad-bg)}
.opt.wrong i{background:var(--bad);color:#fff}
.opt.dim{opacity:.6}
.exp{
  margin-top:11px;font-size:13.6px;line-height:1.78;color:var(--ink2);
  background:var(--surface2);border-left:3px solid var(--good);border-radius:0 9px 9px 0;padding:10px 12px;
}
.exp b{color:var(--good);font-size:12.5px;letter-spacing:.06em;display:block;margin-bottom:3px}
textarea{
  width:100%;margin-top:11px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;
  font:inherit;font-size:14.2px;line-height:1.75;background:var(--surface2);color:var(--ink);
  resize:vertical;min-height:96px;
}
textarea:focus{outline:none;border-color:#b9ab94;background:#fff}
.ref{
  margin-top:11px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;
}
.ref-h{
  display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--tint,#f4f1ea);
  font-size:12.8px;font-weight:600;color:var(--c,#5a5a5a);
}
.ref-b{padding:11px 13px;font-size:14px;line-height:1.82;color:var(--ink2);white-space:pre-line}
.keys{display:flex;flex-wrap:wrap;gap:6px;padding:0 13px 13px}
.keys i{
  font-style:normal;font-size:11.5px;background:var(--surface2);border:1px solid var(--line);
  color:var(--ink2);padding:2px 8px;border-radius:99px;
}
.ref-note{padding:0 13px 13px;font-size:12px;color:var(--muted)}
.empty{
  text-align:center;color:var(--muted);font-size:14px;padding:40px 0;
}

/* ---------- 底部导航（移动端） ---------- */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  display:flex;justify-content:space-around;align-items:stretch;
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  height:calc(60px + env(safe-area-inset-bottom));
}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--muted);font-size:11px;letter-spacing:.04em;padding-top:3px;
}
.tabbar .ico{font-size:19px;line-height:1.1;filter:grayscale(1);opacity:.55}
.tabbar button.active{color:var(--ink);font-weight:600}
.tabbar button.active .ico{filter:none;opacity:1}

/* ---------- 桌面 ---------- */
@media (min-width:820px){
  body{font-size:16px;padding-bottom:0}
  .topbar-in{padding:12px 20px}
  .tabs{display:flex}
  .hdr-progress{display:flex;margin-left:6px}
  .tabbar{display:none}
  .wrap{padding:26px 20px 60px}
  .leaf-head .lt{-webkit-line-clamp:2}
  .contrast-table{grid-template-columns:1fr}
  .crow{grid-template-columns:1fr 1.25fr}
  .crow>div+div{border-left:1px solid var(--line)}
  .method-grid{grid-template-columns:1fr 1fr}
  .mm-branches{display:block}
  .mm{padding-bottom:20px}
}
@media (max-width:400px){
  .brand-txt span{display:none}
  .qcard{padding:13px}
  .sp-body{padding:15px 13px 4px}
}

/* 打印 */
@media print{
  .topbar,.tabbar,.sp-nav,.dots{display:none}
  body{background:#fff}
}

/* ---------- 补丁 ---------- */
.lesson-card.closed .mm,
.lesson-card.closed .lc-tools{display:none}

.tabbar .ico svg{
  width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;
}
.tabbar .ico{filter:none;opacity:.6}
.tabbar button.active .ico{opacity:1}
.method > button .chev{margin-right:0;margin-left:2px}
.method.open > button .chev{transform:rotate(-45deg)}
.lesson-card .lc-head:hover{background:var(--surface2)}
.leaf-head:hover .lt{color:var(--ink)}
@media (min-width:820px){
  .page-head h1{font-size:27px}
  .stepper{max-width:none}
}

/* ---------- 步骤路径 & 细节优化 ---------- */
.sp-path{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 6px;justify-content:center}
.pstep{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);
  border:1px solid var(--line);background:#fff;padding:4px 9px;border-radius:99px;transition:.15s;
}
.pstep b{font-weight:700;font-size:10.5px;color:#b6ae9e}
.pstep.on{color:var(--good);border-color:#bfdccd;background:var(--good-bg)}
.pstep.cur{background:var(--ink);border-color:var(--ink);color:#fff}
.pstep.cur b{color:rgba(255,255,255,.75)}
@media (min-width:820px){
  .mm{max-width:840px}
  .sp-body{min-height:220px}
  .leaf-head .lt{max-width:76ch}
  .step-p{max-width:78ch}
}
.kw i{background:#fff;color:#4c5560;border-color:#e2ddd1}

#spDots{display:block;margin-top:14px}

#spDots .pstep.on{background:var(--good-bg)}
#spDots .pstep.cur{background:var(--ink)}

@media (min-width:980px){
  .mm{max-width:none}
  .mm-leaves{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-items:start}

  .leaf:only-child{grid-column:1/-1}

  .mm-leaves{gap:10px}
}

.foot{
  margin-top:38px;padding-top:18px;border-top:1px solid var(--line);
  font-size:12px;color:var(--muted);line-height:1.8;
}

/* ---------- 科目切换 ---------- */
:root{--brand:#b4552d;--brand2:#8f3f21}
.mark{background:linear-gradient(150deg,var(--brand2),var(--brand));box-shadow:0 6px 14px -6px rgba(0,0,0,.32)}
.subj{display:flex;gap:3px;background:#efece4;padding:3px;border-radius:11px;margin-left:auto;flex:0 0 auto}
.subj button{padding:6px 12px;border-radius:8px;font-size:13px;color:var(--ink2);white-space:nowrap;transition:.18s}
.subj button.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(31,36,41,.1)}
@media (min-width:820px){.subj{margin-left:0}.tabs{margin-left:auto}}
@media (max-width:359px){.brand-txt span{display:none}}

/* ---------- 课文原文 ---------- */
.text-box{
  background:#fffdf8;border:1px solid var(--line);border-radius:13px;
  padding:16px 16px 6px;margin-top:6px;
  font-family:var(--serif);font-size:15.5px;line-height:2.02;color:var(--ink);
}
.text-box p{margin-bottom:10px;letter-spacing:.02em}
.text-box p:first-child{color:var(--ink2);font-weight:600}

/* ---------- 名句默写 ---------- */
.recite-wrap{display:grid;gap:9px;margin-top:6px}
.recite-item{border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:11px 13px}
.recite-q{display:flex;gap:8px;font-size:14.6px;line-height:1.8;align-items:flex-start}
.recite-q b{
  flex:0 0 auto;width:19px;height:19px;border-radius:6px;background:var(--c,#666);color:#fff;
  font-size:11px;display:grid;place-items:center;margin-top:4px;font-weight:600;
}
.recite-item .tool{margin-top:9px}
.recite-a{
  margin-top:9px;font-size:14.8px;color:#1f5c42;background:var(--good-bg);
  border-radius:8px;padding:9px 11px;font-family:var(--serif);letter-spacing:.03em;
}
@media (min-width:820px){
  .text-box{font-size:16px;line-height:2.1}
  .recite-wrap{grid-template-columns:1fr 1fr}
}
.text-box .tb-h{font-weight:600;color:var(--ink);margin-top:4px;letter-spacing:.05em;font-size:16px}
.text-box .tb-h + p{margin-top:2px}
@media (min-width:820px){
  .chips{flex-wrap:wrap;overflow-x:visible;row-gap:8px}
}

</style>

    open: [

  {

    scene: "小芸想学一门技术成为大国工匠，小胜想造出世界上最先进的芯片，小美想和堂哥一起助力乡村振兴……你的梦想是什么？如果梦想实现不了，它还有意义吗？",
    boxes: [
      { name: "做有梦想的少年", points: [
        { t: "梦想能不断激发我们对生命的热情和勇气，让生活更有色彩。有梦想，就会有希望。人类需要有梦想，因为有了梦想，人类社会才能不断发展和进步。", kw: ["热情与勇气", "希望", "社会进步"], tip: "意义要答“个人＋人类”两个层面，只答个人不完整。" },
        { t: "做有梦想的少年，应当树立远大志向。“志不立，天下无可成之事。”志向是人生的航标，是奋斗的原动力。我们要早立志，立大志，立长志。", kw: ["人生航标", "原动力", "早立志、立大志、立长志"], tip: "三个“立”的顺序和内容要记准：早—大—长。" },
        { t: "做有梦想的少年，应当紧扣时代脉搏。我们共同享有人生出彩的机会、梦想成真的机会、同祖国和时代一起成长与进步的机会。要努力成为担当民族复兴大任的时代新人。", kw: ["时代脉搏", "三个共同享有", "时代新人"], tip: "把个人梦想与中国梦结合，是本课的价值观落点。" }

      { name: "学习成就梦想", points: [

        { t: "学习可以提升我们的思想品德和精神境界，增强能力，增长智慧，使我们面前的世界更广阔、更精彩，让我们拥有实现梦想的持续力量。", kw: ["品德境界", "能力智慧", "持续力量"], tip: "“学习是半径，半径越大世界越广阔”，可作答题素材。" },
        { t: "初中阶段的学习内容非常丰富，既有知识的获取，又有能力的提升、品德的培养。学习并不局限在学校，我们生活中的所看、所听、所尝、所触、所做，都可以是学习。学习不仅表现为接受和掌握，而且表现为探究、发现、体验和感悟。", kw: ["不局限学校", "探究发现体验感悟"], tip: "做家务、做义工、调查垃圾分类都是学习，这是最常见的考法。" },
        { t: "梦想的实现，需要我们努力学习、善于学习：发现并保持对学习的兴趣，更加自觉、主动地学习；养成良好的学习习惯，掌握科学的学习方法，提高学习效率；积极参加社会实践活动，到社会大课堂去读好“无字之书”。", kw: ["兴趣", "习惯与方法", "社会实践"], tip: "“无字之书”＝社会实践，属固定表述。" },
        { t: "学习不仅关乎个人的前途和命运，更关乎民族的未来和发展。我们应学以致用、开拓进取、勇于创新，运用所学知识帮助他人、服务社会。", kw: ["民族未来", "学以致用", "服务社会"], tip: "知识学习三层次：记忆—理解—运用，只有运用才能转化为能力。" }

    contrasts: [

    quiz: [
      { q: "小然课余读科幻小说，小冰主动做家务，小佳周末去敬老院做义工，小丽调查社区垃圾分类。对他们的行为评价正确的是", o: ["只有读书才是学习，其余都是浪费时间", "这些都是学习，学习不局限在学校，也表现为体验和感悟", "做家务和做义工与学习无关", "只有考试要考的内容才算学习"], a: 1, exp: "教材明确：学习不局限在学校，所看、所听、所尝、所触、所做都可以是学习，且不仅表现为接受和掌握，还表现为探究、发现、体验和感悟。" },
      { q: "袁隆平少年时立志“让大家吃饱饭”，一生致力于杂交水稻研究。这启示我们", o: ["立志越早越容易成功，不必努力学习", "做有梦想的少年要树立远大志向，并紧扣时代脉搏", "只要志向远大，梦想就一定能实现", "梦想是个人的事，与国家无关"], a: 1, exp: "志向是人生的航标、奋斗的原动力，要早立志、立大志、立长志；同时把个人梦想同祖国和时代结合起来，成为担当民族复兴大任的时代新人。" },
      { q: "关于学习与梦想的关系，下列说法正确的是", o: ["学习是成就梦想的重要路径，为梦想提供持续力量", "有了梦想就不需要学习", "学习只是为了考试拿高分", "学习成绩好的人梦想一定能实现"], a: 0, exp: "学习是现阶段的基本任务，也是成就梦想的重要路径；它能提升品德境界、增强能力、增长智慧，让人拥有实现梦想的持续力量。" }

    open: [

  paper: {

    quiz: [
      { q: "“上了初中，我感觉自己长大了。”这种“长大”主要体现在", o: ["可以不再听父母的话", "有了新身份、新环境，也承担起新的成长要求", "学习科目变少、负担变轻", "可以自由安排所有时间"], a: 1, exp: "跨进中学校园，我们有了“中学生”这个新身份，意味着新的人生旅程开始，同时家庭、学校、社会寄予更高期望。" },
      { q: "下列做法中，属于合理规划初中生活的是", o: ["小明把“要努力”写在纸上就收进抽屉", "小华把期末目标分解成每周任务，并列出时间表", "小刚只定目标，不做具体安排", "小丽把每天的时间都用来刷题，不休息"], a: 1, exp: "规划＝确定目标＋制订行动方案（分解目标、明确细节、列出时间表）＋持之以恒；同时要劳逸结合、科学用脑。" },
      { q: "小敏在班级演讲比赛中失利，她说：“这次没发挥好，但我发现自己的表达还需要练。”小敏的做法体现了", o: ["自我否定，缺乏自信", "通过生活实践检视自己，在反思中完善自己", "盲目乐观，不重视结果", "过分在意他人的评价"], a: 1, exp: "在生活实践中认识自己，能让我们更了解自己的优势与不足，不断证明自己、检视自己；同时体现了接纳不足并向更好方向发展的态度。" },
      { q: "“天生我材必有用。”下列做法与这句话蕴含的道理一致的是", o: ["小轩总觉得自己处处不如人，不敢发言", "小雅发现自己擅长绘画，主动承担班级黑板报设计", "小宇照搬同学的学习方法，结果成绩下滑", "小彤为了合群，隐藏自己的兴趣爱好"], a: 1, exp: "每个人都有值得欣赏的方面，要欣赏自己的长处和优势，并据此发展自己，而不是盲从他人或自我否定。" },
      { q: "关于梦想，下列说法正确的是", o: ["梦想一旦确定就不能改变", "梦想能激发热情与勇气，但与社会进步无关", "梦想指引方向，实现梦想需要努力学习、善于学习", "梦想只是幻想，与现实没有联系"], a: 2, exp: "梦想是人生航标和奋斗的原动力，也能推动人类社会进步；实现梦想需要努力学习、善于学习，把梦想落实在行动中。" },
      { q: "“学习是半径，半径越大，我们拥有的世界就越广阔。”这句话说明", o: ["学习会占用我们的时间", "学习能开阔视野、增长智慧，让我们拥有实现梦想的持续力量", "学习成绩决定一个人的一切", "学习只在课堂上进行"], a: 1, exp: "学习提升思想品德和精神境界，增强能力，增长智慧，使世界更广阔、更精彩，让人拥有实现梦想的持续力量。" }
    ],
    open: [
      { type: "材料分析题", q: "材料：小明升入初中后，给自己定了“成为班级演讲高手”的目标。他报名参加朗诵社，坚持每天朗读 15 分钟并录音回听；第一次比赛失利后，他主动向语文老师请教，还请同学帮他挑毛病。半年后，他在校级比赛中获得二等奖。\n（1）小明身上体现了哪些值得我们学习的品质或做法？（2）结合材料，说明我们应如何做更好的自己。", ref: "（1）①有明确的个人发展目标并制订具体行动方案；②发挥长处、坚持训练（欣赏并发展自己的优势）；③能接纳失败、正视不足，主动向他人学习；④善于在生活实践中检视自己、不断完善自己。\n（2）①尊重和接受个体差异，根据自身特点和社会需要发展自己；②学会欣赏自己，欣赏自己的长处和优势；③学会接纳自己，接纳优点也接纳不足，并以乐观、勇气和智慧向更好方向发展；④不断完善自己，扬长补短，向他人、书本、社会学习；⑤不断发掘潜能，通过学习、参加活动、与他人合作发掘潜能；⑥把做更好的自己落实到为他人、为社会服务中。", keys: ["提取材料信息", "目标与行动方案", "欣赏与接纳", "完善与潜能", "结合材料不作空谈"] },
      { type: "实践探究题", q: "班级要开展“我的初中三年”规划主题活动，请你完成两项任务：（1）为自己设计一份初中生活规划书，写出目标与行动方案要点；（2）为活动设计两种具体形式。", ref: "（1）目标：结合社会需要与自身兴趣、性格、能力，确定品德发展、学业发展、身心发展等方面的目标（如“本学期数学稳定在 85 分以上”“每周运动 3 次”）。行动方案：把目标分解为月度、周任务，明确完成时间并列出时间表；安排“重要但不紧急”的事项优先做；每周日复盘一次，请家长或同学监督。\n（2）形式示例：①“三年后的我”主题演讲或书信；②规划书展评与小组互评；③邀请高年级学生分享规划经验；④制作“目标打卡墙”，每周打卡记录。", keys: ["目标合理且具体", "行动方案含分解、时间表、监督", "活动形式可操作", "语言条理清晰"] }

{
  id: "u2", name: "第二单元", title: "成长的时空", color: "#2f8f76", tint: "#eaf6f2",

  goal: ["理解家的意味，学会让家更美好", "认识教师职业与老师的作用，珍惜师生情谊", "体悟友谊的真谛，掌握交友的智慧", "理解集体生活的价值，学会共建美好集体"],

  {

    boxes: [
      { name: "家的意味", points: [

        { t: "家是生命的居所，是心灵的港湾。我们的生命是父母给予的，我们的成长也离不开家庭的哺育和支持。家不只是一所房子，家里有亲人，家中有亲情，家让我们的心灵有所依托。", kw: ["生命居所", "心灵港湾", "不只是一所房子"], tip: "“家不只是一所房子”是高频辨析句，强调亲情而非物质。" },
        { t: "父母关心我们的学习，关注我们的品行，用自己的言行影响和教育我们；父母给我们提供发展的机会和条件，对我们的未来寄予厚望。家长特别是父母对我们的影响很大，往往可以影响一个人的一生。", kw: ["关注品行", "提供条件", "影响一生"], tip: "“孟母三迁”“岳母刺字”“画荻教子”是说明父母影响的常用素材。" },
        { t: "家是代代传承、血脉相连的生活共同体。在薪火相传中，我们不仅接续着祖先的生命，而且传承着家风。家风作为一种无形的力量，潜移默化地影响家庭成员的价值观念、性格特征、道德修养和行为习惯。优良家风引导我们向上向善，促进家庭幸福和谐。", kw: ["生活共同体", "家风", "潜移默化", "向上向善"], tip: "家风影响的四个方面要记全：价值观念、性格特征、道德修养、行为习惯。" },
        { t: "家是我们的第一所学校，是我们的修身之所。父母是我们的第一任老师，我们在父母等家人的言传身教中学习为人处世，扣好人生的“第一粒扣子”。", kw: ["第一所学校", "第一任老师", "第一粒扣子"], tip: "三个“第一”是固定表述，不能换成“第二个家”。" }

      { name: "让家更美好", points: [
        { t: "家庭是社会的基本细胞。家庭和睦则社会安定，家庭幸福则社会祥和，家庭文明则社会文明。", kw: ["基本细胞", "和睦—安定", "幸福—祥和", "文明—文明"], tip: "三组对应关系要一一对应，别错位。" },
        { t: "建设美好的家庭，需要用心体味亲情之爱。每个家庭的亲情表现不尽相同：有的温馨和睦，有的磕磕绊绊，有的内敛深沉，有的随和自然。只要我们用心体悟就会发现，家人间的爱蕴含在生活的点滴之中。", kw: ["表现不尽相同", "用心体味", "生活点滴"], tip: "“感受不到亲情”不等于“没有亲情”，这是常考的情境判断。" },
        { t: "建设美好的家庭，需要相互关爱、彼此尊重。家庭成员之间相互关爱是家庭幸福美满的重要条件。在接受关爱的同时，也要学会回报爱：对父母长辈要孝顺敬重，对兄弟姐妹要相携相助。家庭成员要以彼此尊重为前提进行沟通和交流。", kw: ["相互关爱", "回报爱", "孝顺敬重", "彼此尊重"], tip: "关爱是双向的：接受爱＋回报爱，少一半就丢分。" },
        { t: "生活中家庭成员之间的矛盾有时难以避免。我们要学会换位思考，有事多商量，主动化解矛盾，增进情感。", kw: ["换位思考", "多商量", "主动化解"], tip: "处理家庭矛盾的三招：换位、商量、主动。" },
        { t: "建设美好的家庭，需要传承中华民族传统家庭美德。家庭是道德养成的起点。要发扬光大尊老爱幼、勤俭持家、知书达礼、遵纪守法等传统家庭美德，推动形成爱国爱家、相亲相爱、向上向善、共建共享的社会主义家庭文明新风尚。", kw: ["道德养成起点", "尊老爱幼", "勤俭持家", "新风尚"], tip: "四个“传统美德”与“新风尚”的四个短语容易混，注意区分层次。" },
        { t: "建设美好的家庭，是家庭成员的共同责任。在家庭生活中，我们都有自己的角色，家庭成员共同分担、相互协作，有助于营造良好的家庭氛围。我们要提高自我管理能力，增强家庭责任意识，为家庭建设作出贡献。", kw: ["共同责任", "共同分担", "责任意识"], tip: "问“青少年能做什么”，答“提高自我管理能力＋增强责任意识＋做力所能及的家务”。" },
        { t: "孝亲敬老是中华民族的传统美德，也是公民的法定义务。《宪法》规定成年子女有赡养扶助父母的义务；《老年人权益保障法》规定赡养人应履行经济上供养、生活上照料和精神上慰藉的义务。", kw: ["传统美德", "法定义务", "精神慰藉"], tip: "“既是美德又是义务”是必背的双重定位，只答美德不全面。" }
      ]}

      { q: "妈妈让小强穿厚外套，小强说“我知道冷热，您放心吧”，妈妈拿着外套若有所思。面对这类“碰撞”，最恰当的做法是", o: ["坚持己见，直接摔门而出", "理解妈妈的关心，说明自己的想法，用平和的方式沟通", "表面答应，出门就脱掉", "认为妈妈管得太多，以后不理她"], a: 1, exp: "亲情表现不尽相同，要用心体味其中的爱；家庭成员要以彼此尊重为前提沟通交流，学会换位思考、有事多商量。" },

      { type: "辨析题", q: "有同学说：“家是讲感情的地方，不需要讲规则和责任。”请你辨析这一观点。", ref: "该观点错误。①家确实以亲情为纽带，家中有亲情，家让我们的心灵有所依托；但家庭生活同样需要相互关爱、彼此尊重，家庭成员要以彼此尊重为前提进行沟通交流。②建设美好的家庭是家庭成员的共同责任，每个人在家庭中都有自己的角色，需要共同分担、相互协作，提高自我管理能力、增强家庭责任意识。③孝亲敬老既是中华民族传统美德，也是公民的法定义务，成年子女有赡养扶助父母的义务，赡养人还要给予精神上的慰藉。④因此，讲感情与讲责任、讲规则并不矛盾，二者统一于幸福和睦家庭的建设之中。", keys: ["判断明确", "亲情与尊重并存", "共同责任", "美德＋法定义务"] }
    ]

  {
    id: "l5", no: "第五课", title: "和谐的师生关系",
    scene: "小奇喜欢写小说，语文老师表扬他，数学课上他偷写小说被数学老师狠狠批评。同一件事，两种态度。假如你是小奇，你会怎么办？",
    boxes: [
      { name: "走近老师", points: [
        { t: "教师是一个神圣的职业，承担教书育人的使命。“师者，所以传道受业解惑也。”教师对人类数千年文明的延续发挥着重要作用。", kw: ["教书育人", "传道受业解惑", "文明延续"], tip: "“传道受业解惑”是固定引文，注意“受”不写成“授”（教材原文）。" },
        { t: "教师是履行教育教学职责的专业人员。《教师法》明确规定了教师的资格、任用、培养和培训等要求。教师作为人类文明的传承者，承载着传播知识、传播思想、传播真理，塑造灵魂、塑造生命、塑造新人的重任。", kw: ["专业人员", "教师法", "三传播三塑造"], tip: "“三传播、三塑造”要成对记住：知识—思想—真理；灵魂—生命—新人。" },
        { t: "老师在我们的成长过程中发挥着不可替代的作用。老师是我们锤炼品格的引路人，是我们学习知识的引路人，是我们创新思维的引路人，是我们奉献祖国的引路人。", kw: ["四个引路人", "品格", "知识", "创新思维", "奉献祖国"], tip: "四个“引路人”顺序固定，答题漏一个就扣分。" },
        { t: "随着时代的发展，老师正在不断改变工作理念和工作方式，提高自身素养，努力成为有理想信念、有道德情操、有扎实学识、有仁爱之心的好老师。", kw: ["四有好老师", "理想信念", "道德情操", "扎实学识", "仁爱之心"], tip: "“四有”是固定提法，与“教育家精神”不是同一组概念，别混答。" }
      ]},
      { name: "珍惜师生情谊", points: [
        { t: "彼此尊重、教学相长、携手共进，是师生交往理想而美好的状态。老师是我们敬重的长辈，是我们的良师益友，也是有血有肉、有喜怒哀乐的普通人，我们应主动理解、关心老师。", kw: ["彼此尊重", "教学相长", "携手共进", "普通人"], tip: "“老师也是普通人”是用来反驳“老师不该有情绪”的关键句。" },
        { t: "真诚接受老师的引领和指导。我们的成长离不开老师的悉心教导，应发自内心地尊重老师，善于从老师的教诲中汲取成长的营养，以勤学好问、积极主动的态度与老师交流。", kw: ["发自内心尊重", "勤学好问", "积极主动"], tip: "态度是“真诚接受”，不是“无条件服从”。" },
        { t: "正确对待老师的表扬和批评。表扬意味着肯定、鼓励和期待，我们应戒骄戒躁、再接再厉；批评意味着关心、提醒和劝诫，帮助我们反省自己、完善自我，我们应把注意力放在批评的内容上，理解老师的良苦用心。", kw: ["表扬＝肯定鼓励期待", "批评＝关心提醒劝诫", "关注内容"], tip: "最高频考点：批评也是关爱，要“对事不对人”。" },
        { t: "与老师发生矛盾时：自我反思，冷静、客观地分析原因；坦诚相待，注意沟通方式（选好时间地点场合，用老师容易接受的方式）；求同存异，尊重关心老师；相信善意，多些宽容和理解，有理恰当表达，无理主动认错。", kw: ["自我反思", "坦诚沟通", "求同存异", "相信善意"], tip: "四步法是标准答案框架，答题按“反思—沟通—求同—相信善意”展开。" },
        { t: "尊重并适应不同风格的老师。由于年龄、专业、阅历、性格等差异，每位老师的教育教学方式有所不同，不同风格的老师都有值得我们学习的地方。", kw: ["风格差异", "尊重适应", "都有可学之处"], tip: "面对“我不喜欢这个老师的风格”，正确答案是“尊重并适应”，不是“换老师”或“不听课”。" }

      { w: "现在网上什么都能查到，老师没那么重要了", r: "老师是锤炼品格、学习知识、创新思维、奉献祖国的引路人，作用不可替代" },
      { w: "老师应该永远温和，不能有情绪", r: "老师也是有血有肉、有喜怒哀乐的普通人，应主动理解、关心老师" }
    ],
    quiz: [
      { q: "小奇在数学课上偷写小说被老师批评。下列做法最恰当的是", o: ["认为老师故意让自己难堪，从此不听课", "把注意力放在批评的内容上，反思自己并改正，同时理解老师的良苦用心", "当面顶撞老师，说明自己没错", "表面认错，以后继续在课上看小说"], a: 1, exp: "老师的批评意味着关心、提醒和劝诫，帮助我们反省自己、完善自我；应把注意力放在批评的内容上，理解老师的良苦用心。" },
      { q: "“师者，所以传道受业解惑也。”这句话说明", o: ["教师只是知识的搬运工", "教师承担教书育人的使命，对人类文明的延续发挥重要作用", "只有大学老师才算真正的老师", "教师职业不需要专业素养"], a: 1, exp: "教师承担教书育人的使命，是人类文明的传承者，承载着传播知识、思想、真理和塑造灵魂、生命、新人的重任。" },
      { q: "进入初中后，小北觉得英语老师讲课“太啰嗦”，上课总走神。你给他的建议是", o: ["向学校申请换掉这位老师", "承认老师的差别，主动了解老师，尊重并适应不同风格的老师", "干脆不学英语了", "在课堂上公开表达不满，让老师改变风格"], a: 1, exp: "由于年龄、专业、阅历、性格等差异，每位老师的教育教学方式不同，不同风格的老师都有值得学习的地方，应尊重并适应。" }

    open: [
      { type: "情境探究", q: "语文老师常表扬小林的文章写得好，但一次他在数学课上看小说被数学老师严厉批评。小林觉得委屈：“我只是喜欢写作，为什么老师不理解我？”\n（1）你如何看待两位老师的做法？（2）请你给小林三条建议。", ref: "（1）两位老师的做法都是出于对小林的关心和负责。语文老师的表扬是肯定、鼓励和期待，激励他更好发展；数学老师的批评是关心、提醒和劝诫，帮助他反省自己、完善自我。二者并不矛盾。\n（2）①正确对待表扬，戒骄戒躁、再接再厉；②正确对待批评，把注意力放在批评的内容上，理解老师的良苦用心，认识上课看小说确实影响了课堂秩序；③真诚接受老师的引领和指导，主动与老师沟通，用恰当的时间、场合和方式说明自己的想法；④尊重并适应不同风格的老师，从不同老师身上学习。", keys: ["评价两位老师", "表扬的意义", "批评的意义", "沟通与适应风格"] }

  {
    id: "l6", no: "第六课", title: "友谊之树常青",

    boxes: [
      { name: "友谊的真谛", points: [
        { t: "友谊是一种亲密的关系。在真正的友谊中，我们能够得到朋友的理解和帮助、信任和忠诚、肯定和关心，享受更多的快乐和温暖，获得精神上的支持和满足。", kw: ["亲密的关系", "理解帮助", "信任忠诚", "精神支持"], tip: "“亲密”不是“形影不离”，而是心灵上的支持。" },
        { t: "友谊是一种心灵的相遇。人之相识，贵在相知；人之相知，贵在知心。友谊的美好就在于它可以超越物质条件、家庭背景、学业成绩等，实现心灵的沟通与契合。志趣相投、志同道合的友谊，更能经得住时间的考验和风雨的洗礼。", kw: ["心灵的相遇", "超越物质条件", "志同道合"], tip: "“超越物质条件、家庭背景、学业成绩”是三个并列点，答题要写全。" },
        { t: "友谊是平等的、双向的。接受朋友的帮助，也主动帮助对方；感受朋友的关怀，也主动关怀对方。我们共同分享，也相互分担，在相处中体验积极的情感，在交流中共同成长。", kw: ["平等", "双向", "共同分享", "相互分担"], tip: "这是解释“我帮了他，他却不帮我，我该不该难过”的标准依据。" },
        { t: "朋友，见证了我们一起走过的成长历程。人生路上，有些朋友陪我们一程，有些朋友伴我们一生。我们应当不辜负每一段情谊，让友谊伴随我们成长。", kw: ["见证成长", "不辜负每段情谊"], tip: "可作开放性试题的升华句。" }

      { name: "交友的智慧", points: [
        { t: "交友需要真诚和热情。人与人之间不会自然而然地产生友谊，友谊是用心培育的结果。敞开心扉，主动表达，热情待人，朋友才不会彼此错过。", kw: ["真诚", "热情", "主动表达"], tip: "“等待别人来找我”是错误做法，友谊需要主动。" },
        { t: "交友需要慎重选择。与品德高尚的人交朋友，有助于我们走好成长之路。无论是现实交友还是网上交友，我们都应学会理性辨别，做到慎交友、结好伴。", kw: ["慎重选择", "理性辨别", "慎交友结好伴"], tip: "《论语》“益者三友，损者三友”是常用素材：友直、友谅、友多闻。" },
        { t: "交友需要学会关心和尊重对方。在朋友需要的时候，以行动向朋友表达关心和支持。关心朋友也要尊重对方，把握好彼此的界限和分寸，可以给予朋友积极合理的建议，但不要替朋友做决定。", kw: ["关心支持", "界限和分寸", "不替朋友做决定"], tip: "“朋友之间该不该有距离”——答案是有，要有界限和分寸。" },
        { t: "交友需要学会处理朋友之间的矛盾和冲突。发生矛盾和冲突时，我们可以一起协商，寻找彼此能够接受的解决方式。基本策略：保持冷静、坦诚交流、换位思考、及时处理、勇担责任。", kw: ["协商", "保持冷静", "坦诚交流", "换位思考", "及时处理", "勇担责任"], tip: "五个策略是固定框架，答“怎么办”按此展开即可。" },
        { t: "交友需要讲原则。友谊需要信任和忠诚，但不等于不加分辨地为朋友做任何事。当朋友做错事，甚至误入歧途时，我们要坚持正确立场、不随波逐流，并积极予以规劝，帮助朋友及时改正错误。", kw: ["讲原则", "不随波逐流", "积极规劝"], tip: "“为朋友两肋插刀”是典型错误选项，要能识别。" },

      { w: "朋友之间不该有秘密和距离", r: "关心朋友要尊重对方，把握好界限和分寸，不替朋友做决定" },

      { q: "小川约好朋友“我”一起去教训和他闹矛盾的人。作为好朋友，“我”应该", o: ["答应他，朋友就该两肋插刀", "拒绝并劝他冷静处理，必要时寻求老师帮助", "假装答应，到时候不去", "跟他一起去，但只在旁边看着"], a: 1, exp: "交友需要讲原则。友谊不等于不加分辨地为朋友做任何事；当朋友做错事甚至误入歧途时，要坚持正确立场、不随波逐流，并积极规劝。" },
      { q: "小刚最近情绪低落却不愿说原因，好友反复追问后他很不耐烦。这提醒我们", o: ["朋友之间不该有关心", "关心朋友要尊重对方，把握好界限和分寸", "他不把我当朋友，应该绝交", "必须问出原因才算好朋友"], a: 1, exp: "交友需要学会关心和尊重对方：在朋友需要时以行动表达关心，同时尊重对方，把握好界限和分寸，不替朋友做决定。" },
      { q: "“友直，友谅，友多闻，益矣。”这句话启示我们", o: ["朋友越多越好", "交友要慎重选择，与正直、诚信、见闻广博的人交朋友", "只要成绩好就值得交朋友", "网上交友不必谨慎"], a: 1, exp: "交友需要慎重选择，与品德高尚的人交朋友有助于走好成长之路；无论现实交友还是网上交友，都要理性辨别，慎交友、结好伴。" }
    ],
    open: [
      { type: "材料分析题", q: "材料：小雨和晓彤是好朋友。一次小雨生病缺课，晓彤把笔记整理好送到她家。后来晓彤竞选班干部失败，情绪低落，小雨陪她散步、听她倾诉，还提醒她“这次演讲确实准备得不够充分”。晓彤却说：“你是我朋友，怎么还帮别人说话？”\n（1）材料中小雨的做法体现了友谊的哪些特点？（2）请你帮助晓彤正确认识友谊。", ref: "（1）①友谊是一种亲密的关系：小雨在朋友需要时给予关心和帮助，晓彤也为小雨付出，体现理解、信任与关心；②友谊是平等的、双向的：接受帮助也主动帮助，感受关怀也主动关怀；③交友需要真诚，也需要讲原则：小雨既陪伴倾听，也坦诚指出问题。\n（2）①友谊需要信任和忠诚，但不等于不加分辨地为朋友做任何事；②真正的朋友会在你做错时坚持正确立场、积极规劝，帮助你及时改正错误，这才是对友谊负责；③朋友之间要坦诚交流、换位思考，理解对方的善意，而不是把“指出问题”当成“不站我这边”。", keys: ["亲密的关系", "平等双向", "真诚与原则", "规劝也是关心"] }
    ]

  {
    id: "l7", no: "第七课", title: "在集体中成长",
    scene: "从村小学来到镇初中，寄宿生活让你学会自理；运动会上，运动员的拼搏和啦啦队的呐喊让你感受到集体的力量；小组合作中，你的视野更开阔、思维更活跃。集体到底给了我们什么？",
    boxes: [
      { name: "集体生活成就我", points: [
        { t: "集体不是个体的简单相加，而是人们联合起来的有组织的整体。每个人都有过集体生活的需要，集体生活在某种程度上可以影响甚至改变一个人。", kw: ["有组织的整体", "影响甚至改变"], tip: "“不是个体的简单相加”是高频判断点，强调组织性。" },
        { t: "集体生活能带给我们温暖。一般来说，集体的联结度越高，个体感知到的温暖就越多。集体成员间的相互体贴、团结互助，传递着关爱和温暖，让我们获得安全感和归属感。", kw: ["温暖", "联结度", "安全感", "归属感"], tip: "联结度与成员关联程度、对成员重要性、交流频率、目标共识、默契程度、存在时间相关。" },
        { t: "集体生活有助于我们学会与人交往。集体生活为我们搭建交往的平台。每个人有着不同的生活经历和性格特点，我们在集体生活中学会接纳和尊重，学会理解和包容，彼此友好相处。", kw: ["交往平台", "接纳尊重", "理解包容"], tip: "注意“学会接纳和尊重”与“学会理解和包容”是两层。" },
        { t: "集体生活有助于培养我们的责任感。在集体生活中，每个人都有不同的角色，承担不同的职责。我们在认真做事的过程中体现自己的价值，体验责任感，做有担当的人。", kw: ["责任感", "角色与职责", "有担当"], tip: "责任感来自“角色—职责—做事”的链条。" },
        { t: "集体生活有助于我们发展个性。人与人之间的差异是我们发展个性的“明镜”。在集体中学习他人的优点，有助于我们不断完善自己，发挥自己的优势和特长。", kw: ["发展个性", "差异是明镜", "发挥优势特长"], tip: "“集体的统一”与“个性的发展”不矛盾，这是易错点。" },
        { t: "集体是我们共同成长的园地。在集体生活中，我们展示自己，发展自己。集体的发展推动个人提升能力和健康成长，让我们在集体生活中相互促进、相互成就、共同发展。", kw: ["共同成长园地", "相互促进", "相互成就"], tip: "个人与集体是双向成就，不能说“个人只能服从集体”。" }
      ]},
      { name: "共建美好集体", points: [
        { t: "在美好集体中，我们能感受集体的关爱，凝聚拼搏向上的力量，坚定自己的生活信念。建设美好集体离不开你我他，需要我们共同参与和努力。", kw: ["感受关爱", "凝聚力量", "共同参与"], tip: "本框的总起句，答题可作开头。" },
        { t: "建设美好集体，要确定共同的愿景。愿景是集体的精神动力之源，是推动集体发展的内驱力。拥有共同的梦想、向往美好的未来、承担共同的使命、认同正确的价值观、形成一致的目标和追求，这就是美好集体的愿景。", kw: ["共同愿景", "精神动力之源", "内驱力"], tip: "愿景的五个要素要能列举：梦想、未来、使命、价值观、目标。" },
        { t: "建设美好集体，要树立主人翁意识。我们应主动作为，各负其责，各尽其能。对于集体的事务，应积极参与、共同商定；对于集体中存在的问题和不足，可以通过恰当的方式表达自己的意见，提出改进建议。", kw: ["主人翁意识", "主动作为", "共同商定", "恰当方式建言"], tip: "“恰当方式”很关键——不是抱怨、不是背后议论。" },
        { t: "建设美好集体，要营造和谐有序的集体环境。我们要自觉遵守集体的共同规则，使集体生活有序开展；要学会处理与他人的关系，在人际交往中学会推己及人，多些宽容和理解；要弘扬正气，自觉抵制并机智应对欺凌行为。", kw: ["遵守规则", "推己及人", "弘扬正气", "抵制欺凌"], tip: "“机智应对”欺凌≠以暴制暴，也不是沉默忍受。" },
        { t: "建设美好集体，要树立正确的合作与竞争观念。集体发展既有赖于成员间的相互合作，也需要成员间的良性竞争。我们既要敢于竞争、勇于挑战，又要善于合作、共同进步。", kw: ["相互合作", "良性竞争", "敢于竞争", "善于合作"], tip: "竞争不是“你死我活”，是“良性竞争”。" },
        { t: "建设美好集体，要坚持集体主义原则，发扬集体主义精神。当个人利益与集体利益发生冲突时，应把集体利益放在个人利益之上。同时，要充分重视和保障个人的正当利益，促进集体和个人不断发展。", kw: ["集体主义", "集体利益优先", "保障正当利益"], tip: "两句话都要写：集体利益优先＋保障个人正当利益，只写一半会失分。" }
      ]}
    ],
    contrasts: [

      { w: "竞争就是分出输赢，越激烈越好", r: "要树立正确的合作与竞争观念，既敢于竞争又善于合作，开展良性竞争" }

    quiz: [
      { q: "元元担任班级黑板报主编后，主动与同学交流合作，性格比以前开朗，生活更充实。这说明", o: ["为集体做事只会耽误自己的时间", "集体生活有助于我们学会与人交往、培养责任感", "只有当班干部才能成长", "集体会限制个人发展"], a: 1, exp: "集体生活为我们搭建交往平台，有助于学会接纳尊重、理解包容；在承担职责、认真做事中体现价值、体验责任感、做有担当的人。" },
      { q: "关于个人与集体的关系，下列说法正确的是", o: ["个人利益与集体利益总是完全一致的", "当个人利益与集体利益冲突时，应把集体利益放在个人利益之上，同时保障个人正当利益", "集体利益优先意味着可以随意牺牲个人任何利益", "个人发展完全取决于自己，与集体无关"], a: 1, exp: "坚持集体主义原则，要把集体利益放在个人利益之上；同时要充分重视和保障个人的正当利益，促进集体和个人共同发展。" },
      { q: "班里同学对“研学活动去哪儿”意见不一，下列做法最能体现主人翁意识的是", o: ["谁声音大就听谁的", "把想法写在班级信箱，班会上充分讨论后共同商定", "不参与讨论，反正最后由老师定", "私下抱怨但不说出建议"], a: 1, exp: "树立主人翁意识，要主动作为、各负其责；对集体事务积极参与、共同商定，对问题和不足通过恰当方式表达意见、提出改进建议。" }
    ],
    open: [
      { type: "实践探究题", q: "班级准备开展“共建美好集体”主题活动。请你完成：（1）写出你心目中美好集体的两个特征；（2）为班级建设提出两条具体建议，并说明依据。", ref: "（1）示例：①有共同的愿景，同学们目标一致、团结互助；②和谐有序，大家自觉遵守共同规则，彼此宽容理解；③人人有主人翁意识，各负其责、各尽其能。\n（2）建议与依据：①设立“班级信箱”，同学把想法写成纸条投入，班会集中讨论——依据：树立主人翁意识，对集体事务积极参与、共同商定，通过恰当方式提出改进建议。②制订班级目标和班级口号、布置班级文化墙——依据：确定共同愿景，愿景是集体的精神动力之源。③把班级事务细分到人、轮岗负责——依据：主动作为、各负其责，培养责任感。④开展学习互助小组，考试后互相讲题——依据：树立正确的合作与竞争观念，既敢于竞争又善于合作。", keys: ["特征具体", "建议可操作", "每条有依据", "结合教材术语"] }
    ]

  paper: {
    title: "第二单元 综合检测",
    quiz: [
      { q: "“家不只是一所房子。”这句话强调的是", o: ["房子越大家越幸福", "家中有亲人、有亲情，家让我们的心灵有所依托", "只有和父母同住才算有家", "家庭的经济条件最重要"], a: 1, exp: "家是生命的居所、心灵的港湾；家中有亲情，家让我们的心灵有所依托，而不只是物质空间。" },
      { q: "小雨发现妈妈总翻看自己的手机，她很生气。下列处理方式最恰当的是", o: ["偷偷把手机设密码，从此不和妈妈说话", "冷静沟通，说明自己的感受，也了解妈妈的担心，共同约定使用规则", "在朋友圈公开吐槽妈妈", "把手机摔了表示抗议"], a: 1, exp: "家庭成员要以彼此尊重为前提沟通交流；遇到矛盾要学会换位思考、有事多商量、主动化解矛盾，增进情感。" },
      { q: "老师批评小宇作业抄袭，小宇认为老师“故意针对”。下列认识正确的是", o: ["批评就是否定，说明老师不喜欢我", "批评意味着关心、提醒和劝诫，应把注意力放在批评的内容上", "只要成绩好，老师就不会批评", "被批评就该立刻反驳"], a: 1, exp: "老师的批评意味着关心、提醒和劝诫，帮助我们反省自己、完善自我；应把注意力放在批评的内容上，理解老师的良苦用心。" },
      { q: "“友谊是平等的、双向的”，下列做法体现这一特点的是", o: ["小A只在需要抄作业时才找朋友", "小B接受朋友帮助后，也主动关心帮助对方", "小C要求朋友必须事事听自己的", "小D认为朋友就该无条件为自己付出"], a: 1, exp: "友谊是平等的、双向的：接受朋友的帮助也主动帮助对方，感受关怀也主动关怀对方，共同分享也相互分担。" },
      { q: "运动会前，班委把任务分成训练、后勤、宣传三组，同学们各负其责；比赛中大家既为对手的精彩表现鼓掌，也为自己的成绩拼尽全力。这体现了", o: ["只有竞争没有合作", "共同愿景下的合作与良性竞争", "集体会压制个性", "个人利益高于集体利益"], a: 1, exp: "美好集体需要共同愿景引领，需要树立正确的合作与竞争观念：既敢于竞争、勇于挑战，又善于合作、共同进步。" },
      { q: "关于集体生活的作用，下列说法错误的是", o: ["集体生活能带给我们温暖", "集体生活有助于培养责任感", "集体生活必然限制个性发展", "集体生活有助于我们学会与人交往"], a: 2, exp: "集体生活有助于我们发展个性。人与人之间的差异是我们发展个性的“明镜”，在集体中学习他人优点，有助于完善自己、发挥优势特长。" }
    ],
    open: [
      { type: "辨析题", q: "有同学认为：“好朋友就应该有求必应，否则就不够义气。”请你辨析。", ref: "该观点错误。①友谊需要信任和忠诚，真正的友谊是亲密的关系，能给我们理解、信任与支持，朋友之间也应相互关心、相互帮助。②但友谊不等于不加分辨地为朋友做任何事，交友需要讲原则。当朋友做错事甚至误入歧途时，要坚持正确立场、不随波逐流，并积极予以规劝，帮助朋友及时改正错误。③“有求必应”还可能越过界限和分寸，替朋友做决定、包庇错误，最终害了朋友，也伤害友谊。④真正的“义气”是坦诚规劝、共同进步，而不是盲目顺从。", keys: ["判断错误", "友谊的亲密与忠诚", "交友讲原则", "界限与分寸", "真正的义气"] },
      { type: "材料分析题", q: "材料一：小杰的父母常年在外打工，他和奶奶一起生活。奶奶不识字，小杰每天放学后帮奶奶读药盒说明、买菜记账。他说：“奶奶把我养大，我照顾她是应该的。”\n材料二：《中华人民共和国老年人权益保障法》规定，赡养人应当履行对老年人经济上供养、生活上照料和精神上慰藉的义务。\n（1）小杰的行为体现了哪些家庭美德？（2）结合两则材料，谈谈你对“孝亲敬老”的认识。", ref: "（1）体现了孝亲敬老、尊老爱幼、勤俭持家的中华民族传统家庭美德，也体现了家庭成员相互关爱、共同分担责任。\n（2）①孝亲敬老是中华民族的传统美德，家庭是道德养成的起点；②孝亲敬老也是公民的法定义务，《宪法》规定成年子女有赡养扶助父母的义务，《老年人权益保障法》要求在经济上供养、生活上照料、精神上慰藉；③建设美好家庭需要相互关爱、彼此尊重，在接受关爱的同时学会回报爱；④作为未成年人，我们应从现在做起，做力所能及的家务，关心家人的身体和情绪，提高自我管理能力，增强家庭责任意识。", keys: ["点明传统美德", "点明法定义务", "两种材料结合", "青少年的具体做法"] },
      { type: "实践探究题", q: "学校开展“和谐师生关系”主题教育活动，请你设计一个活动方案，包括活动形式、活动步骤和预期效果。", ref: "活动形式：①“老师，我想对您说”书信（或便笺）活动；②“我当一天小老师”体验活动；③师生恳谈会/师生篮球赛。\n活动步骤（以书信活动为例）：①宣传发动，说明活动目的与写信要求（写一件老师帮助自己的具体事＋一句想说的话）；②学生撰写并投递到“心语信箱”；③班委整理后交给各位老师，邀请老师在班会上回应；④收集反馈，制作“师生心语墙”展示。\n预期效果：增进师生相互理解，让学生学会真诚接受老师的引领、正确对待表扬与批评；营造彼此尊重、教学相长、携手共进的师生关系。", keys: ["形式具体", "步骤清晰可操作", "体现教材观点", "预期效果对应目标"] }
    ]

{
  id: "u3", name: "第三单元", title: "珍爱我们的生命", color: "#3a72b0", tint: "#eaf1fa",
  intro: "每一个完整的生命，都是由肉体和精神构成的。人的生命只有一次，每个人的生命不仅属于自己，还与他人的生命乃至整个人类的生命息息相关。",
  goal: ["认识生命的特点，理解生命的可贵", "体悟敬畏生命的情怀与要求", "增强安全意识，提高防护能力", "学会爱护身体、滋养心灵"],
  lessons: [
  {
    id: "l8", no: "第八课", title: "生命可贵",
    scene: "出生、入队、入团、成年——人生的重要仪式一个接一个。奶奶临终前说“你们要好好活着”，这句话让你第一次认真思考：怎样才算好好活着？",
    boxes: [
      { name: "认识生命", points: [
        { t: "人的生命是大自然的奇迹，是地球上最为珍贵的财富。有了生命，我们才能感受大自然的勃勃生机，才能体验生活的多姿多彩，才能拥有追求幸福生活的种种可能，才能创造璀璨的人类文明。", kw: ["大自然的奇迹", "最珍贵的财富", "四个“才能”"], tip: "四个“才能”是排比句，答题时可作开头铺陈。" },
        { t: "每个人的生命都是独特的。我们来到这个世界，外形相貌、天资禀赋等各不相同，每个生命都不可替代。在成长过程中，每个人会汲取不同的物质和精神养分，形成独特的个性品质，拥有不同的人生道路。", kw: ["独特", "不可替代", "个性品质"], tip: "“独特”强调不可替代，“双胞胎指纹不同”是常用例证。" },
        { t: "每个人的生命都是不可逆的。从婴孩成长为儿童，又从儿童成长为青少年，再到中年和老年，生命的时光一去不复返。我们要珍惜生命的每一天。", kw: ["不可逆", "一去不复返", "珍惜每一天"], tip: "“不可逆”对应做法是“珍惜”，不要与“有限”混。" },
        { t: "每个人的生命都是有限的。新陈代谢、生老病死是无法抗拒的规律。我们应感恩生命的获得，把有限的生命投入到无限的奋斗和奉献之中，让生命的每一段历程都变得精彩和有意义。", kw: ["有限", "无法抗拒的规律", "无限奋斗奉献"], tip: "“有限的生命→无限的奋斗和奉献”是固定搭配，是价值观落点。" },
        { t: "人的生命是代代接续的。在历史的长河中，虽然个人的生命很短暂，但一代又一代的个体生命实现了人类生命的接续。在生命的接续中，每个人的生命不仅是“我”的生命，还是“我们”的生命。", kw: ["代代接续", "“我”也是“我们”"], tip: "“我”的生命也是“我们”的生命，是理解家国情怀的关键句。" },
        { t: "人的精神生命是不断传承的。伟大的思想、崇高的信仰、高尚的道德等都是精神生命的体现。在生命的传承中，人类的精神不断积淀和丰富。", kw: ["精神生命", "思想信仰道德", "传承"], tip: "对应“有的人死了，他还活着”，考精神生命的传承。" }
      ]},
      { name: "敬畏生命", points: [
        { t: "当人的生命遭遇不可抗拒的自然灾害、人为的灾难、不可预知的意外时，我们会感受到生命的脆弱与艰难；当人们万众一心，为挽救生命而努力、为守护生命而拼搏、为悼念生命而默哀时，我们又会体悟到生命的坚强、崇高和神圣。我们对生命要有一种敬畏的情怀。", kw: ["脆弱与艰难", "坚强崇高神圣", "敬畏情怀"], tip: "“为什么敬畏”要从两面对照答，只答一面不完整。" },
        { t: "敬畏生命，就要尊重并遵循生命存在和发展的规律。“天地之大德曰生”，万物的生长和生命的延续是宇宙天地间的重大法则。我们的生命是大自然的组成部分，效法天地自然、遵循自然界的规律，是对我们的生命最好的珍视和善待。", kw: ["遵循规律", "天地之大德曰生", "珍视善待"], tip: "乱捕滥食野生动物、破坏生态，违背的正是这一条。" },
        { t: "敬畏生命，就要关爱他人的生命。“仁者爱人”“推己及人”，要求我们从珍惜自己的生命走向关爱他人的生命，谨慎地对待生命关系、处理生命问题，尊重、关怀和善待身边的每一个人。", kw: ["仁者爱人", "推己及人", "尊重关怀善待"], tip: "从“自己的生命”到“他人的生命”，是范围的扩展。" },
        { t: "敬畏生命，就要坚持人民至上、生命至上。生命重于泰山，每个人的生命都比金钱、权势等身外之物更为重要。当人民的生命遭遇天灾人祸的威胁时，竭尽全力挽救和保护最广大人民的生命。", kw: ["人民至上", "生命至上", "生命重于泰山"], tip: "这是国家层面的要求，答题时要与“个人层面”区分开。" },
        { t: "当我们对生命怀有敬畏之心时，我们会珍视它，在行动前思考后果，保持良好的判断力，从而避免鲁莽行事和不负责任的决策；我们也会用超凡的勇气面对挑战，以无畏的态度追求更高的生命价值。", kw: ["思考后果", "避免鲁莽", "超凡勇气"], tip: "“因为敬畏，所以无畏”“心存敬畏，行有所止”两句并不矛盾，可结合使用。" }
      ]}
    ],
    contrasts: [
      { w: "生命属于自己，怎么活是自己的事", r: "每个人的生命不仅属于自己，还与他人乃至人类的生命息息相关" },
      { w: "敬畏生命就是胆小怕事、什么都不敢做", r: "敬畏让人行动前思考后果、避免鲁莽，也让人以超凡勇气追求更高生命价值" },
      { w: "生命有限，所以做什么都没意义", r: "正因有限，才应感恩生命的获得，把有限生命投入无限的奋斗和奉献" }
    ],
    quiz: [
      { q: "“每个人的生命都是不可逆的。”这一特点要求我们", o: ["珍惜生命的每一天，不虚度时光", "尽量延长生命的长度", "把时间都用在娱乐上", "等待命运的安排"], a: 0, exp: "生命不可逆，时光一去不复返，因此要珍惜生命的每一天。注意与“有限”（对应投入奋斗奉献）、“独特”（对应不可替代）区分。" },
      { q: "重庆缙云山山火中，无数救援人员迎着烈火“逆行”而上。这一行为最能说明", o: ["他们不珍惜自己的生命", "他们对生命怀有敬畏，坚持生命至上，用勇气守护他人生命", "救火是他们的法定义务", "火灾是可以完全避免的"], a: 1, exp: "敬畏生命要坚持人民至上、生命至上，竭尽全力挽救和保护最广大人民的生命；同时体现“因为敬畏，所以无畏”。" },
      { q: "“有的人活着，他已经死了；有的人死了，他还活着。”这句话说明", o: ["生命是可以永恒的", "人的精神生命可以不断传承，伟大思想和高尚道德会被后人铭记", "人的肉体生命不会消亡", "活着没有意义"], a: 1, exp: "人的精神生命是不断传承的，伟大的思想、崇高的信仰、高尚的道德都是精神生命的体现，在传承中不断积淀和丰富。" }
    ],
    open: [
      { type: "辨析题", q: "有同学说：“生命是我自己的，怎样对待生命与他人无关。”请你辨析。", ref: "该观点错误。①人的生命只有一次，每个人的生命不仅属于自己，还与他人的生命乃至整个人类的生命息息相关；在生命的接续中，每个人的生命不仅是“我”的生命，还是“我们”的生命。②敬畏生命就要关爱他人的生命，“仁者爱人”“推己及人”，要求我们从珍惜自己的生命走向关爱他人的生命，尊重、关怀和善待身边的每一个人。③不爱惜自己的生命，会给家人带来巨大痛苦，也会给社会带来损失；危害他人生命更是违法行为。④我们应珍爱生命，坚持生命至上，既对自己负责，也对他人、家庭和社会负责。", keys: ["判断错误", "生命不仅属于自己", "关爱他人生命", "对家庭社会负责"] }
    ]
  },
  {
    id: "l9", no: "第九课", title: "守护生命安全",
    scene: "“我游泳技术很好，不会在河里溺水”“实验室安全须知我没读过，也没出过事”“进电影院我先找安全出口”——三种态度，三种结局的可能性。",
    boxes: [
      { name: "增强安全意识", points: [
        { t: "生命安全是维系人的生命存在的条件和保障，也是我们创造和享受一切美好的前提。在日常生活中，突如其来的灾难、事故可能会危害人的生存、健康和幸福，甚至会毁灭鲜活的生命。", kw: ["条件和保障", "创造享受美好的前提"], tip: "本框的总起句，答题可作开篇。" },
        { t: "树立规则意识。生活中的诸多“禁令”看似是对我们的限制，其实是对我们自由和生命安全的保障。我们要自觉遵守规则，对自身行为是否安全作出恰当评估，并及时纠正自己的不当行为。", kw: ["规则意识", "“禁令”是保障", "评估行为", "纠正不当"], tip: "“限制”与“保障”的辩证关系是高频考点。" },
        { t: "在日常生活中，我们要牢固树立安全意识，对那些可能会对自己或他人造成伤害的外在环境、人为侵害有所警觉和戒备，保护好我们的生命。", kw: ["安全意识", "警觉戒备"], tip: "安全意识指向“外在环境、人为侵害”。" },
        { t: "增强风险意识。“居安思危，思则有备，有备无患。”我们要能够觉察潜在的威胁生命安全的因素，不因好奇去做一些危险的事情，也不盲目触碰一些危险的领域。远离危险，方能平安生活。", kw: ["风险意识", "居安思危", "不因好奇冒险"], tip: "“好奇”“盲目”是风险意识缺失的典型表现。" },
        { t: "安全与每个人息息相关，我们所做的事情不仅影响到自己，也影响着他人。我们用心对待和做好事关安全的每一件事，既是对自己的生命安全负责，也是对家庭和社会负责。", kw: ["息息相关", "对自己负责", "对家庭社会负责"], tip: "责任对象三层：自己—家庭—社会。" }
      ]},
      { name: "提高防护能力", points: [
        { t: "面对生活中可能遇到的各种自然灾害、事故灾难、公共卫生事件等，我们要掌握有效的应对方法，拥有科学自救和救他的能力，保护自己的生命，救助他人的生命。", kw: ["应对方法", "自救", "救他"], tip: "“自救”与“救他”并列，缺一不可。" },
        { t: "提高危险预判能力。自然灾害发生之前，往往有兆可循，危险大多可以预判；一些人为事故，经过得当考虑，本来可以避免。危险预判能力不是天生就有的，要在日常生活中主动学习安全知识，见微知著，防患于未然。", kw: ["危险预判", "有兆可循", "见微知著", "防患于未然"], tip: "隧道洪水中小侯及时提醒众人弃车逃生，是预判能力的典型例证。" },
        { t: "提高避险和逃生能力。平时应当积极参加安全演练活动。危险来临时，要保持头脑冷静，就近、快速逃离到安全地带；有效利用各种资源，以便求救和逃生。", kw: ["安全演练", "头脑冷静", "就近快速", "利用资源"], tip: "地震时就近躲在承重墙墙根、墙角，护住头部，是标准做法。" },
        { t: "学习防护和急救的知识与技能。平时多掌握一些防护和急救知识技能，需要紧急救护时就不会束手无策，可以争分夺秒地施救，为挽救生命赢得宝贵时间。", kw: ["急救技能", "争分夺秒", "赢得时间"], tip: "心肺复苏的“黄金 4 分钟”是常考数据。" },
        { t: "公共卫生安全包括疾病预防控制、环境卫生、食品安全等多个方面，保障着人民的身体健康和生命安全。我们要争做维护公共卫生安全的小卫士：勤开窗通风、注意手卫生、分餐制用公筷、做好免疫接种、正确处理有害垃圾等。", kw: ["公共卫生安全", "通风", "公筷", "免疫接种"], tip: "公共卫生安全是“提高防护能力”的组成部分，容易被忽略。" }
      ]}
    ],
    contrasts: [
      { w: "我技术好、运气好，不会出事", r: "要增强风险意识，觉察潜在威胁，不因好奇冒险、不盲目触碰危险领域" },
      { w: "安全规则是对我们自由的限制", r: "诸多“禁令”看似限制，其实是对我们自由和生命安全的保障" },
      { w: "遇到危险只要勇敢就行", r: "要掌握科学自救和救他的方法：预判、避险逃生、急救技能，并保持冷静" }
    ],
    quiz: [
      { q: "对“我游泳技术很好，不会在河里溺水”这一想法，正确的评价是", o: ["有自信是好事，可以下河游泳", "缺乏风险意识，野泳水域情况复杂，容易发生危险", "只要结伴就可以下河", "技术好就不需要遵守规则"], a: 1, exp: "要增强风险意识，觉察潜在的威胁生命安全的因素，不因好奇做危险的事，也不盲目触碰危险领域。野外水域水情复杂，技术好也不能保证安全。" },
      { q: "进入电影院后先查看安全疏散通道的位置，这一做法", o: ["多此一举，浪费时间", "体现了较强的安全意识和危险预判能力", "说明胆子太小", "只在火灾时才需要"], a: 1, exp: "要树立安全意识、提高危险预判能力，见微知著、防患于未然；平时熟悉逃生通道，紧急时才能快速撤离。" },
      { q: "发生地震时，如果你在教室且无法立刻撤离，正确的做法是", o: ["躲在窗边观察外面的情况", "就近躲在承重墙的墙根、墙角，蹲下保护好头部", "乘电梯迅速下楼", "站在教室中央大声呼喊"], a: 1, exp: "不能立刻撤离到安全空旷区域时，可就近寻找合适躲避位置，如承重墙墙根、墙角，蹲下保护好头部，防止被楼板、墙体砸伤；同时不能乘电梯。" }
    ],
    open: [
      { type: "情境探究", q: "暑假前，学校发出安全提示：不食用“三无”食品；不攀爬窗户和阳台护栏；不爬野山、不游野泳；严禁驾驶电动自行车和摩托车；不轻信网友，不擅自与网友会面。有同学说：“好不容易放个假，怎么这么多限制？”\n（1）你如何看待这一观点？（2）请你就其中两点，说明我们应如何做好自我保护。", ref: "（1）该观点错误。生活中的诸多“禁令”看似是对我们的限制，其实是对我们自由和生命安全的保障；生命安全是创造和享受一切美好的前提，安全与每个人息息相关，既对自己负责，也对家庭和社会负责。\n（2）示例：①不游野泳：增强风险意识，觉察潜在危险，不到无人看护的水域游泳；若遇同伴落水，不盲目下水施救，应大声呼救、寻找漂浮物或报警。②不轻信网友、不擅自会面：增强安全意识，对可能造成伤害的人为侵害保持警觉戒备；保护个人隐私，遇到可疑情况及时告知家长、老师或报警。③交通安全：树立规则意识，自觉遵守交通法规，对自身行为是否安全作出恰当评估，及时纠正不当行为。", keys: ["判断观点", "规则即保障", "两点具体做法", "自救与求助结合"] }
    ]
  },
  {
    id: "l10", no: "第十课", title: "保持身心健康",
    scene: "小伟世界杯期间常常半夜起来看球，早上急急忙忙赶到学校。一天体育课跑步时，他突然眼前一黑，摔倒在地。身体发出的警报，你听见了吗？",
    boxes: [
      { name: "爱护身体", points: [
        { t: "保持身心健康是提高生命质量的关键。只有拥有强健的体魄，才能保持充沛的精力和蓬勃的朝气；只有拥有健康的心理和丰富的精神世界，才能葆有积极的生活态度和良好的人际关系，看到生命中更多的希望和光彩。", kw: ["提高生命质量", "强健体魄", "精神世界"], tip: "总起句：身心健康＝身体＋心理＋精神。" },
        { t: "身体是生命存在的根本。身体健康既关系个人的成长和发展，也关系家庭的生活质量，还关系国家的人口素质和社会的发展。爱护自己的身体，是一种对生命负责任的态度，我们要做自身健康的第一责任人。", kw: ["生命存在的根本", "三个关系", "第一责任人"], tip: "“第一责任人”是必背表述，强调自己的主体责任。" },
        { t: "爱护身体，应当关注自己的身体状况。我们要关注并记录自身健康状况，定期体检，合理利用卫生保健服务；积极主动获取健康信息，知道生理健康的基本标准，能够判断自己的身体是否处于正常状态。如有不适，应及时科学就医。", kw: ["关注记录", "定期体检", "科学就医"], tip: "“及时科学就医”针对“硬扛”“乱吃药”等错误做法。" },
        { t: "爱护身体，应当养成健康的生活方式。我们要自觉自律，注重饮食有节、起居有常、动静结合，杜绝不良嗜好。", kw: ["自觉自律", "饮食有节", "起居有常", "动静结合"], tip: "四个短语要记准，“起居有常”对应规律作息，正是熬夜的反面。" },
        { t: "爱护身体，应当积极、主动、科学地锻炼身体，强健体魄。我们要参加适合自己的体育锻炼，选择合理的运动负荷，提高身体的免疫力和对自然环境的适应能力，预防并减少疾病的发生；在享受科学健身乐趣的同时，磨炼意志，健全人格。", kw: ["适合自己的项目", "合理负荷", "免疫力", "磨炼意志"], tip: "科学健身五法：多样化运动、适度运动、科学热身、合理饮食、健康心态。" }
      ]},

        { t: "滋养心灵，需要我们保持心理健康。心理健康是一种良好而持续的心理状态，表现为个人具有生命的活力、积极的内心体验、良好的社会适应能力，并能有效地激发个人潜能。", kw: ["生命活力", "积极内心体验", "社会适应", "激发潜能"], tip: "心理健康的四个表现是选择题常考的“判断依据”。" },
        { t: "在日常生活中，主动学习心理健康知识，掌握自我调节的方法，必要时积极寻求专业帮助，都有助于我们改善心理状况、促进心理健康。", kw: ["学习知识", "自我调节", "专业帮助"], tip: "“必要时寻求专业帮助”（如心理咨询室）是勇敢而聪明的选择，不是“有病”。" },

  paper: {

      { q: "“在生命的接续中，每个人的生命不仅是‘我’的生命，还是‘我们’的生命。”这句话说明", o: ["个人生命毫无意义", "人的生命是代代接续的，个人与国家、民族紧密相连", "生命可以无限延长", "只有伟人的生命才值得纪念"], a: 1, exp: "人的生命是代代接续的，一代又一代的个体生命实现了人类生命的接续；每个人的生命不仅是“我”的，还是“我们”的。" },
      { q: "下列行为体现敬畏生命的是", o: ["为拍短视频攀爬野生动物保护区围栏", "发现有人落水，不会游泳仍立即跳下施救", "劝阻同学不要购买、食用野生动物", "在加油站吸烟"], a: 2, exp: "敬畏生命要尊重并遵循生命存在和发展的规律，关爱他人的生命；A、D 是危害生命的行为，B 缺乏科学施救意识，易造成更大伤害。" },
      { q: "学校组织消防疏散演练，有同学认为“走个过场而已”。下列认识正确的是", o: ["演练确实没有意义", "演练能提高避险和逃生能力，关键时刻能救命", "只有火灾时才需要演练", "演练会耽误学习，不如多做题"], a: 1, exp: "平时积极参加安全演练，危险来临时才能保持头脑冷静、就近快速逃离到安全地带；这是提高避险和逃生能力的重要途径。" },

    open: [
      { type: "辨析题", q: "有同学说：“敬畏生命就是珍惜自己的生命，别人的生命与我无关。”请你辨析。", ref: "该观点错误。①敬畏生命首先要珍视自己的生命，在行动前思考后果，保持良好判断力，避免鲁莽行事和不负责任的决策。②但敬畏生命还包括关爱他人的生命。“仁者爱人”“推己及人”，要求我们从珍惜自己的生命走向关爱他人的生命，谨慎对待生命关系、处理生命问题，尊重、关怀和善待身边的每一个人。③敬畏生命还要坚持人民至上、生命至上，当人民的生命遭遇天灾人祸威胁时，竭尽全力挽救和保护最广大人民的生命。④敬畏生命还要尊重并遵循生命存在和发展的规律，善待自然、善待万物。", keys: ["判断错误", "珍视自己", "关爱他人", "生命至上", "遵循规律"] },
      { type: "材料分析题", q: "材料：某地突降特大暴雨，隧道出口堵了上百辆车。雨水开始灌进隧道时，堵在尾部的小侯最早意识到危险，他知道水位上涨到一定程度人会被困在车里。他不停拍打车门劝人们弃车逃生，许多人因此避免了灾难。\n（1）小侯的行为体现了哪些能力？（2）结合材料，谈谈我们应如何提高防护能力。", ref: "（1）体现了危险预判能力、安全意识和救助他人的责任感；也体现了关键时刻的冷静判断。\n（2）①提高危险预判能力：危险大多有兆可循，要在日常生活中主动学习安全知识，见微知著，对潜在危险作出科学判断，防患于未然；②提高避险和逃生能力：积极参加安全演练，危险来临时保持头脑冷静，就近、快速逃离到安全地带，有效利用各种资源求救和逃生；③学习防护和急救的知识与技能，争分夺秒施救，为挽救生命赢得宝贵时间；④增强风险意识，不到危险区域，不盲目冒险。", keys: ["预判能力", "避险逃生", "急救技能", "结合材料"] },
      { type: "实践探究题", q: "学校开展“珍爱生命·健康成长”主题教育活动，请你以班委会名义写一份倡议书（只需写出倡议要点，不少于三条）。", ref: "倡议要点示例：①树立安全意识，自觉遵守校规校纪和交通规则，不追逐打闹、不攀爬危险设施；②养成健康生活方式，按时作息、均衡饮食、坚持锻炼，做自身健康的第一责任人；③关注心理健康，学会自我调节，遇到困扰主动向家人、老师或心理老师求助；④敬畏生命、关爱他人，不做伤害自己和他人的事，发现同学情绪异常及时关心并报告老师；⑤掌握防护与急救技能，认真参加安全演练，学会科学自救和救他。", keys: ["格式规范", "要点具体", "身心兼顾", "体现教材观点"] }

{

  goal: ["理解人生目标的意义，学会树立正确的人生目标", "拥有积极的人生态度，正确对待顺境与逆境", "理解人生价值通过劳动创造", "懂得在奉献中成就精彩人生"],
  lessons: [
  {

    boxes: [
      { name: "探问人生目标", points: [
        { t: "人的生命活动方式与动物不同。动物的活动是无意识的、本能的活动，人的活动则是有意识、有目的的活动。人能够积极主动地规划人生，确立自己的人生目标，过有意识、有目的的生活。", kw: ["无意识本能", "有意识有目的", "主动规划"], tip: "“建筑师与蜜蜂”的差别就在“目的性”，这是本框的逻辑起点。" },
        { t: "人生目标体现着人在社会实践中对未来的向往和追求，决定着人生道路的发展方向。", kw: ["对未来的向往追求", "决定发展方向"], tip: "定义中的两个要点：来自社会实践、指向未来。" },
        { t: "正确的人生目标会带来稳定而持久的内在激励，让我们排除干扰，克服困难，坚定前行，少走弯路，指引我们走上正确的人生道路。", kw: ["内在激励", "排除干扰", "少走弯路"], tip: "作用是“稳定而持久的内在激励”，不是外在奖励。" },
        { t: "人生目标可以分为长远目标和近期目标。只有分阶段实现一个个近期目标，才能实现长远目标。所有近期目标都是围绕长远目标展开的。实现每一个近期目标带来的成就感和喜悦感，鼓舞我们继续奋发向上。", kw: ["长远目标", "近期目标", "分阶段实现"], tip: "关系是“近期围绕长远、长远靠近期累积”，双向都要写。" }

      { name: "树立正确的人生目标", points: [
        { t: "正确认识个人与社会的关系，是我们树立人生目标的必要前提。社会是由个人组成的，个人的发展离不开社会。我们只有在个人与社会的统一中明确人生目标，才能沿着正确的方向走好人生道路。", kw: ["必要前提", "个人与社会统一"], tip: "“必要前提”四个字是固定表述。" },
        { t: "树立人生目标，应当从自身实际出发。个人的兴趣爱好、性格特征、知识能力、家庭环境等，都是我们树立人生目标的影响因素。我们要综合评估，全面考虑，以客观务实的态度树立切实可行的人生目标。", kw: ["自身实际", "兴趣爱好", "综合评估", "切实可行"], tip: "四个影响因素要能列举，答题别只写“兴趣”。" },
        { t: "树立人生目标，应当与国家、民族和人民的利益相结合。我们要把个人的发展牢牢植根于国家、民族和人民的需要，植根于中华民族伟大复兴的事业。", kw: ["国家民族人民", "植根复兴事业"], tip: "程开甲“一切为了祖国的需要”、钱伟长“弃文从理”是标准例证。" },
        { t: "树立人生目标，应当与人类的福祉相统一。志存高远，方能登高望远；胸怀天下，才可大展宏图。个人的追求与进步，只有与人类的发展进步紧密联系在一起，人生才能焕发无限的生机和活力。", kw: ["人类福祉", "志存高远", "胸怀天下"], tip: "层次递进：自身→国家民族→人类，三条依次展开最完整。" }

/* ---------- 运行时状态 ---------- */
let SUB = SUBJECTS[0];
let ALLQ = {}, TESTS = [], TOTAL_STEPS = 0, LESSON_COUNT = 0, POINT_COUNT = 0;
let curUnit, curLessonKey, curStep = 0, curTestId, curView = "map";
let S = { learn: {}, wrong: {}, ans: {}, scores: {}, ui: {} };
const MEM = {};   /* 内存副本：即使浏览器禁用 localStorage，切换科目也不丢进度 */
const save = () => {
  MEM[SUB.id] = S;
  try { localStorage.setItem(SUB.ls, JSON.stringify(S)); } catch (e) {}
};

function loadState() {
  if (MEM[SUB.id]) { S = MEM[SUB.id]; }
  else {
    try { S = JSON.parse(localStorage.getItem(SUB.ls)) || {}; } catch (e) { S = {}; }
  }
  S.learn = S.learn || {}; S.wrong = S.wrong || {}; S.ans = S.ans || {};
  S.scores = S.scores || {}; S.ui = S.ui || {};
}

/* 建立索引（每个科目各自一套） */
function prepare() {
  ALLQ = {}; TESTS = []; TOTAL_STEPS = 0; LESSON_COUNT = 0; POINT_COUNT = 0;
  SUB.units.forEach(u => {
    u.lessons.forEach(l => {
      l._key = `${u.id}-${l.id}`;
      l.quiz = l.quiz || []; l.open = l.open || [];
      l.quiz.forEach((q, i) => { q._id = `${u.id}${l.id}q${i + 1}`; q._u = u; q._type = "单选题"; ALLQ[q._id] = q; });
      l.open.forEach((o, i) => { o._id = `${u.id}${l.id}o${i + 1}`; o._u = u; o._type = o.type; ALLQ[o._id] = o; });
      LESSON_COUNT++; POINT_COUNT += pointsOf(l);
    });
    u.paper.quiz.forEach((q, i) => { q._id = `${u.id}pq${i + 1}`; q._u = u; q._type = "单选题"; ALLQ[q._id] = q; });
    u.paper.open.forEach((o, i) => { o._id = `${u.id}po${i + 1}`; o._u = u; o._type = o.type; ALLQ[o._id] = o; });
  });
  SUB.units.forEach(u => {
    u.lessons.forEach(l => TESTS.push({
      id: l._key, name: `${l.no}　${l.title}`, short: `${l.title}`,
      unit: u, quiz: l.quiz, open: l.open, kind: "lesson"
    }));
    TESTS.push({ id: `${u.id}-paper`, name: u.paper.title, short: `${u.name}综合`, unit: u, quiz: u.paper.quiz, open: u.paper.open, kind: "paper" });
  });
  SUB.units.forEach(u => u.lessons.forEach(l => { TOTAL_STEPS += stepsOf(l).length; }));
}

/* ---------- 跟学步骤 ---------- */
function pointsOf(l) { return l.boxes.reduce((s, b) => s + b.points.length, 0); }
function stepsOf(l) {
  if (l._steps) return l._steps;
  const out = [{ kind: "scene" }];
  if (l.text) out.push({ kind: "text" });
  let n = 0;
  l.boxes.forEach(b => b.points.forEach(p => { n++; out.push({ kind: "point", box: b.name, no: n, p }); }));
  if (l.contrasts && l.contrasts.length) out.push({ kind: "contrast" });
  if (l.recite) out.push({ kind: "recite" });
  if (l.quiz && l.quiz.length) out.push({ kind: "check" });
  out.push({ kind: "summary" });
  l._steps = out;
  return out;
}

/* 让当前选中的胶囊横向居中（只滚横向） */
function centerChip(box) {
  if (!box) return;
  const a = box.querySelector(".chip.active");
  if (!a) return;
  const r1 = a.getBoundingClientRect(), r2 = box.getBoundingClientRect();
  const target = box.scrollLeft + (r1.left - r2.left) - (box.clientWidth - r1.width) / 2;
  box.scrollLeft = Math.max(0, Math.round(target));
}

/* ========== 科目切换 ========== */
function setSubject(id, keepView) {
  const sub = SUBJECTS.find(x => x.id === id) || SUBJECTS[0];
  if (SUB && SUB.id !== sub.id) { S.ui = { unit: curUnit, lesson: curLessonKey, step: curStep, test: curTestId }; save(); }
  SUB = sub;
  prepare(); loadState();
  try { localStorage.setItem("kp:last", SUB.id); } catch (e) {}

  document.documentElement.style.setProperty("--brand", SUB.accent);
  document.documentElement.style.setProperty("--brand2", SUB.accent2);
  document.title = `${SUB.name} 七年级上册 · 跟学伙伴`;
  $("#brandMark").textContent = SUB.mark;
  $("#brandSub").textContent = `七年级上册 · ${SUB.units.length} 单元`;
  $$("#subjSwitch [data-sub]").forEach(b => b.classList.toggle("active", b.dataset.sub === SUB.id));

  const ui = S.ui || {};
  curUnit = (SUB.units.find(u => u.id === ui.unit) || SUB.units[0]).id;
  const hasL = SUB.units.some(u => u.lessons.some(l => l._key === ui.lesson));
  curLessonKey = hasL ? ui.lesson : SUB.units[0].lessons[0]._key;
  curStep = ui.step || 0;
  curTestId = (TESTS.find(t => t.id === ui.test) || TESTS[0]).id;

  $("#mapSub").innerHTML = `${SUB.units.length} 个单元 · ${LESSON_COUNT} 课 · ${POINT_COUNT} 个知识点。${SUB.mapTip}`;
  $("#learnSub").innerHTML = SUB.learnTip;
  $("#testSub").innerHTML = SUB.testTip;
  $("#methodSub").innerHTML = SUB.methodTip;
  $("#foot").innerHTML = SUB.foot.map(p => `<p>${esc(p)}</p>`).join("");

  renderMap(); renderLearn(); renderTest();
  switchView(keepView || curView);
  paintProgress();
}

/* ========== 导航 ========== */
function switchView(v) {
  curView = v;
  $$(".view").forEach(el => el.classList.toggle("active", el.id === "view-" + v));
  $$("[data-view]").forEach(b => b.classList.toggle("active", b.dataset.view === v));
  window.scrollTo({ top: 0 });
  if (v === "map") renderMap();
  if (v === "learn") renderLearn();
  if (v === "test") renderTest();
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-view]");
  if (t) switchView(t.dataset.view);
});

/* ---------- 顶部进度 ---------- */
function paintProgress() {
  let done = 0;
  Object.values(S.learn).forEach(v => { done += (v.done || []).length; });
  const pct = TOTAL_STEPS ? Math.min(100, Math.round(done / TOTAL_STEPS * 100)) : 0;
  const bar = $("#hdrBar"), txt = $("#hdrPct");
  if (bar) bar.style.width = pct + "%";
  if (txt) txt.textContent = "跟学 " + pct + "%";
}

      <button class="tool" data-open-all>全部展开</button>
      <button class="tool" data-shut-all>全部收起</button>
      <button class="tool" data-go-learn>去跟学 →</button>
    </div>
    <div class="mm">
      <div class="mm-root">${l.boxes.length} 个板块 · ${pointsOf(l)} 个知识点</div>
      <div class="mm-branches">${branches}</div>
    </div>
  </article>`;
}

$("#mapChips").addEventListener("click", e => {
  const b = e.target.closest("[data-unit]");
  if (!b) return;
  curUnit = b.dataset.unit;
  renderMap();
});

$("#mapList").addEventListener("click", e => {
  const card = e.target.closest(".lesson-card");
  if (!card) return;
  if (e.target.closest("[data-toggle-lesson]")) { card.classList.toggle("closed"); return; }
  const node = e.target.closest("[data-node]");
  if (node) { node.closest(".mm-branch").classList.toggle("closed"); return; }
  const leaf = e.target.closest("[data-leaf]");
  if (leaf) { leaf.closest(".leaf").classList.toggle("open"); return; }
  if (e.target.closest("[data-open-all]")) {
    card.classList.remove("closed");
    $$(".mm-branch", card).forEach(x => x.classList.remove("closed"));
    $$(".leaf", card).forEach(x => x.classList.add("open"));
    return;
  }
  if (e.target.closest("[data-shut-all]")) { card.classList.add("closed"); return; }
  if (e.target.closest("[data-go-learn]")) {
    curLessonKey = card.dataset.lkey;
    curStep = 0;
    switchView("learn");
  }
});

/* ========== 二、跟学 ========== */
function findLesson(key) {
  for (const u of SUB.units) for (const l of u.lessons) if (l._key === key) return { u, l };
  return null;
}

function renderLearn() {
  $("#learnChips").innerHTML = SUB.units.map(u => u.lessons.map(l =>
    `<button class="chip sm ${l._key === curLessonKey ? "active" : ""}" data-lkey="${l._key}" style="--c:${u.color}">
       <span class="dot"></span>${esc(l.title)}</button>`).join("")).join("");

  centerChip($("#learnChips"));
  const found = findLesson(curLessonKey) || { u: SUB.units[0], l: SUB.units[0].lessons[0] };
  const { u, l } = found;
  const steps = stepsOf(l);
  if (curStep >= steps.length) curStep = steps.length - 1;
  if (curStep < 0) curStep = 0;
  const st = S.learn[curLessonKey] || (S.learn[curLessonKey] = { step: 0, done: [] });
  if (!Array.isArray(st.done)) st.done = [];

  const step = steps[curStep];
  const tag = {
    scene: "导入", text: "原文", point: step.box || "知识点", contrast: "易混辨析",
    recite: "名句默写", check: "即时检测", summary: "知识清单"
  }[step.kind];

  $("#learnCard").innerHTML = `
    <div class="sp-head" style="--c:${u.color}">
      <span class="badge">${l.no}</span>
      <span class="title">${esc(l.title)}</span>
      <span class="count">第 ${curStep + 1} / ${steps.length} 步</span>
    </div>
    <div class="sp-bar"><i style="width:${(curStep + 1) / steps.length * 100}%"></i></div>
    <div class="sp-body" style="--c:${u.color};--tint:${u.tint}">
      <div class="step-tag">${esc(tag)}</div>
      ${stepBody(u, l, step)}
    </div>
    <div class="sp-nav">
      <button class="btn ghost" id="spPrev" ${curStep === 0 ? "disabled" : ""}>上一步</button>
      <span class="grow"></span>
      <button class="btn ghost" id="spMark">${st.done.includes(curStep) ? "已掌握 ✓" : "标记已掌握"}</button>
      <button class="btn" id="spNext">${curStep === steps.length - 1 ? "去测试 →" : "下一步"}</button>
    </div>`;

  const label = (s) => s.kind === "scene" ? "导入"
    : s.kind === "text" ? "原文"
      : s.kind === "point" ? `知识点${s.no}`
        : s.kind === "contrast" ? "易混"
          : s.kind === "recite" ? "默写"
            : s.kind === "check" ? "检测" : "清单";
  $("#spDots").innerHTML = `<div class="sp-path">${steps.map((s, i) =>
    `<button class="pstep ${i === curStep ? "cur" : (st.done.includes(i) ? "on" : "")}" data-dot="${i}">
       <b>${i + 1}</b>${esc(label(s))}</button>`).join("")}</div>`;

  st.step = curStep; S.ui = { unit: curUnit, lesson: curLessonKey, step: curStep, test: curTestId };
  save(); paintProgress();

  $("#spPrev").onclick = () => { if (curStep > 0) { curStep--; renderLearn(); } };
  $("#spNext").onclick = () => {
    if (curStep === steps.length - 1) {
      curTestId = l._key; switchView("test");
    } else { curStep++; renderLearn(); }
  };
  $("#spMark").onclick = () => {
    if (st.done.includes(curStep)) st.done = st.done.filter(x => x !== curStep);
    else st.done.push(curStep);
    save(); renderLearn();
  };
  $("#spDots").onclick = e => {
    const b = e.target.closest("[data-dot]");
    if (b) { curStep = +b.dataset.dot; renderLearn(); }
  };
  $$("#learnCard [data-rec]").forEach(btn => {
    btn.onclick = () => {
      const ans = $(".recite-a", btn.closest(".recite-item"));
      ans.hidden = !ans.hidden;
      btn.textContent = ans.hidden ? "看答案" : "收起";
    };
  });
  bindQuiz();
}

function stepBody(u, l, step) {
  if (step.kind === "scene") {
    return `<h3 class="step-h">${SUB.sceneTitle}</h3>
      <div class="scene-box" style="--tint:${u.tint}">${esc(l.scene)}</div>
      <p class="step-p" style="margin-top:16px;font-size:12.5px;color:var(--muted);letter-spacing:.08em">本单元学习目标</p>
      <div class="lesson-goal" style="margin-top:6px">
        ${u.goal.map(g => `<div>${esc(g)}</div>`).join("")}
      </div>
      <p class="step-p" style="margin-top:12px;font-size:13.6px;color:var(--muted)">
        本课共 ${pointsOf(l)} 个知识点，分 ${l.boxes.length} 个板块。跟着往下走，一步一个点，走完就能自己讲出来。</p>`;
  }
  if (step.kind === "text") {
    const isHead = (p) => !/[，。；：？！、]/.test(p) && p.length <= 20;
    return `<h3 class="step-h">课文原文</h3>
      <p class="step-p" style="font-size:13.6px;margin-bottom:10px">先出声读两遍，不认识的字圈出来，再往下走。读的时候注意停顿和语气。</p>
      <div class="text-box">${l.text.map(p => `<p${isHead(p) ? ' class="tb-h"' : ""}>${esc(p)}</p>`).join("")}</div>`;
  }
  if (step.kind === "point") {
    const p = step.p;
    return `<h3 class="step-h">${esc(step.box)} · 知识点 ${step.no}</h3>
      <p class="step-p strong" style="margin-top:8px">${esc(p.t)}</p>
      <div class="kw" style="margin-top:14px">${p.kw.map(k => `<i>${esc(k)}</i>`).join("")}</div>
      <div class="tip"><b>易错</b><span>${esc(p.tip)}</span></div>`;
  }
  if (step.kind === "contrast") {
    return `<h3 class="step-h">这几个坑，别踩</h3>
      <p class="step-p" style="margin-bottom:12px;font-size:14px">考试里常见的错误说法，左边是错的，右边才是教材／课文里的说法。</p>
      <div class="contrast-table">
        ${l.contrasts.map(c => `<div class="crow">
          <div class="w"><span class="k">✕ 错误</span>${esc(c.w)}</div>
          <div class="r"><span class="k">✓ 正确</span>${esc(c.r)}</div>
        </div>`).join("")}
      </div>`;
  }
  if (step.kind === "recite") {
    return `<h3 class="step-h">名句默写 · 先自己写</h3>
      <p class="step-p" style="font-size:14px;margin-bottom:12px">拿张纸，把空格补出来，再点开核对。写错的字圈起来，抄三遍。</p>
      <div class="recite-wrap">
        ${l.recite.map((r, i) => `<div class="recite-item">
          <div class="recite-q"><b>${i + 1}</b><span>${esc(r.q)}</span></div>
          <button class="tool" data-rec>看答案</button>
          <div class="recite-a" hidden>${esc(r.a)}</div>
        </div>`).join("")}
      </div>`;
  }
  if (step.kind === "check") {
    const qs = l.quiz.slice(0, 2);
    return `<h3 class="step-h">做两道题，检查一下</h3>
      <p class="step-p" style="font-size:14px;margin-bottom:12px">选完立刻出解析，错了就回到上一步再看一遍。</p>
      <div class="check-wrap">${qs.map((q, i) => quizCard(q, i + 1, true)).join("")}</div>`;
  }
  // summary
  return `<h3 class="step-h">本课知识清单</h3>
    <p class="step-p" style="font-size:14px;margin-bottom:10px">合上书，看看关键词能不能复述出来。能，才算真掌握。</p>
    <div class="sum-list">
      ${l.boxes.map(b => `<div class="sum-item">
        <h4><em>${b.points.length}点</em>${esc(b.name)}</h4>
        <div class="kw">${b.points.flatMap(p => p.kw).filter((v, i, a) => a.indexOf(v) === i).map(k => `<i>${esc(k)}</i>`).join("")}</div>
      </div>`).join("")}
    </div>
    <p class="step-p" style="margin-top:14px;font-size:13.6px;color:var(--muted)">
      提示：能用上面的关键词把知识点串成一段话说出来，说明你已经掌握了。</p>`;
}

$("#learnChips").addEventListener("click", e => {
  const b = e.target.closest("[data-lkey]");
  if (!b) return;
  curLessonKey = b.dataset.lkey;
  curStep = (S.learn[curLessonKey] && S.learn[curLessonKey].step) || 0;
  renderLearn();
});

/* ========== 三、测试 ========== */
function quizCard(q, idx, inLearn) {
  const type = q._type || "单选题";
  const u = q._u || {};
  return `
  <div class="qcard" data-qid="${q._id}" style="--c:${u.color || "#6b6b6b"};--tint:${u.tint || "#f3f0e9"}">
    <div class="qhead">
      <span class="qno">${idx}</span>
      <span class="qtype">${type}</span>
      <span class="qmark"></span>
    </div>
    <p class="qtext">${esc(q.q)}</p>
    <div class="opts">
      ${q.o.map((o, i) => `<button class="opt" data-i="${i}"><i>${"ABCD"[i]}</i><span>${esc(o)}</span></button>`).join("")}
    </div>
    <div class="exp" hidden></div>
  </div>`;
}

function openCard(o, idx) {
  const u = o._u || {};
  const saved = S.ans[o._id] || "";
  return `
  <div class="qcard" data-qid="${o._id}" style="--c:${u.color || "#6b6b6b"};--tint:${u.tint || "#f3f0e9"}">
    <div class="qhead">
      <span class="qno">${idx}</span>
      <span class="qtype">${o.type}</span>
      <span class="qmark">先写再看答案</span>
    </div>
    <p class="qtext">${esc(o.q)}</p>
    <textarea data-ans placeholder="${esc(SUB.ph)}">${esc(saved)}</textarea>
    <div style="margin-top:10px"><button class="btn ghost sm" data-reveal>查看参考答案</button></div>
    <div class="ref" hidden>
      <div class="ref-h" style="--c:${u.color || "#5a5a5a"};--tint:${u.tint || "#f4f1ea"}">参考答案</div>
      <div class="ref-b">${esc(o.ref)}</div>
      <div class="keys">${o.keys.map(k => `<i>${esc(k)}</i>`).join("")}</div>
      <div class="ref-note">评分要点：答出以上要点即可得分，分点作答、要点在前更清晰。</div>
    </div>
  </div>`;
}

function renderTest() {
  $("#methodGrid").innerHTML = SUB.methods.map((m, i) => `
    <div class="method" data-m="${i}" style="--c:${m.color}">
      <button data-mhead><span class="mt">${m.name}</span><span class="tag">${m.tag}</span><em class="chev"></em></button>
      <div class="body">
        <ol>${m.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
        <div class="pf"><b>最容易丢分的地方：</b>${esc(m.pitfall)}</div>
      </div>
    </div>`).join("");

  const wrongCount = Object.keys(S.wrong).filter(id => ALLQ[id]).length;
  const chips = TESTS.map(t => {
    const isP = t.kind === "paper";
    return `<button class="chip sm ${t.id === curTestId ? "active" : ""}" data-test="${t.id}" style="--c:${t.unit.color}">
      <span class="dot"></span>${isP ? "★ " : ""}${esc(t.short)}</button>`;
  }).join("") + `<button class="chip sm ${curTestId === "wrong" ? "active" : ""}" data-test="wrong" style="--c:#b93b30">
      <span class="dot"></span>错题重练（${wrongCount}）</button>`;
  $("#testChips").innerHTML = chips;
  centerChip($("#testChips"));

  const box = $("#testBody");
  if (curTestId === "wrong") {
    const ids = Object.keys(S.wrong).filter(id => ALLQ[id]);
    if (!ids.length) {
      box.innerHTML = `<div class="empty">还没有错题。先去做几套题吧，做错的会自动收进这里。</div>`;
      return;
    }
    box.innerHTML = `
      <div class="test-head">
        <h3>错题重练</h3>
        <span class="score-pill" data-score>共 ${ids.length} 题</span>
      </div>
      ${ids.map((id, i) => quizCard(ALLQ[id], i + 1)).join("")}`;
    bindQuiz();
    return;
  }

  const t = TESTS.find(x => x.id === curTestId) || TESTS[0];
  const prev = S.scores[t.id];
  box.innerHTML = `
    <div class="test-head" style="--c:${t.unit.color}">
      <h3>${esc(t.name)}</h3>
      <span class="score-pill" data-score>${t.quiz.length} 道选择 + ${t.open.length} 道笔答题${prev ? ` · 上次正确 ${prev.right}/${prev.total}` : ""}</span>
      <button class="tool" data-reset>重做</button>
    </div>
    ${t.quiz.map((q, i) => quizCard(q, i + 1)).join("")}
    ${t.open.map((o, i) => openCard(o, t.quiz.length + i + 1)).join("")}`;
  bindQuiz();
  bindOpen();
  bindScore(t);
}

function bindQuiz() {
  $$("#testBody .qcard, #learnCard .qcard").forEach(card => {
    const q = ALLQ[card.dataset.qid];
    if (!q || !q.o) return;
    const opts = $$(".opt", card);
    opts.forEach(btn => {
      btn.onclick = () => {
        if (card.dataset.done) return;
        card.dataset.done = "1";
        const i = +btn.dataset.i;
        const right = i === q.a;
        opts.forEach((b, j) => {
          if (j === q.a) b.classList.add("right");
          else if (j === i) b.classList.add("wrong");
          else b.classList.add("dim");
        });
        const exp = $(".exp", card);
        exp.hidden = false;
        exp.innerHTML = `<b>${right ? "✓ 答对了" : "✕ 正确答案 " + "ABCD"[q.a]}</b>${esc(q.exp)}`;
        if (!right) { S.wrong[q._id] = 1; } else { delete S.wrong[q._id]; }
        save();
        const mk = $(".qmark", card);
        if (mk) mk.textContent = right ? "✓" : "✕";
        if (card.closest("#testBody")) updateScore();
      };
    });
  });
}

function bindOpen() {
  $$("#testBody .qcard").forEach(card => {
    const ta = $("textarea[data-ans]", card);
    if (ta) ta.oninput = () => { S.ans[card.dataset.qid] = ta.value; save(); };
    const rev = $("[data-reveal]", card);
    if (rev) rev.onclick = () => {
      const ref = $(".ref", card);
      ref.hidden = !ref.hidden;
      rev.textContent = ref.hidden ? "查看参考答案" : "收起参考答案";
    };
  });
}

function updateScore() {
  const pill = $("[data-score]");
  if (!pill) return;
  const cards = $$("#testBody .qcard").filter(c => c.dataset.done);
  const right = cards.filter(c => $(".qmark", c) && $(".qmark", c).textContent === "✓").length;
  const t = TESTS.find(x => x.id === curTestId);
  if (t) {
    pill.textContent = `已答 ${cards.length}/${t.quiz.length} · 正确 ${right}`;
    S.scores[t.id] = { right, total: t.quiz.length };
    save();
  } else {
    pill.textContent = `已答 ${cards.length} · 正确 ${right}`;
  }
}

function bindScore(t) {
  const pill = $("[data-score]");
  if (pill) pill.textContent = `${t.quiz.length} 道选择 + ${t.open.length} 道笔答题`;
  const reset = $("[data-reset]");
  if (reset) reset.onclick = () => { renderTest(); };
}

$("#testChips").addEventListener("click", e => {
  const b = e.target.closest("[data-test]");
  if (!b) return;
  curTestId = b.dataset.test;
  renderTest();
});

$("#methodGrid").addEventListener("click", e => {
  const head = e.target.closest("[data-mhead]");
  if (!head) return;
  head.closest(".method").classList.toggle("open");
});

$("#subjSwitch").addEventListener("click", e => {
  const b = e.target.closest("[data-sub]");
  if (!b || b.dataset.sub === SUB.id) return;
  setSubject(b.dataset.sub, curView);
});

/* ========== 启动 ========== */
let startId = "df";
try { startId = localStorage.getItem("kp:last") || "df"; } catch (e) {}
setSubject(startId, "map");

</script>
</body>
</html>

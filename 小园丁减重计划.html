<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小园丁减重计划</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #222222;
      --card-bg: #f7f7f7;
      --modal-bg: #fff;
      --border: #ddd;
      --gray-text: #666666;
      --primary: #4080ff;
      --error-red: #e66464;
      --up-color: #f0932b;
      --down-color: #27ae60;
      --same-color: #9a9a9a;
    }
    .dark {
      --bg: #1a1a1a;
      --text: #eeeeee;
      --card-bg: #2c2c2c;
      --modal-bg: #2b2b2b;
      --border: #444;
      --gray-text: #aaaaaa;
      --primary: #6699ff;
      --error-red: #ff7878;
      --up-color: #ffb057;
      --down-color: #4cd07d;
      --same-color: #888;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    /* ========== 首页 ========== */
    .container {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 40px 20px 110px;
    }
    .home-page { display: block; }
    .home-page.hide { display: none; }
    .header { text-align: center; margin-bottom: 30px; position: relative; }
    h1 { font-size: 26px; font-weight: 500; }
    .theme-btn {
      position: absolute; right: 0; top: 50%; transform: translateY(-50%);
      border: none; background: transparent; cursor: pointer; color: var(--text); padding: 6px;
    }
    .user-list-home { display: flex; flex-direction: column; gap: 12px; flex: 1; }
    .user-row {
      background: var(--card-bg); border-radius: 14px; padding: 12px 16px;
      display: flex; align-items: center; gap: 14px; cursor: pointer; transition: 0.2s;
    }
    .user-row:hover { opacity: 0.85; }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; background-color: #ccc; overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-name { font-size: 16px; color: var(--text); }
    .empty-tip { color: var(--gray-text); text-align: center; padding: 40px 0; font-size: 14px; }

    .btn-group-bottom {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 640px;
      display: flex; gap: 28px; justify-content: center;
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom, 0px));
      background: var(--bg); border-top: 1px solid var(--border);
      z-index: 60; transition: background 0.3s;
    }
    .btn-group-bottom.hide { display: none; }
    .text-btn {
      background: transparent; border: none; color: var(--gray-text);
      font-size: 15px; cursor: pointer;
    }

    /* ========== 详情页 ========== */
    .detail-page {
      max-width: 640px; margin: 0 auto; min-height: 100vh;
      padding: 20px 20px 40px; display: none;
    }
    .detail-page.show { display: block; }
    .detail-header {
      display: flex; align-items: center; justify-content: space-between;
      position: relative; padding: 10px 0 20px;
    }
    .detail-back-btn {
      border: none;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      padding: 4px;
      display: flex; align-items: center; justify-content: center;
      transition: 0.2s;
      position: relative; z-index: 2;
    }
    .detail-back-btn:hover { opacity: 0.7; }
    .detail-back-btn svg { display: block; }
    .detail-setting-btn {
      border: none; background: transparent; color: var(--text);
      cursor: pointer; padding: 4px;
      display: flex; align-items: center; justify-content: center; transition: 0.2s;
      position: relative; z-index: 2;
    }
    .detail-setting-btn:hover { opacity: 0.7; }
    .detail-title {
      position: absolute; left: 50%; transform: translateX(-50%);
      font-size: 19px; font-weight: 500; white-space: nowrap;
      max-width: 70%;
      overflow: hidden; text-overflow: ellipsis;
      display: flex; align-items: center; gap: 8px;
      justify-content: center;
    }
    .detail-title-avatar {
      width: 26px; height: 26px; border-radius: 50%;
      flex-shrink: 0; overflow: hidden;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 14px; background: #ccc;
    }
    .detail-title-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .tab-group {
      display: flex; gap: 36px; margin-bottom: 24px;
      border-bottom: 1px solid var(--border); justify-content: center;
    }
    .tab-btn {
      padding: 10px 10px; border: none; background: transparent;
      font-size: 15px; color: var(--gray-text); cursor: pointer;
      position: relative; white-space: nowrap;
    }
    .tab-btn.active { color: var(--primary); font-weight: 500; }
    .tab-btn.active::after {
      content: ""; position: absolute; bottom: -1px; left: 0;
      width: 100%; height: 2px; background-color: var(--primary); border-radius: 2px;
    }
    .tab-content { display: none; }
    .tab-content.show { display: block; }

    /* ========== 体重概览 ========== */
    .weight-overview { display: flex; gap: 10px; margin-bottom: 18px; }
    .ov-item {
      flex: 1; background: var(--card-bg); border-radius: 14px;
      padding: 16px 6px 14px; text-align: center; min-width: 0; position: relative;
    }
    .ov-label { font-size: 12px; color: var(--gray-text); margin-bottom: 8px; }
    .ov-value {
      display: flex; align-items: baseline; justify-content: center;
      gap: 3px; flex-wrap: nowrap;
    }
    .ov-num {
      font-size: clamp(19px, 6vw, 25px); font-weight: 700;
      letter-spacing: -0.5px; line-height: 1.1;
    }
    .ov-unit { font-size: 11px; color: var(--gray-text); white-space: nowrap; }
    .ov-add-btn {
      position: absolute; top: 6px; right: 6px;
      width: 26px; height: 26px; border-radius: 50%;
      border: none; background: transparent; color: var(--primary);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: 0.2s;
    }
    .ov-add-btn:hover { background: rgba(64,128,255,0.12); }

    /* ========== 统计面板 ========== */
    .stat-panel {
      background: var(--card-bg); border-radius: 14px;
      padding: 4px 16px; margin-bottom: 18px;
    }
    .stat-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 0; border-bottom: 1px solid var(--border);
      font-size: 14px; gap: 12px;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-day { font-size: 15px; font-weight: 600; }
    .stat-key { color: var(--gray-text); flex-shrink: 0; }
    .stat-val { font-weight: 600; text-align: right; }
    .bmi-val { font-weight: 600; }

    /* ========== 记录列表 ========== */
    .record-list { display: flex; flex-direction: column; gap: 8px; }
    .record-item {
      background: var(--card-bg); border-radius: 12px; padding: 13px 16px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; cursor: pointer; transition: 0.2s;
    }
    .record-item:hover { opacity: 0.85; }
    .rec-weight { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
    .rec-meta { font-size: 12px; color: var(--gray-text); }
    .rec-diff { font-size: 14px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
    .diff-up { color: var(--up-color); }
    .diff-down { color: var(--down-color); }
    .diff-same { color: var(--same-color); }

    #recordList .record-item { padding: 10px 14px; }
    #recordList .rec-weight { font-size: 14px; margin-bottom: 2px; }
    #recordList .rec-meta { font-size: 11px; }
    #recordList .rec-diff { font-size: 12px; }

    /* ========== 指标卡片 ========== */
    .metric-overview {
      display: flex; gap: 10px; margin-bottom: 8px;
    }
    .metric-item {
      flex: 1;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      min-width: 0;
    }
    .metric-item:hover { opacity: 0.85; }
    .metric-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .metric-value {
      font-size: 13px;
      font-weight: 500;
      color: var(--gray-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .metric-value.empty { color: var(--border); font-weight: 400; }

    /* ========== 趋势变化 ========== */
    .trend-block {
      background: var(--card-bg); border-radius: 14px;
      padding: 16px; margin-bottom: 16px;
    }
    .trend-block h3 {
      font-size: 15px; font-weight: 600; margin-bottom: 14px;
    }

    .calendar-single { padding: 4px 0; }
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 8px;
    }
    .cal-arrow {
      border: none;
      background: transparent;
      color: var(--primary);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
      flex-shrink: 0;
      padding: 0;
    }
    .cal-arrow:hover { background: var(--card-bg); }
    .cal-arrow:active { transform: scale(0.94); }
    .cal-title {
      flex: 1;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
    }
    .cal-weekdays {
      display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 2px;
    }
    .cal-weekdays span {
      text-align: center; font-size: 10px; color: var(--gray-text); padding: 3px 0;
    }
    .cal-days {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px;
    }
    .cal-day {
      min-height: 38px; border-radius: 6px; padding: 2px 1px;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      font-size: 11px; position: relative; cursor: pointer;
    }
    .cal-day .dnum { font-size: 11px; color: var(--gray-text); line-height: 1.4; }
    .cal-day.other-month .dnum { color: var(--border); opacity: 0.5; }
    .cal-day.other-month .dweight { opacity: 0.4; }
    .cal-day.today .dnum {
      color: var(--text);
      font-weight: 700;
    }
    .cal-day.has-rec .dnum { color: var(--text); font-weight: 600; }
    .cal-day .dweight {
      font-size: 9px; font-weight: 600; margin-top: 1px; line-height: 1.2;
    }
    .cal-day.has-rec { background: transparent; }

    .cal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 14px;
      margin-top: 10px;
    }
    .cal-footer .ghost-btn {
      font-size: 12px;
      padding: 2px 0;
      color: var(--gray-text);
    }

    /* 数据分析 */
    .analysis-list { display: flex; flex-direction: column; gap: 10px; }
    .analysis-item {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; gap: 10px;
    }
    .analysis-item .k { color: var(--gray-text); }
    .analysis-item .v { font-weight: 600; text-align: right; }
    .analysis-sub {
      font-size: 12px; color: var(--gray-text); padding-left: 10px;
      display: flex; justify-content: space-between; gap: 10px;
    }
    .analysis-sub .v { font-weight: 600; }
    .trend-divider { height: 1px; background: var(--border); margin: 4px 0; }
    .bold-black { font-weight: 700; color: #000000; }
    .dark .bold-black { color: #ffffff; }

    .chart-title-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px; gap: 8px;
    }
    .chart-title { font-size: 15px; font-weight: 600; }
    .chart-title-row .ghost-btn { font-size: 12px; padding: 2px 0; color: var(--gray-text); }

    .chart-nav-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .chart-arrow {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--gray-text);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
      flex-shrink: 0;
      padding: 0;
    }
    .chart-arrow:hover { background: var(--card-bg); border-color: var(--primary); color: var(--primary); }
    .chart-arrow:active { transform: scale(0.94); }
    .chart-range {
      flex: 1;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }

    .chart-wrap { width: 100%; overflow: hidden; }
    .chart-svg { display: block; width: 100%; }

    .stage-analysis {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px;
    }
    .stage-tag {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; padding: 5px 10px; border-radius: 20px;
      background: var(--bg); border: 1px solid var(--border);
    }
    .stage-dot { width: 7px; height: 7px; border-radius: 50%; }

    /* ========== PK 页面 ========== */
    .pk-block {
      background: var(--card-bg); border-radius: 14px;
      padding: 16px; margin-bottom: 16px;
    }
    .pk-block h3 { font-size: 15px; margin-bottom: 12px; }
    .pk-options { display: flex; flex-direction: column; gap: 8px; }
    .pk-opt {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 10px; background: var(--bg);
      cursor: pointer; font-size: 14px;
    }
    .pk-opt input { width: auto; }
    .pk-opt-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      flex-shrink: 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; background: #ccc;
    }
    .pk-opt-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .pk-start-btn {
      width: 100%; padding: 13px; border-radius: 12px; border: none;
      background: var(--primary); color: #fff; font-size: 15px;
      font-weight: 500; cursor: pointer;
    }
    .pk-start-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .pk-start-btn.secondary {
      background: transparent;
      color: var(--gray-text);
      border: 1px solid var(--border);
    }

    .pk-result {
      display: flex; flex-direction: column; gap: 12px;
    }
    .pk-period {
      background: var(--bg);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .pk-period-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 10px;
    }
    .pk-period-title {
      font-size: 14px;
      font-weight: 600;
    }
    .pk-period-date {
      font-size: 11px;
      color: var(--gray-text);
    }
    .pk-user-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .pk-user-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      background: var(--card-bg);
    }
    .pk-user-row.winner {
      background: rgba(64, 128, 255, 0.12);
      border: 1px solid rgba(64, 128, 255, 0.3);
    }
    .pk-rank {
      font-size: 12px;
      font-weight: 700;
      color: var(--gray-text);
      min-width: 16px;
      text-align: center;
      flex-shrink: 0;
    }
    .pk-user-row.winner .pk-rank { color: var(--primary); }
    .pk-user-avatar {
      width: 24px; height: 24px; border-radius: 50%;
      flex-shrink: 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; background: #ccc;
    }
    .pk-user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .pk-user-name {
      font-size: 13px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 80px;
      flex-shrink: 0;
    }
    .pk-trophy {
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: 2px;
    }
    .pk-user-change {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      margin-left: auto;
    }
    .pk-user-change.down { color: var(--down-color); }
    .pk-user-change.up { color: var(--up-color); }
    .pk-user-change.same { color: var(--same-color); }
    .pk-winner-text {
      margin-top: 6px;
      font-size: 12px;
      color: var(--primary);
      text-align: center;
      font-weight: 500;
    }

    /* ========== 弹窗 ========== */
    .mask {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      display: none; align-items: center; justify-content: center; z-index: 99;
    }
    #maskModify { z-index: 105; }
    #maskAvatarSelect { z-index: 110; }
    #maskEmojiFull { z-index: 115; }
    #maskRecord { z-index: 108; }
    #maskAllRecords { z-index: 120; }
    #maskJumpDate { z-index: 125; }
    #maskMetricRecord { z-index: 130; }
    .mask.show { display: flex; }
    .modal {
      background: var(--modal-bg); padding: 20px; border-radius: 14px;
      width: min(92%, 440px); max-height: 90vh; overflow: auto;
    }
    .modal h3 { margin-bottom: 14px; font-size: 18px; }
    .form-item { margin-bottom: 10px; }
    .form-item label { display: block; margin-bottom: 4px; font-size: 14px; }
    .error-tip { color: var(--error-red); font-size: 12px; margin-left: 6px; }
    input, select {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--modal-bg); color: var(--text); font-size: 14px;
    }
    select { cursor: pointer; }
    input:focus, select:focus { outline: none; border-color: var(--primary); }

    .weight-input-wrap { position: relative; display: flex; align-items: center; }
    .weight-input-wrap input { padding-right: 62px; }
    .weight-unit-tag {
      position: absolute; right: 12px; font-size: 14px;
      color: var(--gray-text); pointer-events: none;
    }
    .unit-toggle {
      color: var(--primary); cursor: pointer; font-size: 13px;
      font-weight: 400; margin-left: 4px;
    }
    .unit-toggle:active { opacity: 0.6; }
    .calc-value {
      padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--card-bg);
      color: var(--gray-text); font-size: 14px;
    }
    .avatar-select-btn {
      border: none; background: transparent; color: var(--primary);
      padding: 6px 0; font-size: 14px; cursor: pointer; text-align: left;
    }
    .modal-footer {
      margin-top: 14px; display: flex; gap: 10px;
      justify-content: flex-end; align-items: center;
    }
    .modal-btn {
      padding: 8px 16px; border-radius: 6px; border: none;
      cursor: pointer; font-size: 14px;
    }
    .cancel { background: transparent; color: var(--gray-text); border: 1px solid var(--border); }
    .confirm { background: var(--primary); color: #fff; }
    .modal-btn.danger {
      background: transparent; color: #ff5555;
      border: 1px solid #ffb3b3; margin-right: auto;
    }
    .edit-user-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 10px; border-bottom: 1px solid var(--border);
      gap: 12px; cursor: pointer;
    }
    .edit-left { display: flex; align-items: center; gap: 10px; }
    .edit-user-name { font-size: 14px; }
    .del-inline-btn {
      color: #ff5555; background: transparent; border: 1px solid #ffb3b3;
      border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 14px;
    }
    .sort-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 10px; border-bottom: 1px solid var(--border); cursor: grab;
    }
    .sort-item.dragging { opacity: 0.4; }
    .sort-handle { color: var(--gray-text); font-size: 20px; user-select: none; }
    .top-tip { color: var(--gray-text); font-size: 13px; margin-bottom: 10px; }

    .avatar-modal-content { display: grid; gap: 14px; }
    .avatar-section h4 { font-size: 14px; margin-bottom: 8px; }
    .avatar-preview-big {
      width: 84px; height: 84px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; margin: 0 auto; overflow: hidden;
    }
    .avatar-preview-big img { width: 100%; height: 100%; object-fit: cover; }
    .emoji-grid {
      display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px;
    }
    .emoji-item {
      font-size: 20px; text-align: center; padding: 5px;
      cursor: pointer; border-radius: 6px; background: var(--card-bg);
    }
    .emoji-item.active { outline: 2px solid var(--primary); }
    .emoji-item.more-btn {
      font-size: 12px; color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-weight: 500;
    }
    .emoji-footer { margin-top: 8px; display: flex; justify-content: flex-end; }
    .ghost-btn {
      border: none; background: transparent; color: var(--primary);
      font-size: 14px; cursor: pointer; padding: 4px 0;
    }
    .bg-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .color-select-btn {
      border: none; background: transparent; color: var(--primary);
      font-size: 14px; cursor: pointer; padding: 4px 0;
    }
    .hidden-native-color { visibility: hidden; width: 0; height: 0; position: absolute; }
    .hidden-file { display: none; }
    .emoji-full-grid {

    .metric-history-item .mh-diff { font-size: 12px; font-weight: 600; white-space: nowrap; }
    .metric-history-item .mh-diff.up { color: var(--up-color); }
    .metric-history-item .mh-diff.down { color: var(--down-color); }
    .metric-history-item .mh-diff.same { color: var(--same-color); }

    .dimension-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
      margin-bottom: 8px;
    }
    .dimension-grid .form-item { margin-bottom: 0; }

    .ratio-row {

      margin-top: 4px;
      padding: 0 2px;
    }
    .ratio-row .ratio-val { font-weight: 600; color: var(--text); }

<script>
/* =========================================================
   常量与数据
   ========================================================= */
const STORAGE_KEY = 'weightRecordUsers';
let userList = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

/* =========================================================
   单位工具
   ========================================================= */
function unitLabel(unit) { return unit === 'jin' ? '斤' : '公斤'; }
function toDisplay(kg, unit) { return unit === 'jin' ? kg * 2 : kg; }
function toKg(v, unit) { return unit === 'jin' ? v / 2 : v; }
function fmt(v) {
  if (!isFinite(v)) return '--';
  return (Math.round(v * 10) / 10).toFixed(1);
}
function fmtInput(v) {
  if (!isFinite(v)) return '';
  return String(Math.round(v * 10) / 10);
}
function cnDate(d) {
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function cnRange(start, end) {
  const y1 = start.getFullYear(), m1 = start.getMonth()+1, d1 = start.getDate();
  const y2 = end.getFullYear(), m2 = end.getMonth()+1, d2 = end.getDate();
  if (y1 === y2 && m1 === m2) return `${y1}年${m1}月${d1}日 - ${m2}月${d2}日`;
  if (y1 === y2) return `${y1}年${m1}月${d1}日 - ${m2}月${d2}日`;
  return `${y1}年${m1}月${d1}日 - ${y2}年${m2}月${d2}日`;
}

/* =========================================================
   通用工具
   ========================================================= */
function isTransparentBg(bg) { return bg === 'transparent'; }

function renderAvatarVisual(container, emoji, bg, size = 44, image = null) {
  container.innerHTML = '';
  container.style.width = size + 'px';
  container.style.height = size + 'px';
  container.style.fontSize = Math.round(size * 0.5) + 'px';
  container.style.borderRadius = '50%';
  container.style.overflow = 'hidden';

  if (image) {
    const img = document.createElement('img');
    img.src = image;
    img.style.width = '100%';
    img.style.height = '100%';
    img.style.objectFit = 'cover';
    container.appendChild(img);
    container.style.backgroundImage = 'none';
    container.style.backgroundColor = '#ddd';
    return;
  }

  container.innerText = emoji || '';

  if (isTransparentBg(bg)) {
    container.style.backgroundImage =
      'linear-gradient(45deg, #e5e5e5 25%, transparent 25%),' +
      'linear-gradient(-45deg, #e5e5e5 25%, transparent 25%),' +
      'linear-gradient(45deg, transparent 75%, #e5e5e5 75%),' +
      'linear-gradient(-45deg, transparent 75%, #e5e5e5 75%)';
    container.style.backgroundSize = '10px 10px';
    container.style.backgroundPosition = '0 0, 0 5px, 5px -5px, -5px 0px';
    container.style.backgroundColor = 'transparent';
  } else {
    container.style.backgroundImage = 'none';
    container.style.backgroundSize = 'auto';
    container.style.backgroundPosition = 'center';
    container.style.backgroundColor = bg;
  }
}

function fixDate(inputDateStr) {
  if (!inputDateStr) return null;
  const [y, m, d] = inputDateStr.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}
function parseDate(s) {
  if (!s) return new Date(NaN);
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function dateToStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function getTodayStr() { return dateToStr(new Date()); }
function getNowTimeStr() {
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function saveUsers() { localStorage.setItem(STORAGE_KEY, JSON.stringify(userList)); }

/* =========================================================
   体重记录
   ========================================================= */
function getSortedRecords(user) {
  const arr = Array.isArray(user.records) ? [...user.records] : [];
  arr.sort((a, b) => {
    const ka = (a.date || '') + ' ' + (a.time || '00:00');
    const kb = (b.date || '') + ' ' + (b.time || '00:00');
    return ka < kb ? -1 : ka > kb ? 1 : 0;
  });
  return arr;
}
function getCurrentWeight(user) {
  const recs = getSortedRecords(user);
  if (recs.length === 0) return Number(user.startWeight) || 0;
  return Number(recs[recs.length - 1].weight) || 0;
}
function getRecordDiffMap(user) {
  const recs = getSortedRecords(user);
  const map = {};
  for (let i = 0; i < recs.length; i++) {
    if (i === 0) {
      map[recs[i].id] = { diff: 0, dir: 'same' };
    } else {
      const d = Number(recs[i].weight) - Number(recs[i-1].weight);
      let dir = 'same';
      if (d > 0.05) dir = 'up';
      else if (d < -0.05) dir = 'down';
      map[recs[i].id] = { diff: d, dir };
    }
  }
  return map;
}

function renderWeightTab() {
  const idx = currentViewUserIndex;
  if (idx === null || !userList[idx]) return;
  const user = userList[idx];
  const unit = user.unit || 'kg';
  const ul = unitLabel(unit);

  const startW = Number(user.startWeight) || 0;
  const targetW = Number(user.targetWeight) || 0;
  const currentW = getCurrentWeight(user);

  $('ovStart').textContent = fmt(toDisplay(startW, unit));
  $('ovStartUnit').textContent = ul;
  $('ovCurrent').textContent = fmt(toDisplay(currentW, unit));
  $('ovCurrentUnit').textContent = ul;
  $('ovTarget').textContent = fmt(toDisplay(targetW, unit));
  $('ovTargetUnit').textContent = ul;

  renderMetrics(user);

  const startD = parseDate(user.startDate);
  const today = new Date(); today.setHours(0,0,0,0);
  let days = 0;
  if (!isNaN(startD.getTime())) {
    days = Math.floor((today - startD) / 86400000);
    if (days < 0) days = 0;
  }
  $('statDays').textContent = `减重第 ${days} 天`;

  const bmiEl = $('statBmi');
  const h = Number(user.height);
  if (h > 0) {
    const bmi = currentW / Math.pow(h / 100, 2);
    let label, color;
    if (bmi < 18.5) { label = '偏瘦'; color = '#8fd6a8'; }
    else if (bmi < 24) { label = '标准'; color = '#3fbf6f'; }
    else if (bmi < 28) { label = '超重'; color = '#f2a0a0'; }
    else { label = '肥胖'; color = '#e04b4b'; }
    bmiEl.innerHTML = `<span style="color:${color}">BMI ${bmi.toFixed(1)} ${label}</span>`;
  } else {
    bmiEl.textContent = 'BMI --';
  }

  const lost = startW - currentW;
  $('statTotal').textContent = fmt(toDisplay(lost, unit)) + ' ' + ul;

  let remain = currentW - targetW;
  $('statRemain').textContent = remain <= 0.05 ? '已达成 🎉' : fmt(toDisplay(remain, unit)) + ' ' + ul;

  const totalNeed = startW - targetW;
  const done = startW - currentW;
  let pct = totalNeed > 0 ? (done / totalNeed) * 100 : 0;
  if (pct < 0) pct = 0;
  $('statProgress').textContent = pct.toFixed(1) + '%';

  const speedEl = $('statSpeed');
  const recs = getSortedRecords(user);
  const lastRec = recs.length ? recs[recs.length - 1] : null;
  const endD = lastRec ? parseDate(lastRec.date) : startD;
  const weeks = (!isNaN(startD.getTime()) && !isNaN(endD.getTime()))
    ? (endD - startD) / (7 * 86400000) : 0;

  if (weeks <= 0.02) {
    speedEl.textContent = '--';
  } else {
    const speed = lost / weeks;
    if (speed > 1) speedEl.textContent = '过快';
    else if (speed >= 0.5) speedEl.textContent = '正常';
    else speedEl.textContent = '过慢';
  }
  speedEl.style.color = 'var(--text)';

  renderAnalysis(user, unit, ul);
  renderRecordList(user, unit, ul);
}

function renderMetrics(user) {
  const bfEl = $('metricBodyFat');
  const dimEl = $('metricDimensions');
  const bmrEl = $('metricBmr');

  const bfRecs = [...(user.bodyFatRecords || [])].sort((a,b) => a.date < b.date ? -1 : 1);
  if (bfRecs.length > 0) {
    const last = bfRecs[bfRecs.length - 1];
    bfEl.textContent = last.value + '%';
    bfEl.classList.remove('empty');
  } else {
    bfEl.textContent = '--';
    bfEl.classList.add('empty');
  }

  const dimRecs = [...(user.dimensionRecords || [])].sort((a,b) => a.date < b.date ? -1 : 1);
  if (dimRecs.length > 0) {
    const last = dimRecs[dimRecs.length - 1];
    dimEl.textContent = last.waist ? `腰 ${last.waist}` : '已记录';
    dimEl.classList.remove('empty');
  } else {
    dimEl.textContent = '--';
    dimEl.classList.add('empty');
  }

  const bmrRecs = [...(user.bmrRecords || [])].sort((a,b) => a.date < b.date ? -1 : 1);
  if (bmrRecs.length > 0) {
    const last = bmrRecs[bmrRecs.length - 1];
    bmrEl.textContent = last.value + ' kcal';
    bmrEl.classList.remove('empty');
  } else {
    bmrEl.textContent = '--';
    bmrEl.classList.add('empty');
  }
}

/* 辅助：生成差异 HTML */
function diffHtml(dKg, unit, ul) {
  const d = Math.round(toDisplay(dKg, unit) * 10) / 10;
  if (d === 0) return `<span class="v" style="color:var(--same-color)">0 ${ul}</span>`;
  if (d > 0) return `<span class="v" style="color:var(--up-color)">+${fmt(d)} ${ul}</span>`;
  return `<span class="v" style="color:var(--down-color)">-${fmt(Math.abs(d))} ${ul}</span>`;
}

function renderAnalysis(user, unit, ul) {
  const list = $('analysisList');
  list.innerHTML = '';
  const recs = getSortedRecords(user);
  const todayRec = recs.length ? recs[recs.length - 1] : null;
  const startW = Number(user.startWeight) || 0;
  const todayW = todayRec ? Number(todayRec.weight) : startW;

  const todayDate = todayRec ? parseDate(todayRec.date) : new Date();
  const weekRange = getWeekRange(todayDate);
  const monthStart = new Date(todayDate.getFullYear(), todayDate.getMonth(), 1);
  const monthEnd = new Date(todayDate.getFullYear(), todayDate.getMonth() + 1, 0, 23, 59, 59);

  const weekRecs = recs.filter(r => {
    const d = parseDate(r.date);
    return d >= weekRange.start && d <= weekRange.end;
  });
  const monthRecs = recs.filter(r => {
    const d = parseDate(r.date);
    return d >= monthStart && d <= monthEnd;
  });

  const weekAvg = avgWeight(weekRecs);
  const monthAvg = avgWeight(monthRecs);

  // 上周
  const prevWeekStart = new Date(weekRange.start);
  prevWeekStart.setDate(prevWeekStart.getDate() - 7);
  prevWeekStart.setHours(0,0,0,0);
  const prevWeekEnd = new Date(weekRange.end);
  prevWeekEnd.setDate(prevWeekEnd.getDate() - 7);
  prevWeekEnd.setHours(23,59,59,999);
  const prevWeekRecs = recs.filter(r => {
    const d = parseDate(r.date);
    return d >= prevWeekStart && d <= prevWeekEnd;
  });
  const prevWeekAvg = avgWeight(prevWeekRecs);

  // 上月
  const prevMonthStart = new Date(todayDate.getFullYear(), todayDate.getMonth() - 1, 1);
  const prevMonthEnd = new Date(todayDate.getFullYear(), todayDate.getMonth(), 0, 23, 59, 59);
  const prevMonthRecs = recs.filter(r => {
    const d = parseDate(r.date);
    return d >= prevMonthStart && d <= prevMonthEnd;
  });
  const prevMonthAvg = avgWeight(prevMonthRecs);

  let prevDiffHtml = '<span class="v">—</span>';
  if (recs.length >= 2) {
    const prev = recs[recs.length - 2];
    const dKg = todayW - Number(prev.weight);
    prevDiffHtml = diffHtml(dKg, unit, ul);
  }

  let weekDiffHtml = '<span class="v">—</span>';
  if (weekAvg !== null) {
    weekDiffHtml = diffHtml(todayW - weekAvg, unit, ul);
  }

  let monthDiffHtml = '<span class="v">—</span>';
  if (monthAvg !== null) {
    monthDiffHtml = diffHtml(todayW - monthAvg, unit, ul);
  }

  // 本周与上周平均对比
  let weekVsPrevHtml = '<span class="v">—</span>';
  if (weekAvg !== null && prevWeekAvg !== null) {
    weekVsPrevHtml = diffHtml(weekAvg - prevWeekAvg, unit, ul);
  }

  // 本月与上月平均对比
  let monthVsPrevHtml = '<span class="v">—</span>';
  if (monthAvg !== null && prevMonthAvg !== null) {
    monthVsPrevHtml = diffHtml(monthAvg - prevMonthAvg, unit, ul);
  }

  const weekAvgHtml = weekAvg === null ? '—' : fmt(toDisplay(weekAvg, unit)) + ' ' + ul;
  const monthAvgHtml = monthAvg === null ? '—' : fmt(toDisplay(monthAvg, unit)) + ' ' + ul;

  function maxMinHtml(recsArr) {
    if (recsArr.length === 0) return '—';
    let maxRec = recsArr[0], minRec = recsArr[0];
    recsArr.forEach(r => {
      if (Number(r.weight) > Number(maxRec.weight)) maxRec = r;
      if (Number(r.weight) < Number(minRec.weight)) minRec = r;
    });
    const maxStr = `最高 ${fmt(toDisplay(Number(maxRec.weight), unit))} ${ul}（${maxRec.date.slice(5).replace('-', '月')}日）`;
    const minStr = `最低 ${fmt(toDisplay(Number(minRec.weight), unit))} ${ul}（${minRec.date.slice(5).replace('-', '月')}日）`;
    return `${maxStr} · ${minStr}`;
  }

  list.innerHTML = `
    <div class="analysis-item">
      <span class="k">今日体重</span>
      <span class="v bold-black">${fmt(toDisplay(todayW, unit))} ${ul}</span>
    </div>
    <div class="analysis-sub">
      <span>较上次记录</span>${prevDiffHtml}
    </div>
    <div class="analysis-sub">
      <span>较本周平均</span>${weekDiffHtml}
    </div>
    <div class="analysis-sub">
      <span>较本月平均</span>${monthDiffHtml}
    </div>
    <div class="trend-divider"></div>
    <div class="analysis-item">
      <span class="k">本周平均体重</span>
      <span class="v bold-black">${weekAvgHtml}</span>
    </div>
    <div class="analysis-sub" style="padding-left:0;">${maxMinHtml(weekRecs)}</div>
    <div class="analysis-sub">
      <span>较上周平均</span>${weekVsPrevHtml}
    </div>
    <div class="trend-divider"></div>
    <div class="analysis-item">
      <span class="k">本月平均体重</span>
      <span class="v bold-black">${monthAvgHtml}</span>
    </div>
    <div class="analysis-sub" style="padding-left:0;">${maxMinHtml(monthRecs)}</div>
    <div class="analysis-sub">
      <span>较上月平均</span>${monthVsPrevHtml}
    </div>
  `;
}

function avgWeight(recs) {
  if (recs.length === 0) return null;
  const sum = recs.reduce((a, b) => a + Number(b.weight), 0);
  return sum / recs.length;
}

function getWeekRange(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? 6 : day - 1;
  const mon = new Date(d); mon.setDate(d.getDate() - diff); mon.setHours(0,0,0,0);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  sun.setHours(23,59,59,999);
  return { start: mon, end: sun };
}

  const chest = parseFloat($('inpChest')?.value);

  const el1 = $('ratioWhr');
  const el2 = $('ratioWhr2');
  if (el1) el1.textContent = whr1 ? whr1.toFixed(2) : '--';
  if (el2) el2.textContent = whr2 ? whr2.toFixed(2) : '--';
}

function renderMetricHistory(user, type) {
  const list = $('metricHistoryList');
  list.innerHTML = '';
  let records = [];
  if (type === 'bodyFat') records = user.bodyFatRecords || [];
  else if (type === 'dimensions') records = user.dimensionRecords || [];
  else if (type === 'bmr') records = user.bmrRecords || [];

  const sorted = [...records].sort((a, b) => b.date.localeCompare(a.date));

  if (sorted.length === 0) {
    list.innerHTML = '<div class="empty-tip" style="padding:10px 0;font-size:12px;">暂无历史记录</div>';
    return;
  }

  sorted.forEach((rec, idx) => {
    const item = document.createElement('div');
    item.className = 'metric-history-item';
    const left = document.createElement('div');
    left.className = 'mh-left';

    let valueText = '';
    if (type === 'bodyFat') valueText = rec.value + '%';
    else if (type === 'bmr') valueText = rec.value + ' kcal';
    else if (type === 'dimensions') {
      const parts = [];
      if (rec.chest) parts.push('胸' + rec.chest);
      if (rec.waist) parts.push('腰' + rec.waist);
      if (rec.hip) parts.push('臀' + rec.hip);
      valueText = parts.length ? parts.join(' / ') : '已记录';
    }

    left.innerHTML = `<div class="mh-value">${valueText}</div><div class="mh-date">${rec.date}</div>`;

    let diffHtml = '';
    if (idx < sorted.length - 1) {
      const prev = sorted[idx + 1];
      if (type === 'bodyFat' || type === 'bmr') {
        const d = rec.value - prev.value;
        const rounded = Math.round(d * 10) / 10;
        if (Math.abs(rounded) < 0.05) diffHtml = `<span class="mh-diff same">不变</span>`;
        else if (rounded > 0) diffHtml = `<span class="mh-diff up">+${fmt(Math.abs(rounded))}</span>`;
        else diffHtml = `<span class="mh-diff down">-${fmt(Math.abs(rounded))}</span>`;
      } else if (type === 'dimensions') {
        if (rec.waist && prev.waist) {
          const d = rec.waist - prev.waist;
          const rounded = Math.round(d * 10) / 10;
          if (Math.abs(rounded) < 0.05) diffHtml = `<span class="mh-diff same">腰围不变</span>`;
          else if (rounded > 0) diffHtml = `<span class="mh-diff up">腰围 +${fmt(Math.abs(rounded))}</span>`;
          else diffHtml = `<span class="mh-diff down">腰围 -${fmt(Math.abs(rounded))}</span>`;
        } else {
          diffHtml = `<span class="mh-diff same">—</span>`;
        }
      }
    } else {
      diffHtml = `<span class="mh-diff same">—</span>`;
    }

    item.appendChild(left);
    item.innerHTML += diffHtml;

    item.onclick = () => {
      editingMetricRecordId = rec.id;
      if (type === 'bodyFat') {
        $('inpMetricValue').value = rec.value;
      } else if (type === 'bmr') {
        $('inpMetricValue').value = rec.value;
      } else if (type === 'dimensions') {
        $('inpChest').value = rec.chest || '';
        $('inpArm').value = rec.arm || '';
        $('inpWaist').value = rec.waist || '';
        $('inpHip').value = rec.hip || '';
        $('inpThigh').value = rec.thigh || '';
        $('inpCalf').value = rec.calf || '';
        updateDimensionRatios();
      }
      $('inpMetricDate').value = rec.date;
      $('deleteMetricBtn').style.display = '';
      $('metricModalTitle').textContent = type === 'bodyFat' ? '编辑体脂率' : type === 'dimensions' ? '编辑身体维度' : '编辑基础代谢';
    };

    list.appendChild(item);
  });
}

      item.onclick = () => { if (editMode === 'view') openModifyModal(idx); };
    }

  });

let dragIndex = null;
function attachSortEvents(item) {
  item.addEventListener('dragstart', (e) => {
    dragIndex = Number(item.dataset.index);
    item.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  item.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  });
  item.addEventListener('drop', (e) => {
    e.preventDefault();
    const dropIndex = Number(item.dataset.index);
    if (dragIndex !== null && dragIndex !== dropIndex) {
      const [moved] = userList.splice(dragIndex, 1);
      userList.splice(dropIndex, 0, moved);
      saveUsers();
      renderHomeUsers();
      renderEditList();
    }
  });
  item.addEventListener('dragend', () => {
    item.classList.remove('dragging');
    dragIndex = null;
  });
}

function renderCalendarSingle(user, unit, ul) {
  const title = $('calTitle');
  const daysEl = $('calDaysSingle');
  const year = calYear;
  const month = calMonth;
  title.textContent = `${year}年${month + 1}月`;

  const recs = getSortedRecords(user);
  const diffMap = getRecordDiffMap(user);
  const todayStr = getTodayStr();

  const recByDate = {};
  recs.forEach(r => {
    if (!recByDate[r.date]) recByDate[r.date] = [];
    recByDate[r.date].push(r);
  });

  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  let startWeekday = firstDay.getDay();
  startWeekday = startWeekday === 0 ? 6 : startWeekday - 1;

  daysEl.innerHTML = '';
  // 上月尾部
  const prevMonthDays = new Date(year, month, 0).getDate();
  for (let i = startWeekday - 1; i >= 0; i--) {
    const dayNum = prevMonthDays - i;
    const d = new Date(year, month - 1, dayNum);
    const dStr = dateToStr(d);
    const el = document.createElement('div');
    el.className = 'cal-day other-month';
    const dayRecs = recByDate[dStr];
    if (dayRecs && dayRecs.length) {
      const lastRec = dayRecs[dayRecs.length - 1];
      const w = Number(lastRec.weight);
      const info = diffMap[lastRec.id];
      let color = 'var(--same-color)';
      if (info) {
        if (info.dir === 'up') color = 'var(--up-color)';
        else if (info.dir === 'down') color = 'var(--down-color)';
      }
      el.innerHTML = `<div class="dnum">${dayNum}</div><div class="dweight" style="color:${color}">${fmt(toDisplay(w, unit))}</div>`;
    } else {
      el.innerHTML = `<div class="dnum">${dayNum}</div>`;
    }
    daysEl.appendChild(el);
  }
  // 当月
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const el = document.createElement('div');
    el.className = 'cal-day';
    if (dateStr === todayStr) el.classList.add('today');
    const dayRecs = recByDate[dateStr];
    if (dayRecs && dayRecs.length) {
      el.classList.add('has-rec');
      const lastRec = dayRecs[dayRecs.length - 1];
      const w = Number(lastRec.weight);
      const info = diffMap[lastRec.id];
      let color = 'var(--same-color)';
      if (info) {
        if (info.dir === 'up') color = 'var(--up-color)';
        else if (info.dir === 'down') color = 'var(--down-color)';
      }
      el.innerHTML = `<div class="dnum">${d}</div><div class="dweight" style="color:${color}">${fmt(toDisplay(w, unit))}</div>`;
    } else {
      el.innerHTML = `<div class="dnum">${d}</div>`;
    }
    el.onclick = () => {
      $('inpJumpDate').value = dateStr;
      maskJumpDate.classList.add('show');
    };
    daysEl.appendChild(el);
  }
  // 下月头部
  const totalCells = startWeekday + daysInMonth;
  const nextDays = (7 - (totalCells % 7)) % 7;
  for (let d = 1; d <= nextDays; d++) {
    const dateObj = new Date(year, month + 1, d);
    const dStr = dateToStr(dateObj);
    const el = document.createElement('div');
    el.className = 'cal-day other-month';
    const dayRecs = recByDate[dStr];
    if (dayRecs && dayRecs.length) {
      const lastRec = dayRecs[dayRecs.length - 1];
      const w = Number(lastRec.weight);
      const info = diffMap[lastRec.id];
      let color = 'var(--same-color)';
      if (info) {
        if (info.dir === 'up') color = 'var(--up-color)';
        else if (info.dir === 'down') color = 'var(--down-color)';
      }
      el.innerHTML = `<div class="dnum">${d}</div><div class="dweight" style="color:${color}">${fmt(toDisplay(w, unit))}</div>`;
    } else {
      el.innerHTML = `<div class="dnum">${d}</div>`;
    }
    daysEl.appendChild(el);
  }
}

/* ----- 折线图 ----- */
function renderLineChart(container, allPoints, opts = {}) {
  container.innerHTML = '';
  if (!allPoints || allPoints.length === 0) {
    container.innerHTML = '<div class="empty-tip" style="padding:20px 0;">暂无体重记录</div>';
    return;
  }

  const W = container.clientWidth || 600;
  const H = 200;
  const padL = 38, padR = 12, padT = 12, padB = 26;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  const weights = allPoints.map(p => p.weight);
  let minW = Math.min(...weights);
  let maxW = Math.max(...weights);
  if (minW === maxW) { minW -= 1; maxW += 1; }
  const pad = (maxW - minW) * 0.15;
  minW -= pad; maxW += pad;

  const xScale = (i) => padL + (allPoints.length === 1 ? plotW / 2 : (i / (allPoints.length - 1)) * plotW);
  const yScale = (w) => padT + plotH - ((w - minW) / (maxW - minW)) * plotH;

  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('class', 'chart-svg');
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.style.height = H + 'px';

  const yTicks = 4;
  for (let i = 0; i <= yTicks; i++) {
    const val = minW + (maxW - minW) * i / yTicks;
    const y = yScale(val);
    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', padL);
    line.setAttribute('x2', W - padR);
    line.setAttribute('y1', y);
    line.setAttribute('y2', y);
    line.setAttribute('stroke', 'var(--border)');
    line.setAttribute('stroke-width', '1');
    line.setAttribute('stroke-dasharray', '3,3');
    svg.appendChild(line);

    const txt = document.createElementNS(svgNS, 'text');
    txt.setAttribute('x', padL - 5);
    txt.setAttribute('y', y + 3);
    txt.setAttribute('text-anchor', 'end');
    txt.setAttribute('font-size', '10');
    txt.setAttribute('fill', 'var(--gray-text)');
    txt.textContent = val.toFixed(1);
    svg.appendChild(txt);
  }

  const maxLabels = 8;
  const step = Math.max(1, Math.ceil(allPoints.length / maxLabels));
  for (let i = 0; i < allPoints.length; i += step) {
    const x = xScale(i);
    const txt = document.createElementNS(svgNS, 'text');
    txt.setAttribute('x', x);
    txt.setAttribute('y', H - 8);
    txt.setAttribute('text-anchor', 'middle');
    txt.setAttribute('font-size', '10');
    txt.setAttribute('fill', 'var(--gray-text)');
    txt.textContent = allPoints[i].date.slice(5);
    svg.appendChild(txt);
  }
  if (allPoints.length > 1) {
    const lastIdx = allPoints.length - 1;
    if (lastIdx % step !== 0) {
      const x = xScale(lastIdx);
      const txt = document.createElementNS(svgNS, 'text');
      txt.setAttribute('x', x);
      txt.setAttribute('y', H - 8);
      txt.setAttribute('text-anchor', 'middle');
      txt.setAttribute('font-size', '10');
      txt.setAttribute('fill', 'var(--gray-text)');
      txt.textContent = allPoints[lastIdx].date.slice(5);
      svg.appendChild(txt);
    }
  }

  for (let i = 1; i < allPoints.length; i++) {
    const p0 = allPoints[i-1];
    const p1 = allPoints[i];
    const d = p1.weight - p0.weight;
    let color;
    if (d > 0.05) color = 'var(--up-color)';
    else if (d < -0.05) color = 'var(--down-color)';
    else color = 'var(--same-color)';

    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', xScale(i-1));
    line.setAttribute('y1', yScale(p0.weight));
    line.setAttribute('x2', xScale(i));
    line.setAttribute('y2', yScale(p1.weight));
    line.setAttribute('stroke', color);
    line.setAttribute('stroke-width', '2');
    line.setAttribute('stroke-linecap', 'round');
    svg.appendChild(line);
  }

  allPoints.forEach((p, i) => {
    let color = 'var(--same-color)';
    if (i > 0) {
      const d = p.weight - allPoints[i-1].weight;
      if (d > 0.05) color = 'var(--up-color)';
      else if (d < -0.05) color = 'var(--down-color)';
      else color = 'var(--same-color)';
    } else {
      color = 'var(--gray-text)';
    }
    const c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('cx', xScale(i));
    c.setAttribute('cy', yScale(p.weight));
    c.setAttribute('r', '3.5');
    c.setAttribute('fill', color);
    c.setAttribute('stroke', 'var(--bg)');
    c.setAttribute('stroke-width', '1');
    svg.appendChild(c);
  });

  container.appendChild(svg);
}

function analyzeStage(points) {
  let down = 0, same = 0, up = 0;
  for (let i = 1; i < points.length; i++) {
    const d = points[i].weight - points[i-1].weight;
    if (d < -0.05) down++;
    else if (d > 0.05) up++;
    else same++;
  }
  const total = down + same + up;
  return { down, same, up, total };
}

function stageHtml(stage) {
  if (stage.total === 0) {
    return '<div class="empty-tip" style="padding:0;font-size:12px;">数据不足</div>';
  }
  const pct = (n) => ((n / stage.total) * 100).toFixed(0) + '%';
  return `
    <div class="stage-tag">
      <span class="stage-dot" style="background:var(--down-color)"></span>
      下降 ${pct(stage.down)}（${stage.down}天）
    </div>
    <div class="stage-tag">
      <span class="stage-dot" style="background:var(--same-color)"></span>
      不变 ${pct(stage.same)}（${stage.same}天）
    </div>
    <div class="stage-tag">
      <span class="stage-dot" style="background:var(--up-color)"></span>
      上升 ${pct(stage.up)}（${stage.up}天）
    </div>
  `;
}

function renderOverallChart(user, unit, ul) {
  const recs = getSortedRecords(user);
  const startW = Number(user.startWeight) || 0;

  const allPoints = [];
  allPoints.push({ date: user.startDate, weight: startW });
  recs.forEach(r => {
    if (r.date !== user.startDate) {
      allPoints.push({ date: r.date, weight: Number(r.weight) });
    }
  });
  const byDate = {};
  allPoints.forEach(p => { byDate[p.date] = p; });
  const sorted = Object.values(byDate).sort((a, b) => a.date < b.date ? -1 : 1);

  renderLineChart($('chartOverall'), sorted);
  $('stageOverall').innerHTML = stageHtml(analyzeStage(sorted));
}

function getWeekRangeOffset(offset) {
  const today = new Date();
  const weekRange = getWeekRange(today);
  const start = new Date(weekRange.start);
  start.setDate(start.getDate() + offset * 7);
  const end = new Date(start);
  end.setDate(end.getDate() + 6);
  end.setHours(23, 59, 59, 999);
  return { start, end };
}
function getMonthRangeOffset(offset) {
  const today = new Date();
  const start = new Date(today.getFullYear(), today.getMonth() + offset, 1);
  const end = new Date(start.getFullYear(), start.getMonth() + 1, 0, 23, 59, 59);
  return { start, end };
}
function getYearRangeOffset(offset) {
  const today = new Date();
  const year = today.getFullYear() + offset;
  const start = new Date(year, 0, 1);
  const end = new Date(year, 11, 31, 23, 59, 59);
  return { start, end };
}

function renderWeekChart(user, unit, ul) {
  const recs = getSortedRecords(user);
  const { start, end } = getWeekRangeOffset(weekOffset);
  $('weekRange').textContent = cnRange(start, end);
  const points = recs.filter(r => {
    const d = parseDate(r.date);
    return d >= start && d <= end;
  }).map(r => ({ date: r.date, weight: Number(r.weight) }));
  renderLineChart($('chartWeek'), points);
  $('stageWeek').innerHTML = stageHtml(analyzeStage(points));
}

/* =========================================================
   减重 PK
   ========================================================= */
function renderPKTab() {
  const container = $('pkContent');
  container.innerHTML = '';
  if (currentViewUserIndex === null) return;
  if (userList.length <= 1) {
    container.innerHTML = '<h3>选择 PK 对手</h3><div class="empty-tip">需要创建新用户</div>';
    return;
  }

  const others = userList.filter((_, i) => i !== currentViewUserIndex);
  const optionsWrap = document.createElement('div');
  optionsWrap.className = 'pk-options';
  others.forEach(u => {
    const idx = userList.indexOf(u);
    const label = document.createElement('label');
    label.className = 'pk-opt';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'pk-checkbox';
    cb.value = idx;
    const avatarSpan = document.createElement('span');
    avatarSpan.className = 'pk-opt-avatar';
    renderAvatarVisual(avatarSpan, u.avatarEmoji, u.avatarBg, 28, u.avatarImage);
    const nameSpan = document.createElement('span');
    nameSpan.textContent = u.name;
    label.appendChild(cb);
    label.appendChild(avatarSpan);
    label.appendChild(nameSpan);
    optionsWrap.appendChild(label);
  });

  const startBtn = document.createElement('button');
  startBtn.className = 'pk-start-btn';
  startBtn.id = 'pkStartBtn';
  startBtn.disabled = true;
  startBtn.textContent = '开始 PK';

  const h3 = document.createElement('h3');
  h3.textContent = '选择 PK 对手';

  container.appendChild(h3);
  container.appendChild(optionsWrap);
  const btnWrap = document.createElement('div');
  btnWrap.style.marginTop = '14px';
  btnWrap.appendChild(startBtn);
  container.appendChild(btnWrap);

  const checkboxes = container.querySelectorAll('.pk-checkbox');
  checkboxes.forEach(cb => {
    cb.onchange = () => {
      const checked = [...checkboxes].some(c => c.checked);
      startBtn.disabled = !checked;
    };
  });

  startBtn.onclick = () => {
    const selected = [...checkboxes].filter(c => c.checked).map(c => Number(c.value));
    renderPKResult(selected);
  };
}

function getPeriodReduction(user, startDate, endDate) {
  const recs = getSortedRecords(user);
  const inPeriod = recs.filter(r => {
    const d = parseDate(r.date);
    return d >= startDate && d <= endDate;
  });
  if (inPeriod.length === 0) return null;

  const lastW = Number(inPeriod[inPeriod.length - 1].weight);
  let refW;
  if (inPeriod.length >= 2) {
    refW = Number(inPeriod[0].weight);
  } else {
    const before = recs.filter(r => parseDate(r.date) < startDate);
    if (before.length > 0) {
      refW = Number(before[before.length - 1].weight);
    } else {
      refW = Number(user.startWeight) || 0;
    }
  }
  return refW - lastW;
}

function getProgressPct(user) {
  const startW = Number(user.startWeight) || 0;
  const targetW = Number(user.targetWeight) || 0;
  const curW = getCurrentWeight(user);
  const total = startW - targetW;
  if (total <= 0) return null;
  const done = startW - curW;
  return (done / total) * 100;
}

function renderRankBlock(title, dateLabel, users, userIndices, currentIdx, valueFn, formatFn) {
  const entries = users.map((u, i) => ({
    user: u,
    userIdx: userIndices[i],
    value: valueFn(u)
  }));

  entries.sort((a, b) => {
    if (a.value === null && b.value === null) return 0;
    if (a.value === null) return 1;
    if (b.value === null) return -1;
    return b.value - a.value;
  });

  const valid = entries.filter(e => e.value !== null);

  const periodDiv = document.createElement('div');
  periodDiv.className = 'pk-period';

  const header = document.createElement('div');
  header.className = 'pk-period-header';
  const titleSpan = document.createElement('span');
  titleSpan.className = 'pk-period-title';
  titleSpan.textContent = title;
  header.appendChild(titleSpan);
  if (dateLabel) {
    const dateSpan = document.createElement('span');
    dateSpan.className = 'pk-period-date';
    dateSpan.textContent = dateLabel;
    header.appendChild(dateSpan);
  }
  periodDiv.appendChild(header);

  if (valid.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-tip';
    empty.style.padding = '6px 0';
    empty.style.fontSize = '12px';
    empty.textContent = '暂无数据';
    periodDiv.appendChild(empty);
  } else {
    const listDiv = document.createElement('div');
    listDiv.className = 'pk-user-list';
    valid.forEach((e, idx) => {
      const isWinner = idx === 0 && e.value > 0.001;
      const display = formatFn(e.value, e.user);

      const row = document.createElement('div');
      row.className = 'pk-user-row' + (isWinner ? ' winner' : '');

      // 排名
      const rankSpan = document.createElement('span');
      rankSpan.className = 'pk-rank';
      rankSpan.textContent = idx + 1;
      row.appendChild(rankSpan);

      // 头像
      const avatarSpan = document.createElement('span');
      avatarSpan.className = 'pk-user-avatar';
      renderAvatarVisual(avatarSpan, e.user.avatarEmoji, e.user.avatarBg, 24, e.user.avatarImage);
      row.appendChild(avatarSpan);

      // 用户名
      const nameSpan = document.createElement('span');
      nameSpan.className = 'pk-user-name';
      nameSpan.textContent = e.user.name;
      row.appendChild(nameSpan);

      // 获胜标识（在用户名后）
      if (isWinner) {
        const trophy = document.createElement('span');
        trophy.className = 'pk-trophy';
        trophy.textContent = '🏆 获胜！';
        row.appendChild(trophy);
      }

      // 数值（最右）
      const changeSpan = document.createElement('span');
      changeSpan.className = 'pk-user-change ' + display.cls;
      changeSpan.textContent = display.text;
      row.appendChild(changeSpan);

      listDiv.appendChild(row);
    });
    periodDiv.appendChild(listDiv);

    const winners = valid.filter((e, idx) => idx === 0 && e.value > 0.001);
    if (winners.length === 0) {
      const noWinner = document.createElement('div');
      noWinner.className = 'pk-winner-text';
      noWinner.style.color = 'var(--gray-text)';
      noWinner.textContent = '无获胜者（均未减重）';
      periodDiv.appendChild(noWinner);
    }
  }

  return periodDiv;
}

function renderPKResult(opponentIndices) {
  const currentIdx = currentViewUserIndex;
  const allIndices = [currentIdx, ...opponentIndices];
  const users = allIndices.map(i => userList[i]);
  const container = $('pkContent');
  container.innerHTML = '';

  const today = new Date();
  const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 0, 0, 0);
  const todayEnd = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 23, 59, 59);
  const weekRange = getWeekRange(today);
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  const monthEnd = new Date(today.getFullYear(), today.getMonth() + 1, 0, 23, 59, 59);
  const yearStart = new Date(today.getFullYear(), 0, 1);
  const yearEnd = new Date(today.getFullYear(), 11, 31, 23, 59, 59);

  const reductionFormat = (v, u) => {
    const unit = u.unit || 'kg';
    const ul = unitLabel(unit);
    const disp = toDisplay(v, unit);
    const rounded = Math.round(disp * 10) / 10;
    if (Math.abs(rounded) < 0.05) return { text: '无变化', cls: 'same' };
    if (rounded > 0) return { text: `减重 ${fmt(Math.abs(rounded))} ${ul}`, cls: 'down' };
    return { text: `增重 ${fmt(Math.abs(rounded))} ${ul}`, cls: 'up' };
  };

  const progressFormat = (v, u) => {
    if (v === null || !isFinite(v)) return { text: '--', cls: 'same' };
    const rounded = Math.round(v * 10) / 10;
    if (rounded > 0) return { text: rounded.toFixed(1) + '%', cls: 'down' };
    if (rounded < 0) return { text: rounded.toFixed(1) + '%', cls: 'up' };
    return { text: '0.0%', cls: 'same' };
  };

  const h3 = document.createElement('h3');
  h3.textContent = 'PK 结果';
  container.appendChild(h3);

  const resultDiv = document.createElement('div');
  resultDiv.className = 'pk-result';

  resultDiv.appendChild(renderRankBlock(
    '减重进度排名',
    '整体',
    users,
    allIndices,
    currentIdx,
    (u) => getProgressPct(u),
    progressFormat
  ));

  resultDiv.appendChild(renderRankBlock(
    '日排名',
    cnDate(today),
    users,
    allIndices,
    currentIdx,
    (u) => getPeriodReduction(u, todayStart, todayEnd),
    reductionFormat
  ));

  resultDiv.appendChild(renderRankBlock(
    '周排名',
    cnRange(weekRange.start, weekRange.end),
    users,
    allIndices,
    currentIdx,
    (u) => getPeriodReduction(u, weekRange.start, weekRange.end),
    reductionFormat
  ));

  resultDiv.appendChild(renderRankBlock(
    '月排名',
    `${today.getFullYear()}年${today.getMonth()+1}月`,
    users,
    allIndices,
    currentIdx,
    (u) => getPeriodReduction(u, monthStart, monthEnd),
    reductionFormat
  ));

  resultDiv.appendChild(renderRankBlock(
    '年排名',
    `${today.getFullYear()}年`,
    users,
    allIndices,
    currentIdx,
    (u) => getPeriodReduction(u, yearStart, yearEnd),
    reductionFormat
  ));

  container.appendChild(resultDiv);

  const backBtnWrap = document.createElement('div');
  backBtnWrap.style.marginTop = '16px';
  const backBtn = document.createElement('button');
  backBtn.className = 'pk-start-btn secondary';
  backBtn.id = 'pkBackBtn';
  backBtn.textContent = '返回选择';
  backBtnWrap.appendChild(backBtn);
  container.appendChild(backBtnWrap);

  backBtn.onclick = () => renderPKTab();
}

function bindEnterToConfirm(maskEl, confirmBtn) {
  maskEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      confirmBtn.click();
    }
  });
}
